name: Prepare global offline locale candidates

on:
  workflow_dispatch:
    inputs:
      targets:
        description: all, new, or canonical comma-separated locale codes
        required: true
        default: new
        type: string
      budget_seconds:
        description: Local CPU seconds per locale, 30 through 1200
        required: true
        default: '300'
        type: string
  # Small rotating batches; no individual language monopolizes the build lane.
  schedule:
    - cron: '21 */6 * * *'

permissions:
  contents: read

concurrency:
  group: portal-global-locale-prepare
  cancel-in-progress: false

jobs:
  source:
    if: github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      budget: ${{ steps.plan.outputs.budget }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate bounded target plan
        id: plan
        env:
          REQUESTED_TARGETS: ${{ inputs.targets || 'new' }}
          REQUESTED_BUDGET: ${{ inputs.budget_seconds || '300' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PYCODE'
          import datetime, json, os, sys
          sys.path.insert(0, 'scripts')
          from portal_language_registry import selected_locales
          codes = selected_locales(os.environ['REQUESTED_TARGETS'])
          budget = int(os.environ['REQUESTED_BUDGET'])
          assert 30 <= budget <= 1200, 'Unsupported CPU window'
          if os.environ['EVENT_NAME'] == 'schedule':
              groups = [codes[i:i+6] for i in range(0,len(codes),6)]
              slot = int(datetime.datetime.now(datetime.timezone.utc).timestamp()) // (6 * 3600)
              codes = groups[slot % len(groups)]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('matrix=' + json.dumps({'locale': list(codes)}) + '\n')
              stream.write('budget=' + str(budget) + '\n')
          PYCODE
      - name: Build isolated Chinese source from public repository inputs
        run: |
          python -m pip install requests Pillow 'opencc-python-reimplemented==0.1.7'
          python -B scripts/prepare_portal_global_locales.py --build-source \
            --output-root "$RUNNER_TEMP/global-source" --site-url https://kcdesk.com
      - name: Package only the public-source preparation tree
        run: tar -C "$RUNNER_TEMP/global-source" -czf "$RUNNER_TEMP/global-public-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: global-public-source-${{ github.run_attempt }}
          path: ${{ runner.temp }}/global-public-source.tar.gz
          retention-days: 1
          if-no-files-found: error

  prepare:
    needs: source
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests Pillow 'opencc-python-reimplemented==0.1.7'
      - uses: actions/download-artifact@v4
        with:
          name: global-public-source-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-package
      - name: Unpack this run's public source
        run: |
          mkdir -p "$RUNNER_TEMP/global-source"
          tar -xzf "$RUNNER_TEMP/source-package/global-public-source.tar.gz" -C "$RUNNER_TEMP/global-source"
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/global-checkpoint/cache.json.gz
          key: global-locale-v1-${{ matrix.locale }}-${{ hashFiles('scripts/hymt_translation_model_manifest.json', 'scripts/portal_chinese_script.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            global-locale-v1-${{ matrix.locale }}-${{ hashFiles('scripts/hymt_translation_model_manifest.json', 'scripts/portal_chinese_script.py') }}-
      - uses: ./.github/actions/setup-offline-translation
        with:
          targets: ${{ matrix.locale }}
          audit-suffix: -prepare-${{ matrix.locale }}
      - name: Translate incremental public candidate with no paid fallback
        env:
          TARGET_LOCALE: ${{ matrix.locale }}
          CPU_BUDGET: ${{ needs.source.outputs.budget }}
        run: |
          python -B scripts/prepare_portal_global_locales.py \
            --source-root "$RUNNER_TEMP/global-source" --output-root "$RUNNER_TEMP/result/site" \
            --cache "$RUNNER_TEMP/global-checkpoint/cache.json.gz" \
            --targets "$TARGET_LOCALE" --site-url https://kcdesk.com \
            --index-start-date 2026-09-23 --budget-seconds "$CPU_BUDGET"
      - name: Check bounded checkpoint storage
        id: checkpoint
        if: always()
        run: |
          python - <<'PYCODE'
          import os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'global-checkpoint/cache.json.gz'
          valid = path.is_file() and not path.is_symlink() and 0 < path.stat().st_size <= 8 * 1024 * 1024
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('available=' + str(valid).lower() + '\n')
          PYCODE
      - uses: actions/cache/save@v4
        if: always() && steps.checkpoint.outputs.available == 'true'
        with:
          path: ${{ runner.temp }}/global-checkpoint/cache.json.gz
          key: global-locale-v1-${{ matrix.locale }}-${{ hashFiles('scripts/hymt_translation_model_manifest.json', 'scripts/portal_chinese_script.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain readiness, not a production activation claim
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-readiness-${{ matrix.locale }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/result/readiness.json
            ${{ runner.temp }}/result/chinese-parity-before.json
          retention-days: 3
          if-no-files-found: warn
