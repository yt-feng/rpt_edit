<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KC Desk Notes</title>
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body data-page="index">
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="KC Desk Notes home">
        <img src="assets/kc-mark.svg" alt="" width="34" height="34">
        <span>KC Desk Notes</span>
      </a>
      <div class="catalog-meta" id="catalogMeta">Loading catalog...</div>
    </header>

    <main class="shell">
      <section class="search-panel" aria-labelledby="searchTitle">
        <div class="search-copy">
          <h1 id="searchTitle">KC Desk Notes</h1>
          <p class="subtle">Research notes and reports, indexed for fast lookup.</p>
        </div>
        <label class="search-box search-main">
          <span>Search</span>
          <input id="searchInput" type="search" autocomplete="off" placeholder="Topic, company, ticker, title, or keyword">
        </label>
        <div class="filter-grid" aria-label="Report filters">
          <label class="filter-control">
            <span>Institution</span>
            <select id="bankFilter"></select>
          </label>
          <label class="filter-control">
            <span>Industry</span>
            <select id="industryFilter"></select>
          </label>
          <label class="filter-control">
            <span>From</span>
            <input id="startDate" type="date">
          </label>
          <label class="filter-control">
            <span>To</span>
            <input id="endDate" type="date">
          </label>
          <label class="filter-control">
            <span>Search In</span>
            <select id="scopeFilter">
              <option value="all">Everything</option>
              <option value="title">Title only</option>
              <option value="catalog">Catalog fields</option>
              <option value="fulltext">Document text</option>
            </select>
          </label>
          <label class="filter-control">
            <span>PDF</span>
            <select id="availabilityFilter">
              <option value="">All records</option>
              <option value="available">PDF available</option>
              <option value="textOnly">Text only</option>
            </select>
          </label>
        </div>
        <div class="filter-actions">
          <span id="activeFilters">No filters</span>
          <button id="clearFilters" type="button">Clear</button>
        </div>
      </section>

      <section class="results-section" aria-live="polite">
        <div class="results-heading">
          <h2>Reports</h2>
          <span id="resultCount">0 items</span>
        </div>
        <div id="results" class="results-list"></div>
      </section>
    </main>

    <script src="assets/app.js"></script>
  </body>
</html>
