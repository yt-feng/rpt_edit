<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KC Desk Notes</title>
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body data-page="index">
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="KC Desk Notes home">
        <img src="assets/kc-mark.svg" alt="" width="34" height="34">
        <span>KC Desk Notes</span>
      </a>
      <div class="topbar-actions">
        <div class="catalog-meta" id="catalogMeta">Loading catalog...</div>
        <button id="adminGate" class="admin-gate" type="button" aria-label="Private tools"></button>
      </div>
    </header>

    <main class="shell">
      <section class="search-panel" aria-labelledby="searchTitle">
        <div class="search-copy">
          <h1 id="searchTitle">KC Desk Notes</h1>
          <p class="subtle">Research notes and reports, indexed for fast lookup.</p>
        </div>
        <label class="search-box search-main">
          <span>Search</span>
          <input id="searchInput" type="search" autocomplete="off" placeholder="Topic, company, ticker, title, or keyword">
        </label>
        <div class="filter-grid" aria-label="Report filters">
          <label class="filter-control">
            <span>Institution</span>
            <select id="bankFilter"></select>
          </label>
          <label class="filter-control">
            <span>Industry</span>
            <select id="industryFilter"></select>
          </label>
          <label class="filter-control">
            <span>From</span>
            <input id="startDate" type="date">
          </label>
          <label class="filter-control">
            <span>To</span>
            <input id="endDate" type="date">
          </label>
          <label class="filter-control">
            <span>Search In</span>
            <select id="scopeFilter">
              <option value="all">Everything</option>
              <option value="title">Title only</option>
              <option value="catalog">Catalog fields</option>
              <option value="fulltext">Document text</option>
            </select>
          </label>
          <label class="filter-control">
            <span>PDF</span>
            <select id="availabilityFilter">
              <option value="">All records</option>
              <option value="available">PDF available</option>
              <option value="textOnly">Text only</option>
            </select>
          </label>
        </div>
        <div class="filter-actions">
          <span id="activeFilters">No filters</span>
          <button id="clearFilters" type="button">Clear</button>
        </div>
      </section>

      <section class="results-section" aria-live="polite">
        <div class="results-heading">
          <h2>Reports</h2>
          <span id="resultCount">0 items</span>
        </div>
        <div class="pagination-bar" aria-label="Report pages">
          <button id="prevPage" type="button">Previous</button>
          <span id="pageInfo">Page 1 / 1</span>
          <label class="page-size">
            <span>Rows</span>
            <select id="pageSize">
              <option value="25">25</option>
              <option value="50" selected>50</option>
              <option value="100">100</option>
            </select>
          </label>
          <button id="nextPage" type="button">Next</button>
        </div>
        <div id="results" class="results-list"></div>
      </section>

      <section class="external-section" id="externalSection" aria-labelledby="externalTitle" hidden>
        <div class="results-heading">
          <h2 id="externalTitle">其他报告</h2>
          <span id="externalCount"></span>
        </div>
        <p class="subtle external-hint">更多报告。点击条目后输入密码下载；部分报告需要准备约 3 分钟，页面会自动等待并开始下载。</p>
        <div id="externalResults" class="related-list"></div>
        <div id="externalAccess" class="external-access" hidden></div>
        <div id="externalStatus" class="status-line" aria-live="polite"></div>
      </section>

      <section class="about-section" aria-labelledby="aboutTitle">
        <div class="about-copy">
          <h2 id="aboutTitle">关于我们</h2>
          <p>平台全面覆盖宏观策略、行业分析、公司研究、财报、招股书、定制报告等内容。通过前沿的技术和便捷的产品体验，为金融从业人员、投资者、市场运营等提供信息获取和整合的专业服务。</p>
        </div>
        <img class="wechat-qr" src="assets/macrogate.jpg" alt="macroGate 微信二维码">
      </section>
    </main>

    <script src="assets/app.js"></script>
  </body>
</html>
