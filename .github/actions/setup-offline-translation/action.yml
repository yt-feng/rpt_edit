name: Set up offline translation
description: Install local CPU translation models; no translation API or credentials
inputs:
  targets:
    description: Comma-separated target languages
    default: zh,en
runs:
  using: composite
  steps:
    - name: Configure local model and memo directories
      id: configure
      env:
        TRANSLATION_TARGETS: ${{ inputs.targets }}
      shell: bash
      run: |
        if [[ ! "$TRANSLATION_TARGETS" =~ ^(zh|en|ko|ja|ar)(,(zh|en|ko|ja|ar))*$ ]]; then
          echo "Unsupported translation targets" >&2
          exit 2
        fi
        echo "model-key=${TRANSLATION_TARGETS//,/-}" >> "$GITHUB_OUTPUT"
        echo "M2M100_MODEL_DIR=$RUNNER_TEMP/m2m100-model" >> "$GITHUB_ENV"
        echo "OFFLINE_TRANSLATION_BACKEND=m2m100" >> "$GITHUB_ENV"
        echo "PORTAL_OFFLINE_TRANSLATION_CACHE=$RUNNER_TEMP/offline-translation-memo" >> "$GITHUB_ENV"
        echo "PORTAL_OFFLINE_TRANSLATION_THREADS=2" >> "$GITHUB_ENV"
    - name: Install pinned M2M100 CPU runtime
      shell: bash
      run: |
        python -m pip install --disable-pip-version-check torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
        python -m pip install --disable-pip-version-check -r requirements-translation.txt
    - name: Restore converted public model files only
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/m2m100-model
        key: m2m100-ct2-int8-v1-${{ runner.os }}-${{ hashFiles('requirements-translation.txt', 'scripts/install_m2m100_translation_model.py', 'scripts/m2m100_model_manifest.json') }}
    - name: Install and audit pinned M2M100 model
      shell: bash
      run: |
        python scripts/install_m2m100_translation_model.py \
          --model-dir "$M2M100_MODEL_DIR" \
          --audit-out "$RUNNER_TEMP/offline-model-audit.json"
    - name: Preserve model provenance
      uses: actions/upload-artifact@v4
      with:
        name: offline-model-audit-${{ github.job }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/offline-model-audit.json
        retention-days: 3
