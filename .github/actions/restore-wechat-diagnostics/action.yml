name: Restore accepted WeChat draft receipts
description: Restore same-run draft receipts before retrying an interrupted upload.

inputs:
  name:
    description: Base diagnostic artifact name, without the attempt suffix
    required: true
  path:
    description: Original extraction directory
    required: false
    default: "."
  checkpoint-path:
    description: Exact restored directory that must contain a WeChat summary or submission checkpoint
    required: false
    default: ""
  job-name:
    description: Exact API job name whose submissions this checkpoint protects
    required: false
    default: ${{ github.job }}
  submission-step-names:
    description: Exact names, one per line, of every step that can create, publish or delete drafts
    required: false
    default: Build and upload WeChat drafts

outputs:
  found:
    description: Whether a prior submission checkpoint was restored
    value: ${{ steps.locate.outputs.found }}
  no-prior-submission:
    description: Whether complete attempt history proved that no submission started
    value: ${{ steps.locate.outputs.no_prior_submission }}

runs:
  using: composite
  steps:
    - name: Locate prior draft receipts
      id: locate
      if: ${{ github.run_attempt > 1 }}
      shell: python
      env:
        RECEIPT_ARTIFACT_NAME: ${{ inputs.name }}
        CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
        GH_TOKEN: ${{ github.token }}
        UPLOADER_JOB_NAME: ${{ inputs.job-name }}
        SUBMISSION_STEP_NAMES: ${{ inputs.submission-step-names }}
      run: |
        import os
        import runpy
        from pathlib import Path

        runpy.run_path(str(Path(os.environ['GITHUB_WORKSPACE']) / 'scripts/wechat_attempt_history.py'), run_name='__main__')

    - name: Restore prior draft receipts
      id: download
      if: ${{ steps.locate.outputs.found == 'true' }}
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: ${{ steps.locate.outputs.artifact_name }}
        path: ${{ inputs.path }}

    - name: Retry restoring prior draft receipts
      id: retry_download
      if: ${{ steps.locate.outputs.found == 'true' && steps.download.outcome == 'failure' }}
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: ${{ steps.locate.outputs.artifact_name }}
        path: ${{ inputs.path }}

    - name: Validate restored delivery checkpoint
      if: ${{ steps.locate.outputs.found == 'true' }}
      shell: python
      env:
        CHECKPOINT_PATH: ${{ inputs.checkpoint-path }}
        CHECKPOINT_VALIDATOR: ${{ github.action_path }}/../resilient-diagnostic-artifact/validate_wechat_checkpoint.py
        PRIMARY_DOWNLOAD: ${{ steps.download.outcome }}
        RETRY_DOWNLOAD: ${{ steps.retry_download.outcome }}
      run: |
        import os
        import runpy

        if 'success' not in (os.environ.get('PRIMARY_DOWNLOAD'), os.environ.get('RETRY_DOWNLOAD')):
            raise SystemExit('Prior checkpoint download failed after bounded retries; stop before uploading.')
        if os.environ.get('CHECKPOINT_PATH', '').strip():
            runpy.run_path(os.environ['CHECKPOINT_VALIDATOR'], run_name='__main__')
