name: Institution latest PDF to WeChat

# Daily companion to the Dropbox main flow. Instead of Dropbox, it pulls the newest
# public PDF reports from IMF / World Bank / BIS / OECD / ADB / WEF / UNCTAD / WTO /
# Bruegel, runs them through the existing MinerU -> Portal translated -> WeChat draft
# pipeline, and archives the original PDF links. The source PDFs themselves are
# privately archived before extraction and never committed. Daily volume is bounded by max_total (default 100).

on:
  workflow_dispatch:
    inputs:
      completed_source_recovery:
        description: "Replay only reviewed completed originals omitted by a later feed; no new MinerU tasks"
        type: choice
        required: false
        default: none
        options: [none, adb-261013]
      institutions:
        description: "Comma list of sources, or all (imf,worldbank,bis,oecd,adb,wef,unctad,wto,bruegel; rand/brookings only when named explicitly)"
        required: true
        default: "all"
      since_days:
        description: "Only fetch reports published within this many days"
        required: true
        default: "7"
      max_per_institution:
        description: "Cap new PDFs per institution (0 = no cap)"
        required: true
        default: "25"
      max_total:
        description: "Cap new PDFs across all institutions per run (0 = no cap)"
        required: true
        default: "100"
      imf_pending_retries:
        description: "Previously observed IMF reports to retry in this run (1-100)"
        required: false
        type: number
        default: 10
      reviewed_originals:
        description: "Explicit reviewed private-cache originals (ordinary source health still applies)"
        required: false
        type: choice
        default: none
        options:
          - none
          - imf-20261012-reviewed
          - imf-20261015-reviewed
          - imf-europe-20261017-cached
      force_reprocess:
        description: "Ignore seen-state and overwrite today's generated outputs"
        required: true
        type: boolean
        default: false
      max_translated:
        description: "How many fetched reports to translate into WeChat articles. Use all."
        required: true
        default: "all"
      articles_per_draft:
        description: "Number of articles in each WeChat draft item"
        required: true
        default: "8"
      dry_run:
        description: "Build WeChat draft payloads without calling WeChat APIs"
        required: true
        type: boolean
        default: false
      publish:
        description: "Submit created WeChat drafts for publishing (needs publish API access)"
        required: true
        type: boolean
        default: false

  schedule:
    # 06:00 Beijing time (UTC+8), after the expected completion window of the
    # Dropbox main flow that starts at 02:00.
    - cron: "0 22 * * *"

permissions:
  actions: read
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  PRIVATE_HANDOFF_ROOT: "_private-workflow-handoff/institutions"

concurrency:
  group: institution-latest-pdf-to-wechat
  cancel-in-progress: false

jobs:
  fetch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      date_folder: ${{ steps.fetch.outputs.date_folder }}
      pdf_count: ${{ steps.extract.outputs.generated_report_count }}
      deferred_source_count: ${{ steps.extract.outputs.deferred_source_count }}
      source_health: ${{ steps.fetch.outputs.source_health }}
      source_health_required_failure_count: ${{ steps.fetch.outputs.source_health_required_failure_count }}
    steps:
      - name: Initialize DeepSeek usage ledger
        shell: bash
        run: |
          usage_dir="$(mktemp -d "$RUNNER_TEMP/deepseek-usage.XXXXXX")"
          usage_dir="$(cd "$usage_dir" && pwd -P)"
          echo "DEEPSEEK_USAGE_DIR=$usage_dir" >> "$GITHUB_ENV"
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pull latest main (archive + seen state)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags --prune --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          git reset --hard origin/main
          git clean -fdx

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install reportlab
          python -m pip install "boto3>=1.37.32,<2"

      - name: Test institution PDF resolver
        run: |
          python scripts/test_fetch_institution_latest_pdfs.py
          python scripts/test_institution_source_health.py
          python scripts/test_institution_pending_intake.py

      - name: Set up official IMF download route
        if: ${{ inputs.completed_source_recovery == '' || inputs.completed_source_recovery == 'none' }}
        uses: ./.github/actions/setup-imf-browser
        with:
          institutions: ${{ github.event.inputs.institutions || 'all' }}

      - name: Select reviewed institution originals
        id: reviewed_originals
        shell: bash
        env:
          REVIEWED_ORIGINALS: ${{ github.event.inputs.reviewed_originals || 'none' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "$REVIEWED_ORIGINALS" in
            none)
              echo "manifest_path=" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            imf-20261012-reviewed|imf-20261015-reviewed|imf-europe-20261017-cached)
              if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
                echo "::error::Reviewed originals require an explicit manual dispatch."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unknown reviewed originals selection."
              exit 1
              ;;
          esac
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import sys
          import tempfile

          sys.path.insert(0, "scripts")
          from institution_verified_originals import VerifiedOriginals

          selection = os.environ["REVIEWED_ORIGINALS"]
          checksums = {
              "imf-20261012-reviewed": "250557000edbc46f0629393a7a43a139b37926cb54c58535ea498866ccd77e67",
              "imf-20261015-reviewed": "c880842e7f022145eaca780dd52017934444ab7c7f1be7208a9cc7f74b81196b",
              "imf-europe-20261017-cached": "ab27239ae15d4680794800e46ed4b3102e7fdda8bccbdb312c9451c8337100e9",
          }
          source = Path("institution_feeds/reviewed_originals") / (selection + ".json")
          if source.is_symlink() or not source.is_file() or source.stat().st_size > 512 * 1024:
              raise SystemExit("Reviewed originals metadata file is invalid.")
          raw = source.read_bytes()
          expected = checksums[selection]
          if hashlib.sha256(raw).hexdigest() != expected:
              raise SystemExit("Reviewed originals metadata SHA-256 mismatch.")
          with tempfile.NamedTemporaryFile(dir=os.environ["RUNNER_TEMP"], prefix="imf-reviewed-", suffix=".json", delete=False) as stream:
              copied = Path(stream.name)
              stream.write(raw)
          try:
              if hashlib.sha256(copied.read_bytes()).hexdigest() != expected:
                  raise ValueError("Reviewed originals copy SHA-256 mismatch.")
              VerifiedOriginals(copied)  # Full schema/binding validation; no storage access.
          except Exception:
              copied.unlink(missing_ok=True)
              raise
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"manifest_path={copied}\n")
          PY

      - name: Install Chinese fonts
        timeout-minutes: 5
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Install required institution OCR fallback tools
        if: ${{ inputs.completed_source_recovery == '' || inputs.completed_source_recovery == 'none' }}
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim
          tesseract --list-langs

      - name: Export visible dependency holds before fetching originals
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: python scripts/institution_dependency_backlog.py export --path "$RUNNER_TEMP/institution-held-sources.json"

      - name: Fetch latest institution PDFs
        id: fetch
        shell: bash
        env:
          COMPLETED_SOURCE_RECOVERY: ${{ inputs.completed_source_recovery }}
          MINERU_LEDGER_BACKEND: r2
          MINERU_CHECKPOINT_SCOPE: institution
          MINERU_FORBID_NEW_SUBMISSIONS: '1'
          MINER_U: ${{ secrets.MINER_U }}
          MINER_U_2: ${{ secrets.MINER_U_2 }}
          MINER_U_3: ${{ secrets.MINER_U_3 }}
          MINER_U_4: ${{ secrets.MINER_U_4 }}
          PROXY_SUBSCRIPTION_URL: ${{ secrets.PROXY_SUBSCRIPTION_URL }}
          IMF_PENDING_RETRIES: ${{ github.event.inputs.imf_pending_retries || '10' }}
          REVIEWED_ORIGINALS_MANIFEST: ${{ steps.reviewed_originals.outputs.manifest_path }}
          INSTITUTION_ADMITTED_ORIGINALS: "true"
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          set -o pipefail
          if [ -n "$COMPLETED_SOURCE_RECOVERY" ] && [ "$COMPLETED_SOURCE_RECOVERY" != none ]; then
            python scripts/restore_completed_institution_sources.py restore --selection "$COMPLETED_SOURCE_RECOVERY"
            exit 0
          fi
          DATE="$(TZ=Asia/Shanghai date +%y%m%d)"
          echo "date_folder=$DATE" >> "$GITHUB_OUTPUT"
          reviewed_args=()
          if [ -n "$REVIEWED_ORIGINALS_MANIFEST" ]; then
            reviewed_args+=(--verified-originals-manifest "$REVIEWED_ORIGINALS_MANIFEST")
          fi
          fetch_runner=(python)
          if [ "${IMF_CLOUD_BROWSER_ENABLED:-}" = true ]; then
            fetch_runner=(xvfb-run --auto-servernum python)
          fi
          set +e
          "${fetch_runner[@]}" scripts/fetch_institution_latest_pdfs.py \
            --output-dir _institution_latest_pdfs \
            --pending-intake-path institution_feeds/pending_intake/imf.json \
            --imf-pending-retries "$IMF_PENDING_RETRIES" \
            --dependency-holds "$RUNNER_TEMP/institution-held-sources.json" \
            --date "$DATE" \
            --institutions "${{ github.event.inputs.institutions || 'all' }}" \
            --since-days "${{ github.event.inputs.since_days || '7' }}" \
            --max-per-institution "${{ github.event.inputs.max_per_institution || '25' }}" \
            --max-total "${{ github.event.inputs.max_total || '100' }}" \
            --force-reprocess "${{ github.event.inputs.force_reprocess || 'false' }}" \
            "${reviewed_args[@]}" \
            2>&1 | tee institution_fetch_progress.log
          institution_fetch_status=("${PIPESTATUS[@]}")
          set -e
          python scripts/institution_source_health.py \
            --producer-exit-code "${institution_fetch_status[0]}" \
            --log-exit-code "${institution_fetch_status[1]}" \
            --manifest _institution_latest_pdfs/institution_run_manifest.json \
            --date-folder "$DATE" \
            --institutions "${{ github.event.inputs.institutions || 'all' }}" \
            --github-output "$GITHUB_OUTPUT"

      # Save discovery before fallible extraction/translation. Never commit
      # provisional downloaded seen-state in this checkpoint.
      - name: Persist pending IMF intake before downstream work
        if: ${{ (inputs.completed_source_recovery == '' || inputs.completed_source_recovery == 'none') && always() && !cancelled() && steps.fetch.outcome != 'skipped' && hashFiles('institution_feeds/pending_intake/imf.json') != '' }}
        run: |
          python scripts/institution_pending_intake.py institution_feeds/pending_intake/imf.json
          bash scripts/commit_output_dir.sh "institution_feeds/pending_intake/imf.json" "Checkpoint unresolved IMF intake" 8 true

      - name: Extract MinerU source and original images without paid copy
        id: extract
        env:
          COMPLETED_SOURCE_RECOVERY: ${{ inputs.completed_source_recovery }}
          MINERU_LEDGER_BACKEND: r2
          MINERU_CHECKPOINT_SCOPE: institution
          INSTITUTION_DEPENDENCY_BACKLOG: "1"
          INSTITUTION_SOURCE_MANIFEST: _institution_latest_pdfs/institution_run_manifest.json
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
          MINER_U: ${{ secrets.MINER_U }}
          MINER_U_2: ${{ secrets.MINER_U_2 }}
          MINER_U_3: ${{ secrets.MINER_U_3 }}
          MINER_U_4: ${{ secrets.MINER_U_4 }}
        run: |
          set -o pipefail
          DATE="${{ steps.fetch.outputs.date_folder }}"
          SKIP_EXISTING="false"
          OCR_ARGS=(--institution-ocr-fallback)
          if [ -n "$COMPLETED_SOURCE_RECOVERY" ] && [ "$COMPLETED_SOURCE_RECOVERY" != none ]; then
            export MINERU_FORBID_NEW_SUBMISSIONS=1
            export INSTITUTION_DEPENDENCY_BACKLOG=0
            OCR_ARGS=()
          fi
          if [ "${{ github.event.inputs.force_reprocess || 'false' }}" = "true" ]; then
            rm -rf "xhs_notes/institutions/$DATE"
            SKIP_EXISTING="false"
          fi
          python scripts/run_pdf_to_xhs_in_batches.py \
            --input-dir _institution_latest_pdfs \
            --output-dir "xhs_notes/institutions/$DATE" \
            --batch-size 5 \
            --pending-task-attempts 3 \
            --extraction-timeout 2400 \
            --chart-source-only \
            "${OCR_ARGS[@]}" \
            --keep-mineru-raw \
            --skip-existing "$SKIP_EXISTING" 2>&1 | tee institution_xhs_progress.log
          if [ -n "$COMPLETED_SOURCE_RECOVERY" ] && [ "$COMPLETED_SOURCE_RECOVERY" != none ]; then
            python - <<'PYCODE'
          import json, os
          from pathlib import Path
          summary = json.loads(Path('xhs_notes/institutions/${{ steps.fetch.outputs.date_folder }}/batch_run_summary.json').read_bytes())
          if summary.get('generated_report_count') != 6 or summary.get('failures') != 0:
              raise SystemExit('Exact completed-source recovery coverage mismatch')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('generated_report_count=6\ndeferred_source_count=0\n')
          PYCODE
          fi

      - name: Preserve extracted OCR page evidence in private R2
        if: ${{ always() && !cancelled() && hashFiles('xhs_notes/institutions/**/source_ocr.md') != '' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          DATE="${{ steps.fetch.outputs.date_folder }}"
          python scripts/private_workflow_handoff.py upload-dir \
            --source "xhs_notes/institutions/$DATE" \
            --key "$PRIVATE_HANDOFF_ROOT/${{ github.run_id }}/$DATE/extracted-sources.tar.gz"

      - name: Set up free local translation models
        if: ${{ steps.extract.outputs.generated_report_count != '0' }}
        uses: ./.github/actions/setup-offline-translation
        with:
          targets: zh,en

      - name: Restore private report translation checkpoint
        id: translation_checkpoint
        if: ${{ steps.extract.outputs.generated_report_count != '0' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          python -m pip install boto3
          echo "REPORT_TRANSLATION_CACHE_DIR=$RUNNER_TEMP/report-translation-cache" >> "$GITHUB_ENV"
          python scripts/private_translation_checkpoint.py restore \
            --scope institution --date-folder "${{ steps.fetch.outputs.date_folder }}" \
            --directory "$RUNNER_TEMP/report-translation-cache"

      - name: Build Portal translated report PDFs
        timeout-minutes: 60
        if: ${{ steps.extract.outputs.generated_report_count != '0' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_REPORT_NOTES_API_KEY }}
          DEEPSEEK_USAGE_STAGE: report-article
          DEEPSEEK_API_KEY_BACKUP: ""
          DEEPSEEK_BASE_URL: "https://api.deepseek.com"
        run: |
          set -o pipefail
          DATE="${{ steps.fetch.outputs.date_folder }}"
          if [ "${{ github.event.inputs.force_reprocess || 'false' }}" = "true" ]; then
            rm -rf "portal_translated_reports/institutions/$DATE"
          fi
          python scripts/build_portal_translated_reports.py \
            --dropbox-output-root "xhs_notes/institutions" \
            --date-folder "$DATE" \
            --output-root "portal_translated_reports/institutions" \
            --max-reports "${{ github.event.inputs.max_translated || 'all' }}" \
            --include-institutions "${{ github.event.inputs.institutions || 'all' }}" \
            --exclude-institutions "rand,brookings" \
            --title-guard \
            2>&1 | tee institution_translated_progress.log

      - name: Save completed private report translations even on failure
        if: ${{ always() && steps.translation_checkpoint.outcome == 'success' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          python scripts/private_translation_checkpoint.py save \
            --scope institution --date-folder "${{ steps.fetch.outputs.date_folder }}" \
            --directory "$RUNNER_TEMP/report-translation-cache"

      - name: Verify complete translated source coverage before handoff
        if: ${{ steps.extract.outputs.generated_report_count != '0' }}
        run: |
          python scripts/institution_dependency_backlog.py verify-handoff \
            --extracted "xhs_notes/institutions/${{ steps.fetch.outputs.date_folder }}" \
            --translated "portal_translated_reports/institutions/${{ steps.fetch.outputs.date_folder }}"

      - name: Upload translated reports to private R2 handoff
        if: ${{ steps.extract.outputs.generated_report_count != '0' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          DATE="${{ steps.fetch.outputs.date_folder }}"
          python scripts/private_workflow_handoff.py upload-dir \
            --source "portal_translated_reports/institutions/$DATE" \
            --key "$PRIVATE_HANDOFF_ROOT/${{ github.run_id }}/$DATE/translated.tar.gz"

      - name: Complete resumed dependencies after private translated handoff
        if: ${{ steps.extract.outputs.generated_report_count != '0' && (inputs.completed_source_recovery == '' || inputs.completed_source_recovery == 'none') }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          python scripts/institution_dependency_backlog.py complete \
            --path "xhs_notes/institutions/${{ steps.fetch.outputs.date_folder }}/institution-resume-context.json"

      # A downloaded source is only marked seen after successful translated
      # handoff. Held roots already have their own durable private manifest.
      - name: Record completed-source handoff without changing feed seen state
        if: ${{ inputs.completed_source_recovery != '' && inputs.completed_source_recovery != 'none' }}
        env:
          COMPLETED_SOURCE_RECOVERY: ${{ inputs.completed_source_recovery }}
        run: |
          python scripts/restore_completed_institution_sources.py complete --selection "$COMPLETED_SOURCE_RECOVERY"
          bash scripts/commit_output_dir.sh "institution_feeds/completed_source_recovery_receipts" "Record exact completed Institution source handoff" 8 true

      - name: Commit PDF link archive and seen state
        if: ${{ inputs.completed_source_recovery == '' || inputs.completed_source_recovery == 'none' }}
        run: |
          bash scripts/commit_output_dir.sh "institution_feeds" "Update institution PDF link archive" 8 true

      - name: Upload run artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: institution-pdf-run-${{ steps.fetch.outputs.date_folder }}-${{ github.run_id }}
          path: |
            _institution_latest_pdfs/institution_run_manifest.json
            institution_fetch_progress.log
            institution_xhs_progress.log
            xhs_notes/institutions/*/batch_run_summary.json
            institution_translated_progress.log
          if-no-files-found: ignore
          retention-days: 2

      - name: Summarize observed DeepSeek usage
        if: ${{ always() && hashFiles('scripts/summarize_deepseek_usage.py') != '' }}
        run: |
          python scripts/summarize_deepseek_usage.py \
            --input-dir "$DEEPSEEK_USAGE_DIR" \
            --output "$DEEPSEEK_USAGE_DIR/summary.json" \
            --markdown "$DEEPSEEK_USAGE_DIR/summary.md" --github-summary

      - name: Upload content-free DeepSeek usage
        if: ${{ always() && hashFiles('.github/actions/resilient-diagnostic-artifact/action.yml') != '' }}
        uses: ./.github/actions/resilient-diagnostic-artifact
        with:
          name: deepseek-usage-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DEEPSEEK_USAGE_DIR }}
          if-no-files-found: error
          retention-days: 30

  # Source outages remain a failed job; they do not starve accepted private
  # backlog recovery or prevent saving the recovered WeChat delivery receipts.
  source-health:
    needs: fetch-and-build
    if: ${{ always() && !cancelled() && needs.fetch-and-build.outputs.source_health == 'degraded' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report required source degradation independently
        env:
          REQUIRED_FAILURE_COUNT: ${{ needs.fetch-and-build.outputs.source_health_required_failure_count }}
        run: |
          echo "::error::Required institution source health remains degraded ($REQUIRED_FAILURE_COUNT sources). Accepted-source recovery was allowed independently."
          exit 1

  upload-wechat-drafts:
    needs: fetch-and-build
    if: ${{ needs.fetch-and-build.outputs.pdf_count != '0' }}
    runs-on: [self-hosted, wechat-draft]
    timeout-minutes: 120
    outputs:
      wechat_verified: ${{ steps.upload.outputs.wechat_verified }}
      verified_article_count: ${{ steps.upload.outputs.verified_article_count }}
      verified_draft_count: ${{ steps.upload.outputs.verified_draft_count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            scripts
            prompts
            portal_suite/data/blog_archive
            requirements.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          python -m pip install boto3

      - name: Download translated reports from private R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          DATE="${{ needs.fetch-and-build.outputs.date_folder }}"
          python scripts/private_workflow_handoff.py download-dir \
            --key "$PRIVATE_HANDOFF_ROOT/${{ github.run_id }}/$DATE/translated.tar.gz" \
            --destination "portal_translated_reports/institutions/$DATE"

      - name: Materialize private publishing image
        env:
          PORTAL_PRIVATE_PUBLISH_ASSET_KEY: ${{ secrets.PORTAL_PRIVATE_PUBLISH_ASSET_KEY }}
        run: bash scripts/materialize_private_social_asset.sh prompts

      - name: Restore accepted WeChat draft receipts
        uses: ./.github/actions/restore-wechat-diagnostics
        with:
          name: institution-wechat-drafts-${{ needs.fetch-and-build.outputs.date_folder }}-${{ github.run_id }}
          path: .

      - name: Build and upload WeChat drafts
        id: upload
        env:
          WECHAT_MP_APPID: ${{ secrets.WECHAT_MP_APPID }}
          WECHAT_MP_APPSECRET: ${{ secrets.WECHAT_MP_APPSECRET }}
          PORTAL_SITE_URL: ${{ secrets.PORTAL_SITE_URL }}
        run: |
          set -o pipefail
          DATE="${{ needs.fetch-and-build.outputs.date_folder }}"
          TRANSLATED_DIR="portal_translated_reports/institutions/$DATE"
          if [ ! -d "$TRANSLATED_DIR" ]; then
            echo "::warning::No translated reports at $TRANSLATED_DIR; nothing to upload."
            exit 0
          fi

          ARGS=()
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ "${{ github.event.inputs.publish || 'false' }}" = "true" ]; then
            ARGS+=(--publish)
          fi

          python scripts/push_portal_translated_to_wechat_drafts.py \
            --translated-root "portal_translated_reports/institutions" \
            --date-folder "$DATE" \
            --output-root "wechat_drafts/institutions" \
            --max-articles "${{ github.event.inputs.max_translated || 'all' }}" \
            --include-institutions "${{ github.event.inputs.institutions || 'all' }}" \
            --articles-per-draft "${{ github.event.inputs.articles_per_draft || '8' }}" \
            --max-body-chars "1200" \
            --min-inline-images "3" \
            --max-inline-images "3" \
            "${ARGS[@]}" 2>&1 | tee institution_wechat_progress.log

          # Only this successful upload's final receipt can confirm delivery.
          PYTHONPATH=scripts python - "$DATE" <<'PY'
          import os
          import sys
          from pathlib import Path
          from send_portal_ops_alert import institution_wechat_delivery_outputs

          outputs = institution_wechat_delivery_outputs(Path("wechat_drafts/institutions") / sys.argv[1])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              for key, value in outputs.items():
                  handle.write(f"{key}={value}\n")
          PY

      - name: Archive WeChat draft diagnostics
        if: ${{ always() }}
        uses: ./.github/actions/resilient-diagnostic-artifact
        with:
          name: institution-wechat-drafts-${{ needs.fetch-and-build.outputs.date_folder }}-${{ github.run_id }}
          path: |
            wechat_drafts/institutions
            institution_wechat_progress.log
          if-no-files-found: ignore
          retention-days: 2

      - name: Update public Blog archive
        run: |
          python scripts/update_blog_archive_from_wechat_drafts.py \
            --wechat-drafts-root wechat_drafts \
            --blog-archive-root portal_suite/data/blog_archive

      - name: Commit public Blog archive
        run: |
          DATE_FOLDER="${{ needs.fetch-and-build.outputs.date_folder }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- portal_suite/data/blog_archive
          if git diff --cached --quiet; then
            echo "No Blog archive changes for $DATE_FOLDER."
            exit 0
          fi
          git commit -m "Archive institution Blog articles $DATE_FOLDER"
          bash scripts/push_main_with_rebase_retry.sh 5

  cleanup-private-handoff:
    needs: [fetch-and-build, upload-wechat-drafts]
    if: ${{ always() && needs.fetch-and-build.result == 'success' && needs.upload-wechat-drafts.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: scripts/private_workflow_handoff.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Delete completed private handoff
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          python -m pip install boto3
          python scripts/private_workflow_handoff.py delete-prefix \
            --prefix "$PRIVATE_HANDOFF_ROOT/${{ github.run_id }}/${{ needs.fetch-and-build.outputs.date_folder }}"

  notify-failure:
    needs: [fetch-and-build, source-health, upload-wechat-drafts, cleanup-private-handoff]
    if: ${{ always() && !cancelled() && contains(needs.*.result, 'failure') }}
    uses: ./.github/workflows/portal-ops-alert.yml
    with:
      source_workflow: Institution latest PDF to WeChat
      source_results: >-
        build=${{ needs.fetch-and-build.result }},
        source_health=${{ needs.source-health.result }},
        wechat=${{ needs.upload-wechat-drafts.result }},
        dry_run=${{ github.event.inputs.dry_run || 'false' }},
        wechat_verified=${{ needs.upload-wechat-drafts.outputs.wechat_verified }},
        verified_article_count=${{ needs.upload-wechat-drafts.outputs.verified_article_count }},
        verified_draft_count=${{ needs.upload-wechat-drafts.outputs.verified_draft_count }},
        handoff_cleanup=${{ needs.cleanup-private-handoff.result }}
    secrets: inherit
