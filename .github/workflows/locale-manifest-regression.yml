name: Locale manifest regression
on:
  workflow_dispatch:
    inputs:
      diagnostic_run_id:
        description: "Optional failed Neutral run whose complete source accounting must round-trip"
        required: false
        type: string
        default: ""
      diagnostic_run_attempt:
        description: "Exact attempt containing the source-accounting diagnostics"
        required: false
        type: string
        default: "1"
      manifest_run_id:
        description: "Optional completed Neutral run whose full candidate manifest must round-trip (instead of diagnostics)"
        required: false
        type: string
        default: ""
      manifest_run_attempt:
        description: "Exact attempt containing the complete candidate validation artifact"
        required: false
        type: string
        default: "1"
  pull_request:
    paths: ['scripts/*locale*', 'scripts/verify_prepared_static_slot.py', 'scripts/audit_portal_shadow_preview.py', 'scripts/test_audit_portal_shadow_preview.py', '.github/workflows/locale-manifest-regression.yml']
  push:
    branches: [main]
    paths: ['scripts/portal_locale_manifest.py', 'scripts/build_portal_locales.py', 'scripts/test_locale_manifest_compaction.py', '.github/workflows/locale-manifest-regression.yml']
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check production artifact identity and bounds
        if: inputs.diagnostic_run_id != '' || inputs.manifest_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC_RUN_ID: ${{ inputs.diagnostic_run_id }}
          DIAGNOSTIC_RUN_ATTEMPT: ${{ inputs.diagnostic_run_attempt }}
          MANIFEST_RUN_ID: ${{ inputs.manifest_run_id }}
          MANIFEST_RUN_ATTEMPT: ${{ inputs.manifest_run_attempt }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          full_manifest = bool(os.environ['MANIFEST_RUN_ID'])
          if full_manifest and os.environ['DIAGNOSTIC_RUN_ID']:
              raise SystemExit('Choose one exact full manifest or accounting diagnostic')
          run_id = os.environ['MANIFEST_RUN_ID'] if full_manifest else os.environ['DIAGNOSTIC_RUN_ID']
          attempt = os.environ['MANIFEST_RUN_ATTEMPT'] if full_manifest else os.environ['DIAGNOSTIC_RUN_ATTEMPT']
          if not all(re.fullmatch(r'[1-9][0-9]{0,19}', value) for value in (run_id, attempt)):
              raise SystemExit('Diagnostics require an exact numeric run and attempt')
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/{path}'], timeout=60))
          run = api(f'actions/runs/{run_id}/attempts/{attempt}')
          if (run.get('path') != '.github/workflows/neutral-edge-cutover.yml'
                  or run.get('head_repository', {}).get('full_name') != repo
                  or run.get('status') != 'completed'
                  or run.get('conclusion') not in ({'success', 'failure'} if full_manifest else {'failure'})):
              raise SystemExit('Artifact must belong to the requested completed Neutral run in this repository')
          prefix = 'neutral-release-validation' if full_manifest else 'neutral-translation-diagnostics'
          name = f'{prefix}-{run_id}-{attempt}'
          inventory = api(f'actions/runs/{run_id}/artifacts?per_page=100')
          artifacts = inventory['artifacts']
          if inventory.get('total_count') != len(artifacts) or len(artifacts) > 100:
              raise SystemExit('Artifact inventory is incomplete or exceeds bounds')
          matches = [item for item in artifacts if item['name'] == name]
          if len(matches) != 1:
              raise SystemExit('Expected exactly one production diagnostic artifact')
          artifact = matches[0]
          if (artifact.get('expired') is not False
                  or not 0 < artifact.get('size_in_bytes', 0) <= 96 * 1024 * 1024
                  or artifact.get('workflow_run', {}).get('id') != int(run_id)
                  or artifact.get('workflow_run', {}).get('head_sha') != run['head_sha']):
              raise SystemExit('Production diagnostic identity or download bounds differ')
          print(json.dumps({'run_id': int(run_id), 'attempt': int(attempt), 'head_sha': run['head_sha'],
                            'artifact_id': artifact['id'], 'archive_bytes': artifact['size_in_bytes']}, sort_keys=True))
          PY
      - name: Retrieve exact production source accounting
        if: inputs.diagnostic_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.diagnostic_run_id }}
          name: neutral-translation-diagnostics-${{ inputs.diagnostic_run_id }}-${{ inputs.diagnostic_run_attempt }}
          path: ${{ runner.temp }}/locale-regression-diagnostics
      - name: Retrieve exact complete candidate manifest
        if: inputs.manifest_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.manifest_run_id }}
          name: neutral-release-validation-${{ inputs.manifest_run_id }}-${{ inputs.manifest_run_attempt }}
          path: ${{ runner.temp }}/locale-regression-full
      - name: Test bounded manifests and existing acceptance contracts
        env:
          LOCALE_MANIFEST_DIAGNOSTICS: ${{ inputs.diagnostic_run_id && format('{0}/locale-regression-diagnostics/locale-full-diagnostics.json', runner.temp) || '' }}
          LOCALE_MANIFEST_FULL: ${{ inputs.manifest_run_id && format('{0}/locale-regression-full/candidate/data/i18n/manifest.json', runner.temp) || '' }}
          LOCALE_RESOLUTION_SCALE: '126432'
          LOCALE_MANIFEST_SHARD_SCALE: '110000'
        run: |
          set -euo pipefail
          python -m pip install 'requests>=2.31,<3' 'Pillow>=10.1,<12'
          for name in test_locale_manifest_compaction test_locale_manifest_shards test_verify_portal_locale_manifest_bundle test_portal_locale_resume_workflow test_portal_locale_manifest test_build_portal_locales test_portal_locale_resolution test_portal_locale_source_fallback test_verify_prepared_static_slot test_verify_portal_locale_routes test_audit_portal_shadow_preview test_verify_portal_chinese_parity test_resume_portal_locale_candidate; do
            python -B scripts/$name.py
          done
