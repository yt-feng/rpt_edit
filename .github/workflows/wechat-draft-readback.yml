name: Verify existing WeChat drafts
run-name: "${{ inputs.check_accounts_only && 'Check WeChat account access' || inputs.regroup_date != '' && 'Regroup' || inputs.restore_missing && 'Restore missing' || inputs.audit_presence && 'Locate' || 'Verify' }} WeChat drafts from run ${{ inputs.source_run_id }}"

on:
  workflow_dispatch:
    inputs:
      regroup_date:
        description: "Publication date to regroup remaining receipt-bound drafts, YYYY-MM-DD"
        type: string
        default: ""
      regroup_apply:
        description: "Apply regrouping after private backup and verified replacement readback"
        type: boolean
        default: false
      check_accounts_only:
        description: "Check draft API access for all three accounts without creating drafts"
        type: boolean
        default: false
      source_run_id:
        description: "Existing upload run containing draft diagnostics"
        required: false
        type: string
      artifact_name:
        description: "Exact diagnostic artifact name from the upload run"
        required: false
        type: string
      audit_presence:
        description: "Read-only title search across current drafts and published records, preserving later edits"
        required: false
        default: false
        type: boolean
      restore_missing:
        description: "Restore missing archived articles into drafts only, preserving current drafts and edits"
        required: false
        default: false
        type: boolean
      expected_articles:
        description: "Exact archived article count required for restoration"
        required: false
        default: "15"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: wechat-draft-readback
  cancel-in-progress: false

jobs:
  check-account-access:
    if: ${{ inputs.check_accounts_only }}
    runs-on: [self-hosted, wechat-draft]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            requirements.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Check access to the three WeChat draft boxes
        env:
          WECHAT_MP_APPID: ${{ secrets.WECHAT_MP_APPID }}
          WECHAT_MP_APPSECRET: ${{ secrets.WECHAT_MP_APPSECRET }}
          WECHAT_MP_APPID_TT: ${{ secrets.WECHAT_MP_APPID_TT }}
          WECHAT_MP_APPSECRET_TT: ${{ secrets.WECHAT_MP_APPSECRET_TT }}
          WECHAT_MP_APPID_PANKOU: ${{ secrets.WECHAT_MP_APPID_PANKOU }}
          WECHAT_MP_APPSECRET_PANKOU: ${{ secrets.WECHAT_MP_APPSECRET_PANKOU }}
        run: python scripts/wechat_accounts.py --check-access

  regroup-existing:
    if: ${{ inputs.regroup_date != '' && !inputs.check_accounts_only }}
    runs-on: [self-hosted, wechat-draft]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            requirements.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt "boto3>=1.37.32,<2"
      - name: Bind regrouping to an accepted production draft artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          REGROUP_DATE: ${{ inputs.regroup_date }}
          AUDIT_PRESENCE: ${{ inputs.audit_presence }}
          RESTORE_MISSING: ${{ inputs.restore_missing }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import os
          from datetime import date
          from validate_wechat_image_receipt_source import github_json, require, validate
          require(os.environ["AUDIT_PRESENCE"] != "true" and os.environ["RESTORE_MISSING"] != "true", "conflicting_regroup_modes")
          date.fromisoformat(os.environ["REGROUP_DATE"])
          repo = os.environ["GITHUB_REPOSITORY"]
          source = os.environ["SOURCE_RUN_ID"]
          api = lambda path: github_json(repo, path, os.environ["GH_TOKEN"])
          validate(repo, source, os.environ["ARTIFACT_NAME"], api)
          run = api("actions/runs/" + source)
          allowed = {
              ".github/workflows/dropbox-latest-pdf-to-xhs-sharded.yml",
              ".github/workflows/institution-latest-pdf-to-wechat.yml",
              ".github/workflows/consulting-latest-pdf-to-wechat.yml",
              ".github/workflows/ark-invest-feed-to-wechat.yml",
          }
          require(run.get("head_branch") == "main" and run.get("path") in allowed, "regroup_source_is_not_a_production_upload")
          print("Verified source run, production workflow, and exact diagnostic artifact.")
          PY
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: _wechat_regroup_source
      - name: Regroup remaining drafts and verify their current contents
        env:
          WECHAT_MP_APPID: ${{ secrets.WECHAT_MP_APPID }}
          WECHAT_MP_APPSECRET: ${{ secrets.WECHAT_MP_APPSECRET }}
          WECHAT_MP_APPID_TT: ${{ secrets.WECHAT_MP_APPID_TT }}
          WECHAT_MP_APPSECRET_TT: ${{ secrets.WECHAT_MP_APPSECRET_TT }}
          WECHAT_MP_APPID_PANKOU: ${{ secrets.WECHAT_MP_APPID_PANKOU }}
          WECHAT_MP_APPSECRET_PANKOU: ${{ secrets.WECHAT_MP_APPSECRET_PANKOU }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
          REGROUP_DATE: ${{ inputs.regroup_date }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          REGROUP_APPLY: ${{ inputs.regroup_apply }}
        run: |
          OPTIONS=()
          if [ "$REGROUP_APPLY" = true ]; then OPTIONS+=(--apply); fi
          python scripts/regroup_wechat_drafts.py \
            --artifact-root _wechat_regroup_source \
            --source-run-id "$SOURCE_RUN_ID" --publication-date "$REGROUP_DATE" \
            --output _wechat_regroup_result/summary.json "${OPTIONS[@]}"
      - name: Archive regrouping counts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: wechat-regroup-${{ github.run_id }}-${{ github.run_attempt }}
          path: _wechat_regroup_result/summary.json
          if-no-files-found: warn
          retention-days: 14

  verify-existing:
    if: ${{ !inputs.check_accounts_only && inputs.regroup_date == '' }}
    runs-on: [self-hosted, wechat-draft]
    timeout-minutes: 20
    steps:
      - name: Validate source run
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          AUDIT_PRESENCE: ${{ inputs.audit_presence }}
          RESTORE_MISSING: ${{ inputs.restore_missing }}
          EXPECTED_ARTICLES: ${{ inputs.expected_articles }}
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$ARTIFACT_NAME" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$AUDIT_PRESENCE" != true || "$RESTORE_MISSING" != true ]]
          if [[ "$RESTORE_MISSING" == true ]]; then
            [[ "$EXPECTED_ARTICLES" =~ ^[1-9][0-9]*$ ]]
          fi

      - name: Checkout verification code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows
            .github/actions
            scripts
            requirements.txt

      - name: Bind restoration to a successful producer and its exact live receipt
        if: ${{ inputs.restore_missing == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          PYTHONPATH=scripts python3 - <<'PY'
          import os
          from validate_wechat_image_receipt_source import github_json, require, validate
          repo = os.environ['GITHUB_REPOSITORY']
          source = os.environ['SOURCE_RUN_ID']
          api = lambda path: github_json(repo, path, os.environ['GH_TOKEN'])
          validate(repo, source, os.environ['ARTIFACT_NAME'], api)
          run = api('actions/runs/' + source)
          allowed = {
              '.github/workflows/dropbox-latest-pdf-to-xhs-sharded.yml',
              '.github/workflows/institution-latest-pdf-to-wechat.yml',
              '.github/workflows/consulting-latest-pdf-to-wechat.yml',
              '.github/workflows/ark-invest-feed-to-wechat.yml',
          }
          require(run.get('head_branch') == 'main' and run.get('path') in allowed,
                  'restoration_source_is_not_a_production_upload')
          print('Successful production upload and exact receipt artifact verified.')
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verification dependencies
        run: python -m pip install -r requirements.txt

      - name: Test draft readback
        run: |
          python scripts/test_verify_existing_wechat_drafts.py
          python scripts/test_audit_wechat_article_presence.py
          python scripts/test_restore_missing_wechat_drafts.py

      - name: Download existing draft diagnostics
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: _wechat_readback_source

      - name: Verify existing drafts without creating or publishing
        if: ${{ inputs.audit_presence != true && inputs.restore_missing != true }}
        env:
          WECHAT_MP_APPID: ${{ secrets.WECHAT_MP_APPID }}
          WECHAT_MP_APPSECRET: ${{ secrets.WECHAT_MP_APPSECRET }}
          WECHAT_MP_APPID_TT: ${{ secrets.WECHAT_MP_APPID_TT }}
          WECHAT_MP_APPSECRET_TT: ${{ secrets.WECHAT_MP_APPSECRET_TT }}
          WECHAT_MP_APPID_PANKOU: ${{ secrets.WECHAT_MP_APPID_PANKOU }}
          WECHAT_MP_APPSECRET_PANKOU: ${{ secrets.WECHAT_MP_APPSECRET_PANKOU }}
          PORTAL_SITE_URL: ${{ secrets.PORTAL_SITE_URL }}
        run: |
          python scripts/verify_existing_wechat_drafts.py \
            --artifact-root _wechat_readback_source \
            --output _wechat_readback_result/verification.json

      - name: Locate article titles in current drafts and published records
        if: ${{ inputs.audit_presence == true }}
        env:
          WECHAT_MP_APPID: ${{ secrets.WECHAT_MP_APPID }}
          WECHAT_MP_APPSECRET: ${{ secrets.WECHAT_MP_APPSECRET }}
          WECHAT_MP_APPID_TT: ${{ secrets.WECHAT_MP_APPID_TT }}
          WECHAT_MP_APPSECRET_TT: ${{ secrets.WECHAT_MP_APPSECRET_TT }}
          WECHAT_MP_APPID_PANKOU: ${{ secrets.WECHAT_MP_APPID_PANKOU }}
          WECHAT_MP_APPSECRET_PANKOU: ${{ secrets.WECHAT_MP_APPSECRET_PANKOU }}
        run: |
          python scripts/audit_wechat_article_presence.py \
            --artifact-root _wechat_readback_source \
            --output _wechat_readback_result/presence.json

      - name: Restore checkpoint from an interrupted restoration
        id: restore_receipts
        if: ${{ inputs.restore_missing == true }}
        uses: ./.github/actions/restore-wechat-diagnostics
        with:
          submission-step-names: |
            Restore missing archived articles as drafts and read them back
          name: wechat-restored-drafts-${{ github.run_id }}
          path: _wechat_restore_result

      - name: Restore missing archived articles as drafts and read them back
        if: ${{ inputs.restore_missing == true }}
        env:
          WECHAT_MP_APPID: ${{ secrets.WECHAT_MP_APPID }}
          WECHAT_MP_APPSECRET: ${{ secrets.WECHAT_MP_APPSECRET }}
          PORTAL_SITE_URL: ${{ secrets.PORTAL_SITE_URL }}
          EXPECTED_ARTICLES: ${{ inputs.expected_articles }}
          REQUIRE_CHECKPOINT: ${{ steps.restore_receipts.outputs.found == 'true' }}
        run: |
          RESTORE_OPTIONS=()
          if [ "$REQUIRE_CHECKPOINT" = true ]; then
            RESTORE_OPTIONS+=(--require-checkpoint)
          fi
          python scripts/restore_missing_wechat_drafts.py \
            --artifact-root _wechat_readback_source \
            --output _wechat_restore_result/restore_receipt.json \
            --expected-articles "$EXPECTED_ARTICLES" \
            "${RESTORE_OPTIONS[@]}"

      - name: Archive restored draft receipts
        if: ${{ always() && inputs.restore_missing == true }}
        uses: actions/upload-artifact@v4
        with:
          name: wechat-restored-drafts-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: _wechat_restore_result
          if-no-files-found: warn
          retention-days: 7

      - name: Archive readback result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: wechat-readback-${{ github.run_id }}
          path: _wechat_readback_result/*.json
          if-no-files-found: warn
          retention-days: 7
