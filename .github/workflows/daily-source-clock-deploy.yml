name: Deploy independent Daily source clock

on:
  workflow_dispatch:
    inputs:
      inspect_only:
        description: 'Read the existing cron and automatic wake receipt without deployment or dispatch'
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/daily-source-clock-deploy.yml'
      - 'workers/daily-source-wakeup/**'
      - 'workers/portal-suite-worker/src/daily-source-wakeup.js'
      - 'portal_suite/tests/daily-source-wakeup.test.mjs'
      - 'portal_suite/tests/dropbox-ready-relay.test.mjs'
      - 'scripts/inspect_daily_source_clock.py'
      - 'scripts/test_inspect_daily_source_clock.py'
      - 'scripts/private_workflow_handoff.py'
      - 'scripts/sync_portal_worker_schedules.py'

permissions:
  contents: read

concurrency:
  group: daily-source-clock-deploy-${{ github.event_name == 'pull_request' && github.run_id || 'main' }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request' || !inputs.inspect_only
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            workers
            portal_suite/tests
            scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test portal_suite/tests/daily-source-wakeup.test.mjs portal_suite/tests/dropbox-ready-relay.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML
      - run: python scripts/test_inspect_daily_source_clock.py

  inspect:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.inspect_only
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3
      - name: Read existing clock schedule and automatic wake receipt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
          AWS_MAX_ATTEMPTS: '2'
          AWS_RETRY_MODE: standard
        run: python scripts/inspect_daily_source_clock.py

  deploy:
    needs: check
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.inspect_only
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            workers/daily-source-wakeup
            workers/portal-suite-worker/src/daily-source-wakeup.js
            scripts/sync_portal_worker_schedules.py
      - name: Configure the isolated clock and its credentials
        env:
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
          REPORT_HANDOFF_SIGNING_KEY: ${{ secrets.REPORT_HANDOFF_SIGNING_KEY }}
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN || secrets.GH_DISPATCH_TOKEN }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          bucket = os.environ['R2_BUCKET_NAME']
          assert re.fullmatch(r'[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]', bucket), 'Invalid R2 bucket'
          values = {key: os.environ[key] for key in ('GH_READ_TOKEN', 'GH_DISPATCH_TOKEN', 'REPORT_HANDOFF_SIGNING_KEY')}
          assert all(values.values()), 'Missing GitHub clock or Dropbox relay credentials'
          assert re.fullmatch(r'[0-9a-f]{64}', values['REPORT_HANDOFF_SIGNING_KEY']), 'Invalid Dropbox relay signing key'
          config = {
              'name': 'portal-daily-source-clock', 'main': 'src/index.js',
              'compatibility_date': '2026-05-01', 'workers_dev': True,
              'preview_urls': False,
              'vars': {'GH_REPO': os.environ['GITHUB_REPOSITORY']},
              'triggers': {'crons': ['*/30 * * * *']},
              'r2_buckets': [{'binding': 'REPORT_BUCKET', 'bucket_name': bucket}],
          }
          Path('workers/daily-source-wakeup/wrangler.json').write_text(json.dumps(config))
          secret_path = Path(os.environ['RUNNER_TEMP']) / 'daily-clock-secrets.json'
          with os.fdopen(os.open(secret_path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), 'w') as output:
              json.dump(values, output)
          PY
      - name: Deploy the isolated clock with its credentials
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          workingDirectory: workers/daily-source-wakeup
          wranglerVersion: '4.125.0'
          # deploy creates the first Worker as well as updating an existing one;
          # versions upload requires an already-created Worker.
          command: deploy --secrets-file "${{ runner.temp }}/daily-clock-secrets.json"
      - name: Apply the independent half-hour trigger
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          workingDirectory: workers/daily-source-wakeup
          wranglerVersion: '4.125.0'
          command: triggers deploy
      - name: Verify the deployed trigger through Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
        run: |
          PYTHONPATH=scripts python3 - <<'PY'
          import os
          from sync_portal_worker_schedules import ScheduleApi
          api = ScheduleApi(os.environ['CLOUDFLARE_ACCOUNT_ID'], 'portal-daily-source-clock', os.environ['CLOUDFLARE_API_TOKEN'])
          assert api.get() == ['*/30 * * * *'], 'Independent clock schedule mismatch'
          print('Independent half-hour Daily source clock verified')
          PY
      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/daily-clock-secrets.json"
