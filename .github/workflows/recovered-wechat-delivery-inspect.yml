name: Inspect claimed recovered WeChat delivery counts
run-name: Read-only WeChat receipts for Daily ${{ inputs.source_run_id }}
on:
  pull_request:
    paths:
      - .github/workflows/recovered-wechat-delivery-inspect.yml
      - scripts/inspect_recovered_wechat_delivery.py
      - scripts/test_inspect_recovered_wechat_delivery.py
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Original Daily run owning the delivery claim
        required: true
        type: string
      date_folder:
        description: Exact selected source date in YYMMDD format
        required: true
        type: string
      manifest_sha256:
        description: Exact selected source manifest digest
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests Pillow PyMuPDF
      - run: python -B scripts/test_inspect_recovered_wechat_delivery.py
  inspect:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests Pillow PyMuPDF 'boto3>=1.37.32,<2'
      - name: Read claimed receipt counts without changing drafts or checkpoints
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          DATE_FOLDER: ${{ inputs.date_folder }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          GH_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: python -B scripts/inspect_recovered_wechat_delivery.py
