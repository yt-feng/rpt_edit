name: Portal offline translation preflight

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/actions/setup-offline-translation/**'
      - '.github/workflows/portal-locale-translation-preflight.yml'
      - 'requirements-translation.txt'
      - 'scripts/offline_translation.py'
      - 'scripts/hymt_offline_translation.py'
      - 'scripts/install_hymt_translation_model.py'
      - 'scripts/test_hymt_offline_translation.py'
      - 'scripts/financial_quantity_integrity.py'
      - 'scripts/test_financial_quantity_integrity.py'
      - 'scripts/smoke_hymt_translation.py'
      - 'scripts/build_portal_locales.py'
      - 'scripts/translate_portal_titles.py'
      - 'scripts/build_portal_translated_reports.py'

permissions:
  contents: read

concurrency:
  group: portal-offline-translation-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test offline adapters and integration
        run: |
          python -m pip install requests Pillow
          python -B scripts/test_hymt_offline_translation.py
          python -B scripts/test_financial_quantity_integrity.py
          python -B scripts/test_portal_offline_locales.py
          python -B scripts/test_portal_locale_preflight_diagnostics.py
          python -B scripts/test_translate_portal_titles.py
          python -B scripts/test_offline_translation_callers.py
          python -B scripts/test_private_translation_checkpoint.py
          python -B scripts/test_portal_locale_translation_preflight_workflow.py
      - name: Set up free local translation models
        uses: ./.github/actions/setup-offline-translation
        with:
          targets: zh,en,ko,ja,ar
      - name: Translate public samples with the runner-local CPU server
        run: |
          python scripts/smoke_hymt_translation.py \
            --diagnostics-out "$RUNNER_TEMP/portal-locale-preflight/diagnostics.json"
      - name: Upload translation diagnostics even when preflight fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-locale-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/portal-locale-preflight/
          if-no-files-found: warn
          retention-days: 3
