name: Portal offline translation preflight

on:
  workflow_dispatch:
    inputs:
      verify_private_checkpoint:
        description: 'Also verify private R2 checkpoints with synthetic fixtures (no paid API calls)'
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/actions/setup-offline-translation/**'
      - '.github/workflows/portal-locale-translation-preflight.yml'
      - 'requirements-translation.txt'
      - 'scripts/offline_translation.py'
      - 'scripts/hymt_offline_translation.py'
      - 'scripts/install_hymt_translation_model.py'
      - 'scripts/test_hymt_offline_translation.py'
      - 'scripts/financial_quantity_integrity.py'
      - 'scripts/test_financial_quantity_integrity.py'
      - 'scripts/smoke_hymt_translation.py'
      - 'scripts/portal_title_regression_samples.json'
      - 'scripts/build_portal_locales.py'
      - 'scripts/translate_portal_titles.py'
      - 'scripts/build_portal_translated_reports.py'
      - 'scripts/smoke_private_checkpoints.py'
      - 'scripts/test_smoke_private_checkpoints.py'

permissions:
  contents: read

concurrency:
  group: portal-offline-translation-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test offline adapters and integration
        run: |
          python -m pip install requests Pillow
          python -B scripts/test_hymt_offline_translation.py
          python -B scripts/test_financial_quantity_integrity.py
          python -B scripts/test_portal_offline_locales.py
          python -B scripts/test_portal_locale_preflight_diagnostics.py
          python -B scripts/test_translate_portal_titles.py
          python -B scripts/test_offline_translation_callers.py
          python -B scripts/test_private_translation_checkpoint.py
          python -B scripts/test_smoke_private_checkpoints.py
          python -B scripts/test_portal_locale_translation_preflight_workflow.py
      - name: Set up free local translation models
        uses: ./.github/actions/setup-offline-translation
        with:
          targets: zh,en,ko,ja,ar
          audit-suffix: -${{ matrix.runner }}
      - name: Translate public samples with the runner-local CPU server
        run: |
          python scripts/smoke_hymt_translation.py \
            --diagnostics-out "$RUNNER_TEMP/portal-locale-preflight/diagnostics.json"
      - name: Upload translation diagnostics even when preflight fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-locale-preflight-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/portal-locale-preflight/
          if-no-files-found: warn
          retention-days: 3

  private-checkpoint-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_private_checkpoint == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
      AWS_MAX_ATTEMPTS: '2'
      AWS_RETRY_MODE: standard
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install private storage transport
        run: python -m pip install boto3
      - name: Save only built-in synthetic generation and translation checkpoints
        timeout-minutes: 2
        run: |
          python -B scripts/smoke_private_checkpoints.py save \
            --diagnostics-out "$RUNNER_TEMP/private-checkpoint-smoke-diagnostics"
      - name: Restore to empty directories and verify cached outputs and handoff
        timeout-minutes: 3
        run: |
          python -B scripts/smoke_private_checkpoints.py verify \
            --diagnostics-out "$RUNNER_TEMP/private-checkpoint-smoke-diagnostics"
      - name: Delete only this run's synthetic objects
        if: always()
        timeout-minutes: 2
        run: |
          python -B scripts/smoke_private_checkpoints.py cleanup \
            --diagnostics-out "$RUNNER_TEMP/private-checkpoint-smoke-diagnostics"
      - name: Upload content-free private checkpoint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-checkpoint-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/private-checkpoint-smoke-diagnostics/*.json
          if-no-files-found: warn
          retention-days: 3
