name: Locale manifest recovery verification
on:
  push:
    branches: [codex/locale-r2-actions-recovery-20260924]
    paths: [.github/workflows/locale-manifest-recovery.yml, .locale-manifest-fix.patch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/locale-r2-actions-recovery-20260924
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact reviewed patch on recovery branch only
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = codex/locale-r2-actions-recovery-20260924
          git apply --check .locale-manifest-fix.patch
          git apply --index .locale-manifest-fix.patch
      - name: Run codec, source-accounting and release acceptance tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -m pip install 'requests>=2.31,<3' 'Pillow>=10.1,<12'
          for name in test_locale_manifest_compaction test_portal_locale_manifest test_build_portal_locales test_portal_locale_source_fallback test_verify_prepared_static_slot test_verify_portal_locale_routes test_audit_portal_shadow_preview test_verify_portal_chinese_parity test_resume_portal_locale_candidate test_neutral_edge_cutover_workflow; do
            python -B scripts/$name.py
          done
          git diff --cached --check
      - name: Commit tested source without deploying
        run: |
          set -euo pipefail
          git rm .locale-manifest-fix.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: losslessly compact repeated locale provenance under the 16 MiB limit'
          git push origin HEAD:refs/heads/codex/locale-r2-actions-recovery-20260924
