name: Validate global locale refinement
on:
  push:
    branches: [codex/global-offline-locales-20260923]
permissions:
  contents: read
concurrency:
  group: global-locale-refinement
  cancel-in-progress: false
jobs:
  refine:
    if: contains(github.event.head_commit.message, '[apply-global-v2]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/global-offline-locales-20260923
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply byte-verified patch to the implementation branch only
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'codex/global-offline-locales-20260923'
          python - <<'PY'
          import base64,hashlib,json,lzma,pathlib
          manifest=json.loads(pathlib.Path('.global-v2.json').read_text())
          names=manifest['parts']
          assert all(pathlib.Path(n).name==n and n.startswith('.global-v2-') and n.endswith('.txt') for n in names)
          patch=lzma.decompress(base64.b64decode(''.join(pathlib.Path(n).read_text().strip() for n in names),validate=True))
          assert hashlib.sha256(patch).hexdigest()==manifest['sha256'], 'Checksum mismatch'
          pathlib.Path('/tmp/global-v2.patch').write_bytes(patch)
          PY
          git apply --check /tmp/global-v2.patch
          git apply --index /tmp/global-v2.patch
      - name: Validate expanded routes, costs, quantities, candidates and original languages
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -m pip install requests Pillow pypdf 'opencc-python-reimplemented==0.1.7'
          python -B scripts/test_portal_global_locales.py
          python -B scripts/test_build_portal_locales.py
          python -B scripts/test_hymt_offline_translation.py
          python -B scripts/test_financial_quantity_integrity.py
          python -B scripts/test_portal_offline_locales.py
          python -B scripts/test_portal_locale_manifest.py
          python -B scripts/test_portal_locale_source_fallback.py
          python -B scripts/test_verify_portal_chinese_parity.py
          python -B scripts/test_verify_portal_locale_routes.py
          python -B scripts/test_verify_prepared_static_slot.py
          python -B scripts/test_resume_portal_locale_candidate.py
          python -B scripts/test_audit_portal_shadow_preview.py
          python -B scripts/test_neutral_edge_cutover_workflow.py
          python -B scripts/test_portal_seo.py
          python -B scripts/test_portal_discovery_quality.py
          node scripts/test_portal_locale_runtime.js
          node scripts/test_portal_locale_recovery.js
          node scripts/test_portal_locale_detail.js
          node --test workers/edge-static-host/test/*.test.mjs
          git diff --check
      - name: Commit verified code and stage workflow files for connector finalization
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,shutil,subprocess
          files=subprocess.check_output(['git','diff','--cached','--name-only','--','.github/workflows'],text=True).splitlines()
          root=pathlib.Path('.global-v2-workflows');root.mkdir()
          for name in files: shutil.copyfile(name,root/pathlib.Path(name).name)
          PY
          git restore --staged --worktree .github/workflows
          rm -f .github/workflows/portal-global-locale-prepare.yml .global-v2.json .global-v2-*.txt
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add bounded free locale preparation and strict script and citation guards'
          git push origin HEAD:refs/heads/codex/global-offline-locales-20260923
