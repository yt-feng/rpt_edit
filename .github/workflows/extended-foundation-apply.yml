name: Apply reviewed locale foundation
on:
  push:
    branches: [codex/extended-locales-r2-20260924]
    paths: [.github/workflows/extended-foundation-apply.yml]
permissions:
  contents: read
concurrency:
  group: extended-foundation-apply
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/extended-locales-r2-20260924
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply hash-guarded source changes on the draft branch only
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'codex/extended-locales-r2-20260924'
          python -B .foundation_apply.py
          rm .foundation_apply.py
      - name: Verify implementation and existing safety contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -m pip install 'requests>=2.31,<3' 'Pillow>=10.1,<12' 'PyYAML>=6,<7'
          for suite in test_portal_extended_locales test_portal_extended_hardening test_hymt_offline_translation test_compare_hymt_translation test_financial_quantity_integrity test_offline_translation_callers test_portal_offline_locales test_translate_portal_titles; do
            python -B scripts/$suite.py
          done
          python -B scripts/check_public_identity.py
          for test in workers/edge-static-host/test/*.test.mjs; do node --test "$test"; done
          git diff --check
      - name: Commit verified source only without deployment
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'codex/extended-locales-r2-20260924'
          git add .foundation_apply.py .github/actions/setup-offline-translation/action.yml scripts/assemble_portal_extended_locales.py scripts/build_portal_extended_locales.py scripts/collect_portal_extended_sources.py scripts/compare_hymt_translation.py scripts/hymt_offline_translation.py scripts/portal_extended_locales.py workers/edge-static-host/src/index.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: verify offline language foundation and preserve release boundaries'
          git push origin HEAD:refs/heads/codex/extended-locales-r2-20260924
