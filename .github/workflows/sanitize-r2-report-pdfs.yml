name: Sanitize R2 Report PDFs

on:
  workflow_dispatch:
    inputs:
      prefix:
        description: R2 key prefix to scan
        default: reportify/
        required: true
      limit:
        description: Maximum PDFs to process; 0 means all
        default: "0"
        required: true
      force:
        description: Reprocess objects already marked clean
        default: "false"
        required: true

jobs:
  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install boto3 pypdf

      - name: Sanitize cached PDFs
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET || 'portal-suite-pdfs' }}
        run: |
          ARGS=(--prefix "${{ inputs.prefix }}" --limit "${{ inputs.limit }}")
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS+=(--force)
          fi
          python scripts/sanitize_r2_reportify_pdfs.py "${ARGS[@]}"
