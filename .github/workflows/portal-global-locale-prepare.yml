name: Prepare global offline locale candidates

on:
  workflow_dispatch:
    inputs:
      targets:
        description: ready-new (32 additions), ready (35 mirrors), or eligible locale codes
        required: true
        default: ready-new
        type: string
      budget_seconds:
        description: Local CPU seconds per locale, 30 through 1200
        required: true
        default: '300'
        type: string
  # Small rotating batches; no individual language monopolizes the build lane.
  schedule:
    - cron: '21 */6 * * *'

permissions:
  contents: read

concurrency:
  group: portal-global-locale-prepare
  cancel-in-progress: false

jobs:
  source:
    if: github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      budget: ${{ steps.plan.outputs.budget }}
      source_sha256: ${{ steps.store.outputs.source_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate bounded target plan
        id: plan
        env:
          REQUESTED_TARGETS: ${{ inputs.targets || 'ready-new' }}
          REQUESTED_BUDGET: ${{ inputs.budget_seconds || '300' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PYCODE'
          import datetime, json, os, sys
          sys.path.insert(0, 'scripts')
          from portal_language_registry import preparation_locales, HELD_LOCALES
          codes = preparation_locales(os.environ['REQUESTED_TARGETS'])
          print('Languages held pending script qualification:', ','.join(HELD_LOCALES))
          budget = int(os.environ['REQUESTED_BUDGET'])
          assert 30 <= budget <= 1200, 'Unsupported CPU window'
          if os.environ['EVENT_NAME'] == 'schedule':
              groups = [codes[i:i+6] for i in range(0,len(codes),6)]
              slot = int(datetime.datetime.now(datetime.timezone.utc).timestamp()) // (6 * 3600)
              codes = groups[slot % len(groups)]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('matrix=' + json.dumps({'locale': list(codes)}) + '\n')
              stream.write('budget=' + str(budget) + '\n')
          PYCODE
      - name: Build isolated Chinese source from public repository inputs
        run: |
          python -m pip install requests Pillow 'boto3>=1.34,<2' 'opencc-python-reimplemented==0.1.7'
          python -B scripts/prepare_portal_global_locales.py --build-source \
            --output-root "$RUNNER_TEMP/global-source" --site-url https://kcdesk.com
      - name: Store public source in Cloudflare R2, not Actions artifacts
        id: store
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: python -B scripts/portal_global_r2.py push-source --path "$RUNNER_TEMP/global-source"

  prepare:
    needs: source
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests Pillow 'boto3>=1.34,<2' 'opencc-python-reimplemented==0.1.7'
      - name: Restore exact source and this locale checkpoint from R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
          SOURCE_SHA256: ${{ needs.source.outputs.source_sha256 }}
          TARGET_LOCALE: ${{ matrix.locale }}
        run: |
          set -euo pipefail
          python -B scripts/portal_global_r2.py pull-source --path "$RUNNER_TEMP/global-source" --expected-source "$SOURCE_SHA256"
          python -B scripts/portal_global_r2.py pull-checkpoint --path "$RUNNER_TEMP/global-checkpoint/cache.json.gz" --locale "$TARGET_LOCALE"
      - uses: ./.github/actions/setup-offline-translation
        with:
          targets: ${{ matrix.locale }}
          audit-suffix: -prepare-${{ matrix.locale }}
          retain-audit: false
      - name: Translate incremental public candidate with no paid fallback
        env:
          TARGET_LOCALE: ${{ matrix.locale }}
          CPU_BUDGET: ${{ needs.source.outputs.budget }}
        run: |
          python -B scripts/prepare_portal_global_locales.py \
            --source-root "$RUNNER_TEMP/global-source" --output-root "$RUNNER_TEMP/result/site" \
            --cache "$RUNNER_TEMP/global-checkpoint/cache.json.gz" \
            --targets "$TARGET_LOCALE" --site-url https://kcdesk.com \
            --index-start-date 2026-09-23 --budget-seconds "$CPU_BUDGET"
      - name: Check bounded checkpoint storage
        id: checkpoint
        if: always()
        run: |
          python - <<'PYCODE'
          import os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'global-checkpoint/cache.json.gz'
          valid = path.is_file() and not path.is_symlink() and 0 < path.stat().st_size <= 8 * 1024 * 1024
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('available=' + str(valid).lower() + '\n')
          PYCODE
      - name: Persist verified checkpoint and complete candidate only in R2
        if: always() && steps.checkpoint.outputs.available == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
          TARGET_LOCALE: ${{ matrix.locale }}
        run: |
          set -euo pipefail
          python -B scripts/portal_global_r2.py push-checkpoint --path "$RUNNER_TEMP/global-checkpoint/cache.json.gz" --locale "$TARGET_LOCALE"
          if [[ -f "$RUNNER_TEMP/result/readiness.json" ]]; then
            python -B scripts/portal_global_r2.py push-readiness --path "$RUNNER_TEMP/result/readiness.json" --locale "$TARGET_LOCALE"
            ready=$(python -c 'import json,sys; print(str(json.load(open(sys.argv[1])).get("candidate_complete",False)).lower())' "$RUNNER_TEMP/result/readiness.json")
            if [[ "$ready" == 'true' ]]; then
              python -B scripts/portal_global_r2.py push-candidate --path "$RUNNER_TEMP/result/site" --locale "$TARGET_LOCALE" --readiness "$RUNNER_TEMP/result/readiness.json"
            fi
          fi
      - name: Record truthful progress in the job summary without a stored site artifact
        if: always()
        run: |
          python - <<'PYCODE'
          import json, os, pathlib
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'result/readiness.json'
          data=json.loads(path.read_text()) if path.exists() else {'status':'blocked-before-translation','production_ready':False}
          allowed=('status','targets','candidate_complete','production_ready','paid_provider_requests','stop_reason')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('## Offline locale preparation (Cloudflare R2)\n```json\n'+json.dumps({k:data[k] for k in allowed if k in data},ensure_ascii=False,indent=2)+'\n```\n')
          PYCODE
