# Durable private source/checkpoint/candidate pipeline for the additional locales.
# This workflow never publishes an incomplete candidate and never uploads
# generated translations to Actions artifacts or caches.
name: Extended locales private R2 pipeline
run-name: Extended locale R2 ${{ inputs.operation || 'daily incremental' }} (${{ inputs.locales || vars.PORTAL_EXTENDED_INCREMENTAL_LOCALES || 'all-supported' }})

on:
  workflow_run:
    workflows: [Extended locale source admission]
    types: [completed]
    branches: [main]
  push:
    branches: [codex/extended-locales-r2-20260924]
  workflow_dispatch:
    inputs:
      operation:
        description: "R2 round-trip, daily candidate, or read-only replay of an exact failed generation"
        required: true
        type: choice
        options: [roundtrip, candidate, recovery-test, publication-resume, publication-check, english-resume, checkpoint-repair, source-fallback-inspect]
        default: roundtrip
      locales:
        description: "all-supported = 33 non-English locales, or comma-separated subset; English is summary/commentary blog only, no originals/charts; up to 24 new detail pages"
        required: false
        type: string
        default: all-supported
      source_generation:
        description: "Optional same-day daily source generation; leave empty to select today new/changed content"
        required: false
        type: string
        default: ""
      continuation_evidence:
        description: "Publication-resume exact producer/proofs; checkpoint-repair exact legacy intent or French fallback policy and sorted unit hashes; source-fallback-inspect reads French eligibility only"
        required: false
        type: string
        default: ""
      seconds:
        description: "Per-locale Hy-MT2 CPU budget in seconds (1..14400)"
        required: false
        type: string
        default: "14400"
      allow_source_fallback:
        description: "Keep exact source units on translation quality failure, matching ko/ja/ar; still require a complete page set"
        required: false
        type: boolean
        default: true
      diagnose_runtime:
        description: "Recovery-test only: compare the first unfinished unit with the original unconstrained sampler"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # GitHub replaces a pending run before evaluating job conditions. A skipped
  # source-admission event must therefore never enter the shared work queue.
  group: >-
    ${{ (github.event_name == 'workflow_run' &&
          (github.event.workflow_run.conclusion != 'success' ||
           github.event.workflow_run.head_branch != github.event.repository.default_branch ||
           github.event.workflow_run.head_repository.full_name != github.repository)) &&
        format('extended-locales-ineligible-{0}-{1}', github.run_id, github.run_attempt) ||
        inputs.operation == 'roundtrip' && format('extended-locales-r2-staging-{0}', github.ref) ||
        inputs.operation == 'publication-check' && format('extended-locales-publication-check-{0}', github.ref) ||
        inputs.operation == 'recovery-test' && format('extended-locales-r2-recovery-{0}', github.ref) || 'extended-locales-r2-pipeline' }}
  cancel-in-progress: false

env:
  EXTENDED_R2_PREFIX: _extended-locales/v1

jobs:
  publication_check:
    if: inputs.operation == 'publication-check'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public and private storage readers
        run: python3 -m pip install --disable-pip-version-check "boto3>=1.34,<2" "requests>=2.31,<3"
      - name: Verify complete stored candidates in unserved staging without translation or activation
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          REQUESTED_GENERATION: ${{ inputs.source_generation }}
          REQUESTED_LOCALES: ${{ inputs.locales }}
        run: |
          set -euo pipefail
          python3 -B scripts/check_portal_extended_publication.py \
            --generation "$REQUESTED_GENERATION" --locales "$REQUESTED_LOCALES" \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" | tee -a "$GITHUB_STEP_SUMMARY"

  roundtrip:
    if: >-
      ${{
        inputs.operation == 'roundtrip' ||
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[r2-roundtrip]'))
      }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install private R2 client
        run: python3 -m pip install --disable-pip-version-check "boto3>=1.34,<2" "requests>=2.31,<3"
      - name: Verify isolated private R2 read/write/checksum and error classification
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          prefix="_extended-locales/staging/roundtrip-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PYTHONPATH=scripts python3 -B scripts/portal_extended_r2.py roundtrip \
            --prefix "$prefix" --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Verify admitted source and checkpoint recovery in isolated private staging
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          KC_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false && 'true' || 'false' }}
        run: |
          set -euo pipefail
          python3 -B scripts/portal_extended_daily_queue.py --operation staging-probe \
            --prefix "_extended-locales/staging/queue-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Verify English editorial-only source restoration without inference or publication
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          KC_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false && 'true' || 'false' }}
        run: |
          set -euo pipefail
          python3 -B scripts/portal_english_commentary.py \
            --staging-prefix "_extended-locales/staging/english-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Verify English same-capture cursor and incomplete candidate recovery without inference
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          KC_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false && 'true' || 'false' }}
        run: |
          set -euo pipefail
          python3 -B scripts/portal_english_pipeline.py staging-probe \
            --prefix "_extended-locales/staging/english-pipeline-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" | tee -a "$GITHUB_STEP_SUMMARY"

  source:
    permissions:
      contents: read
      actions: read
    if: >-
      ${{
        inputs.operation == 'candidate' || inputs.operation == 'recovery-test' || inputs.operation == 'publication-resume' || inputs.operation == 'english-resume' || inputs.operation == 'checkpoint-repair' || inputs.operation == 'source-fallback-inspect' ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == github.event.repository.default_branch &&
         github.event.workflow_run.head_repository.full_name == github.repository) ||
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[r2-candidate]'))
      }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      has_work: ${{ steps.source.outputs.has_work }}
      generation: ${{ steps.source.outputs.generation }}
      locales_json: ${{ steps.source.outputs.locales_json }}
      locale_jobs_json: ${{ steps.source.outputs.locale_jobs_json }}
      day: ${{ steps.source.outputs.day }}
      requested_locales: ${{ steps.source.outputs.requested_locales }}
      source_admission: ${{ steps.source.outputs.source_admission }}
      pending_counts_json: ${{ steps.source.outputs.pending_counts_json }}
      stopped_locales_json: ${{ steps.source.outputs.stopped_locales_json }}
      english_admission: ${{ steps.source.outputs.english_admission }}
      english_pending_count: ${{ steps.source.outputs.english_pending_count }}
      quality_repair_plans_json: ${{ steps.source.outputs.quality_repair_plans_json || '[]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public collector and private R2 client
        run: python3 -m pip install --disable-pip-version-check "boto3>=1.34,<2" "requests>=2.31,<3"
      - name: Continue registered original generations before selecting today new detail pages
        id: source
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          REQUESTED_SOURCE_GENERATION: ${{ inputs.source_generation }}
          REQUESTED_LOCALES: ${{ inputs.locales || vars.PORTAL_EXTENDED_INCREMENTAL_LOCALES || 'all-supported' }}
          REQUESTED_OPERATION: ${{ inputs.operation }}
          CONTINUATION_EVIDENCE: ${{ inputs.continuation_evidence }}
          GH_TOKEN: ${{ github.token }}
          KC_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED_OPERATION" = "source-fallback-inspect" ]; then
            python3 -B scripts/repair_portal_extended_checkpoint.py inspect \
              --generation "$REQUESTED_SOURCE_GENERATION" --locale "$REQUESTED_LOCALES" \
              --request "$CONTINUATION_EVIDENCE" --github-output "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$REQUESTED_OPERATION" = "checkpoint-repair" ]; then
            python3 -B scripts/repair_portal_extended_checkpoint.py prepare \
              --generation "$REQUESTED_SOURCE_GENERATION" --locale "$REQUESTED_LOCALES" \
              --request "$CONTINUATION_EVIDENCE" --github-output "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$REQUESTED_OPERATION" = "english-resume" ]; then
            test -n "$REQUESTED_SOURCE_GENERATION"
            python3 -B scripts/portal_english_pipeline.py prepare-exact \
              --generation "$REQUESTED_SOURCE_GENERATION" --github-output "$GITHUB_OUTPUT"
            exit 0
          fi
          source_args=()
          if [ -n "$REQUESTED_SOURCE_GENERATION" ]; then
            source_args+=(--generation "$REQUESTED_SOURCE_GENERATION")
          fi
          if [ -n "$CONTINUATION_EVIDENCE" ]; then
            source_args+=(--continuation-evidence "$CONTINUATION_EVIDENCE")
          fi
          prepare_operation=prepare
          if [ "$REQUESTED_OPERATION" = "recovery-test" ]; then
            test -n "$REQUESTED_SOURCE_GENERATION"
            prepare_operation=prepare-recovery
          fi
          if [ "$REQUESTED_OPERATION" = "publication-resume" ]; then
            test -n "$REQUESTED_SOURCE_GENERATION"
            prepare_operation=prepare-publication
          fi
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$prepare_operation" = "prepare" ] && [ -z "$REQUESTED_SOURCE_GENERATION" ]; then
            source_args+=(--include-english)
          fi
          PYTHONPATH=scripts python3 -B scripts/portal_extended_incremental.py "$prepare_operation" \
            --prefix "$EXTENDED_R2_PREFIX" --locales "$REQUESTED_LOCALES" \
            --corpus "$RUNNER_TEMP/extended-source-corpus.json" \
            --github-output "$GITHUB_OUTPUT" "${source_args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Persist source-generation evidence
        env:
          SOURCE_GENERATION: ${{ steps.source.outputs.generation }}
        run: |
          set -euo pipefail
          if [ -z "$SOURCE_GENERATION" ]; then
            echo "No new content today; no model job or historical backfill." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "source_generation=$SOURCE_GENERATION" >> "$GITHUB_STEP_SUMMARY"

  continuation_diagnostics:
    needs: source
    if: >-
      ${{ needs.source.result == 'success' && needs.source.outputs.stopped_locales_json != '' &&
          needs.source.outputs.stopped_locales_json != '[]' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Report stopped locale cursors without blocking healthy candidate publication
        env:
          STOPPED_LOCALES: ${{ needs.source.outputs.stopped_locales_json }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          for row in json.loads(os.environ['STOPPED_LOCALES']):
              print(json.dumps(row, sort_keys=True))
          raise SystemExit('Stopped locale cursors require diagnosis; no model calls were scheduled for them')
          PYCODE

  locale:
    name: locale (${{ matrix.locale }})
    needs: source
    if: needs.source.result == 'success' && needs.source.outputs.has_work == 'true' && github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 270
    strategy:
      fail-fast: false
      # Retain the operator's two-worker production bound, including resumes.
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.source.outputs.locale_jobs_json) }}
    env:
      EXTENDED_R2_PREFIX: ${{ matrix.locale == 'en' && '_english-commentary/v1' || '_extended-locales/v1' }}
      KC_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false && 'true' || 'false' }}
      SOURCE_GENERATION: ${{ matrix.generation }}
      LOCALE: ${{ matrix.locale }}
      QUALITY_REPAIR: ${{ matrix.quality_repair || '' }}
      TRANSLATION_SECONDS: ${{ inputs.seconds || '14400' }}
      ALLOW_SOURCE_FALLBACK: ${{ (github.event_name != 'workflow_dispatch' || inputs.allow_source_fallback) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source/R2 client dependencies
        run: python3 -m pip install --disable-pip-version-check "boto3>=1.34,<2" "requests>=2.31,<3"
      - name: Restore fixed source generation
        if: inputs.operation != 'checkpoint-repair' && matrix.quality_repair == ''
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          if [ "$LOCALE" = "en" ]; then
            python3 -B scripts/portal_english_pipeline.py restore-source \
              --prefix "$EXTENDED_R2_PREFIX" --generation "$SOURCE_GENERATION" \
              --corpus "$RUNNER_TEMP/extended-source-corpus.json"
          else
            PYTHONPATH=scripts python3 -B scripts/portal_extended_r2.py restore-source \
              --prefix "$EXTENDED_R2_PREFIX" --generation "$SOURCE_GENERATION" \
              --output "$RUNNER_TEMP/extended-source-corpus.json"
          fi
      - name: Restore locale checkpoint from private R2
        id: checkpoint
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          REQUESTED_OPERATION: ${{ inputs.operation }}
          REPAIR_EVIDENCE: ${{ inputs.continuation_evidence }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${QUALITY_REPAIR:-}" ]; then
            python3 -B scripts/portal_extended_quality_recovery.py restore \
              --plan "$QUALITY_REPAIR" --locale "$LOCALE" --generation "$SOURCE_GENERATION" \
              --checkpoint "$RUNNER_TEMP/locale-checkpoint.json" --corpus "$RUNNER_TEMP/extended-source-corpus.json" \
              --output "$RUNNER_TEMP/extended-candidate" --seconds "$TRANSLATION_SECONDS" --github-output "$GITHUB_OUTPUT"
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$REQUESTED_OPERATION" = "checkpoint-repair" ]; then
            python3 -B scripts/repair_portal_extended_checkpoint.py restore \
              --generation "$SOURCE_GENERATION" --locale "$LOCALE" --request "$REPAIR_EVIDENCE" \
              --checkpoint "$RUNNER_TEMP/locale-checkpoint.json" --corpus "$RUNNER_TEMP/extended-source-corpus.json"
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$LOCALE" = "en" ] || [ "$REQUESTED_OPERATION" = "recovery-test" ]; then
            # English keeps its separate checkpoint lifecycle; read-only
            # diagnostics never claim additional-locale production progress.
            restore_args=(scripts/portal_extended_r2.py restore-checkpoint --output "$RUNNER_TEMP/locale-checkpoint.json")
          else
            restore_args=(scripts/portal_extended_incremental.py restore-checkpoint --checkpoint "$RUNNER_TEMP/locale-checkpoint.json")
          fi
          result="$(PYTHONPATH=scripts python3 -B "${restore_args[@]}" \
            --prefix "$EXTENDED_R2_PREFIX" --locale "$LOCALE" --generation "$SOURCE_GENERATION")"
          printf '%s\n' "$result" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$result" == *'"present": true'* ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            rm -f "$RUNNER_TEMP/locale-checkpoint.json"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore verified incremental unit memo
        if: inputs.operation != 'checkpoint-repair' && matrix.quality_repair == ''
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          if [ "$LOCALE" = "en" ]; then
            python3 -B scripts/portal_english_pipeline.py restore-seed \
              --prefix "$EXTENDED_R2_PREFIX" --checkpoint "$RUNNER_TEMP/locale-seed.json" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            PYTHONPATH=scripts python3 -B scripts/portal_extended_incremental.py restore-seed \
              --prefix "$EXTENDED_R2_PREFIX" --locale "$LOCALE" \
              --checkpoint "$RUNNER_TEMP/locale-seed.json" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Set up pinned Hy-MT2 CPU model without audit artifacts
        if: matrix.quality_repair == '' || steps.checkpoint.outputs.requires_engine == 'true'
        uses: ./.github/actions/setup-offline-translation
        with:
          targets: ${{ matrix.locale }}
          persist-audit: "false"
      - name: Diagnose original sampler without changing checkpoints or candidates
        if: inputs.operation == 'recovery-test' && inputs.diagnose_runtime == true
        env:
          KC_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false && 'true' || 'false' }}
        run: |
          set -euo pipefail
          python3 -B scripts/probe_portal_extended_runtime.py \
            --corpus "$RUNNER_TEMP/extended-source-corpus.json" --locale "$LOCALE" \
            --checkpoint "$RUNNER_TEMP/locale-checkpoint.json" \
            --cache "$RUNNER_TEMP/unconstrained-diagnostic-cache" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run bounded locale translation and retain timeout state
        id: build
        env:
          KC_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false && 'true' || 'false' }}
          REQUESTED_OPERATION: ${{ inputs.operation }}
          REPAIR_EVIDENCE: ${{ inputs.continuation_evidence }}
          GH_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -u
          if ! [[ "$TRANSLATION_SECONDS" =~ ^[0-9]+$ ]] || [ "$TRANSLATION_SECONDS" -lt 1 ] || [ "$TRANSLATION_SECONDS" -gt 14400 ]; then
            echo "Invalid per-locale budget; expected 1..14400 seconds" >&2
            exit 2
          fi
          checkpoint_args=()
          if [ "$LOCALE" != "en" ] && [ "$ALLOW_SOURCE_FALLBACK" = "true" ]; then
            checkpoint_args+=(--allow-source-fallback)
          fi
          checkpoint_args+=(--checkpoint "$RUNNER_TEMP/locale-checkpoint.json")
          if [ -s "$RUNNER_TEMP/locale-seed.json" ]; then
            checkpoint_args+=(--seed-checkpoint "$RUNNER_TEMP/locale-seed.json")
          fi
          set +e
          if [ -n "${QUALITY_REPAIR:-}" ]; then
            python3 -B scripts/portal_extended_quality_recovery.py build \
              --plan "$QUALITY_REPAIR" --locale "$LOCALE" --generation "$SOURCE_GENERATION" \
              --checkpoint "$RUNNER_TEMP/locale-checkpoint.json" --corpus "$RUNNER_TEMP/extended-source-corpus.json" \
              --output "$RUNNER_TEMP/extended-candidate" --seconds "$TRANSLATION_SECONDS" > "$RUNNER_TEMP/build-result.json"
          elif [ "$REQUESTED_OPERATION" = "checkpoint-repair" ]; then
            python3 -B scripts/repair_portal_extended_checkpoint.py build \
              --generation "$SOURCE_GENERATION" --locale "$LOCALE" --request "$REPAIR_EVIDENCE" \
              --checkpoint "$RUNNER_TEMP/locale-checkpoint.json" --output "$RUNNER_TEMP/extended-candidate" \
              --seconds "$TRANSLATION_SECONDS" > "$RUNNER_TEMP/build-result.json"
          elif [ "$LOCALE" = "en" ]; then
            python3 -B scripts/portal_english_commentary.py \
              --corpus "$RUNNER_TEMP/extended-source-corpus.json" \
              --output "$RUNNER_TEMP/extended-candidate" --seconds "$TRANSLATION_SECONDS" \
              "${checkpoint_args[@]}" > "$RUNNER_TEMP/build-result.json"
          else
            python3 -B scripts/build_portal_extended_locales.py \
              --corpus "$RUNNER_TEMP/extended-source-corpus.json" --locale "$LOCALE" \
              --output "$RUNNER_TEMP/extended-candidate" --seconds "$TRANSLATION_SECONDS" \
              "${checkpoint_args[@]}" > "$RUNNER_TEMP/build-result.json"
          fi
          code=$?
          set -e
          if [ -s "$RUNNER_TEMP/build-result.json" ]; then
            tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/build-result.json"
          else
            echo '{"status":"no-build-summary"}' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != 0 ] && [ "$code" != 75 ]; then
            exit "$code"
          fi
      - name: Persist checkpoint even when the locale budget ended
        if: always() && inputs.operation != 'recovery-test' && inputs.operation != 'checkpoint-repair' && matrix.quality_repair == ''
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          if [ -s "$RUNNER_TEMP/locale-checkpoint.json" ]; then
            if [ "$LOCALE" = "en" ]; then
              python3 -B scripts/portal_english_pipeline.py checkpoint \
                --prefix "$EXTENDED_R2_PREFIX" --generation "$SOURCE_GENERATION" --checkpoint "$RUNNER_TEMP/locale-checkpoint.json"
            else
              PYTHONPATH=scripts python3 -B scripts/portal_extended_incremental.py checkpoint \
                --prefix "$EXTENDED_R2_PREFIX" --locale "$LOCALE" --generation "$SOURCE_GENERATION" \
                --checkpoint "$RUNNER_TEMP/locale-checkpoint.json"
            fi
          else
            echo "No checkpoint was produced; refusing to claim resumability" >&2
            exit 1
          fi
      - name: Persist complete or incomplete candidate pages privately
        if: always() && inputs.operation != 'recovery-test' && inputs.operation != 'checkpoint-repair' && matrix.quality_repair == ''
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/extended-candidate/candidate-manifest.json"
          if [ "$LOCALE" = "en" ]; then
            python3 -B scripts/portal_english_pipeline.py candidate \
              --prefix "$EXTENDED_R2_PREFIX" --generation "$SOURCE_GENERATION" \
              --corpus "$RUNNER_TEMP/extended-source-corpus.json" --directory "$RUNNER_TEMP/extended-candidate"
          else
            PYTHONPATH=scripts python3 -B scripts/portal_extended_incremental.py candidate \
              --prefix "$EXTENDED_R2_PREFIX" --locale "$LOCALE" --generation "$SOURCE_GENERATION" \
              --corpus "$RUNNER_TEMP/extended-source-corpus.json" \
              --directory "$RUNNER_TEMP/extended-candidate"
          fi
      - name: Persist only verified quality repair progress against the exact source plan
        if: matrix.quality_repair != '' && steps.build.outputs.exit_code == '0'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B scripts/portal_extended_quality_recovery.py persist \
            --plan "$QUALITY_REPAIR" --locale "$LOCALE" --generation "$SOURCE_GENERATION" \
            --checkpoint "$RUNNER_TEMP/locale-checkpoint.json" --corpus "$RUNNER_TEMP/extended-source-corpus.json" \
            --output "$RUNNER_TEMP/extended-candidate" --seconds "$TRANSLATION_SECONDS" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Validate exact repaired units and complete candidate before original-intent adoption
        if: inputs.operation == 'checkpoint-repair' && matrix.quality_repair == '' && steps.build.outputs.exit_code == '0'
        env:
          KC_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false && 'true' || 'false' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          REPAIR_EVIDENCE: ${{ inputs.continuation_evidence }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B scripts/repair_portal_extended_checkpoint.py persist \
            --generation "$SOURCE_GENERATION" --locale "$LOCALE" --request "$REPAIR_EVIDENCE" \
            --checkpoint "$RUNNER_TEMP/locale-checkpoint.json" --output "$RUNNER_TEMP/extended-candidate"
      - name: Verify recovery result without uploading or marking pages complete
        if: always() && inputs.operation == 'recovery-test'
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/extended-candidate/candidate-manifest.json"
          PYTHONPATH=scripts python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          from assemble_portal_extended_locales import verified_candidate
          root = Path(os.environ['RUNNER_TEMP'])
          corpus = json.loads((root/'extended-source-corpus.json').read_text())
          manifest = json.loads((root/'extended-candidate/candidate-manifest.json').read_text())
          if manifest['status'] == 'complete-candidate':
              verified_candidate(root/'extended-candidate', corpus)
          print(json.dumps({'recovery_test_only': True, 'r2_writes': 0,
                            'status': manifest['status'], 'publication_performed': False}))
          PY
      - name: Mark a budget timeout as incomplete after persistence
        if: always()
        run: |
          set -euo pipefail
          code="${{ steps.build.outputs.exit_code || '1' }}"
          if [ "$code" = "75" ]; then
            echo "Locale $LOCALE checkpointed but incomplete; publication remains blocked." >> "$GITHUB_STEP_SUMMARY"
            exit 75
          fi
          test "$code" = "0"

  publication_handoff:
    needs: [source, locale]
    if: >-
      ${{ always() && !cancelled() && github.ref == 'refs/heads/main' &&
          needs.source.result == 'success' &&
          (github.event_name == 'workflow_run' || inputs.operation == 'candidate' || inputs.operation == 'publication-resume' || inputs.operation == 'checkpoint-repair') &&
          (inputs.operation != 'checkpoint-repair' ||
           (needs.source.outputs.has_work == 'true' && needs.locale.result == 'success') ||
           (needs.source.outputs.has_work == 'false' && needs.locale.result == 'skipped')) &&
          vars.PORTAL_EXTENDED_AUTO_PUBLISH_LOCALES != '' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install private candidate reader
        run: python3 -m pip install --disable-pip-version-check "boto3>=1.34,<2" "requests>=2.31,<3"
      - name: Hand complete already-live locale candidates to the protected release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          SOURCE_GENERATION: ${{ needs.source.outputs.generation }}
          SOURCE_DAY: ${{ needs.source.outputs.day }}
          SOURCE_LOCALES: ${{ needs.source.outputs.requested_locales }}
          ENABLED_LOCALES: ${{ vars.PORTAL_EXTENDED_AUTO_PUBLISH_LOCALES }}
          HANDOFF_OPERATION: ${{ inputs.operation || 'candidate' }}
          SOURCE_HAS_WORK: ${{ needs.source.outputs.has_work }}
          LOCALE_RESULT: ${{ needs.locale.result }}
        run: |
          set -euo pipefail
          python3 -B scripts/portal_extended_handoff.py \
            --generation "$SOURCE_GENERATION" --day "$SOURCE_DAY" \
            --locales "$SOURCE_LOCALES" --enabled-locales "$ENABLED_LOCALES" \
            --operation "$HANDOFF_OPERATION" --source-has-work "$SOURCE_HAS_WORK" \
            --locale-result "$LOCALE_RESULT"

  english_publication_handoff:
    needs: [source, locale]
    if: >-
      ${{ always() && !cancelled() && github.ref == 'refs/heads/main' &&
          needs.source.result == 'success' && vars.PORTAL_ENGLISH_AUTO_PUBLISH == 'true' &&
          (github.event_name == 'workflow_run' || inputs.operation == 'candidate' || inputs.operation == 'english-resume') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install private English candidate readers
        run: python3 -m pip install --disable-pip-version-check 'boto3>=1.34,<2' 'requests>=2.31,<3'
      - name: Hand off only complete KC commentary candidates without approving or activating
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          KC_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false && 'true' || 'false' }}
          KC_ENGLISH_AUTO_PUBLISH: ${{ vars.PORTAL_ENGLISH_AUTO_PUBLISH }}
        run: python3 -B scripts/portal_english_handoff.py

  continue_admitted_batches:
    needs: [source, locale, publication_handoff]
    if: >-
      ${{ always() && !cancelled() && github.ref == 'refs/heads/main' &&
          needs.source.result == 'success' &&
          (needs.source.outputs.has_work == 'true' || (needs.source.outputs.quality_repair_plans_json != '' && needs.source.outputs.quality_repair_plans_json != '[]')) &&
          (needs.source.outputs.source_admission != '' || needs.source.outputs.english_admission != '' ||
           needs.source.outputs.quality_repair_plans_json != '[]') &&
          (github.event_name == 'workflow_run' || inputs.operation == 'candidate' || inputs.operation == 'english-resume') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install private frontier reader
        run: python3 -m pip install --disable-pip-version-check 'boto3>=1.34,<2' 'requests>=2.31,<3'
      - name: Continue only after durable progress, never loop on an unchanged failure
        id: frontier
        if: needs.source.outputs.source_admission != ''
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          KC_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false && 'true' || 'false' }}
          SOURCE_ADMISSION: ${{ needs.source.outputs.source_admission }}
          SOURCE_LOCALES: ${{ needs.source.outputs.requested_locales }}
          BEFORE_COUNTS: ${{ needs.source.outputs.pending_counts_json }}
        run: |
          set -euo pipefail
          python3 -B scripts/portal_extended_daily_queue.py --operation followup \
            --admission "$SOURCE_ADMISSION" --locales "$SOURCE_LOCALES" \
            --before "$BEFORE_COUNTS" --github-output "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Continue English only after durable editorial page progress
        id: english_frontier
        if: needs.source.outputs.english_admission != ''
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          KC_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false && 'true' || 'false' }}
          ENGLISH_ADMISSION: ${{ needs.source.outputs.english_admission }}
          ENGLISH_BEFORE: ${{ needs.source.outputs.english_pending_count }}
        run: |
          set -euo pipefail
          python3 -B scripts/portal_english_pipeline.py followup \
            --admission "$ENGLISH_ADMISSION" --before "$ENGLISH_BEFORE" \
            --github-output "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Continue quality debt only after accepted durable repair progress
        id: quality_frontier
        if: needs.source.outputs.quality_repair_plans_json != '[]'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          KC_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
          QUALITY_REPAIR_PLANS: ${{ needs.source.outputs.quality_repair_plans_json }}
        run: |
          set -euo pipefail
          python3 -B scripts/portal_extended_quality_recovery.py followup \
            --plans "$QUALITY_REPAIR_PLANS" --github-output "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Dispatch the next bounded per-language cursors
        if: steps.frontier.outputs.continue == 'true' || steps.english_frontier.outputs.continue == 'true' || steps.quality_frontier.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_LOCALES: ${{ needs.source.outputs.requested_locales }}
        run: gh workflow run portal-extended-locales-r2.yml --repo "$GITHUB_REPOSITORY" --ref main -f operation=candidate -f locales="$SOURCE_LOCALES"
