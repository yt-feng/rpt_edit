# Durable private source/checkpoint/candidate pipeline for the additional locales.
# This workflow never publishes an incomplete candidate and never uploads
# generated translations to Actions artifacts or caches.
name: Extended locales private R2 pipeline
run-name: Extended locale R2 ${{ inputs.operation || 'daily incremental' }} (${{ inputs.locales || vars.PORTAL_EXTENDED_INCREMENTAL_LOCALES || 'all-supported' }})

on:
  workflow_run:
    workflows: [Neutral edge catalog refresh]
    types: [completed]
    branches: [main]
  push:
    branches: [codex/extended-locales-r2-20260924]
  workflow_dispatch:
    inputs:
      operation:
        description: "Run a private R2 round-trip or a bounded locale candidate batch"
        required: true
        type: choice
        options: [roundtrip, candidate]
        default: roundtrip
      locales:
        description: "all-supported = 33 non-English locales, or comma-separated subset; English is summary/commentary blog only, no originals/charts; up to 24 new detail pages"
        required: false
        type: string
        default: all-supported
      source_generation:
        description: "Optional same-day daily source generation; leave empty to select today new/changed content"
        required: false
        type: string
        default: ""
      seconds:
        description: "Per-locale Hy-MT2 CPU budget in seconds (1..14400)"
        required: false
        type: string
        default: "14400"
      allow_source_fallback:
        description: "Keep exact source units on translation quality failure, matching ko/ja/ar; still require a complete page set"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: extended-locales-r2-pipeline
  cancel-in-progress: false

env:
  EXTENDED_R2_PREFIX: _extended-locales/v1

jobs:
  roundtrip:
    if: >-
      ${{
        inputs.operation == 'roundtrip' ||
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[r2-roundtrip]'))
      }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install private R2 client
        run: python3 -m pip install --disable-pip-version-check "boto3>=1.34,<2"
      - name: Verify isolated private R2 read/write/checksum and error classification
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          prefix="_extended-locales/staging/roundtrip-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PYTHONPATH=scripts python3 -B scripts/portal_extended_r2.py roundtrip \
            --prefix "$prefix" --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

  source:
    if: >-
      ${{
        inputs.operation == 'candidate' ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == github.event.repository.default_branch &&
         github.event.workflow_run.head_repository.full_name == github.repository) ||
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[r2-candidate]'))
      }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      has_work: ${{ steps.source.outputs.has_work }}
      generation: ${{ steps.source.outputs.generation }}
      locales_json: ${{ steps.source.outputs.locales_json }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public collector and private R2 client
        run: python3 -m pip install --disable-pip-version-check "boto3>=1.34,<2" "requests>=2.31,<3"
      - name: Select today new or changed detail pages without historical backfill
        id: source
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          REQUESTED_SOURCE_GENERATION: ${{ inputs.source_generation }}
          REQUESTED_LOCALES: ${{ inputs.locales || vars.PORTAL_EXTENDED_INCREMENTAL_LOCALES || 'all-supported' }}
        run: |
          set -euo pipefail
          source_args=()
          if [ -n "$REQUESTED_SOURCE_GENERATION" ]; then
            source_args+=(--generation "$REQUESTED_SOURCE_GENERATION")
          fi
          PYTHONPATH=scripts python3 -B scripts/portal_extended_incremental.py prepare \
            --prefix "$EXTENDED_R2_PREFIX" --locales "$REQUESTED_LOCALES" \
            --corpus "$RUNNER_TEMP/extended-source-corpus.json" \
            --github-output "$GITHUB_OUTPUT" "${source_args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Persist source-generation evidence
        env:
          SOURCE_GENERATION: ${{ steps.source.outputs.generation }}
        run: |
          set -euo pipefail
          if [ -z "$SOURCE_GENERATION" ]; then
            echo "No new content today; no model job or historical backfill." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "source_generation=$SOURCE_GENERATION" >> "$GITHUB_STEP_SUMMARY"

  locale:
    needs: source
    if: needs.source.result == 'success' && needs.source.outputs.has_work == 'true' && github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 270
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        locale: ${{ fromJSON(needs.source.outputs.locales_json) }}
    env:
      SOURCE_GENERATION: ${{ needs.source.outputs.generation }}
      LOCALE: ${{ matrix.locale }}
      TRANSLATION_SECONDS: ${{ inputs.seconds || '14400' }}
      ALLOW_SOURCE_FALLBACK: ${{ (github.event_name != 'workflow_dispatch' || inputs.allow_source_fallback) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source/R2 client dependencies
        run: python3 -m pip install --disable-pip-version-check "boto3>=1.34,<2" "requests>=2.31,<3"
      - name: Restore fixed source generation
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 -B scripts/portal_extended_r2.py restore-source \
            --prefix "$EXTENDED_R2_PREFIX" --generation "$SOURCE_GENERATION" \
            --output "$RUNNER_TEMP/extended-source-corpus.json"
      - name: Restore locale checkpoint from private R2
        id: checkpoint
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          result="$(PYTHONPATH=scripts python3 -B scripts/portal_extended_r2.py restore-checkpoint \
            --prefix "$EXTENDED_R2_PREFIX" --locale "$LOCALE" --generation "$SOURCE_GENERATION" \
            --output "$RUNNER_TEMP/locale-checkpoint.json")"
          printf '%s\n' "$result" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$result" == *'"present": true'* ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            rm -f "$RUNNER_TEMP/locale-checkpoint.json"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore verified incremental unit memo
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 -B scripts/portal_extended_incremental.py restore-seed \
            --prefix "$EXTENDED_R2_PREFIX" --locale "$LOCALE" \
            --checkpoint "$RUNNER_TEMP/locale-seed.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Set up pinned Hy-MT2 CPU model without audit artifacts
        uses: ./.github/actions/setup-offline-translation
        with:
          targets: ${{ matrix.locale }}
          persist-audit: "false"
      - name: Run bounded locale translation and retain timeout state
        id: build
        env:
          KC_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false && 'true' || 'false' }}
        run: |
          set -u
          if ! [[ "$TRANSLATION_SECONDS" =~ ^[0-9]+$ ]] || [ "$TRANSLATION_SECONDS" -lt 1 ] || [ "$TRANSLATION_SECONDS" -gt 14400 ]; then
            echo "Invalid per-locale budget; expected 1..14400 seconds" >&2
            exit 2
          fi
          checkpoint_args=()
          if [ "$ALLOW_SOURCE_FALLBACK" = "true" ]; then
            checkpoint_args+=(--allow-source-fallback)
          fi
          checkpoint_args+=(--checkpoint "$RUNNER_TEMP/locale-checkpoint.json")
          if [ -s "$RUNNER_TEMP/locale-seed.json" ]; then
            checkpoint_args+=(--seed-checkpoint "$RUNNER_TEMP/locale-seed.json")
          fi
          set +e
          python3 -B scripts/build_portal_extended_locales.py \
            --corpus "$RUNNER_TEMP/extended-source-corpus.json" --locale "$LOCALE" \
            --output "$RUNNER_TEMP/extended-candidate" --seconds "$TRANSLATION_SECONDS" \
            "${checkpoint_args[@]}" > "$RUNNER_TEMP/build-result.json"
          code=$?
          set -e
          if [ -s "$RUNNER_TEMP/build-result.json" ]; then
            tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/build-result.json"
          else
            echo '{"status":"no-build-summary"}' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != 0 ] && [ "$code" != 75 ]; then
            exit "$code"
          fi
      - name: Persist checkpoint even when the locale budget ended
        if: always()
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          if [ -s "$RUNNER_TEMP/locale-checkpoint.json" ]; then
            PYTHONPATH=scripts python3 -B scripts/portal_extended_incremental.py checkpoint \
              --prefix "$EXTENDED_R2_PREFIX" --locale "$LOCALE" --generation "$SOURCE_GENERATION" \
              --checkpoint "$RUNNER_TEMP/locale-checkpoint.json"
          else
            echo "No checkpoint was produced; refusing to claim resumability" >&2
            exit 1
          fi
      - name: Persist complete or incomplete candidate pages privately
        if: always()
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/extended-candidate/candidate-manifest.json"
          PYTHONPATH=scripts python3 -B scripts/portal_extended_incremental.py candidate \
            --prefix "$EXTENDED_R2_PREFIX" --locale "$LOCALE" --generation "$SOURCE_GENERATION" \
            --corpus "$RUNNER_TEMP/extended-source-corpus.json" \
            --directory "$RUNNER_TEMP/extended-candidate"
      - name: Mark a budget timeout as incomplete after persistence
        if: always()
        run: |
          set -euo pipefail
          code="${{ steps.build.outputs.exit_code || '1' }}"
          if [ "$code" = "75" ]; then
            echo "Locale $LOCALE checkpointed but incomplete; publication remains blocked." >> "$GITHUB_STEP_SUMMARY"
            exit 75
          fi
          test "$code" = "0"
