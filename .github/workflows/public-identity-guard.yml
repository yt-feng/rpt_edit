name: Public identity check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check public paths and content
        run: python3 -B scripts/check_public_identity.py

      - name: Check Market Views trigger and private handoff lifecycle
        run: |
          python3 -B scripts/test_market_views_workflow_contract.py
          python3 -B scripts/test_private_workflow_handoff.py

      - name: Check app loading budget before merge
        run: |
          python3 -B scripts/check_portal_app_budget.py --candidate portal_suite/site_src/assets/app.js
          python3 -B scripts/test_check_portal_app_budget.py

      - name: Check recurring locale refresh failures before merge
        run: |
          python3 -m pip install --disable-pip-version-check "requests>=2.31,<3"
          python3 -B scripts/test_portal_locale_literals.py
          python3 -B scripts/test_portal_locale_preflight_repair.py
          python3 -B scripts/test_portal_locale_preflight_diagnostics.py
          python3 -B scripts/test_deepl_locale_repair.py
          python3 -B scripts/test_translate_portal_titles.py

      - name: Check authenticated external report delivery before merge
        run: |
          python3 -m pip install --disable-pip-version-check "pypdf>=4,<6"
          python3 -B scripts/test_reportify_api_grab.py
          python3 -B scripts/test_portal_worker_emergency_deploy_workflow.py
          for test_file in portal_suite/tests/reportify*.test.mjs; do
            node "$test_file"
          done
