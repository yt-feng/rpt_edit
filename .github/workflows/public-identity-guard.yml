name: Public identity check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check public paths and content
        run: python3 -B scripts/check_public_identity.py

      - name: Check app loading budget before merge
        run: |
          python3 -B scripts/check_portal_app_budget.py --candidate portal_suite/site_src/assets/app.js
          python3 -B scripts/test_check_portal_app_budget.py

      - name: Check recurring locale refresh failures before merge
        run: |
          python3 -m pip install --disable-pip-version-check "requests>=2.31,<3"
          python3 -B scripts/test_portal_locale_literals.py
          python3 -B scripts/test_portal_locale_preflight_repair.py
          python3 -B scripts/test_portal_locale_preflight_diagnostics.py
          python3 -B scripts/test_deepl_locale_repair.py
          python3 -B scripts/test_translate_portal_titles.py
