name: Public identity check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    # Allow the complete regression suite and dependency installs on a clean Python.
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # Match Neutral's clean interpreter so preinstalled distro SDKs cannot
      # satisfy the dependency range and hide changes in the production SDK.
      - name: Set up production Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check public paths and content
        run: python3 -B scripts/check_public_identity.py

      - name: Check Market Views trigger and private handoff lifecycle
        run: |
          python3 -m pip install --disable-pip-version-check "requests>=2.31,<3" PyMuPDF Pillow
          python3 -B scripts/test_market_views_source_readiness.py
          python3 -B scripts/test_market_views_workflow_contract.py
          python3 -B scripts/test_private_workflow_handoff.py

      - name: Check app loading budget before merge
        run: |
          python3 -B scripts/check_portal_app_budget.py --candidate portal_suite/site_src/assets/app.js
          python3 -B scripts/test_check_portal_app_budget.py
          python3 -B scripts/test_check_public_brand.py

      - name: Check recurring locale refresh failures before merge
        run: |
          python3 -m pip install --upgrade --disable-pip-version-check -c requirements-neutral-release-constraints.txt "requests>=2.31,<3" "Pillow>=10.1,<12" "boto3>=1.34,<2"
          python3 -B scripts/test_r2_transport.py
          python3 -B scripts/test_portal_extended_r2.py
          python3 -B scripts/test_portal_extended_r2_sdk.py
          python3 -B scripts/test_publish_static_slot.py
          python3 -B scripts/test_validate_portal_locale_checkpoint.py
          python3 -B scripts/test_neutral_refresh_resilience_workflow.py
          python3 -B scripts/test_portal_locale_text_store.py
          python3 -B scripts/test_run_with_resource_monitor.py
          python3 -B scripts/test_recover_neutral_runner_loss.py
          python3 -B scripts/test_catch_up_dropbox_reports.py
          node --test portal_suite/tests/admin-report-refresh.test.mjs portal_suite/tests/admin-report-refresh-frontend.test.mjs
          node --test portal_suite/tests/daily-source-wakeup.test.mjs
          python3 -B scripts/test_portal_locale_literals.py
          python3 -B scripts/test_build_portal_locales.py
          python3 -B scripts/test_audit_portal_chinese_discovery_plan.py
          python3 -B scripts/test_portal_locale_manifest.py
          python3 -B scripts/test_portal_locale_source_fallback.py
          python3 -B scripts/test_portal_locale_detail_hooks.py
          python3 -B scripts/test_verify_portal_locale_routes.py
          python3 -B scripts/test_verify_prepared_static_slot.py
          python3 -B scripts/test_resume_portal_locale_candidate.py
          python3 -B scripts/test_audit_portal_shadow_preview.py
          python3 -B scripts/test_fetch_release_asset.py
          python3 -B scripts/test_verify_public_chart_index.py
          python3 -B scripts/test_neutral_edge_cutover_workflow.py
          python3 -B scripts/test_portal_locale_resume_workflow.py
          python3 -B scripts/test_portal_locale_preflight_repair.py
          python3 -B scripts/test_portal_locale_preflight_diagnostics.py
          python3 -B scripts/test_deepl_locale_repair.py
          python3 -B scripts/test_translate_portal_titles.py
          python3 -B scripts/test_restore_published_catalog.py
          python3 -B scripts/test_retain_published_core_locales.py
          python3 -B scripts/test_restore_published_chinese_source.py
          python3 -B scripts/test_dispatch_neutral_locale_followup.py
          python3 -B scripts/test_portal_discovery_quality.py

      - name: Check authenticated external report delivery before merge
        run: |
          python3 -m pip install --disable-pip-version-check "pypdf>=4,<6" "Pillow>=10.1,<12" "zxing-cpp>=2.3,<4"
          python3 -B scripts/test_reportify_api_grab.py
          python3 -B scripts/test_reportify_local_qr.py
          python3 -B scripts/test_portal_worker_emergency_deploy_workflow.py
          python3 -B scripts/test_sync_portal_worker_schedules.py
          python3 -B scripts/test_portal_smoke_get.py
          for test_file in portal_suite/tests/reportify*.test.mjs; do
            node "$test_file"
          done

      - name: Check account services and customer content delivery
        run: |
          python3 -B scripts/build_content_agent_assets.py --check
          python3 -m pip install --disable-pip-version-check -r integrations/content-agent/requirements-mcp.txt
          python3 -B -m unittest discover -s integrations/content-agent/tests -v
          python3 -B scripts/test_publish_customer_content.py
          node --test portal_suite/tests/customer-content-*.test.mjs portal_suite/tests/ai-research-credits.test.mjs portal_suite/tests/account-api-frontend.test.mjs portal_suite/tests/admin-pdf-intake-frontend.test.mjs portal_suite/tests/membership-request-journey.test.mjs portal_suite/tests/expiry-reminders.test.mjs

      - name: Check private user directory and mobile admin controls
        run: |
          node scripts/test_portal_entitlement_precedence.js
          node scripts/test_portal_access_renewal.js
          node scripts/test_portal_multi_institution_access.js
          node --test portal_suite/tests/admin-user-subrequests.test.mjs portal_suite/tests/admin-users-frontend.test.mjs portal_suite/tests/admin-responsive-css.test.mjs portal_suite/tests/admin-report-chat-history-frontend.test.mjs

      - name: Check reader discussions, feedback and form confirmations
        run: |
          node --test portal_suite/tests/form-acknowledgement.test.mjs portal_suite/tests/membership-request.test.mjs portal_suite/tests/report-request.test.mjs portal_suite/tests/engagement-rewards.test.mjs portal_suite/tests/newsfeed-policy-worker.test.mjs portal_suite/tests/site-feedback*.test.mjs portal_suite/tests/report-discussion*.test.mjs portal_suite/tests/download-invitation*.test.mjs portal_suite/tests/download-password-context.test.mjs
          node --test portal_suite/tests/course-membership-continuity.test.mjs portal_suite/tests/course-full-directory.test.mjs portal_suite/tests/course-full-frontend.test.mjs portal_suite/tests/journey-frontend.test.mjs
          python3 -B scripts/test_publish_course_full_directory.py
          python3 -B scripts/test_portal_lazy_assets.py
          python3 -B scripts/test_collect_report_discussion_starters.py

      - name: Check verified UI-only release and rollback boundaries
        run: |
          python3 -m pip install --disable-pip-version-check 'PyYAML>=6,<7'
          python3 -B scripts/test_prepare_portal_ui_hotfix.py
          python3 -B scripts/test_verify_portal_ui_hotfix_live.py
          python3 -B scripts/test_portal_ui_hotfix_workflow.py
