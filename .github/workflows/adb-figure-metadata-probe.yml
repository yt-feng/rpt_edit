name: Probe pinned ADB figure metadata
on:
  pull_request:
    paths:
      - .github/workflows/adb-figure-metadata-probe.yml
      - scripts/probe_adb_figure_metadata.py
      - scripts/test_probe_adb_figure_metadata.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -B scripts/test_probe_adb_figure_metadata.py
  probe:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            institution_feeds
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --retries 0 --disable-pip-version-check requests Pillow PyMuPDF pypdf==6.19.0 'boto3>=1.37.32,<2'
      - name: Read pinned source and cached result without writes
        env:
          MINERU_LEDGER_BACKEND: r2
          MINERU_CHECKPOINT_SCOPE: institution
          MINERU_FORBID_NEW_SUBMISSIONS: '1'
          MINER_U: ${{ secrets.MINER_U }}
          MINER_U_2: ${{ secrets.MINER_U_2 }}
          MINER_U_3: ${{ secrets.MINER_U_3 }}
          MINER_U_4: ${{ secrets.MINER_U_4 }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: python3 -B scripts/probe_adb_figure_metadata.py --output "$RUNNER_TEMP/adb-figure-metadata.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adb-figure-metadata-${{ github.run_id }}
          path: ${{ runner.temp }}/adb-figure-metadata.json
          if-no-files-found: error
          retention-days: 7
