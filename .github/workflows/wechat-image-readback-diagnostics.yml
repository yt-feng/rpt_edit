name: Diagnose historical WeChat image readback
on:
  pull_request:
    paths:
      - scripts/diagnose_wechat_image_readback.py
      - scripts/test_diagnose_wechat_image_readback.py
      - .github/workflows/wechat-image-readback-diagnostics.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --retries 0 -r requirements.txt boto3
      - run: python -B scripts/test_diagnose_wechat_image_readback.py
  inspect:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: [self-hosted, wechat-draft]
    timeout-minutes: 15
    concurrency:
      group: wechat-existing-draft-images
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            requirements.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --retries 0 -r requirements.txt boto3
      - name: Restore only the exact accepted 44-article receipt batch
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: >-
          python -B scripts/diagnose_wechat_image_readback.py --mode restore
          --artifact-root "$RUNNER_TEMP/wechat-readback-${{ github.run_id }}/receipts"
          --output "$RUNNER_TEMP/wechat-readback-${{ github.run_id }}/receipt-restore.json"
      - name: Read only the two original draft IDs and emit bounded diagnostics
        env:
          WECHAT_MP_APPID: ${{ secrets.WECHAT_MP_APPID }}
          WECHAT_MP_APPSECRET: ${{ secrets.WECHAT_MP_APPSECRET }}
          PORTAL_SITE_URL: ${{ secrets.PORTAL_SITE_URL }}
        run: >-
          python -B scripts/diagnose_wechat_image_readback.py --mode inspect
          --artifact-root "$RUNNER_TEMP/wechat-readback-${{ github.run_id }}/receipts"
          --output "$RUNNER_TEMP/wechat-readback-${{ github.run_id }}/diagnostics.json"
      - name: Save only sanitized hashes counts and structure flags
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wechat-image-readback-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/wechat-readback-${{ github.run_id }}/receipt-restore.json
            ${{ runner.temp }}/wechat-readback-${{ github.run_id }}/diagnostics.json
          retention-days: 7
          if-no-files-found: warn
