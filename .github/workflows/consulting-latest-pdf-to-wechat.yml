name: Consulting latest PDF to WeChat

# Daily MBB (strategy consulting) companion to the institution flow. Discovers the
# latest McKinsey (DuckDuckGo) and BCG (sitemap) report PDFs, runs them through the
# MinerU -> Portal translated -> WeChat draft pipeline (with the China-sensitivity title
# guard), and archives the original PDF links. Source PDFs are transient.
# Bain is intentionally excluded: its report PDFs sit behind Cloudflare and cannot be
# downloaded reliably yet.

on:
  workflow_dispatch:
    inputs:
      institutions:
        description: "Comma list of consulting sources (mckinsey,bcg). Bain is Cloudflare-blocked."
        required: true
        default: "mckinsey,bcg"
      max_per_institution:
        description: "Cap new PDFs per firm per run"
        required: true
        default: "5"
      force_reprocess:
        description: "Ignore seen-state and overwrite today's generated outputs"
        required: true
        type: boolean
        default: false
      max_translated:
        description: "How many fetched reports to translate into WeChat articles. Use all."
        required: true
        default: "all"
      articles_per_draft:
        description: "Number of articles in each WeChat draft item"
        required: true
        default: "8"
      dry_run:
        description: "Build WeChat draft payloads without calling WeChat APIs"
        required: true
        type: boolean
        default: false
      publish:
        description: "Submit created WeChat drafts for publishing (needs publish API access)"
        required: true
        type: boolean
        default: false
      market_views_bank_date:
        description: "Bank Dropbox date to combine into Market Views. Empty uses yesterday in Asia/Shanghai."
        required: false
        default: ""

  schedule:
    # 06:30 Beijing time (UTC+8), after the institution flow at 06:00.
    - cron: "30 22 * * *"

permissions:
  actions: read
  contents: write
  actions: write

env:
  PYTHONUNBUFFERED: "1"
  PRIVATE_HANDOFF_ROOT: "_private-workflow-handoff/consulting"
  MARKET_VIEWS_HANDOFF_ROOT: "_private-workflow-handoff/market-views"

concurrency:
  group: consulting-latest-pdf-to-wechat
  cancel-in-progress: false

jobs:
  fetch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      date_folder: ${{ steps.fetch.outputs.date_folder }}
      pdf_count: ${{ steps.fetch.outputs.pdf_count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pull latest main (archive + seen state)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags --prune --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          git reset --hard origin/main
          git clean -fdx

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install reportlab
          python -m pip install boto3

      - name: Test consulting source fallbacks
        run: python scripts/test_fetch_institution_latest_pdfs.py

      - name: Install Chinese fonts
        timeout-minutes: 5
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Fetch latest consulting PDFs
        id: fetch
        run: |
          set -o pipefail
          DATE="$(TZ=Asia/Shanghai date +%y%m%d)"
          echo "date_folder=$DATE" >> "$GITHUB_OUTPUT"
          python scripts/fetch_institution_latest_pdfs.py \
            --output-dir _consulting_latest_pdfs \
            --date "$DATE" \
            --institutions "${{ github.event.inputs.institutions || 'mckinsey,bcg' }}" \
            --max-per-institution "${{ github.event.inputs.max_per_institution || '5' }}" \
            --archive-path "institution_feeds/consulting_pdf_archive.jsonl" \
            --seen-state-path "institution_feeds/consulting_seen_state.json" \
            --force-reprocess "${{ github.event.inputs.force_reprocess || 'false' }}" \
            2>&1 | tee consulting_fetch_progress.log

      - name: Generate MinerU source text and notes
        if: ${{ steps.fetch.outputs.pdf_count != '0' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_API_KEY_BACKUP: ${{ secrets.DEEPSEEK_API_KEY_BACKUP }}
          MINER_U: ${{ secrets.MINER_U }}
          MINER_U_2: ${{ secrets.MINER_U_2 }}
          MINER_U_3: ${{ secrets.MINER_U_3 }}
          MINER_U_4: ${{ secrets.MINER_U_4 }}
        run: |
          set -o pipefail
          DATE="${{ steps.fetch.outputs.date_folder }}"
          SKIP_EXISTING="true"
          if [ "${{ github.event.inputs.force_reprocess || 'false' }}" = "true" ]; then
            rm -rf "xhs_notes/consulting/$DATE"
            SKIP_EXISTING="false"
          fi
          python scripts/run_pdf_to_xhs_in_batches.py \
            --input-dir _consulting_latest_pdfs \
            --output-dir "xhs_notes/consulting/$DATE" \
            --batch-size 5 \
            --skip-existing "$SKIP_EXISTING" 2>&1 | tee consulting_xhs_progress.log

      - name: Build Portal translated report PDFs
        if: ${{ steps.fetch.outputs.pdf_count != '0' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_API_KEY_BACKUP: ${{ secrets.DEEPSEEK_API_KEY_BACKUP }}
          DEEPSEEK_BASE_URL: "https://api.deepseek.com"
        run: |
          set -o pipefail
          DATE="${{ steps.fetch.outputs.date_folder }}"
          if [ "${{ github.event.inputs.force_reprocess || 'false' }}" = "true" ]; then
            rm -rf "portal_translated_reports/consulting/$DATE"
          fi
          python scripts/build_portal_translated_reports.py \
            --dropbox-output-root "xhs_notes/consulting" \
            --date-folder "$DATE" \
            --output-root "portal_translated_reports/consulting" \
            --max-reports "${{ github.event.inputs.max_translated || 'all' }}" \
            --title-guard \
            2>&1 | tee consulting_translated_progress.log

      - name: Upload Market Views source handoff
        if: ${{ steps.fetch.outputs.pdf_count != '0' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          DATE="${{ steps.fetch.outputs.date_folder }}"
          python scripts/private_workflow_handoff.py upload-dir \
            --source "xhs_notes/consulting/$DATE" \
            --key "$MARKET_VIEWS_HANDOFF_ROOT/consulting/${{ github.run_id }}/$DATE/xhs_notes.tar.gz"

      - name: Commit PDF link archive and seen state
        run: |
          bash scripts/commit_output_dir.sh "institution_feeds" "Update consulting PDF link archive" 8

      - name: Upload translated reports to private R2 handoff
        if: ${{ steps.fetch.outputs.pdf_count != '0' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          DATE="${{ steps.fetch.outputs.date_folder }}"
          python scripts/private_workflow_handoff.py upload-dir \
            --source "portal_translated_reports/consulting/$DATE" \
            --key "$PRIVATE_HANDOFF_ROOT/${{ github.run_id }}/$DATE/translated.tar.gz"

      - name: Upload run artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: consulting-pdf-run-${{ steps.fetch.outputs.date_folder }}-${{ github.run_id }}
          path: |
            _consulting_latest_pdfs/institution_run_manifest.json
            consulting_fetch_progress.log
            consulting_xhs_progress.log
            consulting_translated_progress.log
          if-no-files-found: ignore
          retention-days: 2

  trigger-market-views:
    needs: [fetch-and-build]
    if: ${{ !cancelled() && needs.fetch-and-build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Trigger Market Views with latest consulting inputs
        env:
          GH_TOKEN: ${{ github.token }}
          DATE_FOLDER: ${{ needs.fetch-and-build.outputs.date_folder }}
          PDF_COUNT: ${{ needs.fetch-and-build.outputs.pdf_count }}
          MARKET_VIEWS_BANK_DATE: ${{ github.event.inputs.market_views_bank_date }}
        run: |
          BANK_DATE="$MARKET_VIEWS_BANK_DATE"
          if [ -z "$BANK_DATE" ]; then
            BANK_DATE="$(TZ=Asia/Shanghai date -d 'yesterday' +%y%m%d)"
          fi
          if ! printf '%s\n' "$BANK_DATE" | grep -Eq '^[0-9]{6,8}$'; then
            echo "Invalid Market Views bank date: $BANK_DATE" >&2
            exit 1
          fi

          ARGS=(
            -f date_folder=latest
            -f expected_bank_date="$BANK_DATE"
            -f institution_handoff_date="$DATE_FOLDER"
            -f consulting_handoff_date="$DATE_FOLDER"
            -f compile_latex=false
          )
          if [ "$PDF_COUNT" != "0" ]; then
            ARGS+=(-f consulting_handoff_run_id="${{ github.run_id }}")
          fi

          echo "::notice::Dispatching Market Views for bank date $BANK_DATE with consulting date $DATE_FOLDER."
          RUN_URL="$(gh workflow run market-views-latex-pdf.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            "${ARGS[@]}")"
          MARKET_RUN_ID="${RUN_URL##*/}"
          if ! printf '%s\n' "$MARKET_RUN_ID" | grep -Eq '^[0-9]+$'; then
            echo "Unable to resolve dispatched Market Views run from: $RUN_URL" >&2
            exit 1
          fi
          echo "::notice::Waiting for Market Views run $MARKET_RUN_ID."
          gh run watch "$MARKET_RUN_ID" --repo "$GITHUB_REPOSITORY" --compact --exit-status --interval 15

  upload-wechat-drafts:
    needs: fetch-and-build
    if: ${{ needs.fetch-and-build.outputs.pdf_count != '0' }}
    runs-on: [self-hosted, wechat-draft]
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            scripts
            prompts
            portal_suite/data/blog_archive
            requirements.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          python -m pip install boto3

      - name: Download translated reports from private R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          DATE="${{ needs.fetch-and-build.outputs.date_folder }}"
          python scripts/private_workflow_handoff.py download-dir \
            --key "$PRIVATE_HANDOFF_ROOT/${{ github.run_id }}/$DATE/translated.tar.gz" \
            --destination "portal_translated_reports/consulting/$DATE"

      - name: Materialize private publishing image
        env:
          PORTAL_PRIVATE_PUBLISH_ASSET_KEY: ${{ secrets.PORTAL_PRIVATE_PUBLISH_ASSET_KEY }}
        run: bash scripts/materialize_private_social_asset.sh prompts

      - name: Build and upload WeChat drafts
        env:
          WECHAT_MP_APPID: ${{ secrets.WECHAT_MP_APPID }}
          WECHAT_MP_APPSECRET: ${{ secrets.WECHAT_MP_APPSECRET }}
          PORTAL_SITE_URL: ${{ secrets.PORTAL_SITE_URL }}
        run: |
          set -o pipefail
          DATE="${{ needs.fetch-and-build.outputs.date_folder }}"
          TRANSLATED_DIR="portal_translated_reports/consulting/$DATE"
          if [ ! -d "$TRANSLATED_DIR" ]; then
            echo "::warning::No translated reports at $TRANSLATED_DIR; nothing to upload."
            exit 0
          fi

          ARGS=()
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ "${{ github.event.inputs.publish || 'false' }}" = "true" ]; then
            ARGS+=(--publish)
          fi

          python scripts/push_portal_translated_to_wechat_drafts.py \
            --translated-root "portal_translated_reports/consulting" \
            --date-folder "$DATE" \
            --output-root "wechat_drafts/consulting" \
            --max-articles "all" \
            --articles-per-draft "${{ github.event.inputs.articles_per_draft || '8' }}" \
            --max-body-chars "1200" \
            --min-inline-images "3" \
            --max-inline-images "3" \
            "${ARGS[@]}" 2>&1 | tee consulting_wechat_progress.log

      - name: Archive WeChat draft diagnostics
        uses: ./.github/actions/resilient-diagnostic-artifact
        with:
          name: consulting-wechat-drafts-${{ needs.fetch-and-build.outputs.date_folder }}-${{ github.run_id }}
          path: |
            wechat_drafts/consulting
            consulting_wechat_progress.log
          if-no-files-found: ignore
          retention-days: 2

      - name: Update public Blog archive
        run: |
          python scripts/update_blog_archive_from_wechat_drafts.py \
            --wechat-drafts-root wechat_drafts \
            --blog-archive-root portal_suite/data/blog_archive

      - name: Commit public Blog archive
        run: |
          DATE_FOLDER="${{ needs.fetch-and-build.outputs.date_folder }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- portal_suite/data/blog_archive
          if git diff --cached --quiet; then
            echo "No Blog archive changes for $DATE_FOLDER."
            exit 0
          fi
          git commit -m "Archive consulting Blog articles $DATE_FOLDER"
          bash scripts/push_main_with_rebase_retry.sh 5

  cleanup-private-handoff:
    needs: [fetch-and-build, trigger-market-views, upload-wechat-drafts]
    if: ${{ always() && needs.fetch-and-build.result == 'success' && needs.trigger-market-views.result != 'failure' && needs.upload-wechat-drafts.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: scripts/private_workflow_handoff.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Delete completed private handoff
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          python -m pip install boto3
          python scripts/private_workflow_handoff.py delete-prefix \
            --prefix "$PRIVATE_HANDOFF_ROOT/${{ github.run_id }}/${{ needs.fetch-and-build.outputs.date_folder }}"

  notify-failure:
    needs: [fetch-and-build, trigger-market-views, upload-wechat-drafts, cleanup-private-handoff]
    if: ${{ always() && !cancelled() && contains(needs.*.result, 'failure') }}
    uses: ./.github/workflows/portal-ops-alert.yml
    with:
      source_workflow: Consulting latest PDF to WeChat
      source_results: >-
        build=${{ needs.fetch-and-build.result }},
        market_views=${{ needs.trigger-market-views.result }},
        wechat=${{ needs.upload-wechat-drafts.result }},
        handoff_cleanup=${{ needs.cleanup-private-handoff.result }}
    secrets: inherit
