name: Institution fetch test

# Lightweight test of scripts/fetch_institution_latest_pdfs.py only.
# Hits the live IMF / World Bank / BIS / OECD / ADB / WEF / UNCTAD / WTO / Bruegel
# sources, validates that the downloaded files are real PDFs, and uploads the
# manifest + link archive. It does NOT run MinerU / DeepSeek / WeChat, and commits nothing.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Recent publications, reviewed IMF17, or exact IMF3 live original-byte acceptance"
        required: false
        type: choice
        default: recent
        options:
          - recent
          - imf-reviewed-20261012
          - imf-live-exact-20261015
      institutions:
        description: "Comma list or all (imf,worldbank,bis,oecd,adb,wef,unctad,wto,bruegel)"
        required: true
        default: "all"
      since_days:
        description: "Lookback window. Use a wide window (14-30) so there is something to fetch."
        required: true
        default: "14"
      max_per_institution:
        description: "Cap PDFs per institution to keep the test fast"
        required: true
        default: "2"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  fetch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Test institution PDF resolver
        run: |
          python scripts/test_fetch_institution_latest_pdfs.py
          python scripts/test_imf_fetch_test_scope.py
          python scripts/test_imf_live_source_probe.py

      - name: Set up official IMF download route
        uses: ./.github/actions/setup-imf-browser
        with:
          institutions: ${{ github.event.inputs.institutions || 'all' }}

      - name: Fetch latest institution PDFs (test, no commit)
        env:
          PROXY_SUBSCRIPTION_URL: ${{ secrets.PROXY_SUBSCRIPTION_URL }}
          IMF_PUBLIC_EVIDENCE_DIR: _fetch_test/imf-source-evidence
          FETCH_INSTITUTIONS: ${{ github.event.inputs.institutions || 'all' }}
          FETCH_SINCE_DAYS: ${{ github.event.inputs.since_days || '14' }}
          FETCH_MAX_PER_INSTITUTION: ${{ github.event.inputs.max_per_institution || '2' }}
          FETCH_SCOPE: ${{ github.event.inputs.scope || 'recent' }}
        run: |
          set -o pipefail
          fetch_date="$(TZ=Asia/Shanghai date +%y%m%d)"
          fetch_runner=(python)
          if [ "${IMF_CLOUD_BROWSER_ENABLED:-}" = true ]; then
            fetch_runner=(xvfb-run --auto-servernum python)
          fi
          case "$FETCH_SCOPE" in
            recent) ;;
            imf-reviewed-20261012|imf-live-exact-20261015)
              test "$FETCH_INSTITUTIONS" = imf
              ;;
            *) echo '::error::Unknown institution fetch scope'; exit 1 ;;
          esac
          set +e
          if [ "$FETCH_SCOPE" = imf-live-exact-20261015 ]; then
            "${fetch_runner[@]}" scripts/imf_live_source_probe.py \
              2>&1 | tee fetch_test.log
            statuses=("${PIPESTATUS[@]}")
          elif [ "$FETCH_SCOPE" = imf-reviewed-20261012 ]; then
            "${fetch_runner[@]}" scripts/imf_fetch_test_scope.py --date "$fetch_date" \
              2>&1 | tee fetch_test.log
            statuses=("${PIPESTATUS[@]}")
          else
            "${fetch_runner[@]}" scripts/fetch_institution_latest_pdfs.py \
              --output-dir _fetch_test \
              --pending-intake-path _fetch_test/imf-pending-intake.json \
              --date "$fetch_date" \
              --institutions "$FETCH_INSTITUTIONS" \
              --since-days "$FETCH_SINCE_DAYS" \
              --max-per-institution "$FETCH_MAX_PER_INSTITUTION" \
              --archive-path "_fetch_test/test_archive.jsonl" \
              --seen-state-path "_fetch_test/test_seen.json" \
              2>&1 | tee fetch_test.log
            statuses=("${PIPESTATUS[@]}")
          fi
          set -e
          if [ "$FETCH_SCOPE" = imf-live-exact-20261015 ]; then
            test "${statuses[0]}" -eq 0
            test "${statuses[1]}" -eq 0
            exit 0
          fi
          python scripts/institution_source_health.py \
            --producer-exit-code "${statuses[0]}" --log-exit-code "${statuses[1]}" \
            --manifest _fetch_test/institution_run_manifest.json \
            --date-folder "$fetch_date" --institutions "$FETCH_INSTITUTIONS" \
            --github-output _fetch_test/source-health.txt
          grep -qx 'source_health=healthy' _fetch_test/source-health.txt

      - name: Show what was fetched
        run: |
          echo "===== downloaded PDFs ====="
          ls -lh _fetch_test/*.pdf 2>/dev/null || echo "(no PDFs downloaded)"
          echo "===== run manifest ====="
          cat _fetch_test/institution_run_manifest.json || true
          echo "===== link archive (original PDF URLs) ====="
          cat _fetch_test/test_archive.jsonl 2>/dev/null || echo "(empty)"
          if [ -f _fetch_test/exact-scope-acceptance.json ]; then
            cat _fetch_test/exact-scope-acceptance.json
          fi

      - name: Validate downloaded files are real PDFs
        run: |
          count=0
          fail=0
          for f in _fetch_test/*.pdf; do
            [ -e "$f" ] || continue
            count=$((count+1))
            if head -c5 "$f" | grep -q "%PDF-"; then
              echo "OK   $f"
            else
              echo "BAD  $f (not a PDF)"
              fail=1
            fi
          done
          echo "Validated $count PDF(s)."
          if [ "$count" -eq 0 ]; then
            echo "::warning::No PDFs were downloaded. Widen since_days or check the source feeds."
          fi
          exit $fail

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: institution-fetch-test-${{ github.run_id }}
          path: |
            fetch_test.log
            _fetch_test/institution_run_manifest.json
            _fetch_test/imf-pending-intake.json
            _fetch_test/test_archive.jsonl
            _fetch_test/source-health.txt
            _fetch_test/scope-before.json
            _fetch_test/scope-discovery.json
            _fetch_test/exact-scope-acceptance.json
            _fetch_test/imf-source-evidence/*.json
            _fetch_test/*.pdf
          if-no-files-found: warn
