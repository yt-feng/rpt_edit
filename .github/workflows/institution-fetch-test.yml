name: Institution fetch test
on:
  workflow_dispatch:
    inputs:
      institutions:
        required: true
        default: imf
      since_days:
        required: true
        default: '14'
      max_per_institution:
        required: true
        default: '2'
permissions:
  contents: read
jobs:
  cloud-access-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            institution_feeds/pending_intake
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests curl_cffi pypdf
      - name: Diagnose official IMF PDF delivery with redacted route identifiers
        env:
          PROXY_SUBSCRIPTION_URL: ${{ secrets.PROXY_SUBSCRIPTION_URL }}
        run: python scripts/cloud_imf_access_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imf-access-probe-${{ github.run_id }}
          path: _imf_access_probe
          if-no-files-found: error
