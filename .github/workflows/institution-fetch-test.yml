name: Institution fetch test
on:
  workflow_dispatch:
    inputs:
      institutions:
        required: true
        default: imf
      since_days:
        required: true
        default: '14'
      max_per_institution:
        required: true
        default: '2'
permissions:
  contents: read
jobs:
  cloud-access-diagnostic:
    strategy:
      fail-fast: false
      matrix:
        include:
          - pool: hosted
            runner: [ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            institution_feeds/pending_intake
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m venv "$RUNNER_TEMP/imf-probe-${{ github.run_id }}"
          "$RUNNER_TEMP/imf-probe-${{ github.run_id }}/bin/pip" install requests curl_cffi pypdf
      - name: Verify parsed cloud proxy authentication and official eLibrary document
        env:
          PROXY_SUBSCRIPTION_URL: ${{ secrets.PROXY_SUBSCRIPTION_URL }}
        run: '"$RUNNER_TEMP/imf-probe-${{ github.run_id }}/bin/python" scripts/cloud_imf_auth_probe.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imf-access-probe-${{ matrix.pool }}-${{ github.run_id }}
          path: |
            _imf_auth_probe
          if-no-files-found: error
      - name: Remove isolated diagnostic Python environment
        if: always()
        run: 'rm -rf "$RUNNER_TEMP/imf-probe-${{ github.run_id }}"'
