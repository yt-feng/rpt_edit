name: Institution fetch test
on:
  workflow_dispatch:
    inputs:
      institutions:
        required: true
        default: imf
      since_days:
        required: true
        default: '7'
      max_per_institution:
        required: true
        default: '1'
      allow_cloud_browser:
        description: 'Explicit user authorization for this cloud-only browser diagnostic'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  approved-cloud-browser-single-pdf:
    if: ${{ inputs.allow_cloud_browser == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/cloud_imf_browser_probe.cjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned official cloud browser package
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/imf-browser" --no-audit --no-fund playwright@1.64.0
          "$RUNNER_TEMP/imf-browser/node_modules/.bin/playwright" install --with-deps chromium
          pip install pypdf
      - name: Download one exact official report in approved cloud browser
        env:
          EXPLICIT_CLOUD_BROWSER_APPROVAL: 'true'
          PLAYWRIGHT_PACKAGE_ROOT: ${{ runner.temp }}/imf-browser
        run: xvfb-run --auto-servernum node scripts/cloud_imf_browser_probe.cjs
      - name: Verify complete PDF and exact known identity
        run: |
          python - <<'PYCODE'
          import hashlib, json
          from pathlib import Path
          from pypdf import PdfReader
          folder=Path('_imf_browser_probe')
          report=json.loads((folder/'summary.json').read_text())
          p=folder/(report['expected_sha256']+'.pdf')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==report['expected_sha256']
          reader=PdfReader(p)
          assert len(reader.pages)==14 and not reader.is_encrypted
          text=' '.join((page.extract_text() or '') for page in reader.pages[:3]).casefold()
          assert 'estonia' in text and 'consumer price index' in text and '2026' in text
          report.update(pdf_parser_validation='passed', pages=14, accepted=True)
          (folder/'summary.json').write_text(json.dumps(report,indent=2)+'\n')
          print('Exact official PDF verified: 14 pages, matching hash and source identity')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imf-browser-probe-${{ github.run_id }}
          path: _imf_browser_probe
          if-no-files-found: warn
