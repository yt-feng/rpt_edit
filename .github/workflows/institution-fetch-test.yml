name: Reviewed IMF original cache transfer
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Exact reviewed cache transfer operation
        required: true
        type: choice
        default: verify
        options: [verify, mint]
      public_request:
        description: Ephemeral recipient public key and nonce only
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: imf-reviewed-cache-import-20261012
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/imf_reviewed_cache_bridge.py
            scripts/reviewed-originals.json
            scripts/imf_production_preflight.py
      - uses: actions/checkout@v4
        with:
          ref: a1b68ba1ffe4d79281ed2f015aad74182bb24d01
          path: helper
          persist-credentials: false
          sparse-checkout: |
            scripts
            institution_feeds
      - uses: actions/checkout@v4
        with:
          ref: main
          path: current
          persist-credentials: false
          sparse-checkout: institution_feeds/pending_intake
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact transfer dependencies
        run: python -m pip install --disable-pip-version-check 'requests==2.34.2' 'pypdf==6.19.0' 'boto3==1.43.111' 'cryptography==50.0.2'
      - name: Save public request only
        env:
          PUBLIC_REQUEST: ${{ inputs.public_request }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          raw = os.environ['PUBLIC_REQUEST'].encode()
          if len(raw) > 8192:
              raise SystemExit('public_request_size')
          json.loads(raw)
          os.umask(0o077)
          Path('_imf_cache_transfer').mkdir()
          Path(os.environ['RUNNER_TEMP'], 'imf-public-request.json').write_bytes(raw)
          PY
      - name: Perform reviewed operation
        env:
          OPERATION: ${{ inputs.operation }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            mint) output_args=(--output _imf_cache_transfer/encrypted.json) ;;
            verify) output_args=() ;;
            *) echo 'invalid_operation'; exit 1 ;;
          esac
          python -I scripts/imf_reviewed_cache_bridge.py "$OPERATION" \
            --repo helper \
            --pending current/institution_feeds/pending_intake/imf.json \
            --public-request "$RUNNER_TEMP/imf-public-request.json" \
            "${output_args[@]}" > _imf_cache_transfer/summary.json
          if [ "$OPERATION" = verify ]; then
            python -I scripts/imf_production_preflight.py --repo helper \
              > _imf_cache_transfer/production-preflight.json
          fi
      - name: Upload encrypted transfer or readback receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imf-cache-import-${{ github.run_id }}
          path: |
            _imf_cache_transfer/encrypted.json
            _imf_cache_transfer/summary.json
            _imf_cache_transfer/production-preflight.json
          retention-days: 1
          if-no-files-found: warn
