name: Institution fetch test

# Temporary feature-branch diagnostic for 17 already admitted IMF sources.
# Fetch and validate only: no production commits or downstream workflows.

on:
  workflow_dispatch:
    inputs:
      institutions:
        description: "Exact acceptance scope (must be imf)"
        required: true
        default: "imf"
      since_days:
        description: "Fresh discovery window (must be 7; frozen queue survives age)"
        required: true
        default: "7"
      max_per_institution:
        description: "Exact acceptance bound (must be 17)"
        required: true
        default: "17"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  fetch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Test resolver and exact acceptance guards offline
        run: |
          python scripts/test_fetch_institution_latest_pdfs.py
          python scripts/test_imf_exact_fetch_acceptance.py

      - name: Prepare isolated frozen 17-source queue
        id: prepare
        env:
          INPUT_INSTITUTIONS: ${{ inputs.institutions }}
          INPUT_SINCE_DAYS: ${{ inputs.since_days }}
          INPUT_MAX_PER_INSTITUTION: ${{ inputs.max_per_institution }}
        run: |
          test "$INPUT_INSTITUTIONS" = "imf"
          test "$INPUT_SINCE_DAYS" = "7"
          test "$INPUT_MAX_PER_INSTITUTION" = "17"
          python scripts/imf_exact_fetch_acceptance.py prepare

      - name: Fetch only the bounded IMF acceptance batch
        id: fetch
        env:
          PROXY_SUBSCRIPTION_URL: ${{ secrets.PROXY_SUBSCRIPTION_URL }}
        run: |
          set +e
          set -o pipefail
          python scripts/imf_exact_fetch_acceptance.py fetch \
            2>&1 | tee fetch_test.log
          producer_status=("${PIPESTATUS[@]}")
          set -e
          echo "producer_exit_code=${producer_status[0]}" >> "$GITHUB_OUTPUT"
          test "${producer_status[1]}" -eq 0
          test "${producer_status[0]}" -eq 0

      - name: Verify exact identities, PDF pages, hashes, and state isolation
        if: ${{ always() && !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          PRODUCER_EXIT_CODE: ${{ steps.fetch.outputs.producer_exit_code }}
        run: |
          python scripts/imf_exact_fetch_acceptance.py verify \
            --producer-exit-code "${PRODUCER_EXIT_CODE:-255}"

      - name: Upload bounded acceptance evidence and first pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: institution-fetch-test-${{ github.run_id }}
          path: |
            fetch_test.log
            _fetch_test/acceptance_prepare.json
            _fetch_test/acceptance_scope.json
            _fetch_test/frozen_seed.json
            _fetch_test/institution_run_manifest.json
            _fetch_test/imf-pending-intake.json
            _fetch_test/test_archive.jsonl
            _fetch_test/exact17_acceptance.json
            _fetch_test/identity_review.md
            _fetch_test/first_pages/*.png
          if-no-files-found: warn
          retention-days: 7
