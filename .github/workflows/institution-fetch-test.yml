name: Institution fetch test (self-hosted)
run-name: Exact IMF eLibrary ordinary HTTP probe on remote VPS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-elibrary-http:
    runs-on: [self-hosted, wechat-draft]
    timeout-minutes: 5
    env:
      PYTHONUNBUFFERED: '1'
      PROBE_OUTPUT: ${{ runner.temp }}/imf-vps-elibrary-${{ github.run_id }}-${{ github.run_attempt }}
      PROBE_VENV: ${{ runner.temp }}/imf-vps-elibrary-venv-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Require the existing remote Linux VPS
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_ACTIONS:-}" != true || "${GITHUB_EVENT_NAME:-}" != workflow_dispatch || "${GITHUB_REPOSITORY:-}" != yt-feng/rpt_edit || "${GITHUB_REF:-}" != refs/heads/codex/imf-vps-elibrary-20261013 || "${RUNNER_OS:-}" != Linux || "${RUNNER_NAME:-}" != rpt-edit-wechat-draft-vps ]]; then
            echo 'remote_runner_guard_failed'
            exit 1
          fi
      - name: Checkout only the reviewed probe workflow
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: imf-vps-probe-${{ github.run_id }}-${{ github.run_attempt }}
          sparse-checkout-cone-mode: false
          sparse-checkout: .github/workflows/institution-fetch-test.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated pinned HTTP and PDF readers
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$PROBE_VENV"
          "$PROBE_VENV/bin/python" -m pip install --disable-pip-version-check 'requests==2.34.2' 'pypdf==6.19.0'
      - name: Read the two fixed official resources once
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          "$PROBE_VENV/bin/python" - <<'PY'
          import contextlib
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import sys
          import signal
          import time
          import warnings
          import requests
          from pypdf import PdfReader

          LIMIT = 8 * 1024 * 1024
          EXPECTED_SIZE = 365715
          EXPECTED_SHA = 'c31da5c22e845f767b39a0a16679c0f1249ce46b5f60bd0170bdb67964e663b3'
          LANDING = 'https://www.elibrary.imf.org/view/journals/019/2026/082/019.2026.issue-082-en.xml?cid=580315-com-dsp-crossref'
          PDF = 'https://www.elibrary.imf.org/downloadpdf/view/journals/019/2026/082/019.2026.issue-082-en.pdf'

          def guard():
              expected = {'GITHUB_ACTIONS': 'true', 'GITHUB_EVENT_NAME': 'workflow_dispatch',
                          'GITHUB_REPOSITORY': 'yt-feng/rpt_edit',
                          'GITHUB_REF': 'refs/heads/codex/imf-vps-elibrary-20261013',
                          'RUNNER_OS': 'Linux', 'RUNNER_NAME': 'rpt-edit-wechat-draft-vps'}
              return sys.platform == 'linux' and all(os.environ.get(key) == value for key, value in expected.items())

          class ProbeDeadline(TimeoutError):
              pass

          def deadline_expired(signum, frame):
              raise ProbeDeadline()

          def probe(url, *, pdf):
              result = {'http_status': None, 'bytes': 0, 'pdf_signature': False,
                        'sha256': None, 'pages': None, 'classification': 'not_read'}
              response = None
              previous_handler = signal.signal(signal.SIGALRM, deadline_expired)
              signal.setitimer(signal.ITIMER_REAL, 30)
              try:
                  deadline = time.monotonic() + 30
                  # No redirect/retry, custom headers, proxy argument, browser profile, or cookie reuse.
                  response = requests.get(url, timeout=30, stream=True, allow_redirects=False)
                  result['http_status'] = response.status_code
                  chunks = []
                  for chunk in response.iter_content(chunk_size=65536):
                      if time.monotonic() > deadline:
                          result['classification'] = 'read_time_bound'
                          return result
                      if not chunk:
                          continue
                      result['bytes'] += len(chunk)
                      if result['bytes'] >= LIMIT:
                          result['classification'] = 'body_size_bound'
                          return result
                      chunks.append(chunk)
                  payload = b''.join(chunks)
                  result['pdf_signature'] = payload.startswith(b'%PDF-')
                  result['sha256'] = hashlib.sha256(payload).hexdigest()
                  if response.status_code != 200:
                      result['classification'] = 'http_rejected'
                  elif not pdf:
                      result['classification'] = 'landing_http_ok'
                  elif not result['pdf_signature']:
                      result['classification'] = 'pdf_signature_missing'
                  elif len(payload) != EXPECTED_SIZE:
                      result['classification'] = 'pdf_size_mismatch'
                  elif result['sha256'] != EXPECTED_SHA:
                      result['classification'] = 'pdf_hash_mismatch'
                  else:
                      try:
                          with contextlib.redirect_stderr(io.StringIO()), warnings.catch_warnings():
                              warnings.simplefilter('ignore')
                              reader = PdfReader(io.BytesIO(payload), strict=True)
                              if reader.is_encrypted:
                                  result['classification'] = 'pdf_encrypted'
                                  return result
                              result['pages'] = len(reader.pages)
                          result['classification'] = 'verified_pdf' if result['pages'] == 14 else 'pdf_pages_mismatch'
                      except ProbeDeadline:
                          raise
                      except Exception:
                          result['classification'] = 'pdf_parse_failed'
              except (ProbeDeadline, requests.exceptions.Timeout):
                  result['classification'] = 'request_timeout'
              except requests.exceptions.RequestException:
                  result['classification'] = 'request_failed'
              except Exception:
                  result['classification'] = 'client_error'
              finally:
                  signal.setitimer(signal.ITIMER_REAL, 0)
                  signal.signal(signal.SIGALRM, previous_handler)
                  if response is not None:
                      try:
                          response.close()
                      except Exception:
                          result['classification'] = 'response_close_failed'
              return result

          def main():
              if not guard():
                  print(json.dumps({'accepted': False, 'classification': 'remote_runner_guard_failed'}))
                  return 1
              output = Path(os.environ['PROBE_OUTPUT'])
              output.mkdir(mode=0o700, parents=False, exist_ok=False)
              result = {'landing': probe(LANDING, pdf=False), 'pdf': probe(PDF, pdf=True)}
              result['accepted'] = result['pdf']['classification'] == 'verified_pdf'
              (output / 'summary.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
              print(json.dumps(result, sort_keys=True))
              return 0 if result['accepted'] else 1

          if __name__ == '__main__':
              raise SystemExit(main())
          PY
      - name: Upload only the content-free result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imf-vps-elibrary-${{ github.run_id }}
          path: ${{ env.PROBE_OUTPUT }}/summary.json
          retention-days: 1
          if-no-files-found: error
