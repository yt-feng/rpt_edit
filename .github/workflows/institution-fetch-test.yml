name: Institution fetch test

# Lightweight test of scripts/fetch_institution_latest_pdfs.py only.
# Hits the live IMF / World Bank / BIS / OECD / ADB / WEF / UNCTAD / WTO / Bruegel
# sources, validates that the downloaded files are real PDFs, and uploads the
# manifest + link archive. It does NOT run MinerU / DeepSeek / WeChat, and commits nothing.

on:
  workflow_dispatch:
    inputs:
      institutions:
        description: "Comma list or all (imf,worldbank,bis,oecd,adb,wef,unctad,wto,bruegel)"
        required: true
        default: "all"
      since_days:
        description: "Lookback window. Use a wide window (14-30) so there is something to fetch."
        required: true
        default: "14"
      max_per_institution:
        description: "Cap PDFs per institution to keep the test fast"
        required: true
        default: "2"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  fetch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Test institution PDF resolver
        run: python scripts/test_fetch_institution_latest_pdfs.py

      - name: Debug Mongolia Coveo metadata
        run: |
          python - <<'PY'
          import json
          import re
          import sys
          from urllib.parse import urlsplit

          sys.path.insert(0, "scripts")

          import requests
          import fetch_institution_latest_pdfs as fetcher

          cfg = dict(fetcher.INSTITUTIONS["imf"])
          token = cfg["coveo_token"]
          body = {
              "aq": cfg["coveo_aq"],
              "q": "mongolia 2026 article iv consultation discussions",
              "searchHub": "Search",
              "numberOfResults": 20,
              "fieldsToInclude": [
                  "title", "clickableuri", "imfdate", "imfcontenttype",
                  "permanentid", "urihash", "imfseries", "seriesvolumeno",
                  "imfstockno", "imfisbn", "imfcountry", "imfproductid",
                  "imfpublicationid", "imfdownloadurl", "imfpdfurl",
                  "filetype", "sysuri",
              ],
          }
          session = requests.Session()
          response = fetcher.http_post(
              session,
              cfg["coveo_url"],
              30,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "Origin": "https://www.imf.org",
                  "Referer": "https://www.imf.org/",
              },
              json_payload=body,
          )
          response.raise_for_status()
          for result in response.json().get("results", []):
              raw = result.get("raw", {})
              uri = raw.get("clickableuri") or result.get("clickUri") or ""
              if "mongolia-2026-article-iv" not in uri.lower():
                  continue
              safe_top = {
                  key: value for key, value in result.items()
                  if key not in {"raw", "excerpt", "firstSentences"}
              }
              print("TOP", json.dumps(safe_top, ensure_ascii=False, sort_keys=True))
              print("RAW", json.dumps(raw, ensure_ascii=False, sort_keys=True))
              parsed = urlsplit(cfg["coveo_url"])
              preview_url = f"{parsed.scheme}://{parsed.netloc}{parsed.path.rstrip('/')}/html"
              preview = fetcher.http_get(
                  session,
                  preview_url,
                  30,
                  params={
                      "organizationId": cfg["coveo_organization_id"],
                      "uniqueId": result.get("uniqueId"),
                  },
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Origin": "https://www.imf.org",
                      "Referer": "https://www.imf.org/",
                  },
              )
              preview.raise_for_status()
              print("PREVIEW", len(preview.text), fetcher.scrape_pdf_candidates(preview.text, uri))
              lower = preview.text.lower()
              for needle in ("download", "stock", ".pdf", "/-/media/"):
                  pos = lower.find(needle)
                  if pos >= 0:
                      print("CONTEXT", needle, preview.text[max(0, pos - 180):pos + 500].replace("\n", " "))
              for candidate in (
                  "https://www.imf.org/-/media/files/publications/cr/2026/english/1mngea2026002.pdf",
                  "https://www.imf.org/-/media/files/publications/cr/2026/english/1mngea2026001.pdf",
              ):
                  probe = fetcher.http_get(session, candidate, 30)
                  print("PROBE", candidate, probe.status_code, probe.headers.get("content-type"), probe.content[:5])
          PY

      - name: Fetch latest institution PDFs (test, no commit)
        env:
          PROXY_SUBSCRIPTION_URL: ${{ secrets.PROXY_SUBSCRIPTION_URL }}
        run: |
          set -o pipefail
          python scripts/fetch_institution_latest_pdfs.py \
            --output-dir _fetch_test \
            --date "$(TZ=Asia/Shanghai date +%y%m%d)" \
            --institutions "${{ github.event.inputs.institutions || 'all' }}" \
            --since-days "${{ github.event.inputs.since_days || '14' }}" \
            --max-per-institution "${{ github.event.inputs.max_per_institution || '2' }}" \
            --archive-path "_fetch_test/test_archive.jsonl" \
            --seen-state-path "_fetch_test/test_seen.json" \
            2>&1 | tee fetch_test.log

      - name: Show what was fetched
        run: |
          echo "===== downloaded PDFs ====="
          ls -lh _fetch_test/*.pdf 2>/dev/null || echo "(no PDFs downloaded)"
          echo "===== run manifest ====="
          cat _fetch_test/institution_run_manifest.json || true
          echo "===== link archive (original PDF URLs) ====="
          cat _fetch_test/test_archive.jsonl 2>/dev/null || echo "(empty)"

      - name: Validate downloaded files are real PDFs
        run: |
          count=0
          fail=0
          for f in _fetch_test/*.pdf; do
            [ -e "$f" ] || continue
            count=$((count+1))
            if head -c5 "$f" | grep -q "%PDF-"; then
              echo "OK   $f"
            else
              echo "BAD  $f (not a PDF)"
              fail=1
            fi
          done
          echo "Validated $count PDF(s)."
          if [ "$count" -eq 0 ]; then
            echo "::warning::No PDFs were downloaded. Widen since_days or check the source feeds."
          fi
          exit $fail

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: institution-fetch-test-${{ github.run_id }}
          path: |
            fetch_test.log
            _fetch_test/institution_run_manifest.json
            _fetch_test/test_archive.jsonl
          if-no-files-found: warn
