name: Institution fetch test
on:
  workflow_dispatch:
    inputs:
      institutions:
        required: true
        default: imf
      since_days:
        required: true
        default: '7'
      max_per_institution:
        required: true
        default: '1'
      allow_cloud_browser:
        description: 'Explicit user authorization for this cloud-only browser diagnostic'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  approved-cloud-proxy-browser-single-pdf:
    if: ${{ inputs.allow_cloud_browser == true && github.repository == 'yt-feng/rpt_edit' && github.ref == 'refs/heads/codex/imf-proxy-browser-20261013' && inputs.institutions == 'imf' && inputs.max_per_institution == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cloud_imf_browser_probe.cjs
            scripts/cloud_imf_proxy_browser_probe.py
            scripts/cloud_imf_protocol_client_probe.py
            scripts/fetch_institution_latest_pdfs.py
            scripts/institution_pending_intake.py
            scripts/test_cloud_imf_proxy_browser_probe.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify offline guards
        run: |
          python -m unittest discover -s scripts -p test_cloud_imf_proxy_browser_probe.py
          node --check scripts/cloud_imf_browser_probe.cjs
      - name: Install pinned official cloud clients
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/imf-browser" --no-audit --no-fund playwright@1.64.0
          "$RUNNER_TEMP/imf-browser/node_modules/.bin/playwright" install --with-deps chromium
          pip install requests==2.34.2 curl_cffi==0.16.3 pypdf==6.19.0
          curl --fail --location --silent --show-error --connect-timeout 10 --max-time 90 \
            https://github.com/SagerNet/sing-box/releases/download/v1.14.3/sing-box-1.14.3-linux-amd64.tar.gz \
            --output "$RUNNER_TEMP/sing-box.tar.gz"
          printf '%s  %s\n' e2bdf179c15a3652955dc44867e33ca0965c9c9b91b34267dcc5a5d639a5feee "$RUNNER_TEMP/sing-box.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/sing-box.tar.gz" -C "$RUNNER_TEMP"
      - name: Download one exact official report through one approved cloud route
        env:
          EXPLICIT_CLOUD_BROWSER_APPROVAL: 'true'
          PLAYWRIGHT_PACKAGE_ROOT: ${{ runner.temp }}/imf-browser
          PROXY_SUBSCRIPTION_URL: ${{ secrets.PROXY_SUBSCRIPTION_URL }}
        run: xvfb-run --auto-servernum python scripts/cloud_imf_proxy_browser_probe.py --sing-box "$RUNNER_TEMP/sing-box-1.14.3-linux-amd64/sing-box"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imf-proxy-browser-probe-${{ github.run_id }}
          path: _imf_browser_probe
          if-no-files-found: warn
