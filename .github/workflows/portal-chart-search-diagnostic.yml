name: Portal chart checkpoint diagnostic
run-name: Chart checkpoint diagnostic ${{ github.run_id }}

on:
  pull_request:
    paths:
      - ".github/workflows/portal-chart-search-diagnostic.yml"
      - "scripts/diagnose_chart_search_state.py"
      - "scripts/test_chart_search_diagnostic.py"
      - "scripts/build_chart_search_index.py"
      - "scripts/test_chart_search_index.py"
      - "scripts/chart_search_r2.py"
  workflow_dispatch:
    inputs:
      run_id:
        description: "Required historical chart-index workflow run ID to inspect"
        type: string
        required: true
        default: ""

permissions:
  contents: read

jobs:
  inspect-checkpoint:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Validate run filter
        if: github.event_name == 'workflow_dispatch'
        env:
          TARGET_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$TARGET_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]] || { echo "::error::A numeric chart workflow run ID is required."; exit 1; }

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            scripts

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install checkpoint reader dependencies
        run: python -m pip install --disable-pip-version-check "requests>=2.31,<3" "Pillow>=10,<12" "boto3>=1.34,<2"

      - name: Test diagnostic redaction and run selection
        run: |
          python scripts/test_chart_search_diagnostic.py
          python scripts/test_chart_search_index.py

      - name: Read checkpoint without model requests or storage writes
        if: github.event_name == 'workflow_dispatch'
        env:
          TARGET_RUN_ID: ${{ inputs.run_id }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: python scripts/diagnose_chart_search_state.py --run-id "$TARGET_RUN_ID" --output _chart_diagnostic/report.json

      - name: Upload only the filtered diagnostic
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: chart-checkpoint-diagnostic-${{ github.run_id }}
          path: _chart_diagnostic/report.json
          if-no-files-found: warn
          retention-days: 7
