name: Market views daily PDF

run-name: Market Views ${{ inputs.expected_bank_date || inputs.date_folder || github.event.workflow_run.name || 'source completion' }}

on:
  workflow_dispatch:
    inputs:
      date_folder:
        description: "Dropbox output date folder under xhs_notes/dropbox, or latest"
        required: true
        default: "latest"
      expected_bank_date:
        description: "Optional completed bank date asserted by the upstream parser"
        required: false
        default: ""
      source_handoff_run_id:
        description: "Private report handoff run id supplied by Daily report articles and translations"
        required: false
        default: ""
      source_handoff_kind:
        description: "Private source: xhs, validated original-PDF backup, MinerU recovery, or complete accepted legacy Daily tasks"
        required: true
        type: choice
        options: [xhs, native-pdf, mineru-recovery, legacy-daily]
        default: xhs
      native_quality_fixture_json:
        description: "Optional numeric value and page-position acceptance fixtures for native PDF sources"
        required: false
        default: ""
      source_artifact_run_id:
        description: "Historical Actions run containing final-dropbox-macro-shard artifacts"
        required: false
        default: ""
      source_artifact_pattern:
        description: "Artifact pattern used with source_artifact_run_id"
        required: true
        default: "final-dropbox-macro-shard-*"
      expected_shards:
        description: "Expected R2 or historical artifact shard count; 0 disables the check"
        required: true
        default: "0"
      expected_articles:
        description: "Expected historical report count; 0 disables the check"
        required: true
        default: "0"
      model:
        description: "DeepSeek model for synthesis"
        required: true
        default: "deepseek-flash"
      deepseek_base_url:
        description: "DeepSeek API base URL"
        required: true
        default: "https://api.deepseek.com"
      compile_latex:
        description: "Also compile the LaTeX .tex with XeLaTeX. Default false because ReportLab already creates the PDF much faster."
        required: true
        type: boolean
        default: false
      force_rebuild:
        description: "Rebuild even when main already contains a valid PDF for the resolved date"
        required: true
        type: boolean
        default: false
permissions:
  contents: write
  actions: read

env:
  PYTHONUNBUFFERED: "1"
  PRIVATE_HANDOFF_ROOT: "_private-workflow-handoff/xhs"
  PRIVATE_MARKET_SOURCES_ROOT: "_private-workflow-handoff/market-sources"
  PRIVATE_MINERU_SOURCES_ROOT: "_private-workflow-handoff/mineru-market-sources"
  PRIVATE_LEGACY_SOURCES_ROOT: "_private-workflow-handoff/legacy-market-sources"

concurrency:
  group: market-views-daily-pdf
  cancel-in-progress: false

jobs:
  build-market-views-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Initialize DeepSeek usage ledger
        shell: bash
        run: |
          usage_dir="$(mktemp -d "$RUNNER_TEMP/deepseek-usage.XXXXXX")"
          usage_dir="$(cd "$usage_dir" && pwd -P)"
          echo "DEEPSEEK_USAGE_DIR=$usage_dir" >> "$GITHUB_ENV"
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            .github/actions
            scripts
            prompts
            requirements.txt
            market_view_summaries
            xhs_notes/institutions
            xhs_notes/consulting

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Validate private input source
        env:
          SOURCE_HANDOFF_RUN_ID: ${{ github.event.inputs.source_handoff_run_id }}
          SOURCE_ARTIFACT_RUN_ID: ${{ github.event.inputs.source_artifact_run_id }}
          EXPECTED_BANK_DATE: ${{ github.event.inputs.expected_bank_date }}
          SOURCE_HANDOFF_KIND: ${{ inputs.source_handoff_kind || 'xhs' }}
          EXPECTED_SHARDS: ${{ inputs.expected_shards || '0' }}
          EXPECTED_ARTICLES: ${{ inputs.expected_articles || '0' }}
        run: |
          for SOURCE_ID in "$SOURCE_HANDOFF_RUN_ID" "$SOURCE_ARTIFACT_RUN_ID"; do
            if [ -n "$SOURCE_ID" ] && ! [[ "$SOURCE_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo "Private input run ids must be positive integers." >&2
              exit 1
            fi
          done
          for EXPECTED_COUNT in "$EXPECTED_SHARDS" "$EXPECTED_ARTICLES"; do
            if ! [[ "$EXPECTED_COUNT" =~ ^[0-9]+$ ]]; then
              echo "Expected input counts must be nonnegative integers." >&2
              exit 1
            fi
          done
          case "$SOURCE_HANDOFF_KIND" in
            xhs) ;;
            native-pdf|mineru-recovery|legacy-daily)
              if [ -z "$SOURCE_HANDOFF_RUN_ID" ] || [ "$EXPECTED_SHARDS" != "1" ] || ! [[ "$EXPECTED_ARTICLES" =~ ^[1-9][0-9]*$ ]]; then
                echo "Source recovery requires its original run, one validated shard and an exact report count." >&2
                exit 1
              fi ;;
            *) echo "Unsupported source handoff kind." >&2; exit 1 ;;
          esac
          if [ -n "$SOURCE_HANDOFF_RUN_ID" ] && [ -n "$SOURCE_ARTIFACT_RUN_ID" ]; then
            echo "source_handoff_run_id and source_artifact_run_id are mutually exclusive." >&2
            exit 1
          fi
          if { [ -n "$SOURCE_HANDOFF_RUN_ID" ] || [ -n "$SOURCE_ARTIFACT_RUN_ID" ]; } && \
             ! printf '%s\n' "$EXPECTED_BANK_DATE" | grep -Eq '^[0-9]{6,8}$'; then
            echo "A valid expected_bank_date is required with a private input source." >&2
            exit 1
          fi

      - name: Download historical bank shard artifacts
        if: ${{ github.event.inputs.source_artifact_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.source_artifact_run_id }}
          pattern: ${{ github.event.inputs.source_artifact_pattern }}
          path: _market_views_shard_artifacts

      - name: Materialize historical bank shard artifacts
        if: ${{ github.event.inputs.source_artifact_run_id != '' }}
        run: |
          python scripts/materialize_shard_artifacts.py \
            --artifact-root _market_views_shard_artifacts \
            --destination "xhs_notes/dropbox/${{ github.event.inputs.expected_bank_date }}" \
            --expected-shards "${{ github.event.inputs.expected_shards || '0' }}" \
            --expected-reports "${{ github.event.inputs.expected_articles || '0' }}"

      - name: Install private handoff dependency
        run: python -m pip install boto3 requests PyMuPDF Pillow

      - name: Download bank inputs from private R2
        if: ${{ github.event.inputs.source_handoff_run_id != '' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
          SOURCE_HANDOFF_KIND: ${{ inputs.source_handoff_kind || 'xhs' }}
          SOURCE_HANDOFF_RUN_ID: ${{ inputs.source_handoff_run_id }}
          EXPECTED_BANK_DATE: ${{ inputs.expected_bank_date }}
          EXPECTED_SHARDS: ${{ inputs.expected_shards || '0' }}
        run: |
          if ! printf '%s\n' "$EXPECTED_BANK_DATE" | grep -Eq '^[0-9]{6,8}$'; then
            echo "A valid expected_bank_date is required with source_handoff_run_id." >&2
            exit 1
          fi
          SOURCE_PREFIX="$PRIVATE_HANDOFF_ROOT"
          if [ "$SOURCE_HANDOFF_KIND" = "native-pdf" ]; then
            SOURCE_PREFIX="$PRIVATE_MARKET_SOURCES_ROOT"
          elif [ "$SOURCE_HANDOFF_KIND" = "mineru-recovery" ]; then
            SOURCE_PREFIX="$PRIVATE_MINERU_SOURCES_ROOT"
          elif [ "$SOURCE_HANDOFF_KIND" = "legacy-daily" ]; then
            SOURCE_PREFIX="$PRIVATE_LEGACY_SOURCES_ROOT"
          fi
          python scripts/private_workflow_handoff.py download-shards \
            --prefix "$SOURCE_PREFIX/$SOURCE_HANDOFF_RUN_ID/$EXPECTED_BANK_DATE" \
            --destination "xhs_notes/dropbox/$EXPECTED_BANK_DATE" \
            --expected-count "$EXPECTED_SHARDS"

      - name: Verify complete native PDF source receipt
        if: ${{ inputs.source_handoff_kind == 'native-pdf' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HANDOFF_RUN_ID: ${{ inputs.source_handoff_run_id }}
          EXPECTED_BANK_DATE: ${{ inputs.expected_bank_date }}
          EXPECTED_ARTICLES: ${{ inputs.expected_articles }}
          NATIVE_QUALITY_FIXTURE_JSON: ${{ inputs.native_quality_fixture_json || '' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          sys.path.insert(0, 'scripts')
          from market_views_source_readiness import require_source_readiness
          source_run = os.environ['SOURCE_HANDOFF_RUN_ID']
          date = os.environ['EXPECTED_BANK_DATE']
          expected = os.environ['EXPECTED_ARTICLES']
          if not re.fullmatch(r'[1-9][0-9]*', source_run) or not re.fullmatch(r'[0-9]{6}', date) or not re.fullmatch(r'[1-9][0-9]*', expected):
              raise SystemExit('Native source consumer requires exact run, date and count.')
          def read_run(run_id):
              result = subprocess.run(['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}"],
                                      check=True, capture_output=True, text=True)
              metadata = json.loads(result.stdout)
              if metadata.get('id') != int(run_id) or metadata.get('head_branch') != 'main' or not re.fullmatch(r'[a-f0-9]{40}', str(metadata.get('head_sha', ''))):
                  raise SystemExit('Native source producer run or execution SHA differs.')
              return metadata
          producer = read_run(source_run)
          daily_path = '.github/workflows/dropbox-latest-pdf-to-xhs-sharded.yml'
          if producer.get('path') not in {daily_path, '.github/workflows/market-views-native-recovery.yml'}:
              raise SystemExit('Native source producer workflow differs.')
          jobs_result = subprocess.run(['gh', 'api',
              f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{source_run}/jobs?filter=latest&per_page=100"],
              check=True, capture_output=True, text=True, timeout=30)
          require_source_readiness(producer, json.loads(jobs_result.stdout))
          root = Path('xhs_notes/dropbox') / date / 'shard_0'
          receipt = json.loads((root / 'source_receipt.json').read_text())
          context = receipt.get('source_context')
          if not isinstance(context, dict):
              raise SystemExit('Native source receipt lacks its frozen cloud producer context.')
          original = context.get('original_source_run_id')
          if not isinstance(original, str) or (original and not re.fullmatch(r'[1-9][0-9]*', original)):
              raise SystemExit('Native original source run is invalid.')
          if producer['path'] == daily_path:
              if original != source_run:
                  raise SystemExit('Daily native source must bind its own selected original run.')
          elif original:
              original_run = read_run(original)
              if original_run.get('path') != daily_path or original_run.get('status') != 'completed' or original_run.get('conclusion') not in {'success', 'failure'}:
                  raise SystemExit('Native recovery original Daily source differs or is not terminal.')
          subprocess.run([sys.executable, 'scripts/extract_native_market_sources.py', 'validate',
                          '--output-dir', str(root), '--manifest', str(root / 'selected_to_process_manifest.json'),
                          '--expected-reports', expected, '--date-folder', date,
                          '--producer-run-id', source_run, '--execution-sha', producer['head_sha'],
                          '--original-source-run-id', original], check=True)
          fixture_args = []
          raw_fixture = os.environ.get('NATIVE_QUALITY_FIXTURE_JSON', '')
          if raw_fixture:
              if len(raw_fixture.encode('utf-8')) > 65536:
                  raise SystemExit('Native numeric fixture input is too large.')
              fixture_path = Path(os.environ['RUNNER_TEMP']) / 'market-views-native-quality-fixtures.json'
              fixture_path.write_text(raw_fixture, encoding='utf-8')
              fixture_args = ['--fixtures', str(fixture_path)]
          subprocess.run([sys.executable, 'scripts/audit_market_views_ocr_receipt.py',
                          '--source-dir', str(root), '--expected-reports', expected,
                          '--date-folder', date, '--producer-run-id', source_run,
                          '--execution-sha', producer['head_sha'], '--original-source-run-id', original,
                          '--summary', str(Path(os.environ['RUNNER_TEMP']) / 'market-views-native-source-audit.json'),
                          *fixture_args], check=True)
          PY

      - name: Preserve sanitized native source numeric audit
        if: ${{ always() && inputs.source_handoff_kind == 'native-pdf' }}
        uses: actions/upload-artifact@v4
        with:
          name: market-views-native-source-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/market-views-native-source-audit.json
          if-no-files-found: warn
          retention-days: 7

      - name: Verify complete MinerU recovery source receipt
        if: ${{ inputs.source_handoff_kind == 'mineru-recovery' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HANDOFF_RUN_ID: ${{ inputs.source_handoff_run_id }}
          EXPECTED_BANK_DATE: ${{ inputs.expected_bank_date }}
          EXPECTED_ARTICLES: ${{ inputs.expected_articles }}
        run: |
          SOURCE_EXECUTION_SHA="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_HANDOFF_RUN_ID" \
            --jq 'if .path == ".github/workflows/market-views-mineru-recovery.yml" and .head_branch == "main" then .head_sha else error("MinerU recovery producer differs") end')"
          [[ "$SOURCE_EXECUTION_SHA" =~ ^[a-f0-9]{40}$ ]]
          python scripts/recover_durable_mineru_sources.py validate \
            --output-dir "xhs_notes/dropbox/$EXPECTED_BANK_DATE/shard_0" \
            --expected-reports "$EXPECTED_ARTICLES" \
            --date-folder "$EXPECTED_BANK_DATE" \
            --expected-recovery-run-id "$SOURCE_HANDOFF_RUN_ID" \
            --expected-execution-sha "$SOURCE_EXECUTION_SHA"

      - name: Verify complete accepted legacy Daily source receipt
        if: ${{ inputs.source_handoff_kind == 'legacy-daily' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HANDOFF_RUN_ID: ${{ inputs.source_handoff_run_id }}
          EXPECTED_BANK_DATE: ${{ inputs.expected_bank_date }}
          EXPECTED_ARTICLES: ${{ inputs.expected_articles }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from market_views_source_readiness import require_source_readiness
          from recover_legacy_market_views_sources import validate_sources, WORKFLOW, RECEIPT
          from seed_legacy_market_views_cache import verify_producer
          source_run, date, expected = (os.environ[key] for key in ('SOURCE_HANDOFF_RUN_ID', 'EXPECTED_BANK_DATE', 'EXPECTED_ARTICLES'))
          if not re.fullmatch(r'[1-9][0-9]*', source_run) or not re.fullmatch(r'[0-9]{6}', date) or not re.fullmatch(r'[1-9][0-9]*', expected):
              raise SystemExit('Legacy source requires an exact run, date and complete count.')
          def get(endpoint):
              result = subprocess.run(['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/{endpoint}"],
                  capture_output=True, text=True, check=False, timeout=30)
              if result.returncode or len(result.stdout.encode()) > 1_000_000:
                  raise SystemExit('Legacy source producer metadata unavailable.')
              return json.loads(result.stdout)
          producer = get(f'actions/runs/{source_run}')
          if (producer.get('id') != int(source_run) or producer.get('path') != WORKFLOW
                  or producer.get('event') != 'workflow_dispatch' or producer.get('head_branch') != 'main'
                  or producer.get('repository', {}).get('full_name') != os.environ['GITHUB_REPOSITORY']
                  or producer.get('head_repository', {}).get('full_name') != os.environ['GITHUB_REPOSITORY']
                  or not re.fullmatch(r'[a-f0-9]{40}', str(producer.get('head_sha', '')))):
              raise SystemExit('Legacy source producer does not match the exact manual main workflow.')
          jobs = get(f'actions/runs/{source_run}/jobs?filter=latest&per_page=100')
          require_source_readiness(producer, jobs)
          root = Path('xhs_notes/dropbox') / date / 'shard_0'
          receipt = validate_sources(root, int(expected), date, expected_producer_run_id=source_run,
                                     expected_execution_sha=producer['head_sha'])
          original_run = receipt['source_context']['original_source_run_id']
          original = get(f'actions/runs/{original_run}')
          original_sha = verify_producer(original, original_run, os.environ['GITHUB_REPOSITORY'])
          if original_sha != receipt['source_context']['original_execution_sha']:
              raise SystemExit('Legacy original producer execution SHA differs.')
          print(json.dumps({'legacy_complete_source_validated': True, 'report_count': receipt['report_count'],
                            'unique_content_count': receipt['unique_content_count'], 'provider_posts': 0,
                            'canonical_task_admission': False}, sort_keys=True))
          PY

      - name: Resolve and validate primary bank source
        env:
          REQUESTED_DATE_FOLDER: ${{ github.event.inputs.date_folder || 'latest' }}
          EXPECTED_BANK_DATE: ${{ github.event.inputs.expected_bank_date || '' }}
          EXPECTED_ARTICLES: ${{ inputs.expected_articles || '0' }}
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild || 'false' }}
        run: |
          python - <<'PYTHON'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from build_market_views_pdf import source_date_dirs, require_primary_report_dirs, find_report_dirs

          root = Path("xhs_notes/dropbox")
          requested = os.environ["REQUESTED_DATE_FOLDER"]
          expected = os.environ["EXPECTED_BANK_DATE"]
          issue_date, source_dirs = source_date_dirs(
              root, [Path("xhs_notes/institutions"), Path("xhs_notes/consulting")], requested
          )
          if expected and issue_date != expected:
              raise SystemExit(f"Completed bank date {expected} does not match issue date {issue_date}.")
          bank_reports = require_primary_report_dirs(source_dirs[0])
          expected_articles = int(os.environ["EXPECTED_ARTICLES"])
          if expected_articles and len(bank_reports) != expected_articles:
              raise SystemExit(f"Expected {expected_articles} bank reports, received {len(bank_reports)}.")
          image_count = sum(len(list(path.glob("assets/source_image_*")))
                            for source_dir in source_dirs for path in find_report_dirs(source_dir))
          pdf = Path(f"market_view_summaries/{issue_date}/market_views_{issue_date}.pdf")
          valid_existing = (pdf.is_file() and pdf.stat().st_size > 1024
                            and pdf.open("rb").read(5) == b"%PDF-")
          should_build = os.environ["FORCE_REBUILD"] == "true" or not valid_existing
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for key, value in {
                  "BUILD_DATE_FOLDER": issue_date,
                  "EXPECTED_DATE_FOLDER": issue_date,
                  "DATE_FOLDER": issue_date,
                  "MINERU_SOURCE_IMAGE_COUNT": image_count,
                  "SHOULD_BUILD": str(should_build).lower(),
              }.items():
                  env.write(f"{key}={value}\n")
          print(f"::notice::Bank date and issue={issue_date}; bank reports={len(bank_reports)}; "
                f"retained source images={image_count}; should_build={should_build}.")
          PYTHON

      - name: Install and test private R2 archiver
        run: |
          python scripts/test_upload_market_view_to_r2.py
          python scripts/test_private_workflow_handoff.py

      - name: Install Python dependencies
        if: ${{ env.SHOULD_BUILD != 'false' }}
        run: |
          pip install -r requirements.txt
          pip install reportlab pillow pypdf
          python scripts/test_market_views_figures.py
          python scripts/test_render_market_views_figures.py

      - name: Test public Market Views PDF exporter
        if: ${{ env.SHOULD_BUILD != 'false' }}
        run: python scripts/test_prepare_public_market_view_pdf.py

      - name: Install Chinese font for fast PDF renderer
        if: ${{ env.SHOULD_BUILD != 'false' }}
        timeout-minutes: 5
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Optionally install minimal LaTeX
        if: ${{ env.SHOULD_BUILD != 'false' && github.event.inputs.compile_latex == 'true' }}
        timeout-minutes: 12
        run: |
          echo "::notice::Installing XeLaTeX only because compile_latex=true. Fast ReportLab PDF is always generated even if this is skipped."
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-recommended texlive-lang-chinese fonts-noto-cjk

      - name: Materialize private publishing image
        if: ${{ env.SHOULD_BUILD != 'false' }}
        env:
          PORTAL_PRIVATE_PUBLISH_ASSET_KEY: ${{ secrets.PORTAL_PRIVATE_PUBLISH_ASSET_KEY }}
        run: bash scripts/materialize_private_social_asset.sh prompts

      - name: Build market views data and LaTeX source
        if: ${{ env.SHOULD_BUILD != 'false' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_MARKET_VIEWS_API_KEY }}
          DEEPSEEK_USAGE_STAGE: market-views
          DEEPSEEK_BASE_URL: ${{ inputs.deepseek_base_url || 'https://api.deepseek.com' }}
        run: |
          set -o pipefail
          MODEL="${{ github.event.inputs.model || 'deepseek-flash' }}"
          BASE_URL="${{ github.event.inputs.deepseek_base_url || 'https://api.deepseek.com' }}"
          COMPILE_LATEX="${{ github.event.inputs.compile_latex || 'false' }}"
          echo "::notice::Building bank-led Market Views with dynamic topic planning and per-section DeepSeek coverage validation."
          python scripts/build_market_views_pdf.py \
            --dropbox-output-root "xhs_notes/dropbox" \
            --extra-roots "xhs_notes/institutions,xhs_notes/consulting" \
            --date-folder "$BUILD_DATE_FOLDER" \
            --output-root "market_view_summaries" \
            --model "$MODEL" \
            --deepseek-base-url "$BASE_URL" \
            --max-reports 0 \
            --per-report-extract-chars 2200 \
            --deepseek-max-tokens 8192 \
            --max-figures 0 \
            --max-selected-figures 0 \
            --max-figures-per-report 5 \
            --max-reports-per-bank-section 12 \
            --max-section-figure-candidates 40 \
            --figures-per-bank-section 4 \
            --max-external-visuals-per-report 0 \
            --compile "$COMPILE_LATEX" 2>&1 | tee market_views_build_progress.log
          RESOLVED_DATE_FOLDER="$(grep -Eo 'MARKET_VIEWS_DATE_FOLDER=[0-9]+' market_views_build_progress.log | tail -1 | cut -d= -f2)"
          if [ -z "$RESOLVED_DATE_FOLDER" ]; then
            echo "Could not resolve generated market_view_summaries date folder." >&2
            exit 1
          fi
          if [ "$RESOLVED_DATE_FOLDER" != "$EXPECTED_DATE_FOLDER" ]; then
            echo "Expected issue date $EXPECTED_DATE_FOLDER but builder resolved $RESOLVED_DATE_FOLDER." >&2
            exit 1
          fi
          echo "::notice::Resolved market views date folder: $RESOLVED_DATE_FOLDER"
          echo "DATE_FOLDER=$RESOLVED_DATE_FOLDER" >> "$GITHUB_ENV"

      - name: Render fast PDF without LaTeX install
        if: ${{ env.SHOULD_BUILD != 'false' }}
        run: |
          set -o pipefail
          echo "::notice::Rendering market_views_<date>.pdf with ReportLab."
          python scripts/render_market_views_reportlab_pdf.py \
            --summary-root "market_view_summaries" \
            --date-folder "$DATE_FOLDER" 2>&1 | tee market_views_pdf_render_progress.log
          STATS_PATH="market_view_summaries/$DATE_FOLDER/market_views_render_stats.json"
          test -s "$STATS_PATH"
          python - "$STATS_PATH" "$MINERU_SOURCE_IMAGE_COUNT" <<'PY'
          import json
          import sys

          stats = json.load(open(sys.argv[1], encoding="utf-8"))
          retained = int(sys.argv[2])
          candidates = int(stats.get("figure_candidate_count") or 0)
          rendered = int(stats.get("rendered_figure_count") or 0)
          if retained > 0 and candidates <= 0:
              raise SystemExit(
                  f"Retained MinerU images were present ({retained}) but no Market Views candidates were built."
              )
          if candidates > 0 and rendered <= 0:
              raise SystemExit(
                  f"Market Views built {candidates} MinerU candidates but rendered none into the PDF."
              )
          print(
              f"Market Views MinerU chart contract: retained={retained}, "
              f"candidates={candidates}, rendered={rendered}"
          )
          PY
          find market_view_summaries -name "*.pdf" -print

      - name: Verify PDF exists before upload and commit
        if: ${{ env.SHOULD_BUILD != 'false' }}
        run: |
          PDF_PATH="market_view_summaries/$DATE_FOLDER/market_views_$DATE_FOLDER.pdf"
          if [ ! -f "$PDF_PATH" ]; then
            echo "Expected PDF was not rendered: $PDF_PATH" >&2
            exit 1
          fi
          PDF_BYTES="$(stat -c '%s' "$PDF_PATH")"
          if [ "$PDF_BYTES" -le 1024 ]; then
            echo "Expected PDF is too small: $PDF_PATH ($PDF_BYTES bytes)" >&2
            exit 1
          fi
          echo "::notice::Verified exact Market Views PDF: $PDF_PATH ($PDF_BYTES bytes)."

      - name: Archive exact Market Views PDF in private R2
        if: ${{ env.SHOULD_BUILD != 'false' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET || 'portal-suite-pdfs' }}
        run: |
          PDF_PATH="market_view_summaries/$EXPECTED_DATE_FOLDER/market_views_$EXPECTED_DATE_FOLDER.pdf"
          if [ ! -f "$PDF_PATH" ]; then
            echo "Expected Market Views PDF is missing before private archive: $PDF_PATH" >&2
            exit 1
          fi
          echo "::notice::Archiving the exact $EXPECTED_DATE_FOLDER Market Views PDF in private R2."
          python scripts/upload_market_view_to_r2.py \
            --date "$EXPECTED_DATE_FOLDER" \
            --pdf "$PDF_PATH"

      - name: Prepare public-safe Market Views PDF
        if: ${{ env.SHOULD_BUILD != 'false' }}
        run: |
          PDF_PATH="market_view_summaries/$DATE_FOLDER/market_views_$DATE_FOLDER.pdf"
          PUBLIC_PDF="$RUNNER_TEMP/market_views_$DATE_FOLDER.public.pdf"
          python scripts/prepare_public_market_view_pdf.py \
            --source "$PDF_PATH" \
            --output "$PUBLIC_PDF"
          mv -- "$PUBLIC_PDF" "$PDF_PATH"

          # The original private PDF is already archived. Restore the tracked
          # neutral placeholder before scanning the public working tree.
          git restore --source=HEAD --worktree -- prompts/zsxq_img.jpg

          # Stage only for the identity guard. The commit helper refreshes the
          # index from origin/main before creating the durable commit.
          git add -f "$PDF_PATH"
          python scripts/check_public_identity.py
          git reset -- "$PDF_PATH"

      - name: Commit public-safe Market Views PDF to main
        if: ${{ env.SHOULD_BUILD != 'false' }}
        run: |
          PDF_PATH="market_view_summaries/$DATE_FOLDER/market_views_$DATE_FOLDER.pdf"
          bash scripts/commit_output_dir.sh \
            "$PDF_PATH" \
            "Archive Market Views PDF $DATE_FOLDER" \
            8 \
            true \
            true

      - name: Summarize observed DeepSeek usage
        if: ${{ always() && hashFiles('scripts/summarize_deepseek_usage.py') != '' }}
        run: |
          python scripts/summarize_deepseek_usage.py \
            --input-dir "$DEEPSEEK_USAGE_DIR" \
            --output "$DEEPSEEK_USAGE_DIR/summary.json" \
            --markdown "$DEEPSEEK_USAGE_DIR/summary.md" --github-summary

      - name: Upload content-free DeepSeek usage
        if: ${{ always() && hashFiles('.github/actions/resilient-diagnostic-artifact/action.yml') != '' }}
        uses: ./.github/actions/resilient-diagnostic-artifact
        with:
          name: deepseek-usage-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DEEPSEEK_USAGE_DIR }}
          if-no-files-found: error
          retention-days: 30

  notify-failure:
    needs: [build-market-views-pdf]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    uses: ./.github/workflows/portal-ops-alert.yml
    with:
      source_workflow: Market views daily PDF
      source_results: build=${{ needs.build-market-views-pdf.result }}
    secrets: inherit
