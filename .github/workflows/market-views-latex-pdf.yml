name: Market views daily PDF

on:
  workflow_dispatch:
    inputs:
      date_folder:
        description: "Dropbox output date folder under xhs_notes/dropbox, or latest"
        required: true
        default: "latest"
      model:
        description: "DeepSeek model for synthesis"
        required: true
        default: "deepseek-chat"
      deepseek_base_url:
        description: "DeepSeek API base URL"
        required: true
        default: "https://api.deepseek.com"
      compile_latex:
        description: "Also compile the LaTeX .tex with XeLaTeX. Default false because ReportLab already creates the PDF much faster."
        required: true
        type: boolean
        default: false
      commit_results:
        description: "Commit generated PDF back to repo"
        required: true
        type: boolean
        default: true
  schedule:
    # UTC 00:00 = Asia/Shanghai 08:00.
    - cron: "0 0 * * *"

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: market-views-daily-pdf
  cancel-in-progress: false

jobs:
  build-market-views-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest generated shard outputs
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install reportlab pillow

      - name: Install Chinese font for fast PDF renderer
        timeout-minutes: 5
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Optionally install minimal LaTeX
        if: ${{ github.event.inputs.compile_latex == 'true' }}
        timeout-minutes: 12
        run: |
          echo "::notice::Installing XeLaTeX only because compile_latex=true. Fast ReportLab PDF is always generated even if this is skipped."
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-recommended texlive-lang-chinese fonts-noto-cjk

      - name: Build market views data and LaTeX source
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ inputs.deepseek_base_url || 'https://api.deepseek.com' }}
        run: |
          DATE_FOLDER="${{ github.event.inputs.date_folder || 'latest' }}"
          MODEL="${{ github.event.inputs.model || 'deepseek-chat' }}"
          BASE_URL="${{ github.event.inputs.deepseek_base_url || 'https://api.deepseek.com' }}"
          COMPILE_LATEX="${{ github.event.inputs.compile_latex || 'false' }}"
          echo "::notice::Building market views from xhs_notes/dropbox/$DATE_FOLDER. No report or figure limits are applied. Fast PDF renderer will run after this step."
          python scripts/build_market_views_pdf.py \
            --dropbox-output-root "xhs_notes/dropbox" \
            --extra-roots "xhs_notes/institutions,xhs_notes/consulting" \
            --date-folder "$DATE_FOLDER" \
            --output-root "market_view_summaries" \
            --model "$MODEL" \
            --deepseek-base-url "$BASE_URL" \
            --max-reports 0 \
            --per-report-extract-chars 2200 \
            --max-figures 0 \
            --max-selected-figures 0 \
            --max-figures-per-report 0 \
            --compile "$COMPILE_LATEX" 2>&1 | tee market_views_build_progress.log
          echo "DATE_FOLDER=$DATE_FOLDER" >> "$GITHUB_ENV"

      - name: Render fast PDF without LaTeX install
        run: |
          echo "::notice::Rendering market_views_<date>.pdf with ReportLab."
          python scripts/render_market_views_reportlab_pdf.py \
            --summary-root "market_view_summaries" \
            --date-folder "$DATE_FOLDER" 2>&1 | tee market_views_pdf_render_progress.log
          find market_view_summaries -name "*.pdf" -print

      - name: Verify PDF exists before upload and commit
        run: |
          if ! find market_view_summaries -name "market_views_*.pdf" -type f -size +1k | grep -q .; then
            echo "No rendered market_views_*.pdf found. Failing the workflow so this is visible."
            find market_view_summaries -maxdepth 3 -type f -print || true
            exit 1
          fi

      - name: Upload market views PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-views-pdf-${{ github.run_id }}
          path: |
            market_view_summaries
            market_views_build_progress.log
            market_views_pdf_render_progress.log
          if-no-files-found: error

      - name: Commit generated market views PDF
        if: ${{ github.event.inputs.commit_results == 'true' || github.event_name == 'schedule' }}
        run: |
          bash scripts/commit_output_dir.sh "market_view_summaries" "Generate market views daily PDF" 8
