name: Market views LaTeX PDF

on:
  workflow_dispatch:
    inputs:
      date_folder:
        description: "Dropbox output date folder under xhs_notes/dropbox, or latest"
        required: true
        default: "latest"
      model:
        description: "DeepSeek model for synthesis"
        required: true
        default: "deepseek-chat"
      deepseek_base_url:
        description: "DeepSeek API base URL"
        required: true
        default: "https://api.deepseek.com"
      max_reports:
        description: "Max report folders to include"
        required: true
        default: "80"
      max_figures:
        description: "Max exhibit-style figures to copy as candidates"
        required: true
        default: "40"
      max_selected_figures:
        description: "Max figures DeepSeek may select for the final PDF"
        required: true
        default: "12"
      compile_pdf:
        description: "Compile LaTeX into PDF. False writes .tex quickly without installing LaTeX."
        required: true
        type: boolean
        default: true
      commit_results:
        description: "Commit generated LaTeX/PDF back to repo"
        required: true
        type: boolean
        default: true
  schedule:
    # UTC 00:30 = Asia/Shanghai 08:30, after the 05:00 daily report pipeline has time to finish and commit shards.
    - cron: "30 0 * * *"

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: market-views-latex-pdf
  cancel-in-progress: false

jobs:
  build-market-views-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest generated shard outputs
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install minimal LaTeX and Chinese fonts
        if: ${{ github.event.inputs.compile_pdf != 'false' }}
        timeout-minutes: 12
        run: |
          echo "::notice::Installing minimal XeLaTeX packages. Set compile_pdf=false to skip this step and only write .tex."
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-recommended texlive-lang-chinese fonts-noto-cjk

      - name: Build market views LaTeX/PDF
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ inputs.deepseek_base_url || 'https://api.deepseek.com' }}
        run: |
          DATE_FOLDER="${{ github.event.inputs.date_folder || 'latest' }}"
          MODEL="${{ github.event.inputs.model || 'deepseek-chat' }}"
          BASE_URL="${{ github.event.inputs.deepseek_base_url || 'https://api.deepseek.com' }}"
          MAX_REPORTS="${{ github.event.inputs.max_reports || '80' }}"
          MAX_FIGURES="${{ github.event.inputs.max_figures || '40' }}"
          MAX_SELECTED_FIGURES="${{ github.event.inputs.max_selected_figures || '12' }}"
          COMPILE="${{ github.event.inputs.compile_pdf || 'true' }}"
          echo "::notice::Building market views PDF from xhs_notes/dropbox/$DATE_FOLDER. compile_pdf=$COMPILE"
          python scripts/build_market_views_pdf.py \
            --dropbox-output-root "xhs_notes/dropbox" \
            --date-folder "$DATE_FOLDER" \
            --output-root "market_view_summaries" \
            --model "$MODEL" \
            --deepseek-base-url "$BASE_URL" \
            --max-reports "$MAX_REPORTS" \
            --max-figures "$MAX_FIGURES" \
            --max-selected-figures "$MAX_SELECTED_FIGURES" \
            --compile "$COMPILE" 2>&1 | tee market_views_build_progress.log

      - name: Upload market views PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-views-latex-pdf-${{ github.run_id }}
          path: |
            market_view_summaries
            market_views_build_progress.log
          if-no-files-found: warn

      - name: Commit generated market views PDF
        if: ${{ github.event.inputs.commit_results == 'true' || github.event_name == 'schedule' }}
        run: |
          bash scripts/commit_output_dir.sh "market_view_summaries" "Generate market views LaTeX PDF" 8
