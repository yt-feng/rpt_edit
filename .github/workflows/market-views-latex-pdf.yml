name: Market views daily PDF

run-name: Market Views ${{ inputs.expected_bank_date || inputs.date_folder || github.event.workflow_run.name || 'source completion' }}

on:
  workflow_dispatch:
    inputs:
      date_folder:
        description: "Dropbox output date folder under xhs_notes/dropbox, or latest"
        required: true
        default: "latest"
      expected_bank_date:
        description: "Optional completed bank date asserted by the upstream parser"
        required: false
        default: ""
      model:
        description: "DeepSeek model for synthesis"
        required: true
        default: "deepseek-v4-flash"
      deepseek_base_url:
        description: "DeepSeek API base URL"
        required: true
        default: "https://api.deepseek.com"
      compile_latex:
        description: "Also compile the LaTeX .tex with XeLaTeX. Default false because ReportLab already creates the PDF much faster."
        required: true
        type: boolean
        default: false
      archive_existing_only:
        description: "One-time migration mode: archive already-generated retained PDFs without rebuilding"
        required: true
        type: boolean
        default: false
      migrate_legacy_artifacts:
        description: "One-time migration: preserve PDFs from legacy Actions artifacts in private R2, then delete those artifacts"
        required: true
        type: boolean
        default: false
      confirm_delete_legacy_artifacts:
        description: "Required with migration: MIGRATE_AND_DELETE"
        required: false
        default: ""
      commit_results:
        description: "Deprecated compatibility input; Market Views output is always private"
        required: true
        type: boolean
        default: false
  workflow_run:
    workflows:
      - Final PDF to XHS notes
      - Institution latest PDF to WeChat
      - Consulting latest PDF to WeChat
    types: [completed]

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: market-views-daily-pdf
  cancel-in-progress: false

jobs:
  build-market-views-pdf:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            scripts
            prompts
            requirements.txt
            xhs_notes/dropbox
            xhs_notes/institutions
            xhs_notes/consulting
            market_view_summaries

      - name: Pull latest generated shard outputs
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags --prune --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          git reset --hard origin/main
          git clean -fdx

      - name: Resolve and validate build or retained archive target
        env:
          REQUESTED_DATE_FOLDER: ${{ github.event.inputs.date_folder || 'latest' }}
          EXPECTED_BANK_DATE: ${{ github.event.inputs.expected_bank_date || '' }}
        run: |
          ARCHIVE_EXISTING_ONLY="${{ github.event.inputs.archive_existing_only || 'false' }}"
          if [ "$ARCHIVE_EXISTING_ONLY" = "true" ]; then
            EXPECTED_DATE_FOLDER="$(
              find market_view_summaries -mindepth 2 -maxdepth 2 -type f -name 'market_views_*.pdf' -printf '%h\n' |
                awk -F/ '$NF ~ /^[0-9]{6}([0-9]{2})?$/ {print $NF}' |
                sort -n |
                tail -1
            )"
            if [ -z "$EXPECTED_DATE_FOLDER" ]; then
              echo "Archive-only migration requested, but no retained Market Views PDF was found." >&2
              exit 1
            fi

            OUTPUT_PDF="market_view_summaries/$EXPECTED_DATE_FOLDER/market_views_$EXPECTED_DATE_FOLDER.pdf"
            if [ ! -f "$OUTPUT_PDF" ]; then
              echo "Archive-only migration selected $EXPECTED_DATE_FOLDER, but its canonical PDF is missing: $OUTPUT_PDF" >&2
              exit 1
            fi
            PDF_BYTES="$(stat -c '%s' "$OUTPUT_PDF")"
            if [ "$PDF_BYTES" -le 1024 ]; then
              echo "Archive-only migration found an invalid PDF: $OUTPUT_PDF ($PDF_BYTES bytes)" >&2
              exit 1
            fi

            SHOULD_BUILD=false
            echo "::notice::Archive-only migration selected the latest retained PDF ($EXPECTED_DATE_FOLDER, $PDF_BYTES bytes); source dates are intentionally ignored."
            echo "BUILD_DATE_FOLDER=$REQUESTED_DATE_FOLDER" >> "$GITHUB_ENV"
            echo "EXPECTED_DATE_FOLDER=$EXPECTED_DATE_FOLDER" >> "$GITHUB_ENV"
            echo "SHOULD_BUILD=$SHOULD_BUILD" >> "$GITHUB_ENV"
            exit 0
          fi

          BUILD_DATE_FOLDER="$REQUESTED_DATE_FOLDER"
          PRIMARY_DATE_FOLDER="$REQUESTED_DATE_FOLDER"
          if [ "$PRIMARY_DATE_FOLDER" = "latest" ]; then
            PRIMARY_DATE_FOLDER="$(find xhs_notes/dropbox -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | grep -E '^[0-9]{6,8}$' | sort -n | tail -1)"
          fi
          if ! printf '%s\n' "$PRIMARY_DATE_FOLDER" | grep -Eq '^[0-9]{6,8}$'; then
            echo "Invalid or missing primary bank date folder: $PRIMARY_DATE_FOLDER" >&2
            exit 1
          fi
          if [ -n "$EXPECTED_BANK_DATE" ] && [ "$PRIMARY_DATE_FOLDER" != "$EXPECTED_BANK_DATE" ]; then
            echo "Upstream completed bank date $EXPECTED_BANK_DATE, but latest committed bank date is $PRIMARY_DATE_FOLDER." >&2
            exit 1
          fi

          PRIMARY_DIR="xhs_notes/dropbox/$PRIMARY_DATE_FOLDER"
          if [ ! -d "$PRIMARY_DIR" ]; then
            echo "Primary bank source folder does not exist: $PRIMARY_DIR" >&2
            exit 1
          fi
          REPORT_COUNT="$(find "$PRIMARY_DIR" -type f \( -name source_mineru.md -o -name wechat_article.md -o -name note.md \) -printf '%h\n' | sort -u | wc -l | tr -d ' ')"
          if [ "$REPORT_COUNT" -eq 0 ]; then
            echo "Primary bank source has no parsed report folders: $PRIMARY_DIR" >&2
            exit 1
          fi

          SOURCE_DIRS=()
          if [ "$BUILD_DATE_FOLDER" = "latest" ]; then
            for SOURCE_ROOT in xhs_notes/dropbox xhs_notes/institutions xhs_notes/consulting; do
              LATEST_SOURCE_DATE="$(find "$SOURCE_ROOT" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | grep -E '^[0-9]{6,8}$' | sort -n | tail -1)"
              if [ -n "$LATEST_SOURCE_DATE" ]; then
                SOURCE_DIRS+=("$SOURCE_ROOT/$LATEST_SOURCE_DATE")
              fi
            done
          else
            for SOURCE_ROOT in xhs_notes/dropbox xhs_notes/institutions xhs_notes/consulting; do
              if [ -d "$SOURCE_ROOT/$BUILD_DATE_FOLDER" ]; then
                SOURCE_DIRS+=("$SOURCE_ROOT/$BUILD_DATE_FOLDER")
              fi
            done
          fi
          EXPECTED_DATE_FOLDER="$(printf '%s\n' "${SOURCE_DIRS[@]}" | awk -F/ '{print $NF}' | sort -n | tail -1)"

          OUTPUT_PDF="market_view_summaries/$EXPECTED_DATE_FOLDER/market_views_$EXPECTED_DATE_FOLDER.pdf"
          REPORT_INPUTS="market_view_summaries/$EXPECTED_DATE_FOLDER/report_inputs.json"
          CURRENT_INPUTS_FILE="$RUNNER_TEMP/market_views_current_inputs.txt"
          find "${SOURCE_DIRS[@]}" -type f \( -name source_mineru.md -o -name wechat_article.md -o -name note.md \) -printf '%h\n' | sort -u > "$CURRENT_INPUTS_FILE"
          CURRENT_INPUT_COUNT="$(wc -l < "$CURRENT_INPUTS_FILE" | tr -d ' ')"
          CURRENT_INPUT_HASH="$(sha256sum "$CURRENT_INPUTS_FILE" | cut -d' ' -f1)"
          RECORDED_INPUT_COUNT=0
          RECORDED_INPUT_HASH=""
          if [ -f "$REPORT_INPUTS" ]; then
            read -r RECORDED_INPUT_COUNT RECORDED_INPUT_HASH < <(
              python3 -c 'import hashlib,json,sys; data=json.load(open(sys.argv[1], encoding="utf-8")); paths=sorted({str(item.get("path") or "") for item in data if item.get("path")}); payload="".join(path + "\n" for path in paths).encode(); print(len(paths), hashlib.sha256(payload).hexdigest())' "$REPORT_INPUTS"
            )
          fi

          SHOULD_BUILD=true
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ -f "$OUTPUT_PDF" ]; then
            PDF_BYTES="$(stat -c '%s' "$OUTPUT_PDF")"
            if [ "$PDF_BYTES" -gt 1024 ] && [ "$CURRENT_INPUT_HASH" = "$RECORDED_INPUT_HASH" ]; then
              SHOULD_BUILD=false
              echo "::notice::Source-completion refresh found the exact $EXPECTED_DATE_FOLDER PDF already current with all $CURRENT_INPUT_COUNT parsed reports ($PDF_BYTES bytes); no rebuild needed."
            fi
          fi

          echo "::notice::Primary bank date=$PRIMARY_DATE_FOLDER, expected issue date=$EXPECTED_DATE_FOLDER, parsed bank reports=$REPORT_COUNT, current inputs=$CURRENT_INPUT_COUNT, recorded inputs=$RECORDED_INPUT_COUNT, should_build=$SHOULD_BUILD."
          echo "BUILD_DATE_FOLDER=$BUILD_DATE_FOLDER" >> "$GITHUB_ENV"
          echo "EXPECTED_DATE_FOLDER=$EXPECTED_DATE_FOLDER" >> "$GITHUB_ENV"
          echo "SHOULD_BUILD=$SHOULD_BUILD" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install and test private R2 archiver
        run: |
          python -m pip install boto3
          python scripts/test_upload_market_view_to_r2.py

      - name: Install Python dependencies
        if: ${{ env.SHOULD_BUILD != 'false' }}
        run: |
          pip install -r requirements.txt
          pip install reportlab pillow

      - name: Install Chinese font for fast PDF renderer
        if: ${{ env.SHOULD_BUILD != 'false' }}
        timeout-minutes: 5
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Optionally install minimal LaTeX
        if: ${{ env.SHOULD_BUILD != 'false' && github.event.inputs.compile_latex == 'true' }}
        timeout-minutes: 12
        run: |
          echo "::notice::Installing XeLaTeX only because compile_latex=true. Fast ReportLab PDF is always generated even if this is skipped."
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-recommended texlive-lang-chinese fonts-noto-cjk

      - name: Build market views data and LaTeX source
        if: ${{ env.SHOULD_BUILD != 'false' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ inputs.deepseek_base_url || 'https://api.deepseek.com' }}
        run: |
          set -o pipefail
          MODEL="${{ github.event.inputs.model || 'deepseek-v4-flash' }}"
          BASE_URL="${{ github.event.inputs.deepseek_base_url || 'https://api.deepseek.com' }}"
          COMPILE_LATEX="${{ github.event.inputs.compile_latex || 'false' }}"
          echo "::notice::Building bank-led Market Views with dynamic topic planning and per-section DeepSeek coverage validation."
          python scripts/build_market_views_pdf.py \
            --dropbox-output-root "xhs_notes/dropbox" \
            --extra-roots "xhs_notes/institutions,xhs_notes/consulting" \
            --date-folder "$BUILD_DATE_FOLDER" \
            --output-root "market_view_summaries" \
            --model "$MODEL" \
            --deepseek-base-url "$BASE_URL" \
            --max-reports 0 \
            --per-report-extract-chars 2200 \
            --deepseek-max-tokens 8192 \
            --max-figures 0 \
            --max-selected-figures 0 \
            --max-figures-per-report 5 \
            --max-reports-per-bank-section 12 \
            --max-section-figure-candidates 40 \
            --figures-per-bank-section 4 \
            --max-external-visuals-per-report 0 \
            --compile "$COMPILE_LATEX" 2>&1 | tee market_views_build_progress.log
          RESOLVED_DATE_FOLDER="$(grep -Eo 'MARKET_VIEWS_DATE_FOLDER=[0-9]+' market_views_build_progress.log | tail -1 | cut -d= -f2)"
          if [ -z "$RESOLVED_DATE_FOLDER" ]; then
            echo "Could not resolve generated market_view_summaries date folder." >&2
            exit 1
          fi
          if [ "$RESOLVED_DATE_FOLDER" != "$EXPECTED_DATE_FOLDER" ]; then
            echo "Expected issue date $EXPECTED_DATE_FOLDER but builder resolved $RESOLVED_DATE_FOLDER." >&2
            exit 1
          fi
          echo "::notice::Resolved market views date folder: $RESOLVED_DATE_FOLDER"
          echo "DATE_FOLDER=$RESOLVED_DATE_FOLDER" >> "$GITHUB_ENV"

      - name: Render fast PDF without LaTeX install
        if: ${{ env.SHOULD_BUILD != 'false' }}
        run: |
          set -o pipefail
          echo "::notice::Rendering market_views_<date>.pdf with ReportLab."
          python scripts/render_market_views_reportlab_pdf.py \
            --summary-root "market_view_summaries" \
            --date-folder "$DATE_FOLDER" 2>&1 | tee market_views_pdf_render_progress.log
          find market_view_summaries -name "*.pdf" -print

      - name: Verify PDF exists before upload and commit
        if: ${{ env.SHOULD_BUILD != 'false' }}
        run: |
          PDF_PATH="market_view_summaries/$DATE_FOLDER/market_views_$DATE_FOLDER.pdf"
          if [ ! -f "$PDF_PATH" ]; then
            echo "Expected PDF was not rendered: $PDF_PATH" >&2
            exit 1
          fi
          PDF_BYTES="$(stat -c '%s' "$PDF_PATH")"
          if [ "$PDF_BYTES" -le 1024 ]; then
            echo "Expected PDF is too small: $PDF_PATH ($PDF_BYTES bytes)" >&2
            exit 1
          fi
          echo "::notice::Verified exact Market Views PDF: $PDF_PATH ($PDF_BYTES bytes)."

      - name: Archive exact Market Views PDF in private R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID || '8182ec40eab8c484e11ebf5d6a516fbd' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET || 'kc-desk-notes-pdfs' }}
        run: |
          PDF_PATH="market_view_summaries/$EXPECTED_DATE_FOLDER/market_views_$EXPECTED_DATE_FOLDER.pdf"
          if [ ! -f "$PDF_PATH" ]; then
            echo "Expected Market Views PDF is missing before private archive: $PDF_PATH" >&2
            exit 1
          fi
          echo "::notice::Archiving the exact $EXPECTED_DATE_FOLDER Market Views PDF and backfilling every retained daily PDF."
          ARCHIVED_COUNT=0
          while IFS= read -r -d '' RETAINED_PDF; do
            RETAINED_DATE="$(basename "$(dirname "$RETAINED_PDF")")"
            python scripts/upload_market_view_to_r2.py \
              --date "$RETAINED_DATE" \
              --pdf "$RETAINED_PDF"
            ARCHIVED_COUNT=$((ARCHIVED_COUNT + 1))
          done < <(find market_view_summaries -mindepth 2 -maxdepth 2 -type f -name 'market_views_*.pdf' -print0 | sort -z)
          if [ "$ARCHIVED_COUNT" -lt 1 ]; then
            echo "No Market Views PDFs were found for private archive." >&2
            exit 1
          fi
          echo "::notice::Archived $ARCHIVED_COUNT retained Market Views PDFs."

  migrate-legacy-market-view-artifacts:
    needs: [build-market-views-pdf]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.migrate_legacy_artifacts == true && inputs.confirm_delete_legacy_artifacts == 'MIGRATE_AND_DELETE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout migration scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install and test private R2 archiver
        run: |
          python -m pip install boto3
          python scripts/test_upload_market_view_to_r2.py
          bash -n scripts/migrate_market_view_artifacts_to_r2.sh

      - name: Migrate PDFs and delete legacy public artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM_DELETE_LEGACY_ARTIFACTS: ${{ inputs.confirm_delete_legacy_artifacts }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID || '8182ec40eab8c484e11ebf5d6a516fbd' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET || 'kc-desk-notes-pdfs' }}
        run: bash scripts/migrate_market_view_artifacts_to_r2.sh

  notify-failure:
    needs: [build-market-views-pdf]
    if: ${{ always() && !cancelled() && needs.build-market-views-pdf.result == 'failure' }}
    uses: ./.github/workflows/kcdesk-ops-alert.yml
    with:
      source_workflow: Market views daily PDF
      source_results: build=${{ needs.build-market-views-pdf.result }}
    secrets: inherit
