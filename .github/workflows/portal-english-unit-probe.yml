name: Probe one exact English translation unit
on:
  workflow_dispatch:
    inputs:
      generation:
        description: Exact admitted source generation
        required: true
        type: string
      checkpoint_sha:
        description: Immutable English checkpoint SHA256
        required: true
        type: string
      candidate_id:
        description: Exact incomplete English candidate ID
        required: true
        type: string
      unit_sha:
        description: Exact first uncached failed fragment SHA256
        required: true
        type: string
      mode:
        description: Reproduce actual attempts or compare three equivalent inputs
        required: true
        type: choice
        default: production-sequence
        options:
          - production-sequence
          - equivalent-forms
permissions:
  contents: read
concurrency:
  group: english-unit-probe-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      KC_PUBLIC_REPOSITORY: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'boto3>=1.34,<2' 'requests>=2.31,<3'
      - run: python -B scripts/test_probe_portal_english_unit.py
      - uses: ./.github/actions/setup-offline-translation
        with:
          targets: en
          persist-audit: 'false'
      - name: Probe three verified equivalent inputs without production writes
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          SOURCE_GENERATION: ${{ inputs.generation }}
          CHECKPOINT_SHA: ${{ inputs.checkpoint_sha }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          UNIT_SHA: ${{ inputs.unit_sha }}
          PROBE_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          python -B scripts/probe_portal_english_unit.py \
            --generation "$SOURCE_GENERATION" --checkpoint-sha "$CHECKPOINT_SHA" \
            --candidate-id "$CANDIDATE_ID" --unit-sha "$UNIT_SHA" --mode "$PROBE_MODE" \
            --output "$RUNNER_TEMP/english-unit-probe.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: english-unit-probe-${{ github.run_id }}
          # Only bounded numeric facts, counts and hashes; never model logs or private prose.
          path: ${{ runner.temp }}/english-unit-probe.json
          if-no-files-found: warn
          retention-days: 7
