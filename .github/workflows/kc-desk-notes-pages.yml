name: KC Desk Notes Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/kc-desk-notes-pages.yml"
      - "kc_desk_notes/password_rules.json"
      - "kc_desk_notes/site_src/**"
      - "scripts/build_kc_desk_notes_site.py"
      - "scripts/submit_kcdesk_indexnow.py"
      - "workers/kc-desk-notes-worker/**"
  workflow_dispatch:
    inputs:
      dropbox_root:
        description: "Dropbox root folder containing date-named backup folders"
        required: true
        default: "/zip_backup"
      days:
        description: "Latest Dropbox date folders to scan. 0 scans all current date folders."
        required: true
        default: "0"
      sync_r2:
        description: "Mirror current Dropbox PDFs to private Cloudflare R2"
        required: true
        type: boolean
        default: true
      force_upload:
        description: "Upload current PDFs even if the catalog says they were already mirrored"
        required: true
        type: boolean
        default: false
      storage_limit_gb:
        description: "Archive oldest PDFs when PDF storage exceeds this many GiB. Catalog/search records stay. 0 disables."
        required: true
        default: "8"
      deploy_worker:
        description: "Deploy the Cloudflare Worker when Cloudflare config is available"
        required: true
        type: boolean
        default: true
  schedule:
    # UTC 01:30 = Asia/Shanghai 09:30.
    - cron: "30 1 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kc-desk-notes-pages
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  # Public IndexNow verification key. The build publishes /<key>.txt.
  INDEXNOW_KEY: "201eca2fc32f348cb7280e22b4999524"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment_1.outputs.page_url || steps.deployment_2.outputs.page_url || steps.deployment_3.outputs.page_url || 'https://kcdesk.com' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install requests boto3 pypdf

      - name: Validate site and Worker JavaScript
        id: code_validation
        run: |
          node --check kc_desk_notes/site_src/assets/contact.js
          node --check kc_desk_notes/site_src/assets/app.js
          node --check workers/kc-desk-notes-worker/src/index.js
          node scripts/test_kcdesk_contact_locale.js

      - name: Update catalog and mirror current PDFs to R2
        id: catalog
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID || '8182ec40eab8c484e11ebf5d6a516fbd' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET || 'kc-desk-notes-pdfs' }}
          R2_OBJECT_PREFIX: ${{ vars.R2_OBJECT_PREFIX || 'reports' }}
        run: |
          if [ -f "kc_desk_notes/data/catalog.json" ]; then
            cp "kc_desk_notes/data/catalog.json" "$RUNNER_TEMP/kcdesk-catalog-before.json"
          fi
          SYNC_R2="${{ github.event.inputs.sync_r2 || 'true' }}"
          FORCE_UPLOAD="${{ github.event.inputs.force_upload || 'false' }}"
          EXTRA_ARGS=()
          if [ "$SYNC_R2" = "true" ]; then
            EXTRA_ARGS+=(--sync-r2)
          fi
          if [ "$FORCE_UPLOAD" = "true" ]; then
            EXTRA_ARGS+=(--force-upload)
          fi
          python scripts/kc_desk_notes_catalog.py \
            --dropbox-root "${{ github.event.inputs.dropbox_root || '/zip_backup' }}" \
            --days "${{ github.event.inputs.days || '0' }}" \
            --catalog-path "kc_desk_notes/data/catalog.json" \
            --password-rules "kc_desk_notes/password_rules.json" \
            --r2-prefix "${R2_OBJECT_PREFIX}" \
            --storage-limit-gb "${{ github.event.inputs.storage_limit_gb || '8' }}" \
            "${EXTRA_ARGS[@]}"

      - name: Translate missing report titles
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
        run: |
          python scripts/translate_kc_desk_titles.py \
            --catalog-path "kc_desk_notes/data/catalog.json" \
            --model "$DEEPSEEK_MODEL" \
            --deepseek-base-url "$DEEPSEEK_BASE_URL" \
            --workers 500

      - name: Build static Pages artifact
        env:
          KC_DESK_WORKER_URL: ${{ vars.KC_DESK_WORKER_URL || '/api' }}
          KC_DESK_DOWNLOAD_PASSWORD: ${{ secrets.KC_DESK_DOWNLOAD_PASSWORD }}
          PASSWORD_SECRET: ${{ secrets.PASSWORD_SECRET }}
        run: |
          python scripts/build_kc_desk_notes_site.py \
            --catalog-path "kc_desk_notes/data/catalog.json" \
            --password-rules "kc_desk_notes/password_rules.json" \
            --site-src "kc_desk_notes/site_src" \
            --output-dir "_kc_desk_notes_pages" \
            --worker-base-url "$KC_DESK_WORKER_URL"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _kc_desk_notes_pages

      - name: Deploy GitHub Pages
        id: deployment_1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retrying GitHub Pages deploy
        if: ${{ steps.deployment_1.outcome != 'success' }}
        run: sleep 30

      - name: Deploy GitHub Pages retry 2
        id: deployment_2
        if: ${{ steps.deployment_1.outcome != 'success' }}
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before final GitHub Pages retry
        if: ${{ steps.deployment_1.outcome != 'success' && steps.deployment_2.outcome != 'success' }}
        run: sleep 60

      - name: Deploy GitHub Pages retry 3
        id: deployment_3
        if: ${{ steps.deployment_1.outcome != 'success' && steps.deployment_2.outcome != 'success' }}
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Verify GitHub Pages deployment
        if: ${{ steps.deployment_1.outcome != 'success' && steps.deployment_2.outcome != 'success' && steps.deployment_3.outcome != 'success' }}
        run: |
          echo "GitHub Pages deployment failed after 3 attempts."
          exit 1

      - name: Notify Bing, Yandex, and IndexNow participants
        continue-on-error: true
        run: |
          python scripts/submit_kcdesk_indexnow.py \
            --catalog "kc_desk_notes/data/catalog.json" \
            --previous-catalog "$RUNNER_TEMP/kcdesk-catalog-before.json" \
            --base-url "https://kcdesk.com" \
            --key "$INDEXNOW_KEY"

      - name: Commit persistent catalog and search archive
        run: |
          bash scripts/commit_output_dir.sh "kc_desk_notes/data" "Update KC Desk Notes catalog and search archive" 8

      - name: Prepare Cloudflare Worker deploy config
        id: worker_config
        if: ${{ always() && steps.code_validation.outcome == 'success' }}
        env:
          DEPLOY_WORKER: ${{ github.event.inputs.deploy_worker || 'true' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID || '8182ec40eab8c484e11ebf5d6a516fbd' }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET || vars.R2_BUCKET || 'kc-desk-notes-pdfs' }}
          PASSWORD_SECRET: ${{ secrets.PASSWORD_SECRET }}
          KC_DESK_DOWNLOAD_PASSWORD: ${{ secrets.KC_DESK_DOWNLOAD_PASSWORD }}
          PAGES_URL: ${{ vars.KC_DESK_PAGES_URL || steps.deployment_1.outputs.page_url || steps.deployment_2.outputs.page_url || steps.deployment_3.outputs.page_url || 'https://kcdesk.com' }}
          R2_OBJECT_PREFIX: ${{ vars.R2_OBJECT_PREFIX || 'reports' }}
          NEWSFEED_EMAIL_PROVIDER: ${{ vars.NEWSFEED_EMAIL_PROVIDER || 'cloudflare' }}
        run: |
          if [ "$DEPLOY_WORKER" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Worker deploy disabled by input."
            exit 0
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$R2_BUCKET_NAME" ] || [ -z "$PASSWORD_SECRET" ] || [ -z "$PAGES_URL" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Worker deploy because Cloudflare token/account, R2 bucket, PASSWORD_SECRET, or Pages URL is missing."
            exit 0
          fi
          if grep -q "REPLACE_WITH_SHA256_HASH" kc_desk_notes/password_rules.json && [ -z "$KC_DESK_DOWNLOAD_PASSWORD" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Worker deploy because kc_desk_notes/password_rules.json still contains the placeholder password hash and KC_DESK_DOWNLOAD_PASSWORD is missing."
            exit 0
          fi

          PAGES_URL="$(node -e "const url = new URL(process.env.PAGES_URL); if (url.protocol === 'http:') url.protocol = 'https:'; console.log(url.toString().replace(/\\/$/, ''))")"
          export PAGES_URL
          PAGES_ORIGIN="$(node -e "console.log(new URL(process.env.PAGES_URL).origin)")"
          cat > workers/kc-desk-notes-worker/wrangler.toml <<EOF
          name = "kc-desk-notes-worker"
          main = "src/index.js"
          compatibility_date = "2026-05-01"

          [vars]
          R2_OBJECT_PREFIX = "$R2_OBJECT_PREFIX"
          CATALOG_URL = "$PAGES_URL/data/catalog.json"
          SEARCH_INDEX_URL = "$PAGES_URL/data/search_index.json"
          PASSWORD_RULES_URL = "$PAGES_URL/data/password_rules.json"
          ALLOWED_ORIGIN = "$PAGES_ORIGIN"
          GH_REPO = "$GITHUB_REPOSITORY"
          NEWSFEED_EMAIL_PROVIDER = "$NEWSFEED_EMAIL_PROVIDER"

          [triggers]
          crons = [
            "*/30 * * * *",
            "*/10 17-18 * * *",
            "*/10 23 * * *",
            "*/10 0-3 * * *",
            "*/10 5-6 * * *"
          ]

          [[r2_buckets]]
          binding = "REPORT_BUCKET"
          bucket_name = "$R2_BUCKET_NAME"
          EOF
          if [ "$NEWSFEED_EMAIL_PROVIDER" = "cloudflare" ]; then
            cat >> workers/kc-desk-notes-worker/wrangler.toml <<EOF

          [[send_email]]
          name = "EMAIL"
          EOF
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Deploy Cloudflare Worker
        if: ${{ always() && steps.worker_config.outputs.enabled == 'true' }}
        uses: cloudflare/wrangler-action@v3
        env:
          PASSWORD_SECRET: ${{ secrets.PASSWORD_SECRET }}
          CALC_KEY: ${{ secrets.CALC_KEY }}
          MASTER_KEY: ${{ secrets.KC_DESK_MASTER_KEY || secrets.KC_DESK_DOWNLOAD_PASSWORD }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || secrets.PASSWORD_SECRET || 'unconfigured' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'unconfigured' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'unconfigured' }}
          PADDLE_ENV: ${{ secrets.PADDLE_ENV || vars.PADDLE_ENV || 'production' }}
          PADDLE_CLIENT_TOKEN: ${{ secrets.PADDLE_CLIENT_TOKEN || vars.PADDLE_CLIENT_TOKEN || 'unconfigured' }}
          PADDLE_PRICE_CNY_CENT: ${{ secrets.PADDLE_PRICE_CNY_CENT || vars.PADDLE_PRICE_CNY_CENT || 'unconfigured' }}
          PADDLE_PRICE_REPORT_CNY_CENT: ${{ secrets.PADDLE_PRICE_REPORT_CNY_CENT || vars.PADDLE_PRICE_REPORT_CNY_CENT || 'unconfigured' }}
          PADDLE_PRICE_YEARLY: ${{ secrets.PADDLE_PRICE_YEARLY || vars.PADDLE_PRICE_YEARLY || 'unconfigured' }}
          PADDLE_WEBHOOK_SECRET: ${{ secrets.PADDLE_WEBHOOK_SECRET || 'unconfigured' }}
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN || secrets.GH_DISPATCH_TOKEN || 'unconfigured' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || 'unconfigured' }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
          NEWSFEED_EMAIL_FROM: ${{ secrets.NEWSFEED_EMAIL_FROM || vars.NEWSFEED_EMAIL_FROM || 'KC Desk Newsfeed <newsfeed@kcdesk.com>' }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY || 'unconfigured' }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL || vars.BREVO_SENDER_EMAIL || 'unconfigured' }}
          BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME || vars.BREVO_SENDER_NAME || 'KC Desk Newsfeed' }}
          CLOUDFLARE_EMAIL_ROUTING_API_TOKEN: ${{ secrets.CLOUDFLARE_EMAIL_ROUTING_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN || 'unconfigured' }}
          CLOUDFLARE_EMAIL_ROUTING_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_EMAIL_ROUTING_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID || 'unconfigured' }}
          # External-report preparation token. Optional; the fallback keeps wrangler
          # from pushing an empty secret value.
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN || 'unconfigured' }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID || '8182ec40eab8c484e11ebf5d6a516fbd' }}
          workingDirectory: workers/kc-desk-notes-worker
          command: deploy
          secrets: |
            PASSWORD_SECRET
            CALC_KEY
            MASTER_KEY
            AUTH_SECRET
            SUPABASE_URL
            SUPABASE_SERVICE_ROLE_KEY
            PADDLE_ENV
            PADDLE_CLIENT_TOKEN
            PADDLE_PRICE_CNY_CENT
            PADDLE_PRICE_REPORT_CNY_CENT
            PADDLE_PRICE_YEARLY
            PADDLE_WEBHOOK_SECRET
            GH_READ_TOKEN
            DEEPSEEK_API_KEY
            DEEPSEEK_BASE_URL
            DEEPSEEK_MODEL
            NEWSFEED_EMAIL_FROM
            BREVO_API_KEY
            BREVO_SENDER_EMAIL
            BREVO_SENDER_NAME
            CLOUDFLARE_EMAIL_ROUTING_API_TOKEN
            CLOUDFLARE_EMAIL_ROUTING_ACCOUNT_ID
            GH_DISPATCH_TOKEN
