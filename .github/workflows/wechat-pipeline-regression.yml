name: WeChat pipeline regression

on:
  pull_request:
    paths:
      - "scripts/*wechat*"
      - "scripts/test_post_blog_refresh.py"
      - "scripts/*generation_cost_controls*"
      - "scripts/*generation_checkpoint*"
      - "scripts/*portal_translation_shards*"
      - "scripts/*replay_report_translation_shards*"
      - "scripts/*private_workflow_handoff*"
      - "scripts/*market_views*"
      - "scripts/*native_market_sources*"
      - "scripts/*ocr_numeric_evidence*"
      - "scripts/*ocr_rotated_axis_evidence*"
      - "scripts/*mineru_figure_sources*"
      - "scripts/*consume_legacy_mineru*"
      - "scripts/*recover_durable_mineru_sources*"
      - "scripts/*package_publish_ready_outputs*"
      - ".github/workflows/market-views-latex-pdf.yml"
      - ".github/workflows/market-views-native-recovery.yml"
      - ".github/workflows/market-views-native-reaudit.yml"
      - ".github/workflows/market-views-ocr-field-probe.yml"
      - "scripts/build_portal_translated_reports.py"
      - "scripts/select_macro_trend_pdfs.py"
      - "scripts/check_completed_shard.py"
      - "scripts/*pdf_to_xhs*"
      - "scripts/*mineru_task_ledger*"
      - "scripts/smoke_mineru_ledger.py"
      - ".github/workflows/mineru-checkpoint-canary.yml"
      - "scripts/download_dropbox_latest_pdfs.py"
      - "scripts/test_download_dropbox_latest_pdfs.py"
      - "scripts/*inspect_dropbox_source*"
      - ".github/workflows/dropbox-source-inspect.yml"
      - "scripts/finalize_outputs.py"
      - "scripts/postprocess_podcast.py"
      - "scripts/sensitive_content_guard.py"
      - "scripts/*xhs_draft*"
      - "scripts/*institution_latest*"
      - "scripts/fixtures/institution_sources/**"
      - "scripts/*publish_static_slot*"
      - ".github/workflows/*wechat*"
      - ".github/workflows/dropbox-latest-pdf-to-xhs-sharded.yml"
      - ".github/workflows/replay-report-translation-shards.yml"
      - ".github/workflows/daily-bilingual-podcast-videos.yml"
      - ".github/workflows/portal-chart-historical-backfill.yml"
      - ".github/actions/restore-wechat-diagnostics/**"
  push:
    branches: [main]
    paths:
      - "scripts/*wechat*"
      - "scripts/test_post_blog_refresh.py"
      - "scripts/*generation_cost_controls*"
      - "scripts/*generation_checkpoint*"
      - "scripts/*portal_translation_shards*"
      - "scripts/*replay_report_translation_shards*"
      - "scripts/*private_workflow_handoff*"
      - "scripts/*market_views*"
      - "scripts/*native_market_sources*"
      - "scripts/*ocr_numeric_evidence*"
      - "scripts/*ocr_rotated_axis_evidence*"
      - "scripts/*mineru_figure_sources*"
      - "scripts/*consume_legacy_mineru*"
      - "scripts/*recover_durable_mineru_sources*"
      - "scripts/*package_publish_ready_outputs*"
      - ".github/workflows/market-views-latex-pdf.yml"
      - ".github/workflows/market-views-native-recovery.yml"
      - ".github/workflows/market-views-native-reaudit.yml"
      - ".github/workflows/market-views-ocr-field-probe.yml"
      - "scripts/build_portal_translated_reports.py"
      - "scripts/select_macro_trend_pdfs.py"
      - "scripts/check_completed_shard.py"
      - "scripts/*pdf_to_xhs*"
      - "scripts/*mineru_task_ledger*"
      - "scripts/smoke_mineru_ledger.py"
      - ".github/workflows/mineru-checkpoint-canary.yml"
      - "scripts/download_dropbox_latest_pdfs.py"
      - "scripts/test_download_dropbox_latest_pdfs.py"
      - "scripts/*inspect_dropbox_source*"
      - ".github/workflows/dropbox-source-inspect.yml"
      - "scripts/finalize_outputs.py"
      - "scripts/postprocess_podcast.py"
      - "scripts/sensitive_content_guard.py"
      - "scripts/*xhs_draft*"
      - "scripts/*institution_latest*"
      - "scripts/fixtures/institution_sources/**"
      - "scripts/*publish_static_slot*"
      - ".github/workflows/*wechat*"
      - ".github/workflows/dropbox-latest-pdf-to-xhs-sharded.yml"
      - ".github/workflows/replay-report-translation-shards.yml"
      - ".github/workflows/daily-bilingual-podcast-videos.yml"
      - ".github/workflows/portal-chart-historical-backfill.yml"
      - ".github/actions/restore-wechat-diagnostics/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REQUIRE_MARKET_VIEWS_OCR_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt reportlab pypdf "boto3>=1.37.32,<2"
      - name: Install real cloud OCR regression dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim
          TESSDATA_DIR="$(tesseract --list-langs 2>/dev/null | sed -n '1s/.*"\(.*\)".*/\1/p')"
          test -n "$TESSDATA_DIR"
          test -f "$TESSDATA_DIR/eng.traineddata"
          test -f "$TESSDATA_DIR/chi_sim.traineddata"
          echo "TESSDATA_PREFIX=$TESSDATA_DIR" >> "$GITHUB_ENV"
      - name: Test source discovery, draft verification and static publication
        run: |
          python scripts/test_fetch_institution_latest_pdfs.py
          python scripts/test_source_monitoring.py
          python scripts/test_publish_static_slot.py
          python scripts/test_mineru_task_ledger.py
          python scripts/test_generation_cost_controls.py
          python scripts/test_wechat_editorial_binding.py
          python scripts/test_private_generation_checkpoint.py
          python scripts/test_portal_translation_shards.py
          python scripts/test_replay_report_translation_shards.py
          python scripts/test_private_workflow_handoff.py
          python scripts/test_archive_market_views_originals.py
          python scripts/test_recover_private_wechat_handoff.py
          python scripts/test_market_views_workflow_contract.py
          python scripts/test_market_views_source_dates.py
          python scripts/test_market_views_figures.py
          python scripts/test_mineru_figure_sources.py
          python scripts/test_consume_legacy_mineru.py
          python scripts/test_recover_legacy_market_views_sources.py
          python scripts/test_recover_durable_mineru_sources.py
          python scripts/test_render_market_views_figures.py
          python scripts/test_extract_native_market_sources.py
          python scripts/test_ocr_numeric_evidence.py
          python scripts/test_ocr_rotated_axis_evidence.py
          python scripts/test_audit_market_views_ocr_receipt.py
          python scripts/test_reaudit_market_views_native_sources.py
          python scripts/test_probe_market_views_ocr_fields.py
          python scripts/test_post_blog_refresh.py
          python scripts/test_check_completed_shard.py
          python scripts/test_wechat_output_contract.py
          python scripts/test_wechat_api_verification.py
          python scripts/test_delete_wechat_drafts.py
          python scripts/test_xhs_draft_streaming.py
          python scripts/test_download_dropbox_latest_pdfs.py
          python scripts/test_inspect_dropbox_source.py
          python scripts/test_verify_existing_wechat_drafts.py
          python scripts/test_sensitive_title_guard.py
          python scripts/test_update_blog_archive_from_wechat_drafts.py
