name: WeChat pipeline regression

on:
  pull_request:
    paths:
      - "scripts/*wechat*"
      - "scripts/test_post_blog_refresh.py"
      - "scripts/*generation_cost_controls*"
      - "scripts/*generation_checkpoint*"
      - "scripts/*portal_translation_shards*"
      - "scripts/*replay_report_translation_shards*"
      - "scripts/*private_workflow_handoff*"
      - "scripts/build_portal_translated_reports.py"
      - "scripts/select_macro_trend_pdfs.py"
      - "scripts/check_completed_shard.py"
      - "scripts/*pdf_to_xhs*"
      - "scripts/download_dropbox_latest_pdfs.py"
      - "scripts/test_download_dropbox_latest_pdfs.py"
      - "scripts/finalize_outputs.py"
      - "scripts/postprocess_podcast.py"
      - "scripts/sensitive_content_guard.py"
      - "scripts/*xhs_draft*"
      - "scripts/*institution_latest*"
      - "scripts/fixtures/institution_sources/**"
      - "scripts/*publish_static_slot*"
      - ".github/workflows/*wechat*"
      - ".github/workflows/dropbox-latest-pdf-to-xhs-sharded.yml"
      - ".github/workflows/replay-report-translation-shards.yml"
      - ".github/workflows/daily-bilingual-podcast-videos.yml"
      - ".github/actions/restore-wechat-diagnostics/**"
  push:
    branches: [main]
    paths:
      - "scripts/*wechat*"
      - "scripts/test_post_blog_refresh.py"
      - "scripts/*generation_cost_controls*"
      - "scripts/*generation_checkpoint*"
      - "scripts/*portal_translation_shards*"
      - "scripts/*replay_report_translation_shards*"
      - "scripts/*private_workflow_handoff*"
      - "scripts/build_portal_translated_reports.py"
      - "scripts/select_macro_trend_pdfs.py"
      - "scripts/check_completed_shard.py"
      - "scripts/*pdf_to_xhs*"
      - "scripts/download_dropbox_latest_pdfs.py"
      - "scripts/test_download_dropbox_latest_pdfs.py"
      - "scripts/finalize_outputs.py"
      - "scripts/postprocess_podcast.py"
      - "scripts/sensitive_content_guard.py"
      - "scripts/*xhs_draft*"
      - "scripts/*institution_latest*"
      - "scripts/fixtures/institution_sources/**"
      - "scripts/*publish_static_slot*"
      - ".github/workflows/*wechat*"
      - ".github/workflows/dropbox-latest-pdf-to-xhs-sharded.yml"
      - ".github/workflows/replay-report-translation-shards.yml"
      - ".github/workflows/daily-bilingual-podcast-videos.yml"
      - ".github/actions/restore-wechat-diagnostics/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt reportlab
      - name: Test source discovery, draft verification and static publication
        run: |
          python scripts/test_fetch_institution_latest_pdfs.py
          python scripts/test_source_monitoring.py
          python scripts/test_publish_static_slot.py
          python scripts/test_generation_cost_controls.py
          python scripts/test_wechat_editorial_binding.py
          python scripts/test_private_generation_checkpoint.py
          python scripts/test_portal_translation_shards.py
          python scripts/test_replay_report_translation_shards.py
          python scripts/test_private_workflow_handoff.py
          python scripts/test_recover_private_wechat_handoff.py
          python scripts/test_market_views_workflow_contract.py
          python scripts/test_post_blog_refresh.py
          python scripts/test_check_completed_shard.py
          python scripts/test_wechat_output_contract.py
          python scripts/test_wechat_api_verification.py
          python scripts/test_delete_wechat_drafts.py
          python scripts/test_xhs_draft_streaming.py
          python scripts/test_download_dropbox_latest_pdfs.py
          python scripts/test_verify_existing_wechat_drafts.py
          python scripts/test_sensitive_title_guard.py
          python scripts/test_update_blog_archive_from_wechat_drafts.py
