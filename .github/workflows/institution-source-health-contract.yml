name: Institution source health contract
on:
  pull_request:
    paths:
      - scripts/institution_source_health.py
      - scripts/institution_pending_intake.py
      - scripts/institution_verified_originals.py
      - scripts/test_institution_verified_originals.py
      - scripts/test_institution_reviewed_intake.py
      - institution_feeds/reviewed_originals/**
      - scripts/test_institution_pending_intake.py
      - scripts/test_institution_source_health.py
      - scripts/test_source_monitoring.py
      - scripts/fetch_institution_latest_pdfs.py
      - .github/workflows/institution-latest-pdf-to-wechat.yml
      - .github/workflows/institution-source-health-contract.yml
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'pypdf==6.19.0'
      - run: python3 -B scripts/test_institution_verified_originals.py
      - run: python3 -B scripts/test_institution_reviewed_intake.py
      - run: python3 -B scripts/test_institution_source_health.py
      - run: python3 -B scripts/test_institution_pending_intake.py
      - run: python3 -B scripts/test_fetch_institution_latest_pdfs.py
      - run: python3 -B scripts/test_source_monitoring.py
