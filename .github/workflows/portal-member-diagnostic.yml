name: Portal member read-only diagnostic
on:
  workflow_dispatch:
    inputs:
      username_sha256:
        description: SHA-256 of the selected normalized username; no raw identity
        type: string
        required: true
permissions:
  contents: read
jobs:
  inspect:
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/diagnose_portal_member.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet boto3==1.40.1
      - name: Read selected account and bounded recent outcomes
        env:
          MEMBER_USERNAME_SHA256: ${{ inputs.username_sha256 }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: python scripts/diagnose_portal_member.py
      - uses: actions/upload-artifact@v4
        with:
          name: member-diagnostic-${{ github.run_id }}
          path: member-diagnostic.json
          retention-days: 3
