name: Daily report articles and translations

on:
  workflow_dispatch:
    inputs:
      dropbox_root:
        description: "Dropbox root folder containing date-named backup folders"
        required: true
        default: "/zip_backup"
      dropbox_date_folder:
        description: "Optional exact report batch in YYMMDD or YYYYMMDD; empty uses latest. Batch date may be the previous Beijing day."
        required: false
        default: ""
      replay_source_run_id:
        description: "Manual only: replay an exact prior Daily original artifact; forbids new MinerU submissions and requires force/WeChat off, translations 0"
        required: false
        default: ""
      model:
        description: "DeepSeek model for report classification and content generation"
        required: true
        default: "deepseek-flash"
      deepseek_base_url:
        description: "DeepSeek API base URL"
        required: true
        default: "https://api.deepseek.com"
      mineru_model:
        description: "MinerU model_version, usually vlm or pipeline"
        required: true
        default: "vlm"
      language:
        description: "MinerU OCR language code, e.g. en, ch, ch_server"
        required: true
        default: "en"
      ocr:
        description: "Enable OCR for scanned/image PDFs"
        required: true
        default: "true"
      shard_count:
        description: "Parallel shard count. 40 shards x 5 reports covers 200 reports."
        required: true
        default: "40"
      reports_per_shard:
        description: "Max reports each shard processes"
        required: true
        default: "5"
      batch_size:
        description: "How many PDFs to send to MinerU per batch inside each shard"
        required: true
        default: "5"
      force_reprocess:
        description: "Overwrite existing shard outputs for the latest Dropbox folder"
        required: true
        type: boolean
        default: false
      max_total_reports:
        description: "Max reports after selection. 0 means all selected candidates."
        required: true
        default: "0"
      report_selection_mode:
        description: "Report selection mode: all publishes every downloaded PDF; macro keeps only macro/trend reports."
        required: true
        default: "all"
      wechat_length:
        description: "Target Chinese character count for WeChat article"
        required: true
        default: "1200"
      community_cta:
        description: "CTA style hint; DeepSeek rewrites it naturally for each article"
        required: true
        default: "更新信息参见portal.example.invalid"
      translated_report_count:
        description: "Number of Portal translated Chinese PDF reports to render after shard generation. Use all for every successful MinerU report; 0 disables it."
        required: true
        default: "all"
      wechat_draft_upload:
        description: "Upload generated report articles into WeChat Official Account drafts. Requires WECHAT_MP_APPID/WECHAT_MP_APPSECRET."
        required: true
        type: boolean
        default: true
      wechat_draft_source:
        description: "xhs_notes uploads generated wechat_article.md immediately; portal_translated waits for rendered Portal translated reports."
        required: true
        default: "xhs_notes"
      wechat_freepublish:
        description: "Submit created WeChat drafts for publishing after upload. Requires WeChat freepublish API permission."
        required: true
        type: boolean
        default: false
      wechat_draft_articles_per_draft:
        description: "Number of articles in each WeChat draft item."
        required: true
        default: "8"
      wechat_draft_max_body_chars:
        description: "Approximate visible Chinese character budget for each WeChat draft article."
        required: true
        default: "1200"
      wechat_draft_min_inline_images:
        description: "Minimum body images per WeChat draft article; xhs_notes uses report images, portal_translated can fill missing slots."
        required: true
        default: "3"
      wechat_draft_max_inline_images:
        description: "Max body images uploaded into each WeChat draft article."
        required: true
        default: "3"
      commit_results:
        description: "Legacy compatibility switch. Generated/private outputs are never committed to the public repo."
        required: true
        type: boolean
        default: false
  schedule:
    # 18:00 UTC = 02:00 Asia/Shanghai. Dropbox reports normally arrive by
    # 00:30, leaving a 90-minute readiness buffer before the long stable run.
    # Report batch dates may be one calendar day behind the Beijing run date.
    - cron: "0 18 * * *"

permissions:
  contents: write
  actions: write

env:
  PYTHONUNBUFFERED: "1"
  PRIVATE_HANDOFF_ROOT: "_private-workflow-handoff/xhs"

concurrency:
  group: final-pdf-to-xhs-notes
  cancel-in-progress: false

jobs:
  resolve-inputs:
    runs-on: ubuntu-latest
    outputs:
      replay_source_run_id: ${{ steps.vars.outputs.replay_source_run_id }}
      forbid_new_submissions: ${{ steps.vars.outputs.forbid_new_submissions }}
      dropbox_root: ${{ steps.vars.outputs.dropbox_root }}
      dropbox_date_folder: ${{ steps.vars.outputs.dropbox_date_folder }}
      expected_dropbox_date_folder: ${{ steps.vars.outputs.expected_dropbox_date_folder }}
      model: ${{ steps.vars.outputs.model }}
      deepseek_base_url: ${{ steps.vars.outputs.deepseek_base_url }}
      mineru_model: ${{ steps.vars.outputs.mineru_model }}
      language: ${{ steps.vars.outputs.language }}
      ocr: ${{ steps.vars.outputs.ocr }}
      shard_count: ${{ steps.vars.outputs.shard_count }}
      reports_per_shard: ${{ steps.vars.outputs.reports_per_shard }}
      batch_size: ${{ steps.vars.outputs.batch_size }}
      force_reprocess: ${{ steps.vars.outputs.force_reprocess }}
      max_total_reports: ${{ steps.vars.outputs.max_total_reports }}
      report_selection_mode: ${{ steps.vars.outputs.report_selection_mode }}
      wechat_length: ${{ steps.vars.outputs.wechat_length }}
      community_cta: ${{ steps.vars.outputs.community_cta }}
      translated_report_count: ${{ steps.vars.outputs.translated_report_count }}
      wechat_draft_upload: ${{ steps.vars.outputs.wechat_draft_upload }}
      wechat_draft_source: ${{ steps.vars.outputs.wechat_draft_source }}
      wechat_freepublish: ${{ steps.vars.outputs.wechat_freepublish }}
      wechat_draft_articles_per_draft: ${{ steps.vars.outputs.wechat_draft_articles_per_draft }}
      wechat_draft_max_body_chars: ${{ steps.vars.outputs.wechat_draft_max_body_chars }}
      wechat_draft_min_inline_images: ${{ steps.vars.outputs.wechat_draft_min_inline_images }}
      wechat_draft_max_inline_images: ${{ steps.vars.outputs.wechat_draft_max_inline_images }}
      commit_results: ${{ steps.vars.outputs.commit_results }}
    steps:
      - name: Resolve workflow inputs
        id: vars
        env:
          REPLAY_SOURCE_RUN_ID: ${{ github.event.inputs.replay_source_run_id }}
          REPLAY_DATE: ${{ github.event.inputs.dropbox_date_folder }}
          REPLAY_FORCE: ${{ github.event.inputs.force_reprocess }}
          REPLAY_WECHAT: ${{ github.event.inputs.wechat_draft_upload }}
          REPLAY_TRANSLATIONS: ${{ github.event.inputs.translated_report_count }}
          REPLAY_LIMIT: ${{ github.event.inputs.max_total_reports }}
        run: |
          FORBID_NEW_SUBMISSIONS=0
          if [ -n "$REPLAY_SOURCE_RUN_ID" ]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REF" = refs/heads/main
            [[ "$REPLAY_SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
            case "$REPLAY_DATE" in *[!0-9]*|'') exit 1 ;; esac
            case "${#REPLAY_DATE}" in 6|8) ;; *) exit 1 ;; esac
            test "$REPLAY_FORCE" = false
            test "$REPLAY_WECHAT" = false
            test "$REPLAY_TRANSLATIONS" = 0
            test "$REPLAY_LIMIT" = 0
            FORBID_NEW_SUBMISSIONS=1
          fi
          echo "replay_source_run_id=$REPLAY_SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "forbid_new_submissions=$FORBID_NEW_SUBMISSIONS" >> "$GITHUB_OUTPUT"
          echo "dropbox_root=${{ github.event.inputs.dropbox_root || '/zip_backup' }}" >> "$GITHUB_OUTPUT"
          echo "dropbox_date_folder=${{ github.event.inputs.dropbox_date_folder || '' }}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] || [ -z "${{ github.event.inputs.dropbox_date_folder }}" ]; then
            echo "expected_dropbox_date_folder=$(TZ=Asia/Shanghai date +%y%m%d)" >> "$GITHUB_OUTPUT"
          else
            echo "expected_dropbox_date_folder=" >> "$GITHUB_OUTPUT"
          fi
          echo "model=${{ github.event.inputs.model || 'deepseek-flash' }}" >> "$GITHUB_OUTPUT"
          echo "deepseek_base_url=${{ github.event.inputs.deepseek_base_url || 'https://api.deepseek.com' }}" >> "$GITHUB_OUTPUT"
          echo "mineru_model=${{ github.event.inputs.mineru_model || 'vlm' }}" >> "$GITHUB_OUTPUT"
          echo "language=${{ github.event.inputs.language || 'en' }}" >> "$GITHUB_OUTPUT"
          echo "ocr=${{ github.event.inputs.ocr || 'true' }}" >> "$GITHUB_OUTPUT"
          echo "shard_count=${{ github.event.inputs.shard_count || '40' }}" >> "$GITHUB_OUTPUT"
          echo "reports_per_shard=${{ github.event.inputs.reports_per_shard || '5' }}" >> "$GITHUB_OUTPUT"
          echo "batch_size=${{ github.event.inputs.batch_size || '5' }}" >> "$GITHUB_OUTPUT"
          echo "force_reprocess=${{ github.event.inputs.force_reprocess || 'false' }}" >> "$GITHUB_OUTPUT"
          echo "max_total_reports=${{ github.event.inputs.max_total_reports || '0' }}" >> "$GITHUB_OUTPUT"
          echo "report_selection_mode=${{ github.event.inputs.report_selection_mode || 'all' }}" >> "$GITHUB_OUTPUT"
          echo "wechat_length=${{ github.event.inputs.wechat_length || '1200' }}" >> "$GITHUB_OUTPUT"
          echo "community_cta=${{ github.event.inputs.community_cta || '更新信息参见portal.example.invalid' }}" >> "$GITHUB_OUTPUT"
          echo "translated_report_count=${{ github.event.inputs.translated_report_count || 'all' }}" >> "$GITHUB_OUTPUT"
          echo "wechat_draft_upload=${{ github.event.inputs.wechat_draft_upload || 'true' }}" >> "$GITHUB_OUTPUT"
          echo "wechat_draft_source=${{ github.event.inputs.wechat_draft_source || 'xhs_notes' }}" >> "$GITHUB_OUTPUT"
          echo "wechat_freepublish=${{ github.event.inputs.wechat_freepublish || 'false' }}" >> "$GITHUB_OUTPUT"
          echo "wechat_draft_articles_per_draft=${{ github.event.inputs.wechat_draft_articles_per_draft || '8' }}" >> "$GITHUB_OUTPUT"
          echo "wechat_draft_max_body_chars=${{ github.event.inputs.wechat_draft_max_body_chars || '1200' }}" >> "$GITHUB_OUTPUT"
          echo "wechat_draft_min_inline_images=${{ github.event.inputs.wechat_draft_min_inline_images || '3' }}" >> "$GITHUB_OUTPUT"
          echo "wechat_draft_max_inline_images=${{ github.event.inputs.wechat_draft_max_inline_images || '3' }}" >> "$GITHUB_OUTPUT"
          echo "commit_results=${{ github.event.inputs.commit_results || 'false' }}" >> "$GITHUB_OUTPUT"
      - name: Print resolved plan
        run: |
          echo "::notice::Daily schedule is 02:00 Asia/Shanghai, 90 minutes after the usual 00:30 Dropbox readiness time. XHS, Xianyu, podcast copy and podcast audio/video are disabled."
          if [ -n "${{ steps.vars.outputs.expected_dropbox_date_folder }}" ]; then
            echo "::notice::Latest-source runs require the latest Dropbox batch within one calendar day of Beijing run date ${{ steps.vars.outputs.expected_dropbox_date_folder }}; older or future-dated batches fail closed."
          fi
          echo "::notice::Report selection mode=${{ steps.vars.outputs.report_selection_mode }}. Default all mode keeps stock/company reports for long-tail WeChat search."
          echo "::notice::Default plan processes ALL selected candidates, sharded as 40 x 5 = up to 200 reports."
          echo "::notice::WeChat draft upload defaults to xhs_notes, so successful MinerU report articles can enter drafts without waiting for Portal translated PDFs."
          echo "::notice::WeChat freepublish is opt-in because it requires separate Official Account API permission."
          echo "::notice::At the end, publish-ready split ZIPs will be created from generated report folders, excluding MinerU raw files."

  select-macro-reports:
    needs: resolve-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      latest_folder: ${{ steps.replay.outputs.latest_folder || steps.dropbox.outputs.latest_folder }}
      pdf_count: ${{ steps.replay.outputs.pdf_count || steps.dropbox.outputs.pdf_count }}
      macro_candidate_count: ${{ steps.replay.outputs.candidate_count || steps.select_macro.outputs.candidate_count }}
      selected_count: ${{ steps.replay.outputs.process_count || steps.select_macro.outputs.process_count }}
      shard_indices: ${{ steps.shard_matrix.outputs.shard_indices }}
      effective_shard_count: ${{ steps.shard_matrix.outputs.effective_shard_count }}
    steps:
      - name: Initialize DeepSeek usage ledger
        shell: bash
        run: |
          usage_dir="$(mktemp -d "$RUNNER_TEMP/deepseek-usage.XXXXXX")"
          usage_dir="$(cd "$usage_dir" && pwd -P)"
          echo "DEEPSEEK_USAGE_DIR=$usage_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            scripts
            prompts
            requirements.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Test Dropbox download retries
        run: python scripts/test_download_dropbox_latest_pdfs.py
      - name: Download PDFs from latest Dropbox date folder
        if: ${{ needs.resolve-inputs.outputs.replay_source_run_id == '' }}
        id: dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          REQUESTED_DATE="${{ needs.resolve-inputs.outputs.dropbox_date_folder }}"
          EXPECTED_DATE="${{ needs.resolve-inputs.outputs.expected_dropbox_date_folder }}"
          if [ -n "$REQUESTED_DATE" ]; then
            echo "::notice::Downloading exact Dropbox date folder $REQUESTED_DATE once for report selection."
          else
            echo "::notice::Downloading latest Dropbox PDFs once for report selection."
          fi
          python scripts/download_dropbox_latest_pdfs.py \
            --dropbox-root "${{ needs.resolve-inputs.outputs.dropbox_root }}" \
            --date-folder "$REQUESTED_DATE" \
            --expected-date-folder "$EXPECTED_DATE" \
            --max-folder-age-days 1 \
            --output-dir "_dropbox_latest_pdfs"
      - name: Authenticate exact frozen Daily source
        if: ${{ needs.resolve-inputs.outputs.replay_source_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPLAY_SOURCE_RUN_ID: ${{ needs.resolve-inputs.outputs.replay_source_run_id }}
          REPLAY_DATE: ${{ needs.resolve-inputs.outputs.dropbox_date_folder }}
        run: python scripts/replay_daily_sources.py origin
      - name: Download frozen selected original PDFs
        if: ${{ needs.resolve-inputs.outputs.replay_source_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: selected-macro-pdfs-${{ needs.resolve-inputs.outputs.replay_source_run_id }}
          run-id: ${{ needs.resolve-inputs.outputs.replay_source_run_id }}
          github-token: ${{ github.token }}
          path: _selected_macro_pdfs
      - name: Verify every frozen original byte and replay provenance
        id: replay
        if: ${{ needs.resolve-inputs.outputs.replay_source_run_id != '' }}
        env:
          REPLAY_SOURCE_RUN_ID: ${{ needs.resolve-inputs.outputs.replay_source_run_id }}
          REPLAY_DATE: ${{ needs.resolve-inputs.outputs.dropbox_date_folder }}
          REPLAY_ROOT: ${{ needs.resolve-inputs.outputs.dropbox_root }}
        run: python scripts/replay_daily_sources.py selection
      - name: Select reports with DeepSeek
        if: ${{ needs.resolve-inputs.outputs.replay_source_run_id == '' }}
        id: select_macro
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_SELECTION_API_KEY }}
          DEEPSEEK_USAGE_STAGE: selection
          DEEPSEEK_API_KEY_BACKUP: ""
          DEEPSEEK_BASE_URL: ${{ needs.resolve-inputs.outputs.deepseek_base_url }}
        run: |
          set -o pipefail
          CANDIDATE_COUNT="${{ needs.resolve-inputs.outputs.max_total_reports }}"
          if [ "$CANDIDATE_COUNT" = "0" ]; then CANDIDATE_COUNT="9999"; fi
          echo "::notice::Classifying PDFs with DeepSeek. Selection mode=${{ needs.resolve-inputs.outputs.report_selection_mode }}; candidate cap=$CANDIDATE_COUNT."
          python scripts/select_macro_trend_pdfs.py \
            --input-dir "_dropbox_latest_pdfs" \
            --output-dir "_selected_macro_pdfs" \
            --candidate-count "$CANDIDATE_COUNT" \
            --process-count "$CANDIDATE_COUNT" \
            --selection-mode "${{ needs.resolve-inputs.outputs.report_selection_mode }}" \
            --model "${{ needs.resolve-inputs.outputs.model }}" \
            --deepseek-base-url "${{ needs.resolve-inputs.outputs.deepseek_base_url }}" 2>&1 | tee "macro_selection_progress.log"
          cp "macro_selection_progress.log" "_selected_macro_pdfs/macro_selection_progress.log"
      - name: Print selection result
        run: |
          echo "::notice::Latest Dropbox folder=${{ steps.replay.outputs.latest_folder || steps.dropbox.outputs.latest_folder }}, pdf_count=${{ steps.replay.outputs.pdf_count || steps.dropbox.outputs.pdf_count }}."
          echo "::notice::Report candidates=${{ steps.replay.outputs.candidate_count || steps.select_macro.outputs.candidate_count }}, selected=${{ steps.replay.outputs.process_count || steps.select_macro.outputs.process_count }}."
      - name: Compute shard matrix
        id: shard_matrix
        env:
          SELECTED_COUNT: ${{ steps.replay.outputs.process_count || steps.select_macro.outputs.process_count }}
          SHARD_COUNT: ${{ needs.resolve-inputs.outputs.shard_count }}
          REPORTS_PER_SHARD: ${{ needs.resolve-inputs.outputs.reports_per_shard }}
        run: |
          python - <<'PY'
          import json
          import math
          import os

          selected = max(0, int(os.getenv("SELECTED_COUNT") or "0"))
          shard_count = max(1, int(os.getenv("SHARD_COUNT") or "1"))
          reports_per_shard = max(1, int(os.getenv("REPORTS_PER_SHARD") or "1"))
          needed = max(1, math.ceil(selected / reports_per_shard))
          effective = min(shard_count, needed)
          indices = list(range(effective))
          output = os.environ["GITHUB_OUTPUT"]
          with open(output, "a", encoding="utf-8") as f:
              f.write(f"shard_indices={json.dumps(indices)}\n")
              f.write(f"effective_shard_count={effective}\n")
          print(f"Selected {selected} PDF(s); running shard indices {indices}.")
          PY
      - name: Upload selected macro PDFs artifact
        uses: actions/upload-artifact@v4
        with:
          name: selected-macro-pdfs-${{ github.run_id }}
          path: _selected_macro_pdfs
          if-no-files-found: error
      - name: Upload lightweight selection manifest
        uses: actions/upload-artifact@v4
        with:
          name: selected-macro-manifest-${{ github.run_id }}
          path: _selected_macro_pdfs/selected_to_process_manifest.json
          if-no-files-found: error

      - name: Summarize DeepSeek usage
        if: ${{ always() && hashFiles('scripts/summarize_deepseek_usage.py') != '' }}
        run: |
          python scripts/summarize_deepseek_usage.py \
            --input-dir "$DEEPSEEK_USAGE_DIR" \
            --output "$DEEPSEEK_USAGE_DIR/summary.json" \
            --markdown "$DEEPSEEK_USAGE_DIR/summary.md" \
            --github-summary
      - name: Upload DeepSeek usage
        if: ${{ always() && hashFiles('.github/actions/resilient-diagnostic-artifact/action.yml') != '' }}
        uses: ./.github/actions/resilient-diagnostic-artifact
        with:
          name: deepseek-usage-${{ github.job }}-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DEEPSEEK_USAGE_DIR }}
          if-no-files-found: error
          retention-days: 30

  process-shard:
    needs: [resolve-inputs, select-macro-reports]
    # The final delivery gate accepts a verified, labelled source edition when
    # parsing is unavailable. Actual matrix step failures remain inspectable.
    continue-on-error: true
    env:
      OUTPUT_DIR: xhs_notes/dropbox/${{ needs.select-macro-reports.outputs.latest_folder }}/shard_${{ matrix.shard_index }}
      GENERATION_OPTIONS_JSON: ${{ toJSON(needs.resolve-inputs.outputs) }}
      MINERU_FORBID_NEW_SUBMISSIONS: ${{ needs.resolve-inputs.outputs.forbid_new_submissions }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard_index: ${{ fromJson(needs.select-macro-reports.outputs.shard_indices) }}
    steps:
      - name: Initialize DeepSeek usage ledger
        shell: bash
        run: |
          usage_dir="$(mktemp -d "$RUNNER_TEMP/deepseek-usage.XXXXXX")"
          usage_dir="$(cd "$usage_dir" && pwd -P)"
          echo "DEEPSEEK_USAGE_DIR=$usage_dir" >> "$GITHUB_ENV"
      - name: Gate shard
        id: gate
        run: |
          if [ "${{ matrix.shard_index }}" -ge "${{ needs.resolve-inputs.outputs.shard_count }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Shard ${{ matrix.shard_index }} skipped because shard_count=${{ needs.resolve-inputs.outputs.shard_count }}."
          elif [ $(( ${{ matrix.shard_index }} * ${{ needs.resolve-inputs.outputs.reports_per_shard }} )) -ge "${{ needs.select-macro-reports.outputs.selected_count }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Shard ${{ matrix.shard_index }} skipped because selected_count=${{ needs.select-macro-reports.outputs.selected_count }}."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "SHARD_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
            echo "::notice::Shard ${{ matrix.shard_index }} started."
          fi
      - name: Checkout repository
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            scripts
            prompts
            requirements.txt
            xhs_notes/dropbox/${{ needs.select-macro-reports.outputs.latest_folder }}/shard_${{ matrix.shard_index }}
      - name: Download lightweight selection manifest
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: selected-macro-manifest-${{ github.run_id }}
          path: _selected_macro_manifest
      - name: Set up Python
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install private checkpoint dependency
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: python -m pip install "boto3>=1.37.32,<2"
      - name: Restore source-matched private generation checkpoint
        id: generation_checkpoint
        if: ${{ steps.gate.outputs.run == 'true' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          python scripts/private_generation_checkpoint.py restore \
            --date-folder "${{ needs.select-macro-reports.outputs.latest_folder }}" \
            --shard-index "${{ matrix.shard_index }}" \
            --reports-per-shard "${{ needs.resolve-inputs.outputs.reports_per_shard }}" \
            --manifest "_selected_macro_manifest/selected_to_process_manifest.json" \
            --directory "$OUTPUT_DIR" \
            --force-reprocess "${{ needs.resolve-inputs.outputs.force_reprocess }}"
      - name: Check for a matching completed shard
        id: completed
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          python scripts/check_completed_shard.py \
            --output-dir "xhs_notes/dropbox/${{ needs.select-macro-reports.outputs.latest_folder }}/shard_${{ matrix.shard_index }}" \
            --current-manifest "_selected_macro_manifest/selected_to_process_manifest.json" \
            --shard-index "${{ matrix.shard_index }}" \
            --selected-count "${{ needs.select-macro-reports.outputs.selected_count }}" \
            --reports-per-shard "${{ needs.resolve-inputs.outputs.reports_per_shard }}" \
            --force-reprocess "${{ needs.resolve-inputs.outputs.force_reprocess }}"
      - name: Reuse completed shard
        if: ${{ steps.gate.outputs.run == 'true' && steps.completed.outputs.complete == 'true' }}
        run: echo "::notice::Shard ${{ matrix.shard_index }} is already complete; ${{ steps.completed.outputs.reason }}."
      - name: Install Chinese fonts for cover images
        if: ${{ steps.gate.outputs.run == 'true' && steps.completed.outputs.complete != 'true' }}
        timeout-minutes: 5
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-arphic-ukai
      - name: Install Python dependencies
        if: ${{ steps.gate.outputs.run == 'true' && steps.completed.outputs.complete != 'true' }}
        run: |
          pip install -r requirements.txt
      - name: Download selected macro PDFs artifact
        if: ${{ steps.gate.outputs.run == 'true' && steps.completed.outputs.complete != 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: selected-macro-pdfs-${{ github.run_id }}
          path: _selected_macro_pdfs
      - name: Generate shard outputs
        id: generate
        if: ${{ steps.gate.outputs.run == 'true' && steps.completed.outputs.complete != 'true' }}
        env:
          MINERU_LEDGER_BACKEND: r2
          MINERU_CHECKPOINT_SCOPE: dropbox
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
          MINER_U: ${{ secrets.MINER_U }}
          MINER_U_2: ${{ secrets.MINER_U_2 }}
          MINER_U_3: ${{ secrets.MINER_U_3 }}
          MINER_U_4: ${{ secrets.MINER_U_4 }}
          MINER_U_TOKEN_OFFSET: ${{ matrix.shard_index }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_REPORT_NOTES_API_KEY }}
          DEEPSEEK_USAGE_STAGE: report-notes
          DEEPSEEK_API_KEY_BACKUP: ""
          DEEPSEEK_BASE_URL: ${{ needs.resolve-inputs.outputs.deepseek_base_url }}
        run: |
          set -o pipefail
          OUTPUT_DIR="xhs_notes/dropbox/${{ needs.select-macro-reports.outputs.latest_folder }}/shard_${{ matrix.shard_index }}"
          echo "OUTPUT_DIR=$OUTPUT_DIR" >> "$GITHUB_ENV"
          SKIP_EXISTING="true"
          if [ "${{ needs.resolve-inputs.outputs.force_reprocess }}" = "true" ]; then
            rm -rf "$OUTPUT_DIR"
            SKIP_EXISTING="false"
          fi
          mkdir -p "$OUTPUT_DIR"
          # A restored prior attempt's provider failure cannot attest this attempt.
          rm -f -- "$OUTPUT_DIR/batch_run_summary.json"
          cp "_selected_macro_pdfs/macro_classification_all.json" "$OUTPUT_DIR/macro_classification_all.json" || true
          cp "_selected_macro_pdfs/selected_macro_candidates.json" "$OUTPUT_DIR/selected_macro_candidates.json" || true
          cp "_selected_macro_pdfs/selected_to_process_manifest.json" "$OUTPUT_DIR/selected_to_process_manifest.json" || true
          cp "_selected_macro_pdfs/macro_selection_progress.log" "$OUTPUT_DIR/macro_selection_progress.log" || true
          echo "::notice::Shard ${{ matrix.shard_index }} generating text/images from selected reports into $OUTPUT_DIR."
          python scripts/run_pdf_to_xhs_in_batches.py \
            --input-dir "_selected_macro_pdfs" \
            --output-dir "$OUTPUT_DIR" \
            --batch-size "${{ needs.resolve-inputs.outputs.batch_size }}" \
            --continue-on-batch-error true \
            --shard-index "${{ matrix.shard_index }}" \
            --shard-count "${{ needs.resolve-inputs.outputs.shard_count }}" \
            --max-reports-per-shard "${{ needs.resolve-inputs.outputs.reports_per_shard }}" \
            --max-total-reports "${{ needs.resolve-inputs.outputs.max_total_reports }}" \
            --skip-existing "$SKIP_EXISTING" \
            --model "${{ needs.resolve-inputs.outputs.model }}" \
            --deepseek-base-url "${{ needs.resolve-inputs.outputs.deepseek_base_url }}" \
            --mineru-model "${{ needs.resolve-inputs.outputs.mineru_model }}" \
            --language "${{ needs.resolve-inputs.outputs.language }}" \
            --ocr "${{ needs.resolve-inputs.outputs.ocr }}" \
            --poll-timeout 1800 \
            --mineru-retries 0 \
            --mineru-no-progress-timeout 300 \
            --length 1000 \
            --wechat-length "${{ needs.resolve-inputs.outputs.wechat_length }}" \
            --community-cta "${{ needs.resolve-inputs.outputs.community_cta }}" 2>&1 | tee "$OUTPUT_DIR/generate_progress.log"
      - name: Confirm provider-only source degradation
        if: ${{ always() && steps.generate.outcome == 'failure' }}
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from daily_market_source_status import require_provider_only_failure
          summary = json.loads((Path(os.environ['OUTPUT_DIR']) / 'batch_run_summary.json').read_text())
          count = require_provider_only_failure(summary)
          print(f'::warning::{count} MinerU failure(s); completed tasks retained. Backup PDF may proceed.')
          PY
      - name: Attach original images without additional copy generation
        if: ${{ steps.gate.outputs.run == 'true' && steps.completed.outputs.complete != 'true' }}
        env:
          DEEPSEEK_API_KEY: ""
          DEEPSEEK_API_KEY_BACKUP: ""
          DEEPSEEK_BASE_URL: ${{ needs.resolve-inputs.outputs.deepseek_base_url }}
        run: |
          set -o pipefail
          python scripts/postprocess_podcast.py \
            --output-dir "$OUTPUT_DIR" \
            --model "${{ needs.resolve-inputs.outputs.model }}" \
            --deepseek-base-url "${{ needs.resolve-inputs.outputs.deepseek_base_url }}" \
            --generate-english-article false \
            --generate-podcast false \
            --generate-audio false \
            --tts-engine edge 2>&1 | tee "$OUTPUT_DIR/postprocess_progress.log"
      - name: Finalize shard outputs
        if: ${{ steps.gate.outputs.run == 'true' && steps.completed.outputs.complete != 'true' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_FINALIZE_API_KEY }}
          DEEPSEEK_USAGE_STAGE: finalize
          DEEPSEEK_API_KEY_BACKUP: ""
          DEEPSEEK_BASE_URL: ${{ needs.resolve-inputs.outputs.deepseek_base_url }}
        run: |
          set -o pipefail
          python scripts/finalize_outputs.py \
            --output-dir "$OUTPUT_DIR" \
            --model "${{ needs.resolve-inputs.outputs.model }}" \
            --deepseek-base-url "${{ needs.resolve-inputs.outputs.deepseek_base_url }}" \
            --generate-xianyu false 2>&1 | tee "$OUTPUT_DIR/finalize_progress.log"
      - name: Write shard summary
        id: shard_summary
        if: ${{ steps.gate.outputs.run == 'true' && steps.completed.outputs.complete != 'true' }}
        run: |
          ENDED_AT=$(date +%s)
          DURATION=$((ENDED_AT - SHARD_STARTED_AT))
          REPORT_DIRS=$(find "$OUTPUT_DIR" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          cat > "$OUTPUT_DIR/shard_run_summary.md" <<EOF
          # Shard ${{ matrix.shard_index }} summary

          - Latest Dropbox folder: ${{ needs.select-macro-reports.outputs.latest_folder }}
          - Dropbox PDF count before selection: ${{ needs.select-macro-reports.outputs.pdf_count }}
          - Report candidates selected: ${{ needs.select-macro-reports.outputs.macro_candidate_count }}
          - Selected PDFs available to shards: ${{ needs.select-macro-reports.outputs.selected_count }}
          - Shard index: ${{ matrix.shard_index }}
          - Shard count: ${{ needs.resolve-inputs.outputs.shard_count }}
          - Reports per shard: ${{ needs.resolve-inputs.outputs.reports_per_shard }}
          - Batch size: ${{ needs.resolve-inputs.outputs.batch_size }}
          - Report directories generated: $REPORT_DIRS
          - XHS, Xianyu and podcast copy/audio/video generation: disabled
          - Duration seconds: $DURATION
          - Output directory: $OUTPUT_DIR
          EOF
          cat "$OUTPUT_DIR/shard_run_summary.md"
          echo "::notice::Shard ${{ matrix.shard_index }} finished in $((DURATION / 60)) minutes with $REPORT_DIRS output directories."
      - name: Save private generation checkpoint including partial progress
        if: ${{ always() && steps.generation_checkpoint.outcome == 'success' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          python scripts/private_generation_checkpoint.py save \
            --date-folder "${{ needs.select-macro-reports.outputs.latest_folder }}" \
            --shard-index "${{ matrix.shard_index }}" \
            --reports-per-shard "${{ needs.resolve-inputs.outputs.reports_per_shard }}" \
            --manifest "_selected_macro_manifest/selected_to_process_manifest.json" \
            --directory "$OUTPUT_DIR" \
            --complete "${{ steps.completed.outputs.complete == 'true' || steps.shard_summary.outcome == 'success' }}"
      - name: Upload shard to private R2 handoff
        if: ${{ steps.gate.outputs.run == 'true' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          python scripts/private_workflow_handoff.py upload-dir \
            --source "$OUTPUT_DIR" \
            --key "$PRIVATE_HANDOFF_ROOT/${{ github.run_id }}/${{ needs.select-macro-reports.outputs.latest_folder }}/shard_${{ matrix.shard_index }}.tar.gz"
      - name: Upload lightweight shard diagnostics
        if: ${{ always() && steps.gate.outputs.run == 'true' && steps.completed.outputs.complete != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: final-dropbox-shard-diagnostics-${{ needs.select-macro-reports.outputs.latest_folder }}-${{ matrix.shard_index }}
          path: |
            ${{ env.OUTPUT_DIR }}/*.log
            ${{ env.OUTPUT_DIR }}/*.json
            ${{ env.OUTPUT_DIR }}/shard_run_summary.md
          if-no-files-found: warn
          retention-days: 2

      - name: Summarize DeepSeek usage
        if: ${{ always() && hashFiles('scripts/summarize_deepseek_usage.py') != '' }}
        run: |
          python scripts/summarize_deepseek_usage.py \
            --input-dir "$DEEPSEEK_USAGE_DIR" \
            --output "$DEEPSEEK_USAGE_DIR/summary.json" \
            --markdown "$DEEPSEEK_USAGE_DIR/summary.md" \
            --github-summary
      - name: Upload DeepSeek usage
        if: ${{ always() && hashFiles('.github/actions/resilient-diagnostic-artifact/action.yml') != '' }}
        uses: ./.github/actions/resilient-diagnostic-artifact
        with:
          name: deepseek-usage-${{ github.job }}-shard-${{ matrix.shard_index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DEEPSEEK_USAGE_DIR }}
          if-no-files-found: error
          retention-days: 30

  source-outcome:
    needs: [select-macro-reports, process-shard]
    if: ${{ always() && !cancelled() && needs.select-macro-reports.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      primary_ready: ${{ steps.status.outputs.primary_ready }}
      degraded_shards: ${{ steps.status.outputs.degraded_shards }}
      provider_only: ${{ steps.status.outputs.provider_only }}
      no_work: ${{ steps.status.outputs.no_work }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/daily_market_source_status.py
          sparse-checkout-cone-mode: false
      - name: Read actual shard outcomes and exact handoff gates
        id: status
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHARDS: ${{ needs.select-macro-reports.outputs.effective_shard_count }}
          SELECTED_COUNT: ${{ needs.select-macro-reports.outputs.selected_count }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" > "$RUNNER_TEMP/daily-jobs.json"
          python3 scripts/daily_market_source_status.py \
            --jobs "$RUNNER_TEMP/daily-jobs.json" --expected-shards "$EXPECTED_SHARDS" --selected-count "$SELECTED_COUNT" \
            --run-id "$GITHUB_RUN_ID" --execution-sha "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  package-publish-ready:
    # ZIP packaging and direct R2 consumers are sibling branches. Only actual
    # artifact consumers should depend on packaging; all must finish before cleanup.
    needs: [resolve-inputs, select-macro-reports, process-shard, source-outcome]
    if: ${{ !cancelled() && needs.process-shard.result == 'success' && needs.source-outcome.outputs.primary_ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            scripts
            requirements.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install private handoff dependency
        run: python -m pip install boto3
      - name: Download generated shards from private R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          python scripts/private_workflow_handoff.py download-shards \
            --prefix "$PRIVATE_HANDOFF_ROOT/${{ github.run_id }}/${{ needs.select-macro-reports.outputs.latest_folder }}" \
            --destination "xhs_notes/dropbox/${{ needs.select-macro-reports.outputs.latest_folder }}" \
            --expected-count "${{ needs.select-macro-reports.outputs.effective_shard_count }}"
      - name: Build split publish-ready ZIPs
        id: package
        run: |
          set -o pipefail
          DATE_DIR="xhs_notes/dropbox/${{ needs.select-macro-reports.outputs.latest_folder }}"
          echo "::notice::Packaging publish-ready outputs from $DATE_DIR, excluding MinerU raw/source files."
          echo "::notice::Using split ZIPs with --max-zip-mb 90 so every committed ZIP stays below GitHub's 100 MB file limit."
          python scripts/package_publish_ready_outputs.py \
            --date-dir "$DATE_DIR" \
            --output-root "publish_ready_zips" \
            --max-zip-mb 90 2>&1 | tee "publish_ready_package_progress.log"
          echo "PACKAGE_DIR=publish_ready_zips/${{ needs.select-macro-reports.outputs.latest_folder }}" >> "$GITHUB_ENV"
          find "publish_ready_zips/${{ needs.select-macro-reports.outputs.latest_folder }}" -maxdepth 1 -type f -printf '%s bytes %p\n' | sort -n
      - name: Verify ZIP parts are GitHub-safe
        run: |
          TOO_BIG=$(find "$PACKAGE_DIR" -name '*.zip' -type f -size +99M -print || true)
          if [ -n "$TOO_BIG" ]; then
            echo "Some ZIP parts still exceed GitHub's 100 MB file limit:"
            echo "$TOO_BIG"
            exit 1
          fi
      - name: Upload split publish-ready ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: publish-ready-${{ needs.select-macro-reports.outputs.latest_folder }}-${{ github.run_id }}
          path: |
            ${{ env.PACKAGE_DIR }}
            publish_ready_package_progress.log
          if-no-files-found: error
          retention-days: 2

  recover-market-sources:
    # Resume accepted MinerU tasks first, then summarize all original PDFs with
    # cloud OCR if needed. Failed reports remain recorded; successful work stays.
    needs: [resolve-inputs, select-macro-reports, process-shard, source-outcome]
    if: ${{ always() && !cancelled() && needs.select-macro-reports.result == 'success' && needs.source-outcome.outputs.primary_ready == 'false' && needs.select-macro-reports.outputs.selected_count != '0' && (needs.resolve-inputs.outputs.replay_source_run_id == '' || needs.source-outcome.outputs.provider_only == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      source_kind: ${{ steps.source-kind.outputs.source_kind }}
      mineru_recovery_failed: ${{ steps.recovery-status.outputs.mineru_recovery_failed }}
      ocr_attempted: ${{ steps.recovery-status.outputs.ocr_attempted }}
      article_source_ready: ${{ steps.recovery-status.outputs.article_source_ready }}
    steps:
      - name: Initialize DeepSeek usage ledger
        shell: bash
        run: |
          usage_dir="$(mktemp -d "$RUNNER_TEMP/deepseek-usage.XXXXXX")"
          usage_dir="$(cd "$usage_dir" && pwd -P)"
          echo "DEEPSEEK_USAGE_DIR=$usage_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            scripts
            prompts
            requirements.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source recovery and synthesis dependencies
        timeout-minutes: 5
        run: python -m pip install -r requirements.txt reportlab "boto3>=1.37.32,<2"
      - name: Download exact selected original PDFs
        timeout-minutes: 5
        uses: actions/download-artifact@v4
        with:
          name: selected-macro-pdfs-${{ github.run_id }}
          path: _selected_macro_pdfs
      - name: Recover existing MinerU tasks for daily Market Views
        id: mineru-recover
        timeout-minutes: 30
        continue-on-error: true
        # Completed parsing can still be reused when later article generation
        # failed, or a pending page segment lacks the provider-only marker.
        # The recovery entrypoint independently checks every original binding.
        if: ${{ needs.resolve-inputs.outputs.replay_source_run_id == '' }}
        env:
          REPLAY_SOURCE_RUN_ID: ${{ needs.resolve-inputs.outputs.replay_source_run_id }}
          MINERU_FORBID_NEW_SUBMISSIONS: ${{ needs.resolve-inputs.outputs.forbid_new_submissions }}
          MINER_U: ${{ secrets.MINER_U }}
          MINER_U_2: ${{ secrets.MINER_U_2 }}
          MINER_U_3: ${{ secrets.MINER_U_3 }}
          MINER_U_4: ${{ secrets.MINER_U_4 }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
          DATE_FOLDER: ${{ needs.select-macro-reports.outputs.latest_folder }}
          EXPECTED_ARTICLES: ${{ needs.select-macro-reports.outputs.selected_count }}
        run: |
          python scripts/recover_daily_mineru_sources.py \
            --input-dir _selected_macro_pdfs --output-dir _mineru_market_sources/shard_0 \
            --expected-reports "$EXPECTED_ARTICLES" --date-folder "$DATE_FOLDER" --timeout 1740
      - name: Save complete recovered MinerU sources to private R2
        id: mineru-save
        timeout-minutes: 5
        if: ${{ steps.mineru-recover.outcome == 'success' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          python scripts/private_workflow_handoff.py upload-dir \
            --source _mineru_market_sources/shard_0 \
            --key "_private-workflow-handoff/mineru-market-sources/${{ github.run_id }}/${{ needs.select-macro-reports.outputs.latest_folder }}/shard_0.tar.gz"
      - name: Install complete cloud OCR synthesis dependencies
        timeout-minutes: 5
        # Normal runs must finish an actual MinerU recovery attempt first.
        # Frozen replay retains its separate provider-proven, no-new-task path.
        if: >-
          ${{ (needs.resolve-inputs.outputs.replay_source_run_id == '' && steps.mineru-recover.outcome == 'failure') ||
              (needs.resolve-inputs.outputs.replay_source_run_id != '' && needs.source-outcome.outputs.provider_only == 'true' && steps.mineru-recover.outcome == 'skipped') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim
          TESSDATA_DIR="$(tesseract --list-langs 2>/dev/null | sed -n '1s/.*"\(.*\)".*/\1/p')"
          test -n "$TESSDATA_DIR"
          test -f "$TESSDATA_DIR/eng.traineddata"
          test -f "$TESSDATA_DIR/chi_sim.traineddata"
          echo "TESSDATA_PREFIX=$TESSDATA_DIR" >> "$GITHUB_ENV"
      - name: Restore private source-bound OCR synthesis cache
        timeout-minutes: 3
        continue-on-error: true
        if: >-
          ${{ (needs.resolve-inputs.outputs.replay_source_run_id == '' && steps.mineru-recover.outcome == 'failure') ||
              (needs.resolve-inputs.outputs.replay_source_run_id != '' && needs.source-outcome.outputs.provider_only == 'true' && steps.mineru-recover.outcome == 'skipped') }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
          DATE_FOLDER: ${{ needs.select-macro-reports.outputs.latest_folder }}
          EXPECTED_ARTICLES: ${{ needs.select-macro-reports.outputs.selected_count }}
        run: |
          python scripts/private_market_ocr_checkpoint.py restore \
            --manifest _selected_macro_pdfs/selected_to_process_manifest.json \
            --date-folder "$DATE_FOLDER" --expected-reports "$EXPECTED_ARTICLES" \
            --directory _market_ocr_cache
      - name: Build complete OCR summaries and charts for Market Views
        id: ocr-synthesis
        timeout-minutes: 90
        if: >-
          ${{ (needs.resolve-inputs.outputs.replay_source_run_id == '' && steps.mineru-recover.outcome == 'failure') ||
              (needs.resolve-inputs.outputs.replay_source_run_id != '' && needs.source-outcome.outputs.provider_only == 'true' && steps.mineru-recover.outcome == 'skipped') }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_MARKET_VIEWS_API_KEY }}
          DEEPSEEK_USAGE_STAGE: market-views-ocr-synthesis
          MODEL: ${{ needs.resolve-inputs.outputs.model }}
          BASE_URL: ${{ needs.resolve-inputs.outputs.deepseek_base_url }}
          DATE_FOLDER: ${{ needs.select-macro-reports.outputs.latest_folder }}
          EXPECTED_ARTICLES: ${{ needs.select-macro-reports.outputs.selected_count }}
        run: |
          python scripts/build_market_views_ocr_fallback.py \
            --input-dir _selected_macro_pdfs \
            --manifest _selected_macro_pdfs/selected_to_process_manifest.json \
            --expected-reports "$EXPECTED_ARTICLES" --date-folder "$DATE_FOLDER" \
            --output-root _market_ocr_synthesis --cache-dir _market_ocr_cache \
            --source-run-id "$GITHUB_RUN_ID" --execution-sha "$GITHUB_SHA" \
            --workers 4 --ocr-all-pages --model "$MODEL" --base-url "$BASE_URL"
      - name: Save private OCR synthesis cache even after interruption
        timeout-minutes: 3
        continue-on-error: true
        if: ${{ always() && steps.ocr-synthesis.outcome != 'skipped' && hashFiles('scripts/private_market_ocr_checkpoint.py') != '' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
          DATE_FOLDER: ${{ needs.select-macro-reports.outputs.latest_folder }}
          EXPECTED_ARTICLES: ${{ needs.select-macro-reports.outputs.selected_count }}
        run: |
          python scripts/private_market_ocr_checkpoint.py save \
            --manifest _selected_macro_pdfs/selected_to_process_manifest.json \
            --date-folder "$DATE_FOLDER" --expected-reports "$EXPECTED_ARTICLES" \
            --directory _market_ocr_cache
      - name: Save complete OCR synthesis to private R2
        id: ocr-save
        timeout-minutes: 5
        if: ${{ steps.ocr-synthesis.outcome == 'success' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          python scripts/private_workflow_handoff.py upload-dir \
            --source "_market_ocr_synthesis/${{ needs.select-macro-reports.outputs.latest_folder }}" \
            --key "_private-workflow-handoff/market-ocr-synthesis/${{ github.run_id }}/${{ needs.select-macro-reports.outputs.latest_folder }}/shard_0.tar.gz"
      - name: Capture Daily OCR page fallback eligibility
        id: recovery-status
        if: ${{ always() && !cancelled() && hashFiles('scripts/recover_daily_ocr_page_sources.py') != '' }}
        env:
          MINERU_OUTCOME: ${{ steps.mineru-recover.outcome }}
          OCR_OUTCOME: ${{ steps.ocr-synthesis.outcome }}
          MINERU_SAVE_OUTCOME: ${{ steps.mineru-save.outcome }}
          OCR_SAVE_OUTCOME: ${{ steps.ocr-save.outcome }}
        run: python -B scripts/recover_daily_ocr_page_sources.py outcomes
      - name: Select the verified source edition
        id: source-kind
        env:
          MINERU_RECOVER: ${{ steps.mineru-recover.outcome }}
          OCR_SYNTHESIS: ${{ steps.ocr-synthesis.outcome }}
        run: |
          if [ "$MINERU_RECOVER" = success ]; then
            echo "source_kind=mineru-recovery" >> "$GITHUB_OUTPUT"
          else
            test "$OCR_SYNTHESIS" = success
            echo "source_kind=ocr-synthesis" >> "$GITHUB_OUTPUT"
            echo "::notice::Complete original inventory attempted through OCR and DeepSeek synthesis."
          fi
      - name: Summarize DeepSeek usage
        if: ${{ always() && hashFiles('scripts/summarize_deepseek_usage.py') != '' }}
        run: |
          python scripts/summarize_deepseek_usage.py \
            --input-dir "$DEEPSEEK_USAGE_DIR" --output "$DEEPSEEK_USAGE_DIR/summary.json" \
            --markdown "$DEEPSEEK_USAGE_DIR/summary.md" --github-summary
      - name: Upload DeepSeek usage
        if: ${{ always() && hashFiles('.github/actions/resilient-diagnostic-artifact/action.yml') != '' }}
        uses: ./.github/actions/resilient-diagnostic-artifact
        with:
          name: deepseek-usage-market-source-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DEEPSEEK_USAGE_DIR }}
          if-no-files-found: error
          retention-days: 30

  recover-ocr-page-sources:
    # Complete page text can feed articles while Market Views synthesis remains
    # failed/pending. This never submits OCR, MinerU or synthesis requests.
    needs: [resolve-inputs, select-macro-reports, source-outcome, recover-market-sources]
    if: >-
      ${{ always() && !cancelled() && needs.select-macro-reports.result == 'success' &&
          needs.source-outcome.result == 'success' && needs.source-outcome.outputs.primary_ready == 'false' &&
          needs.resolve-inputs.outputs.replay_source_run_id == '' &&
          needs.select-macro-reports.outputs.selected_count != '0' &&
          needs.recover-market-sources.result == 'failure' &&
          needs.recover-market-sources.outputs.mineru_recovery_failed == 'true' &&
          needs.recover-market-sources.outputs.ocr_attempted == 'true' &&
          needs.recover-market-sources.outputs.article_source_ready == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPLAY_SOURCE_RUN_ID: ${{ needs.resolve-inputs.outputs.replay_source_run_id }}
      PRIMARY_READY: ${{ needs.source-outcome.outputs.primary_ready }}
      MINERU_RECOVERY_FAILED: ${{ needs.recover-market-sources.outputs.mineru_recovery_failed }}
      OCR_ATTEMPTED: ${{ needs.recover-market-sources.outputs.ocr_attempted }}
      ARTICLE_SOURCE_READY: ${{ needs.recover-market-sources.outputs.article_source_ready }}
      DATE_FOLDER: ${{ needs.select-macro-reports.outputs.latest_folder }}
      EXPECTED_REPORTS: ${{ needs.select-macro-reports.outputs.selected_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Daily page verification dependencies
        run: python -m pip install --retries 0 --disable-pip-version-check requests Pillow PyMuPDF 'boto3>=1.37.32,<2'
      - name: Restore exact same-run selected original PDFs and manifest
        uses: actions/download-artifact@v4
        with:
          name: selected-macro-pdfs-${{ github.run_id }}
          path: ${{ runner.temp }}/daily-ocr-selected-originals
      - name: Restore and verify complete Daily original OCR pages from cache only
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          python -B scripts/recover_daily_ocr_page_sources.py recover \
            --input-dir "$RUNNER_TEMP/daily-ocr-selected-originals" --workspace "$RUNNER_TEMP/daily-ocr-pages"
      - name: Archive and verify complete Daily OCR page sources in private R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          python -B scripts/recover_daily_ocr_page_sources.py archive \
            --input-dir "$RUNNER_TEMP/daily-ocr-selected-originals" --workspace "$RUNNER_TEMP/daily-ocr-pages"

  trigger-market-views:
    # PDF synthesis consumes the complete R2 shards directly, not the ZIP artifact.
    needs: [resolve-inputs, select-macro-reports, process-shard, recover-market-sources, source-outcome]
    if: ${{ always() && !cancelled() && (needs.source-outcome.outputs.primary_ready == 'true' || needs.recover-market-sources.result == 'success') && needs.select-macro-reports.outputs.selected_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Trigger Market Views from complete bank inputs
        env:
          GH_TOKEN: ${{ github.token }}
          DATE_FOLDER: ${{ needs.select-macro-reports.outputs.latest_folder }}
          EXPECTED_SHARDS: ${{ needs.select-macro-reports.outputs.effective_shard_count }}
          RECOVERY_RESULT: ${{ needs.recover-market-sources.result }}
          RECOVERY_KIND: ${{ needs.recover-market-sources.outputs.source_kind }}
          EXPECTED_ARTICLES: ${{ needs.select-macro-reports.outputs.selected_count }}
          MODEL: ${{ needs.resolve-inputs.outputs.model }}
          DEEPSEEK_BASE_URL: ${{ needs.resolve-inputs.outputs.deepseek_base_url }}
        run: |
          SOURCE_KIND=xhs
          if [ "$RECOVERY_RESULT" = "success" ]; then
            SOURCE_KIND="$RECOVERY_KIND"
            EXPECTED_SHARDS=1
          fi
          echo "::notice::All bank-report shards for $DATE_FOLDER are in private R2. Dispatching the matching Market Views issue now."
          RUN_URL="$(gh workflow run market-views-latex-pdf.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f date_folder="$DATE_FOLDER" \
            -f expected_bank_date="$DATE_FOLDER" \
            -f source_handoff_run_id="${{ github.run_id }}" \
            -f source_handoff_kind="$SOURCE_KIND" \
            -f expected_shards="$EXPECTED_SHARDS" \
            -f expected_articles="$EXPECTED_ARTICLES" \
            -f model="$MODEL" \
            -f deepseek_base_url="$DEEPSEEK_BASE_URL" \
            -f compile_latex=false)"
          MARKET_RUN_ID="${RUN_URL##*/}"
          if ! printf '%s\n' "$MARKET_RUN_ID" | grep -Eq '^[0-9]+$'; then
            echo "Unable to resolve dispatched Market Views run from: $RUN_URL" >&2
            exit 1
          fi
          echo "::notice::Waiting for Market Views run $MARKET_RUN_ID."
          gh run watch "$MARKET_RUN_ID" --repo "$GITHUB_REPOSITORY" --compact --exit-status --interval 15

  validate-market-delivery:
    needs: [resolve-inputs, select-macro-reports, source-outcome, recover-market-sources, trigger-market-views]
    if: ${{ always() && !cancelled() && needs.resolve-inputs.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the actual PDF publication to finish
        env:
          SELECTION_RESULT: ${{ needs.select-macro-reports.result }}
          DELIVERY_RESULT: ${{ needs.trigger-market-views.result }}
          PRIMARY_READY: ${{ needs.source-outcome.outputs.primary_ready }}
          SOURCE_STATUS: ${{ needs.source-outcome.result }}
          PROVIDER_ONLY: ${{ needs.source-outcome.outputs.provider_only }}
          NO_WORK: ${{ needs.source-outcome.outputs.no_work }}
          SELECTED_COUNT: ${{ needs.select-macro-reports.outputs.selected_count }}
        run: |
          test "$SELECTION_RESULT" = success
          test "$SOURCE_STATUS" = success
          if [ "$SELECTED_COUNT" = 0 ] && [ "$NO_WORK" = true ]; then
            test "$DELIVERY_RESULT" = skipped
            echo "::notice::No new selected sources; no PDF was generated or claimed by this run."
            exit 0
          fi
          test "$SELECTED_COUNT" -gt 0
          test "$DELIVERY_RESULT" = success
          if [ "$PRIMARY_READY" != true ]; then
            echo "::notice::Market Views delivered through verified recovered sources. Article delivery is checked separately."
          fi

  push-xhs-notes-wechat-drafts:
    needs: [resolve-inputs, select-macro-reports, process-shard, source-outcome]
    if: ${{ !cancelled() && needs.process-shard.result == 'success' && needs.source-outcome.outputs.primary_ready == 'true' && needs.resolve-inputs.outputs.wechat_draft_upload == 'true' && needs.resolve-inputs.outputs.wechat_draft_source == 'xhs_notes' }}
    runs-on: [self-hosted, wechat-draft]
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            scripts
            prompts
            portal_suite/data/blog_archive
            requirements.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          python -m pip install boto3

      - name: Download generated shards from private R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          python scripts/private_workflow_handoff.py download-shards \
            --prefix "$PRIVATE_HANDOFF_ROOT/${{ github.run_id }}/${{ needs.select-macro-reports.outputs.latest_folder }}" \
            --destination "xhs_notes/dropbox/${{ needs.select-macro-reports.outputs.latest_folder }}" \
            --expected-count "${{ needs.select-macro-reports.outputs.effective_shard_count }}"

      - name: Materialize private publishing image
        env:
          PORTAL_PRIVATE_PUBLISH_ASSET_KEY: ${{ secrets.PORTAL_PRIVATE_PUBLISH_ASSET_KEY }}
        run: bash scripts/materialize_private_social_asset.sh prompts

      - name: Restore accepted WeChat draft receipts
        uses: ./.github/actions/restore-wechat-diagnostics
        with:
          name: xhs-notes-wechat-drafts-${{ needs.select-macro-reports.outputs.latest_folder }}-${{ github.run_id }}
          path: .

      - name: Upload generated xhs notes to WeChat drafts
        id: upload_xhs_wechat
        continue-on-error: true
        env:
          WECHAT_MP_APPID: ${{ secrets.WECHAT_MP_APPID }}
          WECHAT_MP_APPSECRET: ${{ secrets.WECHAT_MP_APPSECRET }}
          PORTAL_SITE_URL: ${{ secrets.PORTAL_SITE_URL }}
        run: |
          set -o pipefail
          DATE_FOLDER="${{ needs.select-macro-reports.outputs.latest_folder }}"
          WECHAT_DRAFT_DIR="wechat_drafts/xhs_notes/$DATE_FOLDER"
          mkdir -p "$WECHAT_DRAFT_DIR"
          echo "WECHAT_DRAFT_DIR=$WECHAT_DRAFT_DIR" >> "$GITHUB_ENV"
          : > wechat_drafts_progress.log
          MAX_ARTICLES="${{ needs.resolve-inputs.outputs.translated_report_count }}"
          if [ "$MAX_ARTICLES" = "0" ]; then MAX_ARTICLES="all"; fi
          PUBLISH_ARGS=()
          if [ "${{ needs.resolve-inputs.outputs.wechat_freepublish }}" = "true" ]; then
            PUBLISH_ARGS+=(--publish)
            echo "::notice::Uploading and publishing generated xhs_notes articles from xhs_notes/dropbox/$DATE_FOLDER"
          else
            echo "::notice::Uploading generated xhs_notes articles to WeChat drafts from xhs_notes/dropbox/$DATE_FOLDER"
          fi
          python scripts/push_xhs_notes_to_wechat_drafts.py \
            --dropbox-output-root "xhs_notes/dropbox" \
            --date-folder "$DATE_FOLDER" \
            --output-root "wechat_drafts/xhs_notes" \
            --max-articles "$MAX_ARTICLES" \
            --articles-per-draft "${{ needs.resolve-inputs.outputs.wechat_draft_articles_per_draft }}" \
            --max-body-chars "${{ needs.resolve-inputs.outputs.wechat_draft_max_body_chars }}" \
            --min-inline-images "${{ needs.resolve-inputs.outputs.wechat_draft_min_inline_images }}" \
            --max-inline-images "${{ needs.resolve-inputs.outputs.wechat_draft_max_inline_images }}" \
            "${PUBLISH_ARGS[@]}" 2>&1 | tee -a wechat_drafts_progress.log

      - name: Archive WeChat draft diagnostics
        if: ${{ always() }}
        uses: ./.github/actions/resilient-diagnostic-artifact
        with:
          name: xhs-notes-wechat-drafts-${{ needs.select-macro-reports.outputs.latest_folder }}-${{ github.run_id }}
          path: |
            ${{ env.WECHAT_DRAFT_DIR }}
            wechat_drafts_progress.log
          if-no-files-found: warn
          retention-days: 2

      - name: Update public Blog archive
        if: ${{ steps.upload_xhs_wechat.outcome == 'success' }}
        run: |
          python scripts/update_blog_archive_from_wechat_drafts.py \
            --wechat-drafts-root wechat_drafts \
            --blog-archive-root portal_suite/data/blog_archive

      - name: Commit public Blog archive
        id: commit_blog_archive
        if: ${{ steps.upload_xhs_wechat.outcome == 'success' }}
        run: |
          DATE_FOLDER="${{ needs.select-macro-reports.outputs.latest_folder }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- portal_suite/data/blog_archive
          if git diff --cached --quiet; then
            echo "No Blog archive changes for $DATE_FOLDER."
            exit 0
          fi
          git commit -m "Archive Blog articles $DATE_FOLDER"
          bash scripts/push_main_with_rebase_retry.sh 5

      - name: Refresh public site after accepted Blog archive
        if: ${{ steps.upload_xhs_wechat.outcome == 'success' && steps.commit_blog_archive.outcome == 'success' }}
        uses: actions/github-script@v7
        env:
          NEUTRAL_SCHEDULE_ENABLED: ${{ vars.NEUTRAL_SCHEDULE_ENABLED || 'false' }}
          PORTAL_MULTILINGUAL_ENABLED: ${{ vars.PORTAL_MULTILINGUAL_ENABLED || 'false' }}
          PORTAL_MULTILINGUAL_LIVE: ${{ vars.PORTAL_MULTILINGUAL_LIVE || 'false' }}
        with:
          script: |
            if (process.env.NEUTRAL_SCHEDULE_ENABLED !== 'true' ||
                (process.env.PORTAL_MULTILINGUAL_ENABLED === 'true' &&
                 process.env.PORTAL_MULTILINGUAL_LIVE !== 'true')) {
              core.info('Automatic public refresh is disabled by the current release settings.');
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'neutral-edge-cutover.yml',
              ref: 'main',
              inputs: { operation: 'migrate', translation_scope: 'incremental' },
            });
            core.info('Queued incremental public refresh after accepted articles and Blog archive.');

      - name: Fail after archiving WeChat upload diagnostics
        if: ${{ steps.upload_xhs_wechat.outcome == 'failure' }}
        run: |
          echo "WeChat draft upload failed; diagnostics were archived before marking the job failed." >&2
          exit 1

  deliver-recovered-report-articles:
    needs: [resolve-inputs, select-macro-reports, source-outcome, recover-market-sources, recover-ocr-page-sources, push-xhs-notes-wechat-drafts]
    if: >-
      ${{ !cancelled() && (needs.recover-market-sources.result == 'success' || needs.recover-ocr-page-sources.result == 'success') &&
          needs.source-outcome.outputs.primary_ready == 'false' &&
          needs.resolve-inputs.outputs.replay_source_run_id == '' &&
          (needs.resolve-inputs.outputs.wechat_draft_upload == 'true' ||
           needs.resolve-inputs.outputs.translated_report_count != '0' ||
           (vars.CHART_SEARCH_ENABLED == 'true' && needs.recover-market-sources.outputs.source_kind == 'mineru-recovery')) }}
    uses: ./.github/workflows/recover-report-article-delivery.yml
    with:
      source_run_id: ${{ github.run_id }}
      source_handoff_run_id: ${{ github.run_id }}
      source_kind: ${{ needs.recover-market-sources.result == 'success' && needs.recover-market-sources.outputs.source_kind || 'ocr-pages' }}
      date_folder: ${{ needs.select-macro-reports.outputs.latest_folder }}
      expected_articles: ${{ needs.select-macro-reports.outputs.selected_count }}
      model: ${{ needs.resolve-inputs.outputs.model }}
      deepseek_base_url: ${{ needs.resolve-inputs.outputs.deepseek_base_url }}
      upload_wechat: ${{ needs.resolve-inputs.outputs.wechat_draft_upload == 'true' && needs.resolve-inputs.outputs.wechat_draft_source == 'xhs_notes' }}
    secrets: inherit

  plan-portal-translated-reports:
    needs: [resolve-inputs, select-macro-reports, process-shard, source-outcome, deliver-recovered-report-articles]
    if: ${{ !cancelled() && ((needs.process-shard.result == 'success' && needs.source-outcome.outputs.primary_ready == 'true') || needs.deliver-recovered-report-articles.result == 'success') && needs.resolve-inputs.outputs.translated_report_count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      shard_indices: ${{ steps.plan.outputs.shard_indices }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
      selected_count: ${{ steps.plan.outputs.selected_count }}
      source_prefix: ${{ steps.sources.outputs.source_prefix }}
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install planning dependencies
        run: python -m pip install -r requirements.txt boto3
      - name: Download generated shards from private R2
        id: sources
        env:
          RECOVERED_PREFIX: ${{ needs.deliver-recovered-report-articles.outputs.article_handoff_prefix }}
          RECOVERED_RESULT: ${{ needs.deliver-recovered-report-articles.result }}
        run: |
          SOURCE_PREFIX="$PRIVATE_HANDOFF_ROOT/${{ github.run_id }}/${{ needs.select-macro-reports.outputs.latest_folder }}"
          EXPECTED_SHARDS="${{ needs.select-macro-reports.outputs.effective_shard_count }}"
          if [ "$RECOVERED_RESULT" = success ]; then
            test -n "$RECOVERED_PREFIX"
            SOURCE_PREFIX="$RECOVERED_PREFIX"
            EXPECTED_SHARDS=1
          fi
          python scripts/private_workflow_handoff.py download-shards \
            --prefix "$SOURCE_PREFIX" \
            --destination "xhs_notes/dropbox/${{ needs.select-macro-reports.outputs.latest_folder }}" \
            --expected-count "$EXPECTED_SHARDS"
          echo "source_prefix=$SOURCE_PREFIX" >> "$GITHUB_OUTPUT"
      - name: Freeze global report selection into bounded translation shards
        id: plan
        run: |
          python scripts/portal_translation_shards.py plan \
            --date-dir "xhs_notes/dropbox/${{ needs.select-macro-reports.outputs.latest_folder }}" \
            --max-reports "${{ needs.resolve-inputs.outputs.translated_report_count }}" \
            --reports-per-shard 5 --output "$RUNNER_TEMP/translation-plan/plan.json"
          python scripts/private_workflow_handoff.py upload-dir \
            --source "$RUNNER_TEMP/translation-plan" \
            --key "$PRIVATE_HANDOFF_ROOT/${{ github.run_id }}/${{ needs.select-macro-reports.outputs.latest_folder }}/translation-plan.tar.gz"

  translate-report-shard:
    needs: [resolve-inputs, select-macro-reports, process-shard, plan-portal-translated-reports]
    if: ${{ !cancelled() && needs.plan-portal-translated-reports.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        translation_shard_index: ${{ fromJson(needs.plan-portal-translated-reports.outputs.shard_indices) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Initialize DeepSeek usage ledger
        shell: bash
        run: |
          usage_dir="$(mktemp -d "$RUNNER_TEMP/deepseek-usage.XXXXXX")"
          usage_dir="$(cd "$usage_dir" && pwd -P)"
          echo "DEEPSEEK_USAGE_DIR=$usage_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install translation and PDF dependencies
        run: python -m pip install -r requirements.txt reportlab boto3
      - name: Materialize only this translation shard's private sources
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          python scripts/private_workflow_handoff.py download-dir \
            --key "$PRIVATE_HANDOFF_ROOT/${{ github.run_id }}/${{ needs.select-macro-reports.outputs.latest_folder }}/translation-plan.tar.gz" \
            --destination "$RUNNER_TEMP/translation-plan"
          python scripts/portal_translation_shards.py materialize \
            --plan "$RUNNER_TEMP/translation-plan/plan.json" \
            --shard-index "${{ matrix.translation_shard_index }}" \
            --prefix "${{ needs.plan-portal-translated-reports.outputs.source_prefix }}" \
            --date-dir "xhs_notes/dropbox/${{ needs.select-macro-reports.outputs.latest_folder }}"
      - name: Install Chinese fonts
        timeout-minutes: 5
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Set up free local translation models
        uses: ./.github/actions/setup-offline-translation
        with:
          targets: zh,en
          audit-suffix: -shard-${{ matrix.translation_shard_index }}
      - name: Restore private report translation checkpoint
        id: translation_checkpoint
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          echo "REPORT_TRANSLATION_CACHE_DIR=$RUNNER_TEMP/report-translation-cache" >> "$GITHUB_ENV"
          python scripts/private_translation_checkpoint.py restore \
            --scope "$TRANSLATION_CHECKPOINT_SCOPE" --date-folder "${{ needs.select-macro-reports.outputs.latest_folder }}" \
            --directory "$RUNNER_TEMP/report-translation-cache"
      - name: Build at most five reports with fixed global indices
        timeout-minutes: 300
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_REPORT_NOTES_API_KEY }}
          DEEPSEEK_USAGE_STAGE: report-article
          DEEPSEEK_API_KEY_BACKUP: ''
          DEEPSEEK_BASE_URL: ${{ needs.resolve-inputs.outputs.deepseek_base_url }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/translation-output/translation_shard_logs"
          python scripts/build_portal_translated_reports.py \
            --dropbox-output-root xhs_notes/dropbox \
            --date-folder "${{ needs.select-macro-reports.outputs.latest_folder }}" \
            --output-root "$RUNNER_TEMP/translation-output/portal_translated_reports" \
            --max-reports all \
            --report-plan "$RUNNER_TEMP/translation-plan/plan.json" \
            --translation-shard-index "${{ matrix.translation_shard_index }}" \
            --max-seconds 16500 \
            --model "${{ needs.resolve-inputs.outputs.model }}" \
            --deepseek-base-url "${{ needs.resolve-inputs.outputs.deepseek_base_url }}" \
            --title-guard 2>&1 | tee "$RUNNER_TEMP/translation-output/translation_shard_logs/shard_${{ matrix.translation_shard_index }}.log"
      - name: Save completed private report translations even on failure
        if: ${{ always() && steps.translation_checkpoint.outcome == 'success' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          python scripts/private_translation_checkpoint.py save \
            --scope "$TRANSLATION_CHECKPOINT_SCOPE" --date-folder "${{ needs.select-macro-reports.outputs.latest_folder }}" \
            --directory "$RUNNER_TEMP/report-translation-cache"
      - name: Handoff this completed translation shard privately
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          python scripts/private_workflow_handoff.py upload-dir \
            --source "$RUNNER_TEMP/translation-output" --include-translated-pdfs \
            --key "$PRIVATE_HANDOFF_ROOT/${{ github.run_id }}/${{ needs.select-macro-reports.outputs.latest_folder }}/translated_${{ matrix.translation_shard_index }}.tar.gz"
      - name: Summarize DeepSeek usage
        if: ${{ always() && hashFiles('scripts/summarize_deepseek_usage.py') != '' }}
        run: |
          python scripts/summarize_deepseek_usage.py \
            --input-dir "$DEEPSEEK_USAGE_DIR" \
            --output "$DEEPSEEK_USAGE_DIR/summary.json" \
            --markdown "$DEEPSEEK_USAGE_DIR/summary.md" \
            --github-summary
      - name: Upload DeepSeek usage
        if: ${{ always() && hashFiles('.github/actions/resilient-diagnostic-artifact/action.yml') != '' }}
        uses: ./.github/actions/resilient-diagnostic-artifact
        with:
          name: deepseek-usage-${{ github.job }}-${{ matrix.translation_shard_index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DEEPSEEK_USAGE_DIR }}
          if-no-files-found: error
          retention-days: 30

  build-portal-translated-reports:
    needs: [resolve-inputs, select-macro-reports, process-shard, plan-portal-translated-reports, translate-report-shard, source-outcome]
    if: ${{ !cancelled() && needs.plan-portal-translated-reports.result == 'success' && needs.translate-report-shard.result == 'success' && needs.resolve-inputs.outputs.translated_report_count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install boto3
      - name: Download planned translation outputs from private R2
        run: |
          python scripts/private_workflow_handoff.py download-dir \
            --key "$PRIVATE_HANDOFF_ROOT/${{ github.run_id }}/${{ needs.select-macro-reports.outputs.latest_folder }}/translation-plan.tar.gz" \
            --destination "$RUNNER_TEMP/translation-plan"
          python scripts/portal_translation_shards.py download-results \
            --plan "$RUNNER_TEMP/translation-plan/plan.json" \
            --prefix "$PRIVATE_HANDOFF_ROOT/${{ github.run_id }}/${{ needs.select-macro-reports.outputs.latest_folder }}" \
            --destination "$RUNNER_TEMP/translation-shards"
      - name: Verify every selected report and merge unique outputs
        run: |
          python scripts/portal_translation_shards.py merge \
            --plan "$RUNNER_TEMP/translation-plan/plan.json" \
            --shard-root "$RUNNER_TEMP/translation-shards" --output-root .
          echo "PORTAL_TRANSLATED_DIR=portal_translated_reports/${{ needs.select-macro-reports.outputs.latest_folder }}" >> "$GITHUB_ENV"
      - name: Upload Portal translated report artifact
        uses: actions/upload-artifact@v4
        with:
          name: portal-translated-reports-${{ needs.select-macro-reports.outputs.latest_folder }}-${{ github.run_id }}
          overwrite: true
          path: |
            ${{ env.PORTAL_TRANSLATED_DIR }}
            portal_translated_reports_progress.log
          if-no-files-found: error
          retention-days: 2

  push-portal-translated-wechat-drafts:
    needs: [resolve-inputs, select-macro-reports, build-portal-translated-reports]
    if: ${{ !cancelled() && needs.build-portal-translated-reports.result == 'success' && needs.resolve-inputs.outputs.translated_report_count != '0' && needs.resolve-inputs.outputs.wechat_draft_upload == 'true' && needs.resolve-inputs.outputs.wechat_draft_source == 'portal_translated' }}
    runs-on: [self-hosted, wechat-draft]
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            scripts
            prompts
            portal_suite/data/blog_archive
            requirements.txt
            wechat_drafts/${{ needs.select-macro-reports.outputs.latest_folder }}

      - name: Download Portal translated reports
        uses: actions/download-artifact@v4
        with:
          name: portal-translated-reports-${{ needs.select-macro-reports.outputs.latest_folder }}-${{ github.run_id }}
          path: .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Materialize private publishing image
        env:
          PORTAL_PRIVATE_PUBLISH_ASSET_KEY: ${{ secrets.PORTAL_PRIVATE_PUBLISH_ASSET_KEY }}
        run: bash scripts/materialize_private_social_asset.sh prompts

      - name: Restore accepted WeChat draft receipts
        uses: ./.github/actions/restore-wechat-diagnostics
        with:
          name: portal-translated-wechat-drafts-${{ needs.select-macro-reports.outputs.latest_folder }}-${{ github.run_id }}
          path: .

      - name: Upload Portal translated reports to WeChat drafts
        id: upload_portal_wechat
        env:
          WECHAT_MP_APPID: ${{ secrets.WECHAT_MP_APPID }}
          WECHAT_MP_APPSECRET: ${{ secrets.WECHAT_MP_APPSECRET }}
          PORTAL_SITE_URL: ${{ secrets.PORTAL_SITE_URL }}
        run: |
          set -o pipefail
          DATE_FOLDER="${{ needs.select-macro-reports.outputs.latest_folder }}"
          echo "WECHAT_DRAFT_DIR=wechat_drafts/$DATE_FOLDER" >> "$GITHUB_ENV"
          MAX_ARTICLES="${{ needs.resolve-inputs.outputs.translated_report_count }}"
          PUBLISH_ARGS=()
          if [ "${{ needs.resolve-inputs.outputs.wechat_freepublish }}" = "true" ]; then
            PUBLISH_ARGS+=(--publish)
            echo "::notice::Uploading and publishing $MAX_ARTICLES Portal translated reports from portal_translated_reports/$DATE_FOLDER"
          else
            echo "::notice::Uploading $MAX_ARTICLES Portal translated reports to WeChat drafts from portal_translated_reports/$DATE_FOLDER"
          fi
          python scripts/push_portal_translated_to_wechat_drafts.py \
            --translated-root "portal_translated_reports" \
            --date-folder "$DATE_FOLDER" \
            --output-root "wechat_drafts" \
            --max-articles "$MAX_ARTICLES" \
            --articles-per-draft "${{ needs.resolve-inputs.outputs.wechat_draft_articles_per_draft }}" \
            --max-body-chars "${{ needs.resolve-inputs.outputs.wechat_draft_max_body_chars }}" \
            --min-inline-images "${{ needs.resolve-inputs.outputs.wechat_draft_min_inline_images }}" \
            --max-inline-images "${{ needs.resolve-inputs.outputs.wechat_draft_max_inline_images }}" \
            "${PUBLISH_ARGS[@]}" 2>&1 | tee wechat_drafts_progress.log

      - name: Archive WeChat draft diagnostics
        if: ${{ always() }}
        uses: ./.github/actions/resilient-diagnostic-artifact
        with:
          name: portal-translated-wechat-drafts-${{ needs.select-macro-reports.outputs.latest_folder }}-${{ github.run_id }}
          path: |
            ${{ env.WECHAT_DRAFT_DIR }}
            wechat_drafts_progress.log
          if-no-files-found: error
          retention-days: 2

      - name: Update public Blog archive
        run: |
          python scripts/update_blog_archive_from_wechat_drafts.py \
            --wechat-drafts-root wechat_drafts \
            --blog-archive-root portal_suite/data/blog_archive

      - name: Commit public Blog archive
        id: commit_blog_archive
        run: |
          DATE_FOLDER="${{ needs.select-macro-reports.outputs.latest_folder }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- portal_suite/data/blog_archive
          if git diff --cached --quiet; then
            echo "No Blog archive changes for $DATE_FOLDER."
            exit 0
          fi
          git commit -m "Archive portal translated Blog articles $DATE_FOLDER"
          bash scripts/push_main_with_rebase_retry.sh 5

      - name: Refresh public site after accepted Blog archive
        if: ${{ steps.upload_portal_wechat.outcome == 'success' && steps.commit_blog_archive.outcome == 'success' }}
        uses: actions/github-script@v7
        env:
          NEUTRAL_SCHEDULE_ENABLED: ${{ vars.NEUTRAL_SCHEDULE_ENABLED || 'false' }}
          PORTAL_MULTILINGUAL_ENABLED: ${{ vars.PORTAL_MULTILINGUAL_ENABLED || 'false' }}
          PORTAL_MULTILINGUAL_LIVE: ${{ vars.PORTAL_MULTILINGUAL_LIVE || 'false' }}
        with:
          script: |
            if (process.env.NEUTRAL_SCHEDULE_ENABLED !== 'true' ||
                (process.env.PORTAL_MULTILINGUAL_ENABLED === 'true' &&
                 process.env.PORTAL_MULTILINGUAL_LIVE !== 'true')) {
              core.info('Automatic public refresh is disabled by the current release settings.');
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'neutral-edge-cutover.yml',
              ref: 'main',
              inputs: { operation: 'migrate', translation_scope: 'incremental' },
            });
            core.info('Queued incremental public refresh after accepted articles and Blog archive.');

  validate-report-delivery:
    needs: [resolve-inputs, select-macro-reports, source-outcome, deliver-recovered-report-articles, push-xhs-notes-wechat-drafts, build-portal-translated-reports, push-portal-translated-wechat-drafts]
    if: ${{ always() && !cancelled() && needs.resolve-inputs.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require configured article and translation delivery
        env:
          SELECTION_RESULT: ${{ needs.select-macro-reports.result }}
          SOURCE_STATUS: ${{ needs.source-outcome.result }}
          SELECTED_COUNT: ${{ needs.select-macro-reports.outputs.selected_count }}
          NO_WORK: ${{ needs.source-outcome.outputs.no_work }}
          PRIMARY_READY: ${{ needs.source-outcome.outputs.primary_ready }}
          RECOVERED_DELIVERY: ${{ needs.deliver-recovered-report-articles.result }}
          WECHAT_ENABLED: ${{ needs.resolve-inputs.outputs.wechat_draft_upload }}
          WECHAT_SOURCE: ${{ needs.resolve-inputs.outputs.wechat_draft_source }}
          WECHAT_RESULT: ${{ needs.push-xhs-notes-wechat-drafts.result }}
          TRANSLATION_COUNT: ${{ needs.resolve-inputs.outputs.translated_report_count }}
          TRANSLATION_RESULT: ${{ needs.build-portal-translated-reports.result }}
          TRANSLATED_WECHAT_RESULT: ${{ needs.push-portal-translated-wechat-drafts.result }}
        run: |
          test "$SELECTION_RESULT" = success
          test "$SOURCE_STATUS" = success
          if [ "$SELECTED_COUNT" = 0 ] && [ "$NO_WORK" = true ]; then
            echo "No new selected sources; no article delivery claimed."
            exit 0
          fi
          test "$SELECTED_COUNT" -gt 0
          if [ "$WECHAT_ENABLED" = true ]; then
            if [ "$WECHAT_SOURCE" = portal_translated ]; then
              test "$TRANSLATED_WECHAT_RESULT" = success
            elif [ "$PRIMARY_READY" = true ]; then
              test "$WECHAT_RESULT" = success
            else
              test "$RECOVERED_DELIVERY" = success
            fi
          fi
          if [ "$TRANSLATION_COUNT" != 0 ]; then
            test "$TRANSLATION_RESULT" = success
          fi
          echo "Configured article and translation consumers completed."

  trigger-chart-search-index:
    needs: [resolve-inputs, select-macro-reports, process-shard, source-outcome, recover-market-sources, deliver-recovered-report-articles]
    if: >-
      ${{
        !cancelled() && ((needs.process-shard.result == 'success' && needs.source-outcome.outputs.primary_ready == 'true') ||
          (needs.deliver-recovered-report-articles.result == 'success' && needs.recover-market-sources.outputs.source_kind == 'mineru-recovery')) &&
        needs.select-macro-reports.outputs.selected_count != '0' &&
        vars.CHART_SEARCH_ENABLED == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Dispatch daily incremental chart index
        env:
          GH_TOKEN: ${{ github.token }}
          DATE_FOLDER: ${{ needs.select-macro-reports.outputs.latest_folder }}
          EXPECTED_SHARDS: ${{ needs.select-macro-reports.outputs.effective_shard_count }}
          MAX_IMAGES: ${{ vars.VISION_INDEX_MAX_IMAGES_PER_RUN || '0' }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          RECOVERED_RESULT: ${{ needs.deliver-recovered-report-articles.result }}
          RECOVERED_MANIFEST: ${{ needs.deliver-recovered-report-articles.outputs.manifest_sha256 }}
          SELECTED_COUNT: ${{ needs.select-macro-reports.outputs.selected_count }}
        run: |
          set -euo pipefail
          printf '%s' "$DATE_FOLDER" | grep -Eq '^[0-9]{6,8}$'
          printf '%s' "$SOURCE_RUN_ID" | grep -Eq '^[0-9]+$'
          MANIFEST_SHA=""
          # Article counts bind recovered manifests; normal handoffs use the shard count.
          EXPECTED_ARTICLES=0
          if [ "$RECOVERED_RESULT" = success ]; then
            printf '%s' "$RECOVERED_MANIFEST" | grep -Eq '^[a-f0-9]{64}$'
            MANIFEST_SHA="$RECOVERED_MANIFEST"
            EXPECTED_SHARDS=1
            EXPECTED_ARTICLES="$SELECTED_COUNT"
          fi
          RUN_URL="$(gh workflow run portal-chart-search-index.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f date_folder="$DATE_FOLDER" \
            -f source_handoff_run_id="$SOURCE_RUN_ID" \
            -f source_handoff_manifest_sha256="$MANIFEST_SHA" \
            -f expected_shards="$EXPECTED_SHARDS" \
            -f expected_articles="$EXPECTED_ARTICLES" \
            -f max_images="$MAX_IMAGES")"
          CHART_RUN_ID="${RUN_URL##*/}"
          if ! printf '%s\n' "$CHART_RUN_ID" | grep -Eq '^[0-9]+$'; then
            echo "Unable to resolve dispatched chart-index run from: $RUN_URL" >&2
            exit 1
          fi
          echo "::notice::Waiting for chart-index run $CHART_RUN_ID."
          gh run watch "$CHART_RUN_ID" --repo "$GITHUB_REPOSITORY" --compact --exit-status --interval 15

  publish-customer-content:
    # Consume completed report outputs before either transient source cleanup.
    # Existing report delivery does not depend on this additional consumer.
    needs: [select-macro-reports, validate-report-delivery]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.validate-report-delivery.result == 'success' && needs.select-macro-reports.outputs.selected_count != '0' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/customer-content-publish.yml
    with:
      source_run_id: ${{ format('{0}', github.run_id) }}
      date: ${{ needs.select-macro-reports.outputs.latest_folder }}
    secrets: inherit

  cleanup-market-source-recovery:
    # Keep the source checkpoint until both PDF and configured article consumers
    # finish. The independent source-bound article checkpoint remains durable.
    needs: [select-macro-reports, recover-market-sources, trigger-market-views, validate-report-delivery, publish-customer-content]
    if: ${{ always() && !cancelled() && needs.recover-market-sources.result == 'success' && needs.trigger-market-views.result == 'success' && needs.validate-report-delivery.result == 'success' && needs.publish-customer-content.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: scripts/private_workflow_handoff.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install boto3
      - name: Delete consumed recovery sources
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
          DATE_FOLDER: ${{ needs.select-macro-reports.outputs.latest_folder }}
          SOURCE_KIND: ${{ needs.recover-market-sources.outputs.source_kind }}
        run: |
          case "$SOURCE_KIND" in
            mineru-recovery) SOURCE_PREFIX=mineru-market-sources ;;
            ocr-synthesis) SOURCE_PREFIX=market-ocr-synthesis ;;
            *) echo "Unknown recovery source kind" >&2; exit 1 ;;
          esac
          python scripts/private_workflow_handoff.py delete-prefix \
            --prefix "_private-workflow-handoff/$SOURCE_PREFIX/${{ github.run_id }}/$DATE_FOLDER"

  cleanup-private-handoff:
    needs:
      - resolve-inputs
      - select-macro-reports
      - package-publish-ready
      - recover-market-sources
      - recover-ocr-page-sources
      - deliver-recovered-report-articles
      - validate-report-delivery
      - trigger-market-views
      - trigger-chart-search-index
      - push-xhs-notes-wechat-drafts
      - plan-portal-translated-reports
      - translate-report-shard
      - build-portal-translated-reports
      - push-portal-translated-wechat-drafts
      - publish-customer-content
    if: >-
      ${{
        always() && !cancelled() &&
        needs.package-publish-ready.result == 'success' &&
        needs.trigger-market-views.result == 'success' &&
        needs.publish-customer-content.result == 'success' &&
        !contains(needs.*.result, 'cancelled') &&
        !contains(needs.*.result, 'failure')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/private_workflow_handoff.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Delete completed private handoff
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          python -m pip install boto3
          python scripts/private_workflow_handoff.py delete-prefix \
            --prefix "$PRIVATE_HANDOFF_ROOT/${{ github.run_id }}/${{ needs.select-macro-reports.outputs.latest_folder }}"

  notify-failure:
    needs:
      - source-outcome
      - validate-market-delivery
      - deliver-recovered-report-articles
      - validate-report-delivery
      - resolve-inputs
      - select-macro-reports
      - process-shard
      - package-publish-ready
      - recover-market-sources
      - recover-ocr-page-sources
      - trigger-market-views
      - trigger-chart-search-index
      - push-xhs-notes-wechat-drafts
      - plan-portal-translated-reports
      - translate-report-shard
      - build-portal-translated-reports
      - push-portal-translated-wechat-drafts
      - cleanup-private-handoff
      - cleanup-market-source-recovery
      - publish-customer-content
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    uses: ./.github/workflows/portal-ops-alert.yml
    with:
      source_workflow: Daily report articles and translations
      source_results: >-
        resolve=${{ needs.resolve-inputs.result }},
        select=${{ needs.select-macro-reports.result }},
        shards=${{ needs.process-shard.result }},
        source_outcome=${{ needs.source-outcome.result }},
        delivery_gate=${{ needs.validate-market-delivery.result }},
        article_delivery_gate=${{ needs.validate-report-delivery.result }},
        recovered_articles=${{ needs.deliver-recovered-report-articles.result }},
        package=${{ needs.package-publish-ready.result }},
        market_source_recovery=${{ needs.recover-market-sources.result }},
        ocr_page_source_recovery=${{ needs.recover-ocr-page-sources.result }},
        market_views=${{ needs.trigger-market-views.result }},
        chart_search=${{ needs.trigger-chart-search-index.result }},
        wechat=${{ needs.push-xhs-notes-wechat-drafts.result }},
        translation_plan=${{ needs.plan-portal-translated-reports.result }},
        translation_shards=${{ needs.translate-report-shard.result }},
        translated=${{ needs.build-portal-translated-reports.result }},
        translated_wechat=${{ needs.push-portal-translated-wechat-drafts.result }},
        customer_content=${{ needs.publish-customer-content.result }},
        handoff_cleanup=${{ needs.cleanup-private-handoff.result }}
    secrets: inherit
