name: Dropbox latest PDFs to Xiaohongshu notes

on:
  workflow_dispatch:
    inputs:
      dropbox_root:
        description: "Dropbox root folder containing date-named backup folders"
        required: true
        default: "/zip_backup"
      model:
        description: "DeepSeek model for note/article/podcast generation"
        required: true
        default: "deepseek-chat"
      deepseek_base_url:
        description: "DeepSeek API base URL"
        required: true
        default: "https://api.deepseek.com"
      mineru_model:
        description: "MinerU model_version, usually vlm or pipeline"
        required: true
        default: "vlm"
      language:
        description: "MinerU OCR language code, e.g. en, ch, ch_server"
        required: true
        default: "en"
      ocr:
        description: "Enable OCR for scanned/image PDFs"
        required: true
        default: "true"
      batch_size:
        description: "How many PDFs to send to MinerU per batch"
        required: true
        default: "5"
      wechat_length:
        description: "Target Chinese character count for WeChat article"
        required: true
        default: "3000"
      community_cta:
        description: "CTA sentence for the WeChat article"
        required: true
        default: "加入社群，领取完整研报解读与原始图表。"
      podcast_minutes:
        description: "Target length for Chinese and English AI podcast script"
        required: true
        default: "5"
      generate_audio:
        description: "Generate separate Chinese/English WAV and MP4 videos. Keep false for large Dropbox batches."
        required: true
        type: boolean
        default: false
      tts_engine:
        description: "TTS engine: edge gives better natural voices; piper is fully local/open-source fallback"
        required: true
        default: "edge"
      commit_results:
        description: "Commit generated outputs back to this branch"
        required: true
        type: boolean
        default: true
  schedule:
    # GitHub cron is UTC. 01:00 UTC = 09:00 Asia/Shanghai.
    - cron: "0 1 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dropbox-latest-pdf-to-xhs.yml"
      - "scripts/download_dropbox_latest_pdfs.py"
      - "scripts/run_pdf_to_xhs_in_batches.py"
      - "scripts/pdf_to_xhs_batch.py"
      - "scripts/postprocess_podcast.py"
      - "scripts/finalize_outputs.py"
      - "prompts/**"

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  dropbox-latest-pdf-to-xhs:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve workflow inputs
        id: vars
        run: |
          echo "dropbox_root=${{ github.event.inputs.dropbox_root || '/zip_backup' }}" >> "$GITHUB_OUTPUT"
          echo "model=${{ github.event.inputs.model || 'deepseek-chat' }}" >> "$GITHUB_OUTPUT"
          echo "deepseek_base_url=${{ github.event.inputs.deepseek_base_url || 'https://api.deepseek.com' }}" >> "$GITHUB_OUTPUT"
          echo "mineru_model=${{ github.event.inputs.mineru_model || 'vlm' }}" >> "$GITHUB_OUTPUT"
          echo "language=${{ github.event.inputs.language || 'en' }}" >> "$GITHUB_OUTPUT"
          echo "ocr=${{ github.event.inputs.ocr || 'true' }}" >> "$GITHUB_OUTPUT"
          echo "batch_size=${{ github.event.inputs.batch_size || '5' }}" >> "$GITHUB_OUTPUT"
          echo "wechat_length=${{ github.event.inputs.wechat_length || '3000' }}" >> "$GITHUB_OUTPUT"
          echo "community_cta=${{ github.event.inputs.community_cta || '加入社群，领取完整研报解读与原始图表。' }}" >> "$GITHUB_OUTPUT"
          echo "podcast_minutes=${{ github.event.inputs.podcast_minutes || '5' }}" >> "$GITHUB_OUTPUT"
          echo "generate_audio=${{ github.event.inputs.generate_audio || 'false' }}" >> "$GITHUB_OUTPUT"
          echo "tts_engine=${{ github.event.inputs.tts_engine || 'edge' }}" >> "$GITHUB_OUTPUT"
          echo "commit_results=${{ github.event.inputs.commit_results || 'true' }}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Chinese fonts for cover images
        timeout-minutes: 5
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-arphic-ukai

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install TTS and video tools
        if: ${{ steps.vars.outputs.generate_audio == 'true' }}
        timeout-minutes: 18
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install edge-tts==6.1.12
          if [ "${{ steps.vars.outputs.tts_engine }}" = "piper" ]; then
            sudo apt-get install -y espeak-ng
            pip install piper-tts==1.2.0
            mkdir -p .piper-voices
            curl -L --retry 3 -o .piper-voices/zh_CN-huayan-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/zh/zh_CN/huayan/medium/zh_CN-huayan-medium.onnx
            curl -L --retry 3 -o .piper-voices/zh_CN-huayan-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/zh/zh_CN/huayan/medium/zh_CN-huayan-medium.onnx.json
            curl -L --retry 3 -o .piper-voices/en_US-lessac-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx
            curl -L --retry 3 -o .piper-voices/en_US-lessac-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json
          fi

      - name: Download PDFs from latest Dropbox date folder
        id: dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          python scripts/download_dropbox_latest_pdfs.py \
            --dropbox-root "${{ steps.vars.outputs.dropbox_root }}" \
            --output-dir "_dropbox_latest_pdfs"

      - name: Generate Xiaohongshu notes and WeChat articles from Dropbox PDFs
        env:
          MINER_U: ${{ secrets.MINER_U }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ steps.vars.outputs.deepseek_base_url }}
        run: |
          OUTPUT_DIR="xhs_notes/dropbox/${{ steps.dropbox.outputs.latest_folder }}"
          mkdir -p "$OUTPUT_DIR"
          cp "_dropbox_latest_pdfs/dropbox_manifest.json" "$OUTPUT_DIR/dropbox_manifest.json"
          python scripts/run_pdf_to_xhs_in_batches.py \
            --input-dir "_dropbox_latest_pdfs" \
            --output-dir "$OUTPUT_DIR" \
            --batch-size "${{ steps.vars.outputs.batch_size }}" \
            --continue-on-batch-error true \
            --model "${{ steps.vars.outputs.model }}" \
            --deepseek-base-url "${{ steps.vars.outputs.deepseek_base_url }}" \
            --mineru-model "${{ steps.vars.outputs.mineru_model }}" \
            --language "${{ steps.vars.outputs.language }}" \
            --ocr "${{ steps.vars.outputs.ocr }}" \
            --wechat-length "${{ steps.vars.outputs.wechat_length }}" \
            --community-cta "${{ steps.vars.outputs.community_cta }}"

      - name: Post-process WeChat images and generate AI podcast scripts
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ steps.vars.outputs.deepseek_base_url }}
        run: |
          OUTPUT_DIR="xhs_notes/dropbox/${{ steps.dropbox.outputs.latest_folder }}"
          python scripts/postprocess_podcast.py \
            --output-dir "$OUTPUT_DIR" \
            --model "${{ steps.vars.outputs.model }}" \
            --deepseek-base-url "${{ steps.vars.outputs.deepseek_base_url }}" \
            --podcast-minutes "${{ steps.vars.outputs.podcast_minutes }}" \
            --generate-audio "${{ steps.vars.outputs.generate_audio }}" \
            --tts-engine "${{ steps.vars.outputs.tts_engine }}"

      - name: Finalize outputs, sanitize brands, and generate Xianyu notes
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ steps.vars.outputs.deepseek_base_url }}
        run: |
          OUTPUT_DIR="xhs_notes/dropbox/${{ steps.dropbox.outputs.latest_folder }}"
          python scripts/finalize_outputs.py \
            --output-dir "$OUTPUT_DIR" \
            --model "${{ steps.vars.outputs.model }}" \
            --deepseek-base-url "${{ steps.vars.outputs.deepseek_base_url }}" \
            --generate-xianyu true

      - name: Upload generated outputs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dropbox-xhs-notes-${{ steps.dropbox.outputs.latest_folder }}
          path: xhs_notes/dropbox/${{ steps.dropbox.outputs.latest_folder }}
          if-no-files-found: error

      - name: Commit generated outputs
        if: ${{ steps.vars.outputs.commit_results == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "xhs_notes/dropbox/${{ steps.dropbox.outputs.latest_folder }}"
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Generate outputs from Dropbox PDFs ${{ steps.dropbox.outputs.latest_folder }}"
            git push
          fi
