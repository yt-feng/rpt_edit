name: Portal Ops Jianguoyun Daily Retention

on:
  workflow_dispatch:
  schedule:
    # 08:30 every day in Beijing and Hong Kong (GitHub cron uses UTC).
    - cron: "30 0 * * *"

permissions:
  contents: read

concurrency:
  group: portal-ops-jianguoyun-retention
  cancel-in-progress: false

jobs:
  cleanup:
    if: ${{ vars.PORTAL_AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout cleanup client
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/portal-ops-jianguoyun-sync.yml
            .github/workflows/portal-ops-jianguoyun-retention.yml
            scripts/render_private_config.py
            scripts/sync_ops_videos_to_jianguoyun.py
            scripts/test_sync_ops_videos_to_jianguoyun.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Test Jianguoyun WebDAV client
        run: python -B scripts/test_sync_ops_videos_to_jianguoyun.py

      - name: Materialize private sync runtime values
        env:
          PORTAL_PRIVATE_CONFIG_B64: ${{ secrets.PORTAL_PRIVATE_CONFIG_B64 }}
        run: |
          python -B scripts/render_private_config.py \
            --root scripts/sync_ops_videos_to_jianguoyun.py \
            --github-add-mask \
            --skip-generated-files
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import sync_ops_videos_to_jianguoyun as sync

          if sync.DEFAULT_REMOTE_ROOT == "/我的坚果云/Portal Suite/Ops":
              raise SystemExit("private operations root was not materialized")
          print("Private operations root materialized")
          PY

      - name: Remove operations folders outside the three-day window
        env:
          JIANGUOYUN_WEBDAV_URL: ${{ secrets.JIANGUOYUN_WEBDAV_URL }}
          JIANGUOYUN_WEBDAV_USERNAME: ${{ secrets.JIANGUOYUN_WEBDAV_USERNAME }}
          JIANGUOYUN_WEBDAV_PASSWORD: ${{ secrets.JIANGUOYUN_WEBDAV_PASSWORD }}
        run: |
          python scripts/sync_ops_videos_to_jianguoyun.py \
            --cleanup-only \
            --retention-days 3
