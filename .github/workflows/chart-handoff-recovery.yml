name: One-time chart handoff recovery

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Parent run whose publish-ready artifact contains the chart inputs"
        required: true
        default: "31900339633"
      date_folder:
        description: "Date folder encoded in the recovered handoff"
        required: true
        default: "260815"
      artifact_name:
        description: "Exact publish-ready artifact name"
        required: true
        default: "publish-ready-260815-31900339633"
      expected_shards:
        description: "Exact shard count to materialize and restore"
        required: true
        default: "12"

permissions:
  actions: write
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      DATE_FOLDER: ${{ inputs.date_folder }}
      ARTIFACT_NAME: ${{ inputs.artifact_name }}
      EXPECTED_SHARDS: ${{ inputs.expected_shards }}
      HANDOFF_ROOT: _private-workflow-handoff/xhs
      PORTAL_SITE_URL: ${{ secrets.PORTAL_SITE_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
    steps:
      - name: Validate exact recovery target
        run: |
          set -euo pipefail
          printf '%s' "$SOURCE_RUN_ID" | grep -Eq '^[0-9]+$'
          printf '%s' "$DATE_FOLDER" | grep -Eq '^[0-9]{6,8}$'
          printf '%s' "$ARTIFACT_NAME" | grep -Eq '^[A-Za-z0-9._-]+$'
          printf '%s' "$EXPECTED_SHARDS" | grep -Eq '^[1-9][0-9]?$'
          for name in PORTAL_SITE_URL R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            value="$(printenv "$name")"
            if [ -z "$value" ]; then
              echo "::error::Missing required recovery configuration: $name"
              exit 1
            fi
            echo "::add-mask::$value"
          done
          python - <<'PY'
          import os
          from urllib.parse import urlsplit

          parsed = urlsplit(os.environ["PORTAL_SITE_URL"])
          if parsed.scheme != "https" or not parsed.hostname or parsed.path not in {"", "/"}:
              raise SystemExit("PORTAL_SITE_URL must be a bare HTTPS origin")
          PY

      - name: Checkout recovery scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /scripts/materialize_shard_artifacts.py
            /scripts/private_workflow_handoff.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install private handoff dependency
        run: python -m pip install --disable-pip-version-check boto3

      - name: Download and materialize retained publish-ready artifact
        run: |
          set -euo pipefail
          ARTIFACT_ROOT="$RUNNER_TEMP/chart-handoff-artifact"
          DIAGNOSTICS_ROOT="$RUNNER_TEMP/chart-handoff-diagnostics"
          RECOVERED_ROOT="$RUNNER_TEMP/chart-handoff-recovered"
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir "$ARTIFACT_ROOT"
          python scripts/materialize_shard_artifacts.py \
            --artifact-root "$ARTIFACT_ROOT" \
            --destination "$RECOVERED_ROOT" \
            --expected-shards "$EXPECTED_SHARDS" \
            --expected-date "$DATE_FOLDER" \
            --require-images
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "final-dropbox-shard-diagnostics-$DATE_FOLDER-*" \
            --dir "$DIAGNOSTICS_ROOT"
          export DIAGNOSTICS_ROOT RECOVERED_ROOT
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          diagnostics_root = Path(os.environ["DIAGNOSTICS_ROOT"])
          recovered_root = Path(os.environ["RECOVERED_ROOT"])
          date_folder = os.environ["DATE_FOLDER"]
          expected_shards = int(os.environ["EXPECTED_SHARDS"])
          restored = 0
          for shard_index in range(expected_shards):
              diagnostics = diagnostics_root / f"final-dropbox-shard-diagnostics-{date_folder}-{shard_index}"
              summary = json.loads((diagnostics / "summary.json").read_text(encoding="utf-8"))
              if not isinstance(summary, list):
                  raise SystemExit(f"Invalid diagnostics summary for shard {shard_index}")
              final_names = []
              for line in (diagnostics / "finalize_progress.log").read_text(
                  encoding="utf-8", errors="replace"
              ).splitlines():
                  match = re.fullmatch(r"Generating Xianyu note for (.+)", line.strip())
                  if match and match.group(1) not in final_names:
                      final_names.append(match.group(1))

              source_by_slot = {}
              for record in summary:
                  source_pdf = str(record.get("source_pdf") or "") if isinstance(record, dict) else ""
                  match = re.match(r"^(\d{4})-", Path(source_pdf).name)
                  if not match or match.group(1) in source_by_slot:
                      raise SystemExit(f"Invalid source-title mapping for shard {shard_index}")
                  source_by_slot[match.group(1)] = source_pdf
              final_by_slot = {}
              for final_name in final_names:
                  match = re.match(r"^(\d{4})-", final_name)
                  if not match or match.group(1) in final_by_slot:
                      raise SystemExit(f"Invalid final-directory mapping for shard {shard_index}")
                  final_by_slot[match.group(1)] = final_name
              if set(source_by_slot) != set(final_by_slot):
                  raise SystemExit(
                      f"Diagnostics mapping mismatch for shard {shard_index}: "
                      f"sources={len(source_by_slot)}, reports={len(final_by_slot)}"
                  )

              shard_root = recovered_root / f"shard_{shard_index}"
              for slot, final_name in final_by_slot.items():
                  report_root = shard_root / final_name
                  if not report_root.is_dir():
                      raise SystemExit(f"Recovered report directory is missing for shard {shard_index}")
                  (report_root / "status.json").write_text(
                      json.dumps({"source_pdf": source_by_slot[slot]}, ensure_ascii=False) + "\n",
                      encoding="utf-8",
                  )
                  restored += 1
          print(f"Restored canonical report-title metadata={restored}")
          PY

      - name: Restore exact private handoff
        run: |
          set -euo pipefail
          PREFIX="$HANDOFF_ROOT/$SOURCE_RUN_ID/$DATE_FOLDER"
          export PREFIX EXPECTED_SHARDS
          RECOVERY_STATE="$(python - <<'PY'
          import os
          import sys
          sys.path.insert(0, "scripts")
          from private_workflow_handoff import list_keys

          prefix = os.environ["PREFIX"].strip("/")
          count = int(os.environ["EXPECTED_SHARDS"])
          expected = {f"{prefix}/shard_{index}.tar.gz" for index in range(count)}
          keys = list_keys(os.environ["PREFIX"])
          if not keys:
              print("empty")
          elif set(keys) == expected:
              print("complete")
          else:
              raise SystemExit(
                  f"Recovery prefix contains an unexpected partial set: "
                  f"expected={count}, actual={len(keys)}"
              )
          PY
          )"
          if [ "$RECOVERY_STATE" = "empty" ]; then
            for INDEX in $(seq 0 $((EXPECTED_SHARDS - 1))); do
              SOURCE="$RUNNER_TEMP/chart-handoff-recovered/shard_$INDEX"
              test -d "$SOURCE"
              python scripts/private_workflow_handoff.py upload-dir \
                --source "$SOURCE" \
                --key "$PREFIX/shard_$INDEX.tar.gz"
            done
          elif [ "$RECOVERY_STATE" = "complete" ]; then
            echo "Recovered handoff is already complete; reusing the verified object set."
          else
            echo "::error::Unexpected recovery state: $RECOVERY_STATE"
            exit 1
          fi
          python - <<'PY'
          import os
          import sys
          sys.path.insert(0, "scripts")
          from private_workflow_handoff import list_keys

          prefix = os.environ["PREFIX"].strip("/")
          count = int(os.environ["EXPECTED_SHARDS"])
          expected = {f"{prefix}/shard_{index}.tar.gz" for index in range(count)}
          actual = list_keys(prefix)
          if set(actual) != expected:
              raise SystemExit(f"Recovered handoff validation failed: expected={count}, actual={len(actual)}")
          print(f"Recovered private handoff objects={len(actual)}")
          PY

      - name: Restore last deployed chart index baseline
        run: |
          set -euo pipefail
          BASELINE="$RUNNER_TEMP/last-deployed-chart-index.json"
          curl --fail --location --silent --show-error --max-time 90 \
            "${PORTAL_SITE_URL%/}/data/chart_search_index.json?recovery=$GITHUB_RUN_ID" \
            --output "$BASELINE"
          export BASELINE
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import boto3
          from botocore.config import Config

          path = Path(os.environ["BASELINE"])
          payload = json.loads(path.read_text(encoding="utf-8"))
          reports = payload.get("reports") if isinstance(payload, dict) else None
          actual_items = sum(
              len(report.get("charts") or [])
              for report in reports or []
              if isinstance(report, dict)
          )
          if (
              int(payload.get("schema_version") or 0) != 1
              or not isinstance(reports, list)
              or int(payload.get("report_count") or -1) != 221
              or len(reports) != 221
              or int(payload.get("item_count") or -1) != 833
              or actual_items != 833
          ):
              raise SystemExit("Last deployed chart index no longer matches the verified pre-260815 baseline")

          client = boto3.client(
              "s3",
              endpoint_url=f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com",
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto",
              config=Config(retries={"max_attempts": 8, "mode": "adaptive"}),
          )
          client.put_object(
              Bucket=os.environ["R2_BUCKET"],
              Key="_chart-search/v1/index.json",
              Body=path.read_bytes(),
              ContentType="application/json; charset=utf-8",
              CacheControl="private, no-store",
          )
          print("Restored verified chart baseline reports=221 charts=833")
          PY

      - name: Dispatch and wait for canonical chart repair
        run: |
          set -euo pipefail
          RUN_URL="$(gh workflow run portal-chart-search-index.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f date_folder="$DATE_FOLDER" \
            -f source_handoff_run_id="$SOURCE_RUN_ID" \
            -f expected_shards="$EXPECTED_SHARDS" \
            -f max_images=0 \
            -f retry_errors_now=true)"
          CHART_RUN_ID="${RUN_URL##*/}"
          if ! printf '%s' "$CHART_RUN_ID" | grep -Eq '^[1-9][0-9]*$'; then
            echo "::error::Unable to resolve canonical chart repair run from: $RUN_URL"
            exit 1
          fi
          echo "::notice::Waiting for canonical chart repair run $CHART_RUN_ID."
          gh run watch "$CHART_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --compact \
            --exit-status \
            --interval 15

      - name: Remove reconstructed private handoff after success
        run: |
          set -euo pipefail
          PREFIX="$HANDOFF_ROOT/$SOURCE_RUN_ID/$DATE_FOLDER"
          python scripts/private_workflow_handoff.py delete-prefix --prefix "$PREFIX"
