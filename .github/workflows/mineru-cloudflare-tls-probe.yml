name: MinerU Cloudflare TLS Probe

on:
  pull_request:
    paths:
      - '.github/workflows/mineru-cloudflare-tls-probe.yml'
      - 'scripts/probe_mineru_cloudflare_tls.py'
      - 'scripts/test_probe_mineru_cloudflare_tls.py'
      - 'workers/mineru-result-tls-probe/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mineru-cloudflare-tls-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check --retries 0 requests
      - name: Verify fixed HEAD target, auth and isolated lifecycle offline
        run: python3 -B scripts/test_probe_mineru_cloudflare_tls.py

  probe:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Cloudflare API client dependency
        run: python3 -m pip install --disable-pip-version-check --retries 0 requests
      - name: One CDN HEAD from a temporary Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
        run: python3 -B scripts/probe_mineru_cloudflare_tls.py
      - name: Upload sanitized strict HTTPS probe summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mineru-cloudflare-tls-probe-${{ github.run_id }}
          path: artifacts/mineru-cloudflare-tls-probe.json
          if-no-files-found: warn
          retention-days: 7
