name: Neutral edge runner recovery

on:
  workflow_run:
    workflows: [Neutral edge catalog refresh]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: neutral-edge-runner-recovery-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.run_attempt == 1 &&
      (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_run' || github.event.workflow_run.event == 'repository_dispatch')
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: write
      checks: read
    steps:
      # Execute the recovery policy from trusted main, never downloaded artifacts.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts/recover_neutral_runner_loss.py
          sparse-checkout-cone-mode: false
      - name: Recover one confirmed pre-upload hosted runner loss
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/recover_neutral_runner_loss.py
