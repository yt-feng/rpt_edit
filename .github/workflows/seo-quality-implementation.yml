name: SEO quality implementation

on:
  push:
    branches: [codex/seo-geo-quick-wins-20260923]

permissions:
  contents: read

concurrency:
  group: seo-quality-implementation
  cancel-in-progress: false

jobs:
  apply-and-test:
    if: contains(github.event.head_commit.message, '[apply-seo-patch]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/seo-geo-quick-wins-20260923
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve public patch transport for checksum diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: seo-patch-transport
          path: .seo-quality-patch-*.txt
          include-hidden-files: true
          retention-days: 1
      - name: Apply reviewed patch to this branch only
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'codex/seo-geo-quick-wins-20260923'
          python - <<'PYCODE'
          import base64, hashlib, json, pathlib, zlib
          payload = json.loads(pathlib.Path('.seo-quality-patch.json').read_text())
          names = payload['parts']
          assert all(pathlib.Path(name).name == name and name.startswith('.seo-quality-patch-') and name.endswith('.txt') for name in names)
          chunks = {name: pathlib.Path(name).read_text().strip() for name in names}
          for repair in payload.get('transport_repairs', []):
              name = repair['file']
              assert name in chunks and chunks[name].count(repair['before']) == 1
              chunks[name] = chunks[name].replace(repair['before'], repair['after'], 1)
          encoded = ''.join(chunks[name] for name in names)
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == payload['sha256'], 'Patch checksum mismatch'
          pathlib.Path('/tmp/seo-quality.patch').write_bytes(patch)
          for name in names:
              pathlib.Path(name).unlink()
          PYCODE
          git apply --check /tmp/seo-quality.patch
          git apply --index /tmp/seo-quality.patch
          rm .seo-quality-patch.json
      - name: Run source regression tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'Pillow>=10.1,<12' 'pypdf>=4,<6'
          python -m unittest discover -s scripts -p 'test_portal_discovery_quality.py' -v
          python scripts/test_portal_seo.py
          python scripts/test_portal_blog_build.py
          python scripts/test_translate_portal_titles.py
          python scripts/test_wechat_article_quality.py
          python scripts/test_wechat_output_contract.py
          python scripts/test_audit_portal_seo_live.py
          python scripts/check_public_identity.py
          python scripts/test_check_public_brand.py
          python scripts/test_update_blog_archive_from_wechat_drafts.py
          python scripts/test_wechat_filename_titles.py
          python scripts/test_build_portal_locales.py
          python scripts/test_neutral_edge_cutover_workflow.py
          python scripts/test_portal_worker_emergency_deploy_workflow.py
          node --test portal_suite/tests/report-detail-performance.test.mjs portal_suite/tests/text-only-frontend.test.mjs portal_suite/tests/public-brand-boundary.test.mjs
          node --test workers/edge-static-host/test/*.test.mjs
      - name: Commit verified implementation for connected-app finalization
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import pathlib, shutil, subprocess
          files = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '--', '.github/workflows'], text=True).splitlines()
          root = pathlib.Path('.seo-workflow-staging')
          root.mkdir(exist_ok=True)
          for name in files:
              shutil.copyfile(name, root / pathlib.Path(name).name)
          PYCODE
          git restore --staged --worktree .github/workflows
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: implement source-grounded SEO discovery and quality improvements'
          git push origin HEAD:refs/heads/codex/seo-geo-quick-wins-20260923
