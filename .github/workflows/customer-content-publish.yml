name: Publish customer API content

on:
  workflow_call:
    inputs:
      source_run_id:
        required: true
        type: string
      date:
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Existing Daily report run to publish; no new parsing or translation"
        required: true
        type: string
      date:
        description: "Optional source date YYMMDD or YYYY-MM-DD"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: customer-content-publication
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.36,<2'
      - name: Verify publisher offline
        run: python -B scripts/test_publish_customer_content.py
      - name: Verify original workflow identity
        uses: actions/github-script@v7
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        with:
          script: |
            const runId = process.env.SOURCE_RUN_ID;
            if (!/^[1-9][0-9]{0,19}$/.test(runId) || !Number.isSafeInteger(Number(runId))) throw new Error('Invalid source run');
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: Number(runId)});
            // A reusable call consumes this exact Daily run before its cleanup.
            // A manually selected different run must already be completed.
            const sameDailyRun = String(context.runId) === runId && context.workflow === 'Daily report articles and translations';
            if (run.path.split('@')[0] !== '.github/workflows/dropbox-latest-pdf-to-xhs-sharded.yml'
                || run.head_branch !== 'main' || run.head_repository.full_name !== `${context.repo.owner}/${context.repo.repo}`
                || String(run.id) !== runId || (sameDailyRun && run.head_sha !== context.sha)
                || (run.status !== 'completed' && !(sameDailyRun && run.status === 'in_progress')))
              throw new Error('Source must be this main Daily report run or a completed main Daily report run');
      - name: Fetch and validate current public report catalog
        run: |
          python -B scripts/fetch_release_asset.py \
            --url "https://kcdesk.com/data/catalog.json" --output "$RUNNER_TEMP/customer-current-catalog.json" \
            --label "customer-content-current-catalog" --max-time 180 --max-total-time 420 \
            --max-bytes 67108864 --json
          python -B -c 'import sys; from pathlib import Path; sys.path.insert(0, "scripts"); from publish_customer_content import load_catalog; load_catalog(Path(sys.argv[1]))' \
            "$RUNNER_TEMP/customer-current-catalog.json"
      - name: Publish existing report outputs to private delivery storage
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_DATE: ${{ inputs.date || '' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          python -B scripts/publish_customer_content.py \
            --source-run-id "$SOURCE_RUN_ID" --date "$SOURCE_DATE" \
            --catalog "$RUNNER_TEMP/customer-current-catalog.json"
