name: ARK Invest feed to WeChat

# Daily monitor for ARK Invest ("木头姐") RSS updates. New feed items are written
# into xhs_notes/ark, rewritten through the Portal translated article pipeline, uploaded
# to WeChat drafts, and then picked up by the daily market views PDF via extra-roots.

on:
  workflow_dispatch:
    inputs:
      since_days:
        description: "Only process ARK feed items updated/published within this many days"
        required: true
        default: "1"
      max_items:
        description: "Cap new ARK items per run. Use all for every new item."
        required: true
        default: "5"
      include_types:
        description: "Comma list of ARK feed types to process"
        required: true
        default: "Articles,Newsletters,White Papers,Crypto Reports"
      articles_per_draft:
        description: "Number of articles in each WeChat draft item"
        required: true
        default: "8"
      dry_run:
        description: "Build WeChat draft payloads without calling WeChat APIs"
        required: true
        type: boolean
        default: false
      publish:
        description: "Submit created WeChat drafts for publishing (needs publish API access)"
        required: true
        type: boolean
        default: false
      replay_run_id:
        description: "Optional prior workflow run ID whose ARK artifact should be replayed"
        required: false
        default: ""
      replay_date_folder:
        description: "Date folder stored in the replay artifact, for example 260811"
        required: false
        default: ""

  schedule:
    # 06:45 Beijing time (UTC+8), before the market views PDF at 08:00.
    - cron: "45 22 * * *"

permissions:
  contents: write
  actions: read

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: ark-invest-feed-to-wechat
  cancel-in-progress: false

jobs:
  fetch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      date_folder: ${{ steps.handoff.outputs.date_folder }}
      article_count: ${{ steps.handoff.outputs.article_count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pull latest main
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags --prune --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          git reset --hard origin/main
          git clean -fdx

      - name: Resolve optional artifact replay
        id: replay
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPLAY_RUN_ID: ${{ github.event.inputs.replay_run_id || '' }}
          REPLAY_DATE_FOLDER: ${{ github.event.inputs.replay_date_folder || '' }}
        run: |
          if [ -z "$REPLAY_RUN_ID" ] && [ -z "$REPLAY_DATE_FOLDER" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "Artifact replay is available only through workflow_dispatch" >&2
            exit 2
          fi
          if ! [[ "$REPLAY_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "replay_run_id must be a numeric workflow run ID" >&2
            exit 2
          fi
          if ! [[ "$REPLAY_DATE_FOLDER" =~ ^[0-9]{6}$ ]]; then
            echo "replay_date_folder must contain exactly 6 digits" >&2
            exit 2
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "run_id=$REPLAY_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "date_folder=$REPLAY_DATE_FOLDER" >> "$GITHUB_OUTPUT"

      - name: Download prior ARK run artifact
        if: ${{ steps.replay.outputs.enabled == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: ark-invest-feed-run-${{ steps.replay.outputs.date_folder }}-${{ steps.replay.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.replay.outputs.run_id }}
          path: .

      - name: Validate replayed ARK articles
        id: replay_artifact
        if: ${{ steps.replay.outputs.enabled == 'true' }}
        env:
          DATE_FOLDER: ${{ steps.replay.outputs.date_folder }}
        run: |
          TRANSLATED_DIR="portal_translated_reports/ark/$DATE_FOLDER"
          SUMMARY="$TRANSLATED_DIR/translation_summary.json"
          if [ ! -d "$TRANSLATED_DIR" ]; then
            echo "Replayed ARK artifact is missing $TRANSLATED_DIR" >&2
            exit 1
          fi
          if [ ! -f "$SUMMARY" ]; then
            echo "Replayed ARK artifact is missing $SUMMARY" >&2
            exit 1
          fi
          ARTICLE_COUNT="$(find "$TRANSLATED_DIR" -type f -name translated.md -size +0c | wc -l | tr -d '[:space:]')"
          if ! [[ "$ARTICLE_COUNT" =~ ^[1-9][0-9]*$ ]]; then
            echo "Replayed ARK artifact has no translated articles in $TRANSLATED_DIR" >&2
            exit 1
          fi
          SUMMARY_DATE="$(jq -r '.date_folder // empty' "$SUMMARY")"
          SUMMARY_COUNT="$(jq -r '.successful_count // empty' "$SUMMARY")"
          if [ "$SUMMARY_DATE" != "$DATE_FOLDER" ] || [ "$SUMMARY_COUNT" != "$ARTICLE_COUNT" ]; then
            echo "Replayed ARK summary does not match date/count: date=$SUMMARY_DATE count=$SUMMARY_COUNT actual=$ARTICLE_COUNT" >&2
            exit 1
          fi
          echo "date_folder=$DATE_FOLDER" >> "$GITHUB_OUTPUT"
          echo "article_count=$ARTICLE_COUNT" >> "$GITHUB_OUTPUT"
          echo "::notice::Replaying $ARTICLE_COUNT ARK article(s) from run ${{ steps.replay.outputs.run_id }}."

      - name: Set up Python
        if: ${{ steps.replay.outputs.enabled != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Verify ARK workflow handoff contract
        if: ${{ steps.replay.outputs.enabled != 'true' }}
        run: python scripts/test_ark_workflow_contract.py

      - name: Install Python dependencies
        if: ${{ steps.replay.outputs.enabled != 'true' }}
        run: |
          pip install -r requirements.txt
          pip install reportlab

      - name: Install Chinese fonts
        if: ${{ steps.replay.outputs.enabled != 'true' }}
        timeout-minutes: 5
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Fetch new ARK feed items
        id: fetch
        if: ${{ steps.replay.outputs.enabled != 'true' }}
        run: |
          set -o pipefail
          DATE="$(TZ=Asia/Shanghai date +%y%m%d)"
          python scripts/fetch_ark_invest_feed.py \
            --output-root "xhs_notes/ark" \
            --date "$DATE" \
            --since-days "${{ github.event.inputs.since_days || '1' }}" \
            --max-items "${{ github.event.inputs.max_items || '5' }}" \
            --include-types "${{ github.event.inputs.include_types || 'Articles,Newsletters,White Papers,Crypto Reports' }}" \
            2>&1 | tee ark_feed_progress.log

      - name: Build ARK Portal translated articles
        if: ${{ steps.replay.outputs.enabled != 'true' && steps.fetch.outputs.article_count != '0' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_API_KEY_BACKUP: ${{ secrets.DEEPSEEK_API_KEY_BACKUP }}
          DEEPSEEK_BASE_URL: "https://api.deepseek.com"
        run: |
          set -o pipefail
          DATE="${{ steps.fetch.outputs.date_folder }}"
          python scripts/build_portal_translated_reports.py \
            --dropbox-output-root "xhs_notes/ark" \
            --date-folder "$DATE" \
            --output-root "portal_translated_reports/ark" \
            --max-reports "all" \
            --title-guard \
            2>&1 | tee ark_translated_progress.log

      - name: Commit ARK feed state
        if: ${{ steps.replay.outputs.enabled != 'true' && steps.fetch.outputs.article_count != '0' }}
        run: |
          bash scripts/commit_output_dir.sh "ark_invest_feed" "Update ARK Invest feed archive" 8

      - name: Resolve artifact handoff metadata
        id: handoff
        env:
          REPLAY_ENABLED: ${{ steps.replay.outputs.enabled }}
          REPLAY_DATE_FOLDER: ${{ steps.replay_artifact.outputs.date_folder }}
          REPLAY_ARTICLE_COUNT: ${{ steps.replay_artifact.outputs.article_count }}
          FETCH_DATE_FOLDER: ${{ steps.fetch.outputs.date_folder }}
          FETCH_ARTICLE_COUNT: ${{ steps.fetch.outputs.article_count }}
        run: |
          if [ "$REPLAY_ENABLED" = "true" ]; then
            DATE_FOLDER="$REPLAY_DATE_FOLDER"
            ARTICLE_COUNT="$REPLAY_ARTICLE_COUNT"
          else
            DATE_FOLDER="$FETCH_DATE_FOLDER"
            ARTICLE_COUNT="$FETCH_ARTICLE_COUNT"
          fi
          if ! [[ "$DATE_FOLDER" =~ ^[0-9]{6}$ ]] || ! [[ "$ARTICLE_COUNT" =~ ^[0-9]+$ ]]; then
            echo "Unable to resolve ARK artifact handoff metadata" >&2
            exit 1
          fi
          echo "date_folder=$DATE_FOLDER" >> "$GITHUB_OUTPUT"
          echo "article_count=$ARTICLE_COUNT" >> "$GITHUB_OUTPUT"
          echo "::notice::ARK handoff date=$DATE_FOLDER article_count=$ARTICLE_COUNT replay=$REPLAY_ENABLED."

      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ark-invest-feed-run-${{ steps.handoff.outputs.date_folder }}-${{ github.run_id }}
          path: |
            ark_invest_feed/ark_feed_run_manifest.json
            ark_feed_progress.log
            ark_translated_progress.log
            xhs_notes/ark
            portal_translated_reports/ark
          if-no-files-found: error
          overwrite: true

  upload-wechat-drafts:
    needs: fetch-and-build
    if: ${{ needs.fetch-and-build.outputs.article_count != '0' }}
    runs-on: [self-hosted, wechat-draft]
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            scripts
            prompts
            portal_suite/data/blog_archive
            requirements.txt
            portal_translated_reports/ark/${{ needs.fetch-and-build.outputs.date_folder }}
            wechat_drafts/ark/${{ needs.fetch-and-build.outputs.date_folder }}

      - name: Pull latest generated ARK articles
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git sparse-checkout set --no-cone \
            .github \
            scripts \
            prompts \
            portal_suite/data/blog_archive \
            requirements.txt \
            "portal_translated_reports/ark/${{ needs.fetch-and-build.outputs.date_folder }}" \
            "wechat_drafts/ark/${{ needs.fetch-and-build.outputs.date_folder }}"
          git fetch --filter=blob:none --no-tags --prune --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          git reset --hard origin/main
          git clean -fdx

      - name: Download generated ARK article artifact
        uses: actions/download-artifact@v4
        with:
          name: ark-invest-feed-run-${{ needs.fetch-and-build.outputs.date_folder }}-${{ github.run_id }}
          path: .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Materialize private publishing image
        env:
          PORTAL_PRIVATE_PUBLISH_ASSET_KEY: ${{ secrets.PORTAL_PRIVATE_PUBLISH_ASSET_KEY }}
        run: bash scripts/materialize_private_social_asset.sh prompts

      - name: Build and upload WeChat drafts
        env:
          WECHAT_MP_APPID: ${{ secrets.WECHAT_MP_APPID }}
          WECHAT_MP_APPSECRET: ${{ secrets.WECHAT_MP_APPSECRET }}
          PORTAL_SITE_URL: ${{ secrets.PORTAL_SITE_URL }}
        run: |
          set -o pipefail
          DATE="${{ needs.fetch-and-build.outputs.date_folder }}"
          TRANSLATED_DIR="portal_translated_reports/ark/$DATE"
          if [ ! -d "$TRANSLATED_DIR" ]; then
            echo "::error::Generated ARK artifact is missing $TRANSLATED_DIR."
            exit 1
          fi

          ARGS=()
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ "${{ github.event.inputs.publish || 'false' }}" = "true" ]; then
            ARGS+=(--publish)
          fi

          python scripts/push_portal_translated_to_wechat_drafts.py \
            --translated-root "portal_translated_reports/ark" \
            --date-folder "$DATE" \
            --output-root "wechat_drafts/ark" \
            --max-articles "all" \
            --articles-per-draft "${{ github.event.inputs.articles_per_draft || '8' }}" \
            --max-body-chars "1200" \
            --min-inline-images "3" \
            --max-inline-images "3" \
            "${ARGS[@]}" 2>&1 | tee ark_wechat_progress.log

      - name: Archive WeChat draft diagnostics
        uses: ./.github/actions/resilient-diagnostic-artifact
        with:
          name: ark-invest-wechat-drafts-${{ needs.fetch-and-build.outputs.date_folder }}-${{ github.run_id }}
          path: |
            wechat_drafts/ark
            ark_wechat_progress.log
          if-no-files-found: ignore

      - name: Update public Blog archive
        run: |
          python scripts/update_blog_archive_from_wechat_drafts.py \
            --wechat-drafts-root wechat_drafts \
            --blog-archive-root portal_suite/data/blog_archive

      - name: Commit public Blog archive
        run: |
          DATE="${{ needs.fetch-and-build.outputs.date_folder }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- portal_suite/data/blog_archive
          if git diff --cached --quiet; then
            echo "No Blog archive changes for $DATE."
            exit 0
          fi
          git commit -m "Archive ARK Blog articles $DATE"
          bash scripts/push_main_with_rebase_retry.sh 5

  notify-failure:
    needs: [fetch-and-build, upload-wechat-drafts]
    if: ${{ always() && !cancelled() && contains(needs.*.result, 'failure') }}
    uses: ./.github/workflows/portal-ops-alert.yml
    with:
      source_workflow: ARK Invest feed to WeChat
      source_results: >-
        build=${{ needs.fetch-and-build.result }},
        wechat=${{ needs.upload-wechat-drafts.result }}
    secrets: inherit
