name: Verify title placeholder retry
on:
  push:
    branches: [codex/seo-geo-quick-wins-20260923]
    paths: [.github/workflows/seo-title-placeholder-repair.yml]
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/seo-geo-quick-wins-20260923
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded retry and regression tests
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'codex/seo-geo-quick-wins-20260923'
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/translate_portal_titles.py')
          s = p.read_text()
          old = '''        translated = normalize_translation(args._offline_translator.translate(
                      protected, target="zh", source=_detect_source(title), markdown=False))
                  for token, value in identifiers.items():
                      if translated.count(token) != 1:
                          raise RuntimeError("Offline model changed a protected title identifier")
                      translated = translated.replace(token, value)
          '''
          old = old.replace('\n          ', '\n')
          new = '''        def translate_checked(model_input: str) -> str:
                      result = normalize_translation(args._offline_translator.translate(
                          model_input, target="zh", source=_detect_source(title), markdown=False))
                      if any(result.count(token) != 1 for token in identifiers):
                          raise RuntimeError("Offline model changed a protected title identifier")
                      return result
          
                  try:
                      translated = translate_checked(protected)
                  except RuntimeError as error:
                      # Some titles attach a filename sentinel directly to a word. Retry
                      # once with visible token boundaries; never repair model output or
                      # relax the existing placeholder/financial-quantity validators.
                      spaced = re.sub(r"(__KC_PH_[0-9]+__)", r" \\1 ", protected)
                      spaced = re.sub(r"\\s+", " ", spaced).strip()
                      placeholder_error = any(message in str(error) for message in (
                          "protected placeholder", "protected title identifier",
                      ))
                      if not identifiers or not placeholder_error or spaced == protected:
                          raise
                      translated = translate_checked(spaced)
                  for token, value in identifiers.items():
                      translated = translated.replace(token, value)
          '''
          new = new.replace('\n          ', '\n')
          assert s.count(old) == 1, 'Unexpected translation source; do not overwrite'
          p.write_text(s.replace(old, new, 1))
          p = Path('scripts/test_portal_discovery_quality.py')
          s = p.read_text()
          marker = '    def test_existing_catalog_repairs_without_model_request(self):'
          tests = '''    def test_placeholder_failure_retries_once_with_visible_boundaries(self):
                  translator = mock.Mock()
                  translator.translate.side_effect = [
                      RuntimeError("Hy-MT2 changed, omitted, or duplicated a protected placeholder"),
                      "__KC_PH_0001__-香港股票策略专家访谈要点 __KC_PH_0000__",
                  ]
                  result = titles.translate_title(
                      'JPM-Hong Kong Equity Strategy Expert Call takeaways-260918',
                      Namespace(_offline_translator=translator),
                  )
                  self.assertEqual(result, '摩根大通-香港股票策略专家访谈要点 -260918')
                  self.assertEqual(translator.translate.call_count, 2)
                  self.assertIn('takeaways __KC_PH_0000__', translator.translate.call_args.args[0])
          
              def test_retry_never_accepts_damaged_output_or_loops(self):
                  translator = mock.Mock()
                  translator.translate.return_value = '没有保留标识符'
                  with self.assertRaisesRegex(RuntimeError, 'protected title identifier'):
                      titles.translate_title('JPM-Outlook-260918', Namespace(_offline_translator=translator))
                  self.assertEqual(translator.translate.call_count, 2)
          
              def test_quantity_failure_is_not_retried_as_a_placeholder_error(self):
                  translator = mock.Mock()
                  translator.translate.side_effect = RuntimeError('financial quantity mismatch')
                  with self.assertRaisesRegex(RuntimeError, 'financial quantity mismatch'):
                      titles.translate_title('JPM-Growth 12.5%-260918', Namespace(_offline_translator=translator))
                  self.assertEqual(translator.translate.call_count, 1)
          
          '''
          tests = tests.replace('\n          ', '\n')
          assert s.count(marker) == 1, 'Unexpected regression source'
          p.write_text(s.replace(marker, tests + marker, 1))
          PY
      - name: Validate unchanged safety boundaries
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pip install requests Pillow
          python scripts/test_portal_discovery_quality.py
          python scripts/test_translate_portal_titles.py
          python scripts/test_financial_quantity_integrity.py
          python scripts/test_hymt_offline_translation.py
          git diff --check
      - name: Commit verified changes to implementation branch only
        run: |
          set -euo pipefail
          git add scripts/translate_portal_titles.py scripts/test_portal_discovery_quality.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: retry protected title tokens once with explicit word boundaries'
          git push origin HEAD:refs/heads/codex/seo-geo-quick-wins-20260923
