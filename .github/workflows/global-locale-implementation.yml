name: Verify global locale implementation
on:
  push:
    branches: [codex/global-offline-locales-20260923]
permissions:
  contents: read
concurrency:
  group: global-locale-implementation
  cancel-in-progress: false
jobs:
  verify:
    if: contains(github.event.head_commit.message, '[apply-global-locales]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/global-offline-locales-20260923
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate checksum and apply only to the implementation branch
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'codex/global-offline-locales-20260923'
          python - <<'PY'
          import base64, hashlib, json, lzma, pathlib
          manifest = json.loads(pathlib.Path('.global-locale-patch.json').read_text())
          names = manifest['parts']
          assert all(pathlib.Path(name).name == name and name.startswith('.global-locale-patch-') and name.endswith('.txt') for name in names)
          patch = lzma.decompress(base64.b64decode(''.join(pathlib.Path(name).read_text().strip() for name in names), validate=True))
          assert hashlib.sha256(patch).hexdigest() == manifest['sha256'], 'Patch checksum differs'
          pathlib.Path('/tmp/global-locales.patch').write_bytes(patch)
          PY
          git apply --check /tmp/global-locales.patch
          git apply --index /tmp/global-locales.patch
      - name: Test global and unchanged locale contracts without paid APIs
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -m pip install requests Pillow pypdf
          python -B scripts/test_portal_global_locales.py
          python -B scripts/test_build_portal_locales.py
          python -B scripts/test_hymt_offline_translation.py
          python -B scripts/test_compare_hymt_translation.py
          python -B scripts/test_portal_offline_locales.py
          python -B scripts/test_verify_portal_chinese_parity.py
          python -B scripts/test_verify_portal_locale_routes.py
          python -B scripts/test_verify_prepared_static_slot.py
          python -B scripts/test_portal_seo.py
          python -B scripts/test_portal_discovery_quality.py
          node scripts/test_portal_locale_runtime.js
          node scripts/test_portal_locale_recovery.js
          node scripts/test_portal_locale_detail.js
          node --test workers/edge-static-host/test/*.test.mjs
          git diff --check
      - name: Commit verified source and stage the tested workflow for connector finalization
        run: |
          set -euo pipefail
          mkdir -p .global-locale-workflow-staging
          cp .github/workflows/portal-global-locale-preflight.yml .global-locale-workflow-staging/
          git restore --staged .github/workflows/portal-global-locale-preflight.yml
          rm .github/workflows/portal-global-locale-preflight.yml .global-locale-patch.json .global-locale-patch-*.txt
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: generalize offline SEO GEO locales to the complete supported model language set'
          git push origin HEAD:refs/heads/codex/global-offline-locales-20260923
