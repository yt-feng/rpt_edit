name: Social publishing credential monitor

on:
  schedule:
    # 09:27 Asia/Shanghai (GitHub cron uses UTC).
    - cron: "27 1 * * *"
  workflow_dispatch:
    inputs:
      force_email:
        description: Send a healthy test email as well
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: social-publishing-credential-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: vars.SOCIAL_CREDENTIAL_MONITOR_ENABLED == 'true' && github.ref == 'refs/heads/main'
    environment: social-monitor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout monitor and existing email client
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/check_social_credentials.py
            scripts/test_check_social_credentials.py
            scripts/render_private_config.py
            scripts/send_portal_ops_alert.py
            scripts/test_send_portal_ops_alert.py

      - name: Test monitor without provider credentials
        run: |
          python3 -B scripts/test_check_social_credentials.py
          python3 -B scripts/test_send_portal_ops_alert.py

      - name: Run read-only credential and connection checks
        id: monitor
        env:
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_REQUIRED_SCOPES: ${{ vars.LINKEDIN_REQUIRED_SCOPES || 'w_member_social' }}
          LINKEDIN_CREDENTIAL_EXPIRES_AT: ${{ vars.LINKEDIN_CREDENTIAL_EXPIRES_AT }}
          LINKEDIN_CREDENTIAL_VERSION: ${{ vars.LINKEDIN_CREDENTIAL_VERSION || '1' }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_USER_ID: ${{ secrets.X_USER_ID || vars.X_USER_ID }}
          X_OAUTH1_SCOPES: ${{ vars.X_OAUTH1_SCOPES }}
          X_CREDENTIAL_EXPIRES_AT: ${{ vars.X_CREDENTIAL_EXPIRES_AT }}
          X_CREDENTIAL_VERSION: ${{ vars.X_CREDENTIAL_VERSION || '1' }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID || vars.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_CREDENTIAL_EXPIRES_AT: ${{ vars.YOUTUBE_CREDENTIAL_EXPIRES_AT }}
          YOUTUBE_CREDENTIAL_VERSION: ${{ vars.YOUTUBE_CREDENTIAL_VERSION || '1' }}
          YOUTUBE_REQUIRED_SCOPES: ${{ vars.YOUTUBE_REQUIRED_SCOPES || 'https://www.googleapis.com/auth/youtube.upload' }}
          BUFFER_MONITOR_ENABLED: ${{ vars.BUFFER_MONITOR_ENABLED || 'false' }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ACCOUNT_ID: ${{ secrets.BUFFER_ACCOUNT_ID || vars.BUFFER_ACCOUNT_ID }}
          BUFFER_LINKEDIN_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_CHANNEL_ID || vars.BUFFER_LINKEDIN_CHANNEL_ID }}
          BUFFER_X_CHANNEL_ID: ${{ secrets.BUFFER_X_CHANNEL_ID || vars.BUFFER_X_CHANNEL_ID }}
          BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID || vars.BUFFER_YOUTUBE_CHANNEL_ID }}
          BUFFER_CREDENTIAL_EXPIRES_AT: ${{ vars.BUFFER_CREDENTIAL_EXPIRES_AT }}
          BUFFER_CREDENTIAL_VERSION: ${{ vars.BUFFER_CREDENTIAL_VERSION || '1' }}
          FORCE_EMAIL: ${{ inputs.force_email || false }}
        run: |
          set -euo pipefail
          args=(
            --json-output "$RUNNER_TEMP/social-credential-monitor.json"
            --email-output "$RUNNER_TEMP/social-credential-monitor-email.txt"
            --github-output "$GITHUB_OUTPUT"
          )
          if [[ "$FORCE_EMAIL" == "true" ]]; then
            args+=(--force-email)
          fi
          python3 -B scripts/check_social_credentials.py "${args[@]}"

      - name: Write sanitized monitor summary
        env:
          CHECK_COUNT: ${{ steps.monitor.outputs.check_count }}
          CONFIGURED_COUNT: ${{ steps.monitor.outputs.configured_count }}
          ISSUE_COUNT: ${{ steps.monitor.outputs.issue_count }}
          ALERT_STAGE: ${{ steps.monitor.outputs.alert_stage }}
          SHOULD_ALERT: ${{ steps.monitor.outputs.should_alert }}
        run: |
          {
            echo "### 社媒官方 API 凭证检查"
            echo ""
            echo "- 检查项：$CHECK_COUNT"
            echo "- 完整配置：$CONFIGURED_COUNT"
            echo "- 需要处理：$ISSUE_COUNT"
            echo "- 当前阶段：$ALERT_STAGE"
            echo "- 本次发邮件：$SHOULD_ALERT"
            echo "- 检查方式：只读 OAuth/API；不读取 Cookie"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized credential report
        uses: actions/upload-artifact@v4
        with:
          name: social-credential-monitor-${{ github.run_id }}
          path: ${{ steps.monitor.outputs.json_file }}
          if-no-files-found: error
          retention-days: 30

      - name: Materialize private email runtime values
        if: steps.monitor.outputs.should_alert == 'true'
        env:
          PORTAL_PRIVATE_CONFIG_B64: ${{ secrets.PORTAL_PRIVATE_CONFIG_B64 }}
        run: |
          python3 -B scripts/render_private_config.py \
            --root scripts/send_portal_ops_alert.py \
            --github-add-mask \
            --skip-generated-files

      - name: Send deduplicated reauthorization email
        if: steps.monitor.outputs.should_alert == 'true'
        env:
          OPS_ALERT_SIGNING_KEY: ${{ secrets.OPS_ALERT_SIGNING_KEY || secrets.PASSWORD_SECRET }}
          PORTAL_WORKER_URL: ${{ secrets.PORTAL_WORKER_URL }}
          ALERT_SUBJECT: ${{ steps.monitor.outputs.subject }}
          ALERT_TEXT_FILE: ${{ steps.monitor.outputs.email_file }}
          ALERT_DEDUPE_KEY: ${{ steps.monitor.outputs.dedupe_key }}
          ALERT_SEVERITY: ${{ steps.monitor.outputs.severity }}
          DEDUPE_HOURS: ${{ inputs.force_email && '1' || '168' }}
        run: |
          python3 -B scripts/send_portal_ops_alert.py \
            --subject "$ALERT_SUBJECT" \
            --text-file "$ALERT_TEXT_FILE" \
            --dedupe-key "$ALERT_DEDUPE_KEY" \
            --dedupe-hours "$DEDUPE_HOURS" \
            --severity "$ALERT_SEVERITY"
