name: IMF probe (temporary)

# One-time capture of the public Coveo search key (base64-encoded to bypass log
# masking) so the daily IMF flow can call Coveo directly without a browser.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Capture Coveo key (base64)
        run: |
          python - <<'PY'
          import base64
          from playwright.sync_api import sync_playwright

          cap = {}
          def on_request(req):
              if "coveo.com/rest/search" in req.url and "auth" not in cap:
                  h = {k.lower(): v for k, v in req.headers.items()}
                  cap["auth"] = h.get("authorization", "")
                  cap["url"] = req.url

          with sync_playwright() as p:
              b = p.chromium.launch(headless=True)
              ctx = b.new_context(user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124.0 Safari/537.36", locale="en-US")
              page = ctx.new_page()
              page.on("request", on_request)
              try:
                  page.goto("https://www.imf.org/en/publications/search", wait_until="domcontentloaded", timeout=90000)
              except Exception as e:
                  print("goto:", e)
              page.wait_for_timeout(12000)
              b.close()

          auth = cap.get("auth", "")
          tok = auth.split(" ", 1)[1] if " " in auth else auth
          print("ENDPOINT:", cap.get("url"))
          print("SCHEME:", auth.split(" ")[0] if auth else "(none)")
          print("TOKEN_LEN:", len(tok))
          print("TOKEN_B64:", base64.b64encode(tok.encode()).decode())
          PY
