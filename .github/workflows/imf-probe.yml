name: IMF probe (temporary)

# Temporary diagnostic: confirm that headless Chromium (Playwright) can render the
# JS-built IMF publications list and reach a PDF. Delete once IMF is wired up.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Playwright IMF probe
        run: |
          python - <<'PY'
          import re
          from playwright.sync_api import sync_playwright

          urls = [
              "https://www.imf.org/en/publications/wp",
              "https://www.imf.org/en/publications",
          ]
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              ctx = browser.new_context(user_agent=(
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                  "(KHTML, like Gecko) Chrome/124.0 Safari/537.36"))
              page = ctx.new_page()
              for url in urls:
                  print("=" * 80, "\n", url)
                  try:
                      page.goto(url, wait_until="domcontentloaded", timeout=60000)
                      page.wait_for_timeout(6000)
                  except Exception as e:
                      print("  goto error", e); continue
                  anchors = page.eval_on_selector_all(
                      "a", "els => els.map(e => e.href)")
                  issues = sorted(set(a for a in anchors if re.search(r"/Issues/", a)))
                  print("  total anchors:", len(anchors), "issue-links:", len(issues))
                  for a in issues[:8]:
                      print("    ", a)
                  if issues:
                      try:
                          page.goto(issues[0], wait_until="domcontentloaded", timeout=60000)
                          page.wait_for_timeout(4000)
                          land_anchors = page.eval_on_selector_all("a", "els => els.map(e=>e.href)")
                          pdfs = sorted(set(a for a in land_anchors if re.search(r"\.(ashx|pdf)(\?|$)", a, re.I)))
                          title = page.title()
                          print("  LANDING title:", title[:80])
                          print("  LANDING pdf/ashx:", len(pdfs), pdfs[:4])
                      except Exception as e:
                          print("  landing error", e)
              browser.close()
          PY
