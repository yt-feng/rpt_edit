name: IMF probe (temporary)

# Temporary diagnostic: capture the exact Coveo search request (auth token + POST
# body) and response shape used by the IMF publications search. Delete once wired up.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Capture Coveo request/response
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          reqs, resps = [], []

          def on_request(req):
              if "coveo.com/rest/search" in req.url:
                  reqs.append({"method": req.method, "url": req.url,
                               "headers": dict(req.headers), "post": req.post_data})

          def on_response(resp):
              if "coveo.com/rest/search" in resp.url:
                  try:
                      body = resp.text()
                  except Exception as e:
                      body = f"<err {e}>"
                  resps.append((resp.status, resp.url, body))

          with sync_playwright() as p:
              b = p.chromium.launch(headless=True)
              ctx = b.new_context(
                  user_agent=("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                              "(KHTML, like Gecko) Chrome/124.0 Safari/537.36"),
                  locale="en-US")
              page = ctx.new_page()
              page.on("request", on_request)
              page.on("response", on_response)
              try:
                  page.goto("https://www.imf.org/en/publications/search", wait_until="networkidle", timeout=90000)
              except Exception as e:
                  print("goto:", e)
              page.wait_for_timeout(9000)

              print("=== COVEO REQUESTS (%d) ===" % len(reqs))
              for r in reqs:
                  print("METHOD", r["method"], r["url"])
                  h = {k.lower(): v for k, v in r["headers"].items()}
                  for k in ("authorization", "content-type", "origin", "referer"):
                      if k in h:
                          print("  H", k, ":", str(h[k])[:160])
                  print("  POST:", (r["post"] or "")[:1800])
                  print("-" * 70)

              print("=== COVEO RESPONSES (%d) ===" % len(resps))
              for st, url, body in resps:
                  print("STATUS", st)
                  print("  BODY:", body[:1500].replace("\n", " "))
                  print("-" * 70)
              b.close()
          PY
