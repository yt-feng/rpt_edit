name: IMF probe (temporary)

# Final diagnostic (curl_cffi only, fast): locate the Coveo org id + API key inside
# the IMF search JS bundles so the token can be fetched without a browser.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install curl_cffi
      - name: Find Coveo org/token in JS bundles
        run: |
          python - <<'PY'
          import re
          from urllib.parse import urljoin
          from curl_cffi import requests as cr

          base = "https://www.imf.org/en/publications/search"
          html = cr.get(base, impersonate="chrome", timeout=40).text
          print("search HTML len:", len(html))

          bundles = sorted(set(re.findall(r'src="([^"]*?/_next/[^"]+?\.js)"', html)))
          print("bundles found:", len(bundles))
          ORG = "imfproduction561s308u"

          def show(label, text, needle, around=70):
              i = text.find(needle)
              if i >= 0:
                  print(f"   [{label}] ...{text[max(0,i-around):i+around]}...")
                  return True
              return False

          hit_any = False
          for rel in bundles:
              url = urljoin(base, rel)
              try:
                  t = cr.get(url, impersonate="chrome", timeout=40).text
              except Exception as e:
                  print("  bundle err", rel, e); continue
              if ORG in t or "accessToken" in t or "coveo" in t.lower():
                  print("BUNDLE", url)
                  hit_any = True
                  show("org", t, ORG)
                  for kw in ("accessToken", "apiKey", "searchToken", "platformUrl", "organizationId"):
                      show(kw, t, kw)
                  # token-looking strings near accessToken
                  for m in re.finditer(r'accessToken["\']?\s*[:=]\s*["\']([^"\']{12,60})["\']', t):
                      print("   TOKEN-CANDIDATE:", m.group(1))
                  for m in re.finditer(r'organizationId["\']?\s*[:=]\s*["\']([^"\']{6,40})["\']', t):
                      print("   ORG-CANDIDATE:", m.group(1))
          if not hit_any:
              print("No bundle referenced org/accessToken/coveo.")
          PY
