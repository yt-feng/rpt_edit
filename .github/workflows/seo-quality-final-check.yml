name: SEO final integration check

on:
  push:
    branches: [codex/seo-geo-quick-wins-20260923]
    paths: [.github/workflows/seo-quality-final-check.yml]

permissions:
  contents: read

concurrency:
  group: seo-quality-final-integration
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Complete topic pagination metadata and regression coverage
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/codex/seo-geo-quick-wins-20260923'
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/build_portal_suite_site.py')
          s = p.read_text()
          before = '<title>{html_escape(heading)}｜最新研究索引 | {BLOG_PUBLIC_BRAND}</title>'
          after = '<title>{html_escape(heading + page_suffix)}｜最新研究索引 | {BLOG_PUBLIC_BRAND}</title>'
          assert s.count(before) == 1
          s = s.replace(before, after)
          before = '"alternateName": name_zh,\n                    "url": canonical,'
          after = '"alternateName": name_zh,\n                    "url": url_join(base_url, topic_hub_path(definition)),'
          assert s.count(before) == 1
          p.write_text(s.replace(before, after))
          p = Path('scripts/test_portal_discovery_quality.py')
          s = p.read_text()
          marker = "if __name__ == '__main__':"
          assert s.count(marker) == 1
          extra = '''class PaginatedTopicIdentityTests(unittest.TestCase):
              def test_topic_page_titles_and_entity_urls_are_stable(self):
                  definition = builder.TOPIC_HUBS[2]
                  items = [report(f"topic-{index}") for index in range(201)]
                  pages = [builder.render_topic_hub(definition, items, [], BASE, "2026-09-23", page_number=n)
                           for n in (1, 2, 3)]
                  titles = [re.search(r"<title>(.*?)</title>", page).group(1) for page in pages]
                  self.assertEqual(len(set(titles)), 3)
                  self.assertIn("第 2 页", titles[1])
                  root = BASE + "/" + builder.topic_hub_path(definition)
                  for page in pages:
                      entity = nodes(page)["CollectionPage"]["about"]
                      self.assertEqual(entity["@id"], root + "#topic")
                      self.assertEqual(entity["url"], root)
          
          
          '''
          p.write_text(s.replace(marker, extra + marker))
          PY
      - name: Verify final code and all frontend regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'Pillow>=10.1,<12' 'pypdf>=4,<6'
          python scripts/test_portal_discovery_quality.py
          python scripts/test_portal_seo.py
          python scripts/test_portal_blog_build.py
          python scripts/test_translate_portal_titles.py
          python scripts/test_audit_portal_seo_live.py
          python scripts/test_build_portal_locales.py
          python scripts/test_neutral_edge_cutover_workflow.py
          python scripts/check_public_identity.py
          node --test portal_suite/tests/*.test.mjs
          node --test workers/edge-static-host/test/*.test.mjs
      - name: Commit tested source changes without touching production
        run: |
          set -euo pipefail
          git add scripts/build_portal_suite_site.py scripts/test_portal_discovery_quality.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: distinguish paginated topic titles and retain stable entity URLs'
          git push origin HEAD:refs/heads/codex/seo-geo-quick-wins-20260923
