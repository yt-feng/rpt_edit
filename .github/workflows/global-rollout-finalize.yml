name: Verify reviewed global locale corrections
on:
  push:
    branches: [codex/global-offline-locales-20260923]
    paths: [.github/workflows/global-rollout-finalize.yml]
permissions:
  contents: read
concurrency:
  group: global-rollout-finalize
  cancel-in-progress: false
jobs:
  verify:
    if: github.event.repository.private == false && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact source bases and apply reviewed patch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/codex/global-offline-locales-20260923'
          python - <<'PY'
          import hashlib,pathlib
          bases={'scripts/build_portal_locales.py':'2d137e94d50fc0291fe5d3e1d08570adbfab3c1e','scripts/portal_language_registry.py':'8396404aca7c847a140e43a799883903ce708837','scripts/verify_portal_chinese_parity.py':'4bd42e46375014833bd40d79246e0ae2d315d236','scripts/hymt_offline_translation.py':'e353ecac258e7354fa1f7ebcca599db7b50b73c5','scripts/test_portal_global_build_support.py':'bc60e8ed2a85853134036d9159c73c3684ef1293','scripts/test_portal_global_locales.py':'2a1e0905b47f3c0b7222dcf0bf62a15e3e9ba8c2','scripts/prepare_portal_global_locales.py':'b35357651ff21d3d55f192c59097d629d16e34f0','scripts/portal_global_r2.py':'783506f2c236f888f779fa5b6a44786d976fd3c8'}
          for name,expected in bases.items():
              body=pathlib.Path(name).read_bytes()
              assert hashlib.sha1(f'blob {len(body)}\0'.encode()+body).hexdigest()==expected,'Source changed: '+name
          PY
          git apply --check --unidiff-zero .global-rollout-review.patch
          git apply --index --unidiff-zero .global-rollout-review.patch
          python - <<'PY'
          import hashlib,pathlib
          expected={'scripts/build_portal_locales.py':'88d9413af9e38f6d3a649ecd129fe5c9517760b9','scripts/portal_language_registry.py':'ab7e8514fd5eadb50a9e4ec2de9f22bc27b754f8','scripts/verify_portal_chinese_parity.py':'e233b626eac2f5e96e34a28aa7ed3230b7b0c3c9','scripts/hymt_offline_translation.py':'d08d0408bbf69bf4dd363bf78e71ba43cc481e62','scripts/test_portal_global_build_support.py':'ec37e922f5d40eb1f72f3660360bab81b0f35cb2','scripts/test_portal_global_locales.py':'d1795c77f94855e5bb38c63a8b7b0649a265e06d','scripts/prepare_portal_global_locales.py':'1ecf8b9884f124d5b1efd014bd1a64f01685ac45','scripts/portal_global_r2.py':'f71231f9f6ea1b1740283910f8b4a3a7cafba93f'}
          for name,sha in expected.items():
              body=pathlib.Path(name).read_bytes()
              assert hashlib.sha1(f'blob {len(body)}\0'.encode()+body).hexdigest()==sha,'Patched result differs: '+name
          PY
          rm .global-rollout-review.patch
      - name: Validate source, quality and unchanged production contracts
        run: |
          set -euo pipefail
          python -m pip install requests Pillow 'opencc-python-reimplemented==0.1.7'
          python -B scripts/test_portal_global_build_support.py
          python -B scripts/test_portal_global_r2.py
          python -B scripts/test_portal_global_locales.py
          python -B scripts/test_build_portal_locales.py
          python -B scripts/test_hymt_offline_translation.py
          python -B scripts/test_financial_quantity_integrity.py
          python -B scripts/test_translate_portal_titles.py
          python -B scripts/test_portal_locale_manifest.py
          python -B scripts/test_verify_portal_chinese_parity.py
          python -B scripts/test_neutral_edge_cutover_workflow.py
          node scripts/test_portal_locale_runtime.js
          node scripts/test_portal_locale_recovery.js
          node scripts/test_portal_locale_detail.js
          git diff --check
      - name: Commit verified source corrections only
        run: |
          set -euo pipefail
          git add scripts .global-rollout-review.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: qualify safe locale cohort and preserve legal-page and language metadata identity'
          git push origin HEAD:refs/heads/codex/global-offline-locales-20260923
