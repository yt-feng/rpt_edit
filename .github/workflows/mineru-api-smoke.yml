name: Verify MinerU with one synthetic PDF
run-name: One-page MinerU API smoke test
on:
  pull_request:
    paths:
      - .github/workflows/mineru-api-smoke.yml
      - scripts/smoke_mineru_api.py
      - scripts/test_smoke_mineru_api.py
      - scripts/mineru_daily_result_transport.py
      - scripts/test_mineru_daily_result_transport.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mineru-api-smoke-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --retries 0 --disable-pip-version-check 'reportlab==4.4.9' requests 'urllib3>=2.2,<3' 'certifi>=2024.2.2'
      - run: python3 -B scripts/test_smoke_mineru_api.py
  smoke:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --retries 0 --disable-pip-version-check 'reportlab==4.4.9' requests 'boto3>=1.37.32,<2' 'urllib3>=2.2,<3' 'certifi>=2024.2.2'
      - name: Verify one synthetic parse, authenticated result, durable R2 cache and zero-submit replay
        env:
          MINER_U: ${{ secrets.MINER_U }}
          MINER_U_2: ${{ secrets.MINER_U_2 }}
          MINER_U_3: ${{ secrets.MINER_U_3 }}
          MINER_U_4: ${{ secrets.MINER_U_4 }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: python3 -B scripts/smoke_mineru_api.py
      - name: Preserve sanitized smoke result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mineru-api-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mineru-api-smoke-summary.json
          if-no-files-found: warn
          retention-days: 14
