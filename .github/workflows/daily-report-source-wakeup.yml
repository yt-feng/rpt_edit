name: Daily report source wake-up
run-name: ${{ inputs.date_folder && format('Daily report source wake-up [{0}/{1}]', inputs.date_folder, inputs.upstream_run_id) || 'Daily report source wake-up' }}

on:
  schedule:
    # Recheck at 02:00 Beijing when an overnight Dropbox receipt has not arrived.
    - cron: '0 18 * * *'
    # Late Dropbox deliveries and missed Daily schedules get a metadata-only
    # check at a different minute. No model runs in this workflow.
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      date_folder:
        description: 'Verified Dropbox batch in YYMMDD. Leave all inputs blank for a reconciliation check.'
        type: string
      upstream_run_id:
        description: 'GitHub Actions run ID of the upstream sync'
        type: string
      pdf_count:
        description: 'Exact recursive PDF count after Dropbox readback'
        type: string
      manifest_sha256:
        description: 'SHA-256 of the sorted Dropbox PDF IDs and revisions'
        type: string
  pull_request:
    paths:
      - '.github/workflows/daily-report-source-wakeup.yml'
      - 'scripts/wake_daily_report_source.py'
      - 'scripts/test_wake_daily_report_source.py'

permissions:
  contents: read

concurrency:
  group: daily-report-source-wakeup-${{ github.event_name == 'pull_request' && github.run_id || 'main' }}
  cancel-in-progress: false
  queue: max

jobs:
  contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --disable-pip-version-check requests PyYAML
      - run: python3 -B scripts/test_wake_daily_report_source.py

  wake:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --disable-pip-version-check requests
      - name: Start only an unattempted ready report batch
        env:
          GH_TOKEN: ${{ github.token }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: python3 -B scripts/wake_daily_report_source.py
