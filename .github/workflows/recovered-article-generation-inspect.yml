name: Inspect exact recovered article generation failure
run-name: Read-only article diagnostics for retained Daily 37695511597
on:
  pull_request:
    paths:
      - .github/workflows/recovered-article-generation-inspect.yml
      - scripts/inspect_recovered_article_generation.py
      - scripts/test_inspect_recovered_article_generation.py
  workflow_dispatch:
    inputs:
      generation_run_id:
        description: Completed failed standalone recovery run to authenticate (empty for original)
        required: false
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: recovered-article-generation-inspection-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --retries 0 --disable-pip-version-check requests Pillow PyMuPDF reportlab PyYAML
      - run: python -B scripts/test_inspect_recovered_article_generation.py
  inspect:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --retries 0 --disable-pip-version-check requests Pillow PyMuPDF 'boto3>=1.37.32,<2'
      - name: Read exact retained generation checkpoint without mutations
        env:
          GENERATION_RUN_ID: ${{ inputs.generation_run_id }}
          GH_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          python -B scripts/inspect_recovered_article_generation.py \
            --generation-run-id "$GENERATION_RUN_ID" \
            --output "$RUNNER_TEMP/recovered-article-generation-inspection.json"
      - name: Preserve content-free typed diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovered-article-generation-inspection-${{ github.run_id }}
          path: ${{ runner.temp }}/recovered-article-generation-inspection.json
          if-no-files-found: warn
          retention-days: 14
