name: Test macro Dropbox PDFs pipeline

on:
  workflow_dispatch:
    inputs:
      dropbox_root:
        description: "Dropbox root folder containing date-named backup folders"
        required: true
        default: "/zip_backup"
      candidate_count:
        description: "How many macro/trend candidates to select from the latest Dropbox folder"
        required: true
        default: "10"
      process_count:
        description: "How many selected macro/trend PDFs to process in this test run"
        required: true
        default: "5"
      batch_size:
        description: "How many PDFs to send to MinerU per batch"
        required: true
        default: "5"
      model:
        description: "DeepSeek model for classification and content generation"
        required: true
        default: "deepseek-chat"
      deepseek_base_url:
        description: "DeepSeek API base URL"
        required: true
        default: "https://api.deepseek.com"
      mineru_model:
        description: "MinerU model_version, usually vlm or pipeline"
        required: true
        default: "vlm"
      language:
        description: "MinerU OCR language code, e.g. en, ch, ch_server"
        required: true
        default: "en"
      ocr:
        description: "Enable OCR for scanned/image PDFs"
        required: true
        default: "true"
      wechat_length:
        description: "Target Chinese character count for WeChat article"
        required: true
        default: "3000"
      community_cta:
        description: "CTA sentence for the WeChat article"
        required: true
        default: "加入社群，领取完整研报解读与原始图表。"
      podcast_minutes:
        description: "Target length for podcast script only. Audio/video disabled in this test workflow."
        required: true
        default: "5"
      commit_results:
        description: "Commit generated test outputs back to this branch"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  SELECTED_DIR: "_macro_test_pdfs"

jobs:
  test-macro-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Start timer
        id: timer
        run: |
          echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "STARTED_AT_ISO=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Chinese fonts for image rendering
        timeout-minutes: 5
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-arphic-ukai

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Download PDFs from latest Dropbox date folder
        id: dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          python scripts/download_dropbox_latest_pdfs.py \
            --dropbox-root "${{ inputs.dropbox_root }}" \
            --output-dir "_dropbox_latest_pdfs"

      - name: Select macro trend PDFs with DeepSeek
        id: select_macro
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ inputs.deepseek_base_url }}
        run: |
          python scripts/select_macro_trend_pdfs.py \
            --input-dir "_dropbox_latest_pdfs" \
            --output-dir "$SELECTED_DIR" \
            --candidate-count "${{ inputs.candidate_count }}" \
            --process-count "${{ inputs.process_count }}" \
            --model "${{ inputs.model }}" \
            --deepseek-base-url "${{ inputs.deepseek_base_url }}"

      - name: Prepare output folder
        run: |
          OUTPUT_DIR="xhs_notes/test_macro/${{ steps.dropbox.outputs.latest_folder }}-${{ github.run_id }}"
          echo "OUTPUT_DIR=$OUTPUT_DIR" >> "$GITHUB_ENV"
          mkdir -p "$OUTPUT_DIR"
          cp "_dropbox_latest_pdfs/dropbox_manifest.json" "$OUTPUT_DIR/dropbox_manifest.json"
          cp "$SELECTED_DIR/macro_classification_all.json" "$OUTPUT_DIR/macro_classification_all.json"
          cp "$SELECTED_DIR/selected_macro_candidates.json" "$OUTPUT_DIR/selected_macro_candidates.json"
          cp "$SELECTED_DIR/selected_to_process_manifest.json" "$OUTPUT_DIR/selected_to_process_manifest.json"

      - name: Generate text and image outputs for selected macro PDFs
        env:
          MINER_U: ${{ secrets.MINER_U }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ inputs.deepseek_base_url }}
        run: |
          python scripts/run_pdf_to_xhs_in_batches.py \
            --input-dir "$SELECTED_DIR" \
            --output-dir "$OUTPUT_DIR" \
            --batch-size "${{ inputs.batch_size }}" \
            --continue-on-batch-error true \
            --model "${{ inputs.model }}" \
            --deepseek-base-url "${{ inputs.deepseek_base_url }}" \
            --mineru-model "${{ inputs.mineru_model }}" \
            --language "${{ inputs.language }}" \
            --ocr "${{ inputs.ocr }}" \
            --wechat-length "${{ inputs.wechat_length }}" \
            --community-cta "${{ inputs.community_cta }}"

      - name: Post-process articles and generate podcast scripts only
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ inputs.deepseek_base_url }}
        run: |
          python scripts/postprocess_podcast.py \
            --output-dir "$OUTPUT_DIR" \
            --model "${{ inputs.model }}" \
            --deepseek-base-url "${{ inputs.deepseek_base_url }}" \
            --podcast-minutes "${{ inputs.podcast_minutes }}" \
            --generate-audio false \
            --tts-engine edge

      - name: Finalize outputs, sanitize brands, and generate Xianyu notes
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ inputs.deepseek_base_url }}
        run: |
          python scripts/finalize_outputs.py \
            --output-dir "$OUTPUT_DIR" \
            --model "${{ inputs.model }}" \
            --deepseek-base-url "${{ inputs.deepseek_base_url }}" \
            --generate-xianyu true

      - name: Write runtime summary
        if: always()
        run: |
          ENDED_AT=$(date +%s)
          DURATION=$((ENDED_AT - ${{ steps.timer.outputs.started_at }}))
          mkdir -p "$OUTPUT_DIR"
          cat > "$OUTPUT_DIR/test_run_summary.md" <<EOF
          # Test macro Dropbox PDFs pipeline summary

          - Started at UTC: $STARTED_AT_ISO
          - Ended at UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Duration seconds: $DURATION
          - Duration minutes: $((DURATION / 60))
          - Dropbox latest folder: ${{ steps.dropbox.outputs.latest_folder }}
          - Dropbox PDF count: ${{ steps.dropbox.outputs.pdf_count }}
          - Macro candidates requested: ${{ inputs.candidate_count }}
          - PDFs requested for processing: ${{ inputs.process_count }}
          - PDFs selected for processing: ${{ steps.select_macro.outputs.process_count }}
          - Audio/video generation: disabled
          - Output folder: $OUTPUT_DIR
          EOF
          cat "$OUTPUT_DIR/test_run_summary.md"

      - name: Upload generated test outputs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-macro-xhs-notes-${{ steps.dropbox.outputs.latest_folder }}-${{ github.run_id }}
          path: |
            ${{ env.OUTPUT_DIR }}
            ${{ env.SELECTED_DIR }}/macro_classification_all.json
            ${{ env.SELECTED_DIR }}/selected_macro_candidates.json
            ${{ env.SELECTED_DIR }}/selected_to_process_manifest.json
          if-no-files-found: warn

      - name: Commit generated test outputs
        if: ${{ inputs.commit_results }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT_DIR"
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Test macro pipeline from Dropbox PDFs ${{ steps.dropbox.outputs.latest_folder }}"
            git push
          fi
