name: Portal analytics day summary

on:
  workflow_dispatch:
    inputs:
      summary_date:
        description: Beijing date (YYYY-MM-DD)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: portal-analytics-summary-${{ inputs.summary_date }}
  cancel-in-progress: false

jobs:
  summarize:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/summarize_portal_analytics_day.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install private archive client
        run: python -m pip install --disable-pip-version-check --quiet boto3==1.40.1

      - name: Build privacy-preserving summary
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: >-
          python scripts/summarize_portal_analytics_day.py
          --date "${{ inputs.summary_date }}"
          --output private-summary/analytics-day.json

      - name: Upload short-lived private summary
        uses: actions/upload-artifact@v4
        with:
          name: portal-analytics-${{ inputs.summary_date }}
          path: private-summary/analytics-day.json
          if-no-files-found: error
          retention-days: 1
