name: Portal Suite Worker Emergency Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-production-release
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.PORTAL_AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout Worker source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .gitignore
            .github/workflows/portal-worker-emergency-deploy.yml
            .github/workflows/course-directory-private-publish.yml
            .github/workflows/market-views-latex-pdf.yml
            workers/portal-suite-worker/src/index.js
            workers/portal-suite-worker/src/source-lead-adapter.js
            portal_suite/site_src
            portal_suite/tests
            scripts/build_portal_suite_site.py
            scripts/build_member_course_directory.py
            scripts/capture_edge_worker_deployment.py
            scripts/check_public_brand.py
            scripts/check_public_identity.py
            scripts/encrypt_member_course_directory.mjs
            scripts/render_private_config.py
            scripts/portal_r2_prefix.py
            scripts/test_portal_catalog_object_keys.js
            scripts/test_portal_entitlement_precedence.js
            scripts/test_portal_legacy_access_compat.js
            scripts/test_portal_access_renewal.js
            scripts/test_portal_daily_pick_topics.js
            scripts/test_portal_hot_report_auto_archive.js
            scripts/test_portal_hot_retention_first_added.js
            scripts/test_portal_hot_reports.js
            scripts/test_portal_market_views.js
            scripts/test_portal_multi_institution_access.js
            scripts/test_portal_newsfeed_access.js
            scripts/test_portal_text_only_pdf_upload.js
            scripts/test_portal_text_only_text_access.js
            scripts/test_portal_source_lead_integration.js
            scripts/test_portal_chart_search_frontend.js
            scripts/test_portal_site_runtime.js
            scripts/test_build_member_course_directory.py
            scripts/test_capture_edge_worker_deployment.py
            scripts/test_check_public_brand.py
            scripts/test_encrypt_member_course_directory.mjs
            scripts/test_portal_worker_emergency_deploy_workflow.py
            scripts/test_source_lead_adapter.js
            scripts/test_portal_r2_prefix.py

      - name: Validate legacy access compatibility
        run: |
          python3 -B scripts/check_public_identity.py
          node --input-type=module --check < workers/portal-suite-worker/src/index.js
          node --input-type=module --check < workers/portal-suite-worker/src/source-lead-adapter.js
          node --check portal_suite/site_src/assets/app.js
          node --check portal_suite/site_src/assets/report-chat.js
          node --check portal_suite/site_src/assets/charts.js
          node --check portal_suite/site_src/assets/site-runtime.js
          node --test portal_suite/tests/*.test.mjs
          node scripts/test_portal_entitlement_precedence.js
          node scripts/test_portal_legacy_access_compat.js
          node scripts/test_portal_access_renewal.js
          node scripts/test_portal_daily_pick_topics.js
          node scripts/test_portal_catalog_object_keys.js
          node scripts/test_portal_hot_report_auto_archive.js
          node scripts/test_portal_hot_retention_first_added.js
          node scripts/test_portal_hot_reports.js
          node scripts/test_portal_market_views.js
          node scripts/test_portal_multi_institution_access.js
          node scripts/test_portal_text_only_pdf_upload.js
          node scripts/test_portal_text_only_text_access.js
          node scripts/test_portal_newsfeed_access.js
          node scripts/test_source_lead_adapter.js
          node scripts/test_portal_source_lead_integration.js
          node scripts/test_portal_chart_search_frontend.js
          node scripts/test_portal_site_runtime.js
          python3 -B scripts/test_build_member_course_directory.py
          python3 -B scripts/test_capture_edge_worker_deployment.py
          python3 -B scripts/test_check_public_brand.py
          python3 -B scripts/test_portal_worker_emergency_deploy_workflow.py
          node --test scripts/test_encrypt_member_course_directory.mjs
          python3 scripts/test_portal_r2_prefix.py

      - name: Materialize private deployment values
        env:
          PORTAL_PRIVATE_CONFIG_B64: ${{ secrets.PORTAL_PRIVATE_CONFIG_B64 }}
        run: |
          python3 scripts/render_private_config.py \
            --github-add-mask \
            --skip-generated-files \
            --root workers/portal-suite-worker/src \
            --root portal_suite/site_src \
            --root scripts/build_portal_suite_site.py

      - name: Validate materialized public brand
        run: python3 -B scripts/check_public_brand.py portal_suite/site_src

      - name: Prepare Cloudflare Worker config
        env:
          PORTAL_SITE_URL: ${{ secrets.PORTAL_SITE_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
          R2_OBJECT_PREFIX: ${{ secrets.R2_OBJECT_PREFIX || vars.R2_OBJECT_PREFIX }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          NEWSFEED_EMAIL_PROVIDER: ${{ vars.NEWSFEED_EMAIL_PROVIDER || 'cloudflare' }}
          OPS_ALERT_EMAIL: ${{ secrets.OPS_ALERT_EMAIL || vars.OPS_ALERT_EMAIL || '' }}
          HOT_REPORT_CLEANUP_ENABLED: ${{ vars.HOT_REPORT_CLEANUP_ENABLED || 'false' }}
        run: |
          for name in PORTAL_SITE_URL R2_BUCKET_NAME R2_OBJECT_PREFIX CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "Required deployment value is not configured: $name" >&2
              exit 1
            fi
          done
          case "$PORTAL_SITE_URL" in
            https://*) ;;
            *)
              echo "PORTAL_SITE_URL must use https" >&2
              exit 1
              ;;
          esac
          case "$HOT_REPORT_CLEANUP_ENABLED" in
            true|false) ;;
            *)
              echo "HOT_REPORT_CLEANUP_ENABLED must be true or false" >&2
              exit 1
              ;;
          esac
          PORTAL_SITE_URL="${PORTAL_SITE_URL%/}"
          R2_OBJECT_PREFIX="$(python3 scripts/portal_r2_prefix.py "$R2_OBJECT_PREFIX")"
          export PORTAL_SITE_URL R2_OBJECT_PREFIX
          cat > workers/portal-suite-worker/wrangler.toml <<EOF
          name = "portal-suite-worker"
          main = "src/index.js"
          compatibility_date = "2026-05-01"
          compatibility_flags = ["global_fetch_strictly_public"]

          [vars]
          ACCOUNT_STORE_MODE = "supabase"
          R2_OBJECT_PREFIX = "$R2_OBJECT_PREFIX"
          STATIC_DATA_PREFIX = "edge-static/runtime-data"
          CATALOG_URL = "$PORTAL_SITE_URL/data/catalog.json"
          SEARCH_INDEX_URL = "$PORTAL_SITE_URL/data/search_index.json"
          PASSWORD_RULES_URL = "$PORTAL_SITE_URL/data/password_rules.json"
          ALLOWED_ORIGIN = "$PORTAL_SITE_URL"
          GH_REPO = "$GITHUB_REPOSITORY"
          NEWSFEED_EMAIL_PROVIDER = "$NEWSFEED_EMAIL_PROVIDER"
          OPS_ALERT_EMAIL = "$OPS_ALERT_EMAIL"
          HOT_REPORT_CLEANUP_ENABLED = "$HOT_REPORT_CLEANUP_ENABLED"

          [triggers]
          crons = [
            "*/30 * * * *",
            "*/10 17-18 * * *",
            "*/10 23 * * *",
            "*/10 0-3 * * *",
            "*/10 5-6 * * *"
          ]

          [[r2_buckets]]
          binding = "REPORT_BUCKET"
          bucket_name = "$R2_BUCKET_NAME"
          EOF
          if [ "$NEWSFEED_EMAIL_PROVIDER" = "cloudflare" ]; then
            cat >> workers/portal-suite-worker/wrangler.toml <<EOF

          [[send_email]]
          name = "EMAIL"
          EOF
          fi

      - name: Materialize private Worker config
        env:
          PORTAL_PRIVATE_CONFIG_B64: ${{ secrets.PORTAL_PRIVATE_CONFIG_B64 }}
        run: |
          python3 scripts/render_private_config.py \
            --skip-generated-files \
            --root workers/portal-suite-worker/wrangler.toml

      - name: Verify private deploy artifacts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roots = (
              Path("workers/portal-suite-worker/src"),
              Path("portal_suite/site_src"),
              Path("scripts/build_portal_suite_site.py"),
              Path("workers/portal-suite-worker/wrangler.toml"),
          )
          placeholders = (
              "portal.example.invalid",
              "portal-suite-pdfs",
              "portal-suite-worker",
              "portal-suite:",
              "source/example",
              "Portal Suite",
          )
          failures = []
          for root in roots:
              paths = (root,) if root.is_file() else root.rglob("*")
              for path in paths:
                  if not path.is_file() or path.is_symlink():
                      continue
                  try:
                      text = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  if any(marker in text for marker in placeholders):
                      failures.append(str(path))
          if failures:
              for path in sorted(set(failures)):
                  print(f"Public deployment placeholder remains in {path}")
              raise SystemExit(1)
          PY

      - name: Resolve private Portal Worker name
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          config_path = Path("workers/portal-suite-worker/wrangler.toml")
          config_lines = config_path.read_text(encoding="utf-8").splitlines()
          name_matches = []
          for line in config_lines:
              if line.lstrip().startswith("["):
                  break
              match = re.fullmatch(r'\s*name\s*=\s*"([A-Za-z0-9][A-Za-z0-9._-]{0,127})"\s*', line)
              if match:
                  name_matches.append(match.group(1))
          if len(name_matches) != 1:
              raise SystemExit("Rendered Portal Worker config must have one safe top-level name")
          worker_name = name_matches[0]
          if (
              worker_name == "portal-suite-worker"
          ):
              raise SystemExit("Rendered Portal Worker name is invalid or still public")
          print(f"::add-mask::{worker_name}")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"PORTAL_WORKER_SCRIPT_NAME={worker_name}\n")
          PY

      - name: Materialize Worker version secrets
        env:
          PASSWORD_SECRET: ${{ secrets.PASSWORD_SECRET }}
          CALC_KEY: ${{ secrets.CALC_KEY }}
          MASTER_KEY: ${{ secrets[vars.PORTAL_MASTER_SECRET_REF] || secrets[vars.PORTAL_DOWNLOAD_SECRET_REF] }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || secrets.PASSWORD_SECRET || 'unconfigured' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'unconfigured' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'unconfigured' }}
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN || secrets.GH_DISPATCH_TOKEN || 'unconfigured' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || 'unconfigured' }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
          NEWSFEED_EMAIL_FROM: ${{ secrets.NEWSFEED_EMAIL_FROM || vars.NEWSFEED_EMAIL_FROM || 'unconfigured' }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY || 'unconfigured' }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL || vars.BREVO_SENDER_EMAIL || 'unconfigured' }}
          BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME || vars.BREVO_SENDER_NAME || 'Portal Suite Newsfeed' }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN || 'unconfigured' }}
          OPS_ALERT_SIGNING_KEY: ${{ secrets.OPS_ALERT_SIGNING_KEY || secrets.PASSWORD_SECRET || 'unconfigured' }}
          SUPPLEMENTAL_SEARCH_URL: ${{ secrets.SUPPLEMENTAL_SEARCH_URL || 'unconfigured' }}
          SUPPLEMENTAL_SEARCH_HMAC_SECRET: ${{ secrets.SUPPLEMENTAL_SEARCH_HMAC_SECRET || 'unconfigured' }}
          SUPPLEMENTAL_SEARCH_REDACT_TERMS: ${{ secrets.SUPPLEMENTAL_SEARCH_REDACT_TERMS || 'unconfigured' }}
          COURSE_DIRECTORY_REDACT_TERMS: ${{ secrets.COURSE_DIRECTORY_REDACT_TERMS || 'unconfigured' }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/portal-worker-version-secrets.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          names = (
              "PASSWORD_SECRET",
              "CALC_KEY",
              "MASTER_KEY",
              "AUTH_SECRET",
              "SUPABASE_URL",
              "SUPABASE_SERVICE_ROLE_KEY",
              "GH_READ_TOKEN",
              "DEEPSEEK_API_KEY",
              "DEEPSEEK_BASE_URL",
              "DEEPSEEK_MODEL",
              "NEWSFEED_EMAIL_FROM",
              "BREVO_API_KEY",
              "BREVO_SENDER_EMAIL",
              "BREVO_SENDER_NAME",
              "GH_DISPATCH_TOKEN",
              "OPS_ALERT_SIGNING_KEY",
              "SUPPLEMENTAL_SEARCH_URL",
              "SUPPLEMENTAL_SEARCH_HMAC_SECRET",
              "SUPPLEMENTAL_SEARCH_REDACT_TERMS",
              "COURSE_DIRECTORY_REDACT_TERMS",
          )
          values = {name: os.environ.get(name, "") for name in names}
          missing = [name for name, value in values.items() if not value]
          if missing:
              raise SystemExit(f"Worker version secrets are missing: {', '.join(missing)}")
          target = Path(sys.argv[1])
          descriptor = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, "w", encoding="utf-8") as handle:
              json.dump(values, handle, ensure_ascii=False)
          PY

      - name: Capture exact Portal Worker rollback target
        timeout-minutes: 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
        run: >-
          python3 -B scripts/capture_edge_worker_deployment.py
          --script-name "$PORTAL_WORKER_SCRIPT_NAME"
          --output-env "$GITHUB_ENV"

      - name: Upload Cloudflare Worker version
        id: upload-worker-version
        timeout-minutes: 5
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          workingDirectory: workers/portal-suite-worker
          wranglerVersion: "4.125.0"
          command: >-
            versions upload --keep-vars
            --secrets-file "${{ runner.temp }}/portal-worker-version-secrets.json"
            --tag "run-${{ github.run_id }}-${{ github.run_attempt }}"
            --message "Portal Worker ${{ github.sha }}"

      - name: Deploy Cloudflare Worker version at 100 percent
        id: deploy-worker-version
        timeout-minutes: 5
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          workingDirectory: workers/portal-suite-worker
          wranglerVersion: "4.125.0"
          command: >-
            versions deploy
            --version-tag "run-${{ github.run_id }}-${{ github.run_attempt }}"
            --percentage 100
            --yes
            --message "Portal Worker ${{ github.sha }}"

      - name: Remove temporary Worker version secrets
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path

          Path("${{ runner.temp }}/portal-worker-version-secrets.json").unlink(missing_ok=True)
          PY

      - name: Smoke deployed API through the live edge
        id: portal_smoke
        timeout-minutes: 8
        env:
          PORTAL_SITE_URL: ${{ secrets.PORTAL_SITE_URL }}
        run: |
          set -euo pipefail
          echo "::add-mask::$PORTAL_SITE_URL"
          origin="${PORTAL_SITE_URL%/}"
          ready=0
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 20 \
              "$origin/api/health" --output "$RUNNER_TEMP/api-health.json" \
              && python3 - "$RUNNER_TEMP/api-health.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if payload.get("ok") is not True:
              raise SystemExit(1)
          PY
            then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = 1

          for endpoint in rewards course/access; do
            code="$(curl --silent --show-error --max-time 20 \
              --output "$RUNNER_TEMP/api-anonymous.json" \
              --write-out '%{http_code}' "$origin/api/$endpoint")"
            test "$code" = 401
            python3 -m json.tool "$RUNNER_TEMP/api-anonymous.json" >/dev/null
          done

          contact_smoke_id="foreign:9999999999999999999999999"
          contact_ready=0
          for attempt in $(seq 1 12); do
            contact_code="$(curl --silent --show-error --max-time 20 \
              --get \
              --data-urlencode 'source=authority' \
              --data-urlencode "id=$contact_smoke_id" \
              --output "$RUNNER_TEMP/api-contact-report-item.json" \
              --write-out '%{http_code}' \
              "$origin/api/contact-report/item")"
            if test "$contact_code" = 404 \
              && python3 - "$RUNNER_TEMP/api-contact-report-item.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if not isinstance(payload.get("error"), str) or not payload["error"].strip():
              raise SystemExit("Contact-report item route did not reject an unknown target")
          PY
            then
              contact_ready=1
              break
            fi
            sleep 5
          done
          test "$contact_ready" = 1

          for endpoint in \
            'account-admin/report-requests' \
            'account-admin/upload-status?upload_id=00000000-0000-4000-8000-000000000000'
          do
            code="$(curl --silent --show-error --max-time 20 \
              --output "$RUNNER_TEMP/api-anonymous-admin.json" \
              --write-out '%{http_code}' "$origin/api/$endpoint")"
            test "$code" = 403
            python3 -m json.tool "$RUNNER_TEMP/api-anonymous-admin.json" >/dev/null
          done

          code="$(curl --silent --show-error --max-time 20 \
            --request POST --header 'Content-Type: application/json' \
            --data '{"question":"AI research"}' \
            --output "$RUNNER_TEMP/api-anonymous-chat.json" \
            --write-out '%{http_code}' "$origin/api/report-chat")"
          test "$code" = 400
          python3 - "$RUNNER_TEMP/api-anonymous-chat.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if payload.get("stage_code") != "DEVICE_ID_REQUIRED":
              raise SystemExit("Anonymous report chat did not require a stable device id")
          PY

          # Deployment smoke is intentionally read-only. Durable Hot Reports
          # index bootstrap and repair belong to their dedicated maintenance
          # path, not to a Worker version rollout.

      - name: Roll back failed Portal Worker deployment
        id: portal_rollback
        if: >-
          ${{ failure() &&
              steps.deploy-worker-version.outcome != 'skipped' &&
              steps.portal_smoke.outcome != 'success' }}
        timeout-minutes: 5
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          workingDirectory: workers/portal-suite-worker
          wranglerVersion: "4.125.0"
          command: >-
            rollback ${{ env.EDGE_PREVIOUS_VERSION_ID }}
            --message "Automated rollback after Portal Worker verification failure"

      - name: Verify Portal Worker rollback
        if: ${{ failure() && steps.portal_rollback.outcome == 'success' }}
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          PORTAL_SITE_URL: ${{ secrets.PORTAL_SITE_URL }}
        run: |
          set -euo pipefail
          origin="${PORTAL_SITE_URL%/}"
          echo "::add-mask::$origin"
          restored=0
          for attempt in $(seq 1 5); do
            health_code="$(curl --silent --show-error --max-redirs 0 \
              --connect-timeout 5 --max-time 10 \
              --output "$RUNNER_TEMP/rollback-api-health.json" \
              --write-out '%{http_code}' -- "$origin/api/health" || true)"
            if python3 -B scripts/capture_edge_worker_deployment.py \
              --script-name "$PORTAL_WORKER_SCRIPT_NAME" \
              --expect-version "$EDGE_PREVIOUS_VERSION_ID" \
              && [ "$health_code" = "200" ] \
              && python3 -m json.tool "$RUNNER_TEMP/rollback-api-health.json" >/dev/null; then
              restored=1
              break
            fi
            sleep 5
          done
          test "$restored" = 1
