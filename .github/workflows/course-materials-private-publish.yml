name: Course Materials Private Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate all private source PDFs without publishing"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: course-materials-private-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/course-materials-private-publish.yml
            portal_suite/site_src/data/course-materials.json
            scripts/publish_course_materials.py
            scripts/test_publish_course_materials.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install publisher dependencies
        run: python3 -m pip install --disable-pip-version-check "boto3>=1.34,<2" "cryptography>=42,<47" "pypdf>=4,<6" "requests>=2.31,<3"

      - name: Validate publisher contracts
        run: |
          python3 -m py_compile scripts/publish_course_materials.py
          python3 -B scripts/test_publish_course_materials.py

      - name: Validate and publish private course PDFs
        env:
          JIANGUOYUN_WEBDAV_URL: ${{ secrets.JIANGUOYUN_WEBDAV_URL }}
          JIANGUOYUN_WEBDAV_USERNAME: ${{ secrets.JIANGUOYUN_WEBDAV_USERNAME }}
          JIANGUOYUN_WEBDAV_PASSWORD: ${{ secrets.JIANGUOYUN_WEBDAV_PASSWORD }}
          COURSE_MAIFU_WEBDAV_PATH: ${{ secrets.COURSE_MAIFU_WEBDAV_PATH }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          args=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then args+=(--dry-run); fi
          python3 scripts/publish_course_materials.py "${args[@]}"
