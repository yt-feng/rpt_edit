name: Neutral edge catalog refresh
run-name: Neutral edge catalog ${{ inputs.operation || 'scheduled refresh' }}

on:
  schedule:
    # UTC 01:30/05:30/09:30/13:30 = Asia/Shanghai 09:30/13:30/17:30/21:30.
    - cron: "30 1,5,9,13 * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: "Choose migrate or rollback"
        required: true
        type: choice
        options:
          - migrate
          - switch
          - rollback
          - inspect-source
        default: migrate

permissions:
  contents: write

concurrency:
  group: neutral-edge-hosting-cutover
  cancel-in-progress: false

jobs:
  edge:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate public source
        run: |
          set -euo pipefail
          python3 -B scripts/check_public_identity.py
          node --input-type=module --check < workers/edge-static-host/src/index.js
          node --input-type=module --check < workers/portal-suite-worker/src/index.js
          node --input-type=module --check < workers/portal-suite-worker/src/source-lead-adapter.js
          node --check portal_suite/site_src/assets/app.js
          node --check portal_suite/site_src/assets/report-chat.js
          node --check portal_suite/site_src/assets/charts.js
          node --check portal_suite/site_src/assets/site-runtime.js
          node --test workers/edge-static-host/test/index.test.mjs
          node --test portal_suite/tests/*.test.mjs
          node scripts/test_source_lead_adapter.js
          node scripts/test_portal_source_lead_integration.js
          node scripts/test_portal_hot_report_auto_archive.js
          node scripts/test_portal_hot_reports.js
          node scripts/test_portal_chart_search_frontend.js
          node scripts/test_portal_site_runtime.js
          python3 -m py_compile scripts/edge_route_cutover.py
          python3 -m py_compile \
            scripts/build_chart_search_index.py \
            scripts/build_report_chat_index.py \
            scripts/build_report_research_index.py \
            scripts/chart_search_r2.py \
            scripts/merge_chart_search_index.py \
            scripts/portal_suite_catalog.py \
            scripts/publish_static_slot.py
          python3 scripts/test_build_report_chat_index.py
          python3 scripts/test_report_research_index.py
          python3 scripts/test_portal_catalog_storage_guard.py
          python3 -B scripts/test_publish_static_slot.py
          python3 scripts/test_portal_seo.py
          python3 scripts/test_submit_portal_indexnow.py
          python3 scripts/test_portal_blog_build.py
          python3 scripts/test_edge_route_cutover.py

      - name: Prepare masked runtime context
        env:
          PORTAL_SITE_URL: ${{ secrets.PORTAL_SITE_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          echo "::add-mask::$PORTAL_SITE_URL"
          echo "::add-mask::$R2_BUCKET"
          site_host="$(python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          parsed = urlsplit(os.environ["PORTAL_SITE_URL"])
          if parsed.scheme != "https" or not parsed.hostname or parsed.path not in {"", "/"}:
              raise SystemExit("Configured site URL is not a bare HTTPS origin")
          print(parsed.hostname)
          PY
          )"
          release_id="$(openssl rand -hex 16)"
          echo "::add-mask::$site_host"
          echo "::add-mask::$release_id"
          alias_hosts=""
          if [ "$(printf '%s' "$site_host" | awk -F. '{print NF}')" -eq 2 ] && [ "${site_host#www.}" = "$site_host" ]; then
            alias_hosts="www.$site_host"
            echo "::add-mask::$alias_hosts"
          fi
          printf 'SITE_HOST=%s\n' "$site_host" >> "$GITHUB_ENV"
          printf 'EDGE_ALIAS_HOSTS=%s\n' "$alias_hosts" >> "$GITHUB_ENV"
          printf 'STATIC_RELEASE=%s\n' "$release_id" >> "$GITHUB_ENV"

      - name: Capture previous public discovery state
        if: github.event_name == 'schedule' || inputs.operation == 'migrate'
        env:
          PORTAL_SITE_URL: ${{ secrets.PORTAL_SITE_URL }}
        run: |
          set -euo pipefail
          echo "::add-mask::$PORTAL_SITE_URL"
          origin="${PORTAL_SITE_URL%/}"
          curl --fail --location --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            --header 'Cache-Control: no-cache' \
            --output "$RUNNER_TEMP/previous-public-catalog.json" \
            "$origin/data/catalog.json?indexnow-before=$STATIC_RELEASE"
          curl --fail --location --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            --header 'Cache-Control: no-cache' \
            --output "$RUNNER_TEMP/previous-public-sitemap.xml" \
            "$origin/sitemap-baidu.xml?indexnow-before=$STATIC_RELEASE"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit
          import xml.etree.ElementTree as ET

          runner_temp = Path(os.environ["RUNNER_TEMP"])
          catalog = json.loads(runner_temp.joinpath("previous-public-catalog.json").read_text(encoding="utf-8"))
          items = catalog.get("items")
          if not isinstance(items, list) or not items:
              raise SystemExit("Previous public catalog is empty or invalid")
          ids = [str(item.get("id") or "") for item in items if isinstance(item, dict)]
          if len(ids) != len(items) or any(not value for value in ids) or len(ids) != len(set(ids)):
              raise SystemExit("Previous public catalog contains missing or duplicate report ids")

          sitemap = ET.parse(runner_temp / "previous-public-sitemap.xml").getroot()
          if sitemap.tag.rsplit("}", 1)[-1] != "urlset":
              raise SystemExit("Previous public sitemap is not a flat canonical urlset")
          locs = [str(node.text or "").strip() for node in sitemap.findall("./{*}url/{*}loc")]
          expected_host = urlsplit(os.environ["PORTAL_SITE_URL"]).hostname
          if not locs or any(urlsplit(value).hostname != expected_host for value in locs):
              raise SystemExit("Previous public sitemap is empty or contains a foreign host")
          print(f"previous_public_reports={len(items)} previous_canonical_urls={len(locs)}")
          PY

      - name: Install refresh dependencies
        if: github.event_name == 'schedule' || inputs.operation == 'migrate' || inputs.operation == 'inspect-source'
        run: >-
          python3 -m pip install --disable-pip-version-check
          "boto3>=1.34,<2" "pypdf>=4,<6" "requests>=2.31,<3" "Pillow>=10,<12"

      - name: Test Dropbox API retry handling
        if: github.event_name == 'schedule' || inputs.operation == 'migrate' || inputs.operation == 'inspect-source'
        run: python3 scripts/test_build_bank_report_catalog.py

      - name: Test chart search indexing
        if: github.event_name == 'schedule' || inputs.operation == 'migrate'
        run: python3 scripts/test_chart_search_index.py

      - name: Inspect source namespace visibility
        if: inputs.operation == 'inspect-source'
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re

          import requests

          token_response = requests.post(
              "https://api.dropboxapi.com/oauth2/token",
              data={"grant_type": "refresh_token", "refresh_token": os.environ["DROPBOX_REFRESH_TOKEN"]},
              auth=(os.environ["DROPBOX_APP_KEY"], os.environ["DROPBOX_APP_SECRET"]),
              timeout=60,
          )
          token_response.raise_for_status()
          token = token_response.json()["access_token"]
          auth_headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          account_response = requests.post(
              "https://api.dropboxapi.com/2/users/get_current_account",
              headers=auth_headers,
              data="null",
              timeout=60,
          )
          account_response.raise_for_status()
          root_info = account_response.json().get("root_info") or {}
          root_namespace = str(root_info.get("root_namespace_id") or "")
          home_namespace = str(root_info.get("home_namespace_id") or "")

          def list_dates(path_root):
              headers = dict(auth_headers)
              if path_root:
                  headers["Dropbox-API-Path-Root"] = json.dumps(
                      {".tag": "root", "root": path_root}, separators=(",", ":")
                  )
              response = requests.post(
                  "https://api.dropboxapi.com/2/files/list_folder",
                  headers=headers,
                  json={"path": "/zip_backup", "recursive": False, "include_deleted": False},
                  timeout=90,
              )
              if response.status_code == 409:
                  return False, []
              response.raise_for_status()
              payload = response.json()
              entries = list(payload.get("entries") or [])
              while payload.get("has_more"):
                  response = requests.post(
                      "https://api.dropboxapi.com/2/files/list_folder/continue",
                      headers=headers,
                      json={"cursor": payload["cursor"]},
                      timeout=90,
                  )
                  response.raise_for_status()
                  payload = response.json()
                  entries.extend(payload.get("entries") or [])
              dates = sorted(
                  (
                      str(entry.get("name") or "")
                      for entry in entries
                      if entry.get(".tag") == "folder" and re.fullmatch(r"\d{6,8}", str(entry.get("name") or ""))
                  ),
                  key=int,
                  reverse=True,
              )
              return True, dates

          default_found, default_dates = list_dates("")
          print(
              f"account_root_kind={root_info.get('.tag') or 'unknown'} "
              f"root_differs_from_home={root_namespace != home_namespace}"
          )
          print(
              f"default_path_found={default_found} default_date_count={len(default_dates)} "
              f"default_latest={','.join(default_dates[:10]) or 'none'}"
          )
          if root_namespace and root_namespace != home_namespace:
              root_found, root_dates = list_dates(root_namespace)
              print(
                  f"account_root_path_found={root_found} account_root_date_count={len(root_dates)} "
                  f"account_root_latest={','.join(root_dates[:10]) or 'none'}"
              )
          PY

      - name: Materialize private deployment profile
        if: github.event_name == 'schedule' || inputs.operation == 'migrate'
        env:
          PORTAL_PRIVATE_CONFIG_B64: ${{ secrets.PORTAL_PRIVATE_CONFIG_B64 }}
          PORTAL_PRIVATE_ASSET_KEY: ${{ secrets.PORTAL_PRIVATE_ASSET_KEY }}
          PORTAL_PRIVATE_PUBLISH_ASSET_KEY: ${{ secrets.PORTAL_PRIVATE_PUBLISH_ASSET_KEY }}
          PORTAL_SOCIAL_CARD_B64: ${{ secrets.PORTAL_SOCIAL_CARD_B64 }}
          PORTAL_SITE_URL: ${{ secrets.PORTAL_SITE_URL }}
        run: |
          set -euo pipefail
          echo "::add-mask::$PORTAL_SITE_URL"
          python3 scripts/render_private_config.py --github-add-mask
          python3 scripts/render_private_config.py \
            --root portal_suite/site_src \
            --root scripts/build_portal_suite_site.py \
            --root workers/portal-suite-worker/src/index.js
          bash scripts/materialize_private_assets.sh portal_suite/site_src
          test -s portal_suite/site_src/assets/contact-card.jpg
          test -n "$PORTAL_SOCIAL_CARD_B64"
          social_card="$RUNNER_TEMP/portal-social-card.jpg"
          printf '%s' "$PORTAL_SOCIAL_CARD_B64" | base64 --decode > "$social_card"
          test "$(od -An -tx1 -N3 "$social_card" | tr -d ' \n')" = "ffd8ff"
          test "$(wc -c < "$social_card")" -le 1048576
          install -m 0600 "$social_card" portal_suite/site_src/assets/social-card.jpg

      - name: Refresh report catalog and private PDF mirror
        id: catalog
        if: github.event_name == 'schedule' || inputs.operation == 'migrate'
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_OBJECT_PREFIX: ${{ vars.R2_OBJECT_PREFIX || 'reports' }}
          CATALOG_PDF_CLEANUP_ENABLED: ${{ vars.CATALOG_PDF_CLEANUP_ENABLED || 'true' }}
        run: |
          set -euo pipefail
          case "$CATALOG_PDF_CLEANUP_ENABLED" in
            true) cleanup_args=(--enable-pdf-cleanup) ;;
            false) cleanup_args=() ;;
            *)
              echo "CATALOG_PDF_CLEANUP_ENABLED must be true or false" >&2
              exit 1
              ;;
          esac
          test -s portal_suite/data/catalog.json
          test -s portal_suite/data/archive_catalog.json
          test -s portal_suite/data/history_catalog.json
          python3 scripts/portal_suite_catalog.py \
            --dropbox-root "/zip_backup" \
            --days 0 \
            --catalog-path "portal_suite/data/catalog.json" \
            --password-rules "portal_suite/password_rules.json" \
            --r2-prefix "$R2_OBJECT_PREFIX" \
            --storage-limit-gb 100 \
            --sync-r2 \
            "${cleanup_args[@]}"

      - name: Translate missing report titles
        if: github.event_name == 'schedule' || inputs.operation == 'migrate'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
        run: |
          set -euo pipefail
          python3 scripts/translate_portal_titles.py \
            --catalog-path "portal_suite/data/catalog.json" \
            --model "$DEEPSEEK_MODEL" \
            --deepseek-base-url "$DEEPSEEK_BASE_URL" \
            --workers 500

      - name: Publish private Report Chat lookup index
        if: github.event_name == 'schedule' || inputs.operation == 'migrate'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          python3 scripts/build_report_chat_index.py \
            --catalog-path portal_suite/data/catalog.json \
            --output-dir "$RUNNER_TEMP/report-chat-index" \
            --upload-r2

      - name: Download private chart search index
        if: github.event_name == 'schedule' || inputs.operation == 'migrate'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python3 scripts/chart_search_r2.py download \
            --index _chart_search/index.json

      - name: Build private static release
        if: github.event_name == 'schedule' || inputs.operation == 'migrate'
        env:
          PORTAL_WORKER_URL: ${{ secrets.PORTAL_WORKER_URL }}
          PORTAL_DOWNLOAD_PASSWORD: ${{ secrets[vars.PORTAL_DOWNLOAD_SECRET_REF] }}
          PASSWORD_SECRET: ${{ secrets.PASSWORD_SECRET }}
        run: |
          set -euo pipefail
          echo "::add-mask::$PORTAL_WORKER_URL"
          if ! python3 scripts/build_portal_suite_site.py \
            --catalog-path portal_suite/data/catalog.json \
            --password-rules portal_suite/password_rules.json \
            --site-src portal_suite/site_src \
            --wechat-drafts-root wechat_drafts \
            --blog-archive-root portal_suite/data/blog_archive \
            --output-dir _neutral_site \
            --worker-base-url "$PORTAL_WORKER_URL" \
            >"$RUNNER_TEMP/static-build.log" 2>&1
          then
            echo "Static build failed" >&2
            exit 1
          fi
          python3 scripts/merge_chart_search_index.py \
            --search-index _neutral_site/data/search_index.json \
            --chart-index _chart_search/index.json \
            --catalog portal_suite/data/catalog.json \
            --chart-output _neutral_site/data/chart_search_index.json
          test -s _neutral_site/index.html
          test -s _neutral_site/assets/app.js
          test -s _neutral_site/data/catalog.json
          test -s _neutral_site/data/catalog_preview.json
          test -s _neutral_site/data/catalog_recommendations.json
          test -s _neutral_site/data/search_index.json
          test -s _neutral_site/data/chart_search_index.json
          test -s _neutral_site/data/password_rules.json
          test -s _neutral_site/reports/institutions/bernstein/index.html
          test -n "$(find _neutral_site/data/report_details -type f -name '*.json' -print -quit)"
          python3 - <<'PY'
          from pathlib import Path

          root = Path("_neutral_site")
          files = [path for path in root.rglob("*") if path.is_file() and not path.is_symlink()]
          total = sum(path.stat().st_size for path in files)
          if not 1000 <= len(files) <= 20000:
              raise SystemExit("Static file count is outside the expected range")
          if not 100_000_000 <= total <= 1_000_000_000:
              raise SystemExit("Static release size is outside the expected range")
          if any(path.is_symlink() for path in root.rglob("*")):
              raise SystemExit("Static release contains a symbolic link")
          placeholder = bytes(
              (112, 111, 114, 116, 97, 108, 46, 101, 120, 97, 109, 112, 108, 101, 46, 105, 110, 118, 97, 108, 105, 100)
          ).decode("ascii")
          blog_files = tuple((root / "blog").glob("*.html"))
          if not blog_files:
              raise SystemExit("Static release contains no Blog pages")
          leaked_blog_pages = [
              path.name
              for path in blog_files
              if placeholder in path.read_text(encoding="utf-8")
          ]
          if leaked_blog_pages:
              raise SystemExit(
                  f"Static Blog release retained the public host placeholder in {len(leaked_blog_pages)} page(s)"
              )
          print(f"static_files={len(files)} static_bytes={total}")
          PY

      - name: Publish private report research evidence index
        if: github.event_name == 'schedule' || inputs.operation == 'migrate'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          python3 scripts/build_report_research_index.py \
            --catalog-path _neutral_site/data/catalog.json \
            --search-index-path _neutral_site/data/search_index.json \
            --output-dir "$RUNNER_TEMP/report-research-index" \
            --merge-r2-corpus \
            --upload-r2

      - name: Discover active static slot
        id: active_static_slot
        if: github.event_name == 'schedule' || inputs.operation == 'migrate'
        env:
          PORTAL_SITE_URL: ${{ secrets.PORTAL_SITE_URL }}
        run: |
          set -euo pipefail
          echo "::add-mask::$PORTAL_SITE_URL"
          state_url="$PORTAL_SITE_URL/.well-known/edge-state?before=$STATIC_RELEASE"
          for attempt in $(seq 1 6); do
            headers="$RUNNER_TEMP/edge-state-before.headers"
            body="$RUNNER_TEMP/edge-state-before.json"
            rm -f "$headers" "$body"
            curl_exit=0
            status="$(curl --location --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              --dump-header "$headers" \
              --output "$body" \
              --write-out '%{http_code}' \
              "$state_url")" || curl_exit=$?
            if [ "$curl_exit" -eq 0 ] && [ "$status" = "200" ]; then
              slot="$(STATE_PATH="$body" python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          state = json.loads(Path(os.environ["STATE_PATH"]).read_text(encoding="utf-8"))
          if state.get("schema_version") != 1 or state.get("slot") not in {"a", "b"}:
              raise SystemExit("Active static slot state is invalid")
          if not re.fullmatch(r"[0-9a-f]{32}", str(state.get("release_id") or "")):
              raise SystemExit("Active static release state is invalid")
          print(state["slot"])
          PY
              )"
              printf 'ACTIVE_STATIC_SLOT=%s\n' "$slot" >> "$GITHUB_ENV"
              printf 'active_slot=%s\n' "$slot" >> "$GITHUB_OUTPUT"
              printf 'active_static_slot=%s\n' "$slot"
              exit 0
            fi
            if [ "$curl_exit" -eq 0 ] && [ "$status" = "404" ] \
              && grep -Eiq '^x-origin-class:[[:space:]]*edge-static[[:space:]]*$' "$headers"
            then
              printf 'ACTIVE_STATIC_SLOT=\n' >> "$GITHUB_ENV"
              printf 'active_slot=\n' >> "$GITHUB_OUTPUT"
              echo "active_static_slot=legacy-bootstrap"
              exit 0
            fi
            echo "Waiting for active static slot state ($attempt/6; status=${status:-000}; curl_exit=$curl_exit)"
            sleep 5
          done
          echo "Active static slot could not be determined." >&2
          exit 1

      - name: Verify hot-report API contract before static switch
        id: hot_report_api_gate
        if: github.event_name == 'schedule' || inputs.operation == 'migrate'
        env:
          PORTAL_SITE_URL: ${{ secrets.PORTAL_SITE_URL }}
        run: |
          set -euo pipefail
          echo "::add-mask::$PORTAL_SITE_URL"
          origin="${PORTAL_SITE_URL%/}"
          curl --fail --location --silent --show-error \
            --connect-timeout 10 --max-time 10 \
            --header 'Cache-Control: no-cache' \
            --get \
            --data-urlencode 'limit=24' \
            --data-urlencode "smoke=pre-static-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output "$RUNNER_TEMP/hot-reports-pre-static-api.json" \
            "$origin/api/hot-reports"
          python3 - "$RUNNER_TEMP/hot-reports-pre-static-api.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          items = payload.get("items")
          if not isinstance(items, list) or len(items) > 24:
              raise SystemExit("Pre-static hot-report API did not return at most 24 items")
          if payload.get("page_size") != 24:
              raise SystemExit("Pre-static hot-report API page size is not 24")
          total = payload.get("total")
          if not isinstance(total, int) or isinstance(total, bool) or total < len(items):
              raise SystemExit("Pre-static hot-report API total is invalid")
          if not isinstance(payload.get("has_more"), bool):
              raise SystemExit("Pre-static hot-report API has_more is not boolean")
          if payload["has_more"] != bool(payload.get("next_cursor")):
              raise SystemExit("Pre-static hot-report API cursor contract is inconsistent")
          if not payload.get("index_updated_at"):
              raise SystemExit("Pre-static hot-report API did not expose the index timestamp")
          print(
              f"pre_static_hot_reports=verified items={len(items)} "
              f"total={total} has_more={payload['has_more']}"
          )
          PY

      - name: Upload inactive static slot incrementally
        id: static_upload
        if: github.event_name == 'schedule' || inputs.operation == 'migrate'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          python3 -B scripts/publish_static_slot.py \
            --root _neutral_site \
            --release "$STATIC_RELEASE" \
            --active-slot "${ACTIVE_STATIC_SLOT:-}" \
            --max-workers 10

      - name: Prepare neutral edge runtime
        if: github.event_name == 'schedule' || inputs.operation == 'migrate'
        env:
          PORTAL_PRIVATE_CONFIG_B64: ${{ secrets.PORTAL_PRIVATE_CONFIG_B64 }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
