          prefix="$(REPORT_ID="$report_id" python3 - <<'PY'
          import os
          import re

          print(re.sub(r"[^a-z0-9]", "_", os.environ["REPORT_ID"].lower())[:2].ljust(2, "_"))
          PY
          )"
          fetch_asset() {
            local label="$1"
            local url="$2"
            local output="$3"
            local http_status="000"
            local curl_exit=0
            http_status="$(curl --fail --location --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              --write-out '%{http_code}' \
              --output "$output" \
              "$url")" || curl_exit=$?
            if [ "$curl_exit" -ne 0 ] || ! [[ "$http_status" =~ ^2[0-9][0-9]$ ]]; then
              rm -f "$output"
              printf 'asset_check=%s http_status=%s curl_exit=%s\n' \
                "$label" "${http_status:-000}" "$curl_exit" >&2
              return 1
            fi
            printf 'asset_check=%s http_status=%s\n' "$label" "$http_status"
          }

          for attempt in $(seq 1 18); do
            rm -f \
              "$RUNNER_TEMP/live-bernstein-release.html" \
              "$RUNNER_TEMP/live-indexnow-key-release.txt" \
              "$RUNNER_TEMP/live-report-detail-release.json" \
              "$RUNNER_TEMP/live-recommendations-release.json" \
              "$RUNNER_TEMP/live-bernstein-public.html" \
              "$RUNNER_TEMP/live-indexnow-key-public.txt"
            if fetch_asset \
              "bernstein-release" \
              "$release_check/reports/institutions/bernstein/index.html" \
              "$RUNNER_TEMP/live-bernstein-release.html" \
              && fetch_asset \
                "indexnow-key-release" \
                "$release_check/b7c3e9a41d8f52e604a71bc93f2d6e80.txt" \
                "$RUNNER_TEMP/live-indexnow-key-release.txt" \
              && fetch_asset \
                "report-detail-release" \
                "$release_check/data/report_details/$prefix.json" \
                "$RUNNER_TEMP/live-report-detail-release.json" \
              && fetch_asset \
                "recommendations-release" \
                "$release_check/data/catalog_recommendations.json" \
                "$RUNNER_TEMP/live-recommendations-release.json" \
              && fetch_asset \
                "bernstein-public" \
                "$PORTAL_SITE_URL/reports/institutions/bernstein/index.html" \
                "$RUNNER_TEMP/live-bernstein-public.html" \
              && fetch_asset \
                "indexnow-key-public" \
                "$PORTAL_SITE_URL/b7c3e9a41d8f52e604a71bc93f2d6e80.txt" \
                "$RUNNER_TEMP/live-indexnow-key-public.txt" \
              && REPORT_ID="$report_id" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          catalog = json.loads(Path("_neutral_site/data/catalog.json").read_text(encoding="utf-8"))
          report_id = os.environ["REPORT_ID"]
          runner_temp = Path(os.environ["RUNNER_TEMP"])
          expected = (
              ("live-bernstein-release.html", "伯恩斯坦研报"),
              ("live-indexnow-key-release.txt", "b7c3e9a41d8f52e604a71bc93f2d6e80"),
              ("live-bernstein-public.html", "伯恩斯坦研报"),
              ("live-indexnow-key-public.txt", "b7c3e9a41d8f52e604a71bc93f2d6e80"),
          )
          for filename, marker in expected:
              body = runner_temp.joinpath(filename).read_text(encoding="utf-8")
              if marker not in body:
                  raise SystemExit(f"Live discovery asset failed verification: {filename}")
          shard = json.loads(runner_temp.joinpath("live-report-detail-release.json").read_text(encoding="utf-8"))
          if report_id not in (shard.get("reports") or {}):
              raise SystemExit("Live report-detail shard does not contain its catalog report")
          recommendation_catalog = json.loads(
              runner_temp.joinpath("live-recommendations-release.json").read_text(encoding="utf-8")
          )
          if int(recommendation_catalog.get("item_count") or 0) != int(catalog.get("item_count") or 0):
              raise SystemExit("Live recommendation catalog does not match the active catalog")
          print("live_discovery_assets=verified live_report_detail_shard=verified live_recommendation_catalog=verified")
          PY
            then
              exit 0
            fi
            if [ "$attempt" -lt 18 ]; then
              echo "Waiting for discovery assets to become active ($attempt/18)"
              sleep 5
            fi
          done
          echo "Discovery assets did not become active in time." >&2
          exit 1

