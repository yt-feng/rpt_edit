name: Neutral edge catalog refresh
run-name: Neutral edge catalog ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'migrate' }}

on:
  schedule:
    - cron: "30 1,5,9,13 * * *"
  workflow_run:
    workflows:
      - Bank report catalog
      - Final PDF to XHS notes
      - Institution latest PDF to WeChat
      - Consulting latest PDF to WeChat
      - ARK Invest feed to WeChat
      - Upload XHS notes to WeChat drafts
      - Portal chart search index
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: "Rehearse restores A; locale-shadow prepares multilingual B without cutover; migrate keeps accepted B"
        required: true
        type: choice
        options:
          - rehearse
          - locale-shadow
          - migrate
        default: rehearse

permissions:
  contents: read

concurrency:
  group: portal-production-release
  cancel-in-progress: false

jobs:
  prepare_release:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          vars.NEUTRAL_SCHEDULE_ENABLED == 'true' &&
          (
            vars.PORTAL_MULTILINGUAL_ENABLED != 'true' ||
            vars.PORTAL_MULTILINGUAL_LIVE == 'true'
          ) &&
          (
            github.event_name == 'schedule' ||
            (
              github.event_name == 'workflow_run' &&
              github.event.workflow_run.conclusion == 'success' &&
              github.event.workflow_run.head_branch == github.event.repository.default_branch &&
              github.event.workflow_run.head_repository.full_name == github.repository
            )
          )
        )
      }}
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    outputs:
      changed: ${{ steps.release_delta.outputs.changed }}
      static_release: ${{ steps.runtime_context.outputs.static_release }}
      static_slot: ${{ steps.static_upload.outputs.static_slot }}
      static_prefix: ${{ steps.static_upload.outputs.static_prefix }}
      static_tree: ${{ steps.static_upload.outputs.tree_sha256 }}
      previous_slot: ${{ steps.previous_state.outputs.previous_slot }}
      previous_release: ${{ steps.previous_state.outputs.previous_release }}
      previous_tree: ${{ steps.previous_state.outputs.previous_tree }}
      operation: ${{ steps.operation.outputs.operation }}
      candidate_commit: ${{ steps.operation.outputs.commit_sha }}
      multilingual_enabled: ${{ steps.operation.outputs.multilingual_enabled }}
      multilingual_live: ${{ steps.operation.outputs.multilingual_live }}
      multilingual_index_policy_sha256: ${{ steps.locale_policy.outputs.index_policy_sha256 }}
      chinese_parity_sha256: ${{ steps.chinese_parity.outputs.sha256 }}
      shadow_worker_name: ${{ steps.shadow_context.outputs.worker_name }}
      shadow_preview_url: ${{ steps.shadow_identity.outputs.preview_url }}
    steps:
      - name: Require reviewed main operation
        id: operation
        env:
          REQUESTED_OPERATION: ${{ inputs.operation }}
          PORTAL_MULTILINGUAL_CONFIGURED: ${{ vars.PORTAL_MULTILINGUAL_ENABLED || 'false' }}
          PORTAL_MULTILINGUAL_LIVE_CONFIGURED: ${{ vars.PORTAL_MULTILINGUAL_LIVE || 'false' }}
          PORTAL_MULTILINGUAL_INDEX_START_DATE: ${{ vars.PORTAL_MULTILINGUAL_INDEX_START_DATE || '' }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              case "$REQUESTED_OPERATION" in
                rehearse|locale-shadow|migrate) operation="$REQUESTED_OPERATION" ;;
                *) echo "::error::Unsupported manual Neutral operation"; exit 2 ;;
              esac
              ;;
            schedule|workflow_run)
              operation="migrate"
              ;;
            *)
              echo "::error::Unsupported Neutral trigger: $GITHUB_EVENT_NAME"
              exit 2
              ;;
          esac
          multilingual_enabled="$PORTAL_MULTILINGUAL_CONFIGURED"
          if [ "$operation" = "locale-shadow" ]; then
            multilingual_enabled="true"
          fi
          case "$PORTAL_MULTILINGUAL_LIVE_CONFIGURED" in
            true|false) multilingual_live="$PORTAL_MULTILINGUAL_LIVE_CONFIGURED" ;;
            *) echo "::error::PORTAL_MULTILINGUAL_LIVE must be true or false"; exit 2 ;;
          esac
          if [ "$multilingual_enabled" = "true" ]; then
            if [ -n "$PORTAL_MULTILINGUAL_INDEX_START_DATE" ]; then
              INDEX_START_DATE="$PORTAL_MULTILINGUAL_INDEX_START_DATE" python3 - <<'PY'
          import os
          from datetime import date

          value = os.environ["INDEX_START_DATE"]
          try:
              parsed = date.fromisoformat(value)
          except ValueError as error:
              raise SystemExit("PORTAL_MULTILINGUAL_INDEX_START_DATE must use a real YYYY-MM-DD date") from error
          if parsed.isoformat() != value:
              raise SystemExit("PORTAL_MULTILINGUAL_INDEX_START_DATE must use canonical YYYY-MM-DD form")
          PY
            elif [ "$operation" != "locale-shadow" ]; then
              echo "::error::Multilingual cutover requires a fixed PORTAL_MULTILINGUAL_INDEX_START_DATE"
              exit 2
            fi
          fi
          printf 'NEUTRAL_OPERATION=%s\n' "$operation" >> "$GITHUB_ENV"
          printf 'PORTAL_MULTILINGUAL_ENABLED=%s\n' "$multilingual_enabled" >> "$GITHUB_ENV"
          printf 'PORTAL_MULTILINGUAL_LIVE=%s\n' "$multilingual_live" >> "$GITHUB_ENV"
          printf 'operation=%s\n' "$operation" >> "$GITHUB_OUTPUT"
          printf 'commit_sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          printf 'multilingual_enabled=%s\n' "$multilingual_enabled" >> "$GITHUB_OUTPUT"
          printf 'multilingual_live=%s\n' "$multilingual_live" >> "$GITHUB_OUTPUT"

      - name: Checkout public source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install refresh dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check
          "boto3>=1.34,<2" "pypdf>=4,<6" "requests>=2.31,<3"
          "Pillow>=10.1,<12" "qrcode>=8,<9" "zxing-cpp>=2.3,<4"

      - name: Validate public source
        run: |
          set -euo pipefail
          python3 -B scripts/check_public_identity.py
          node --input-type=module --check < workers/edge-static-host/src/index.js
          node --input-type=module --check < workers/portal-suite-worker/src/index.js
          node --input-type=module --check < workers/portal-suite-worker/src/source-lead-adapter.js
          node --check portal_suite/site_src/assets/app.js
          node --check portal_suite/site_src/assets/report-chat.js
          node --check portal_suite/site_src/assets/charts.js
          node --check portal_suite/site_src/assets/site-runtime.js
          node --check portal_suite/locale_assets/locale-runtime.js
          node --test workers/edge-static-host/test/index.test.mjs
          for test_file in portal_suite/tests/*.test.mjs; do
            node "$test_file"
          done
          node scripts/test_source_lead_adapter.js
          node scripts/test_portal_source_lead_integration.js
          node scripts/test_portal_chart_search_frontend.js
          node scripts/test_portal_site_runtime.js
          python3 -m py_compile \
            scripts/build_member_contact_card.py \
            scripts/check_public_brand.py \
            scripts/compare_portal_release_semantics.py \
            scripts/build_portal_locales.py \
            scripts/verify_portal_chinese_parity.py \
            scripts/audit_portal_shadow_preview.py \
            scripts/edge_route_cutover.py \
            scripts/capture_edge_worker_deployment.py \
            scripts/publish_static_slot.py
          python3 -B scripts/test_compare_portal_release_semantics.py
          python3 -B scripts/test_build_member_contact_card.py
          python3 -B scripts/test_render_private_config.py
          python3 -B scripts/test_check_public_brand.py
          python3 -B scripts/test_publish_static_slot.py
          python3 -B scripts/test_capture_edge_worker_deployment.py
          python3 -B scripts/test_build_portal_locales.py
          python3 -B scripts/test_verify_portal_chinese_parity.py
          python3 -B scripts/test_audit_portal_shadow_preview.py
          python3 scripts/test_portal_seo.py
          python3 scripts/test_portal_blog_build.py
          python3 scripts/test_edge_route_cutover.py
          python3 scripts/test_neutral_edge_cutover_workflow.py
          node scripts/test_portal_locale_runtime.js

      - name: Prepare masked release context
        id: runtime_context
        env:
          PORTAL_SITE_URL: ${{ secrets.PORTAL_SITE_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          echo "::add-mask::$PORTAL_SITE_URL"
          echo "::add-mask::$R2_BUCKET"
          site_host="$(python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          parsed = urlsplit(os.environ["PORTAL_SITE_URL"])
          if (
              parsed.scheme != "https"
              or not parsed.hostname
              or parsed.username is not None
              or parsed.password is not None
              or parsed.port is not None
              or parsed.path not in {"", "/"}
              or parsed.query
              or parsed.fragment
          ):
              raise SystemExit("Configured site URL is not a bare HTTPS origin")
          print(parsed.hostname.lower())
          PY
          )"
          alias_hosts=""
          if [ "$(printf '%s' "$site_host" | awk -F. '{print NF}')" -eq 2 ] \
            && [ "${site_host#www.}" = "$site_host" ]
          then
            alias_hosts="www.$site_host"
          fi
          live_origin="https://$site_host"
          release_id="$(openssl rand -hex 16)"
          echo "::add-mask::$site_host"
          echo "::add-mask::$alias_hosts"
          echo "::add-mask::$live_origin"
          printf 'SITE_HOST=%s\n' "$site_host" >> "$GITHUB_ENV"
          printf 'EDGE_ALIAS_HOSTS=%s\n' "$alias_hosts" >> "$GITHUB_ENV"
          printf 'LIVE_ORIGIN=%s\n' "$live_origin" >> "$GITHUB_ENV"
          printf 'STATIC_RELEASE=%s\n' "$release_id" >> "$GITHUB_ENV"
          printf 'static_release=%s\n' "$release_id" >> "$GITHUB_OUTPUT"

      - name: Gate preparation on stable live routes
        timeout-minutes: 5
        env:
          EDGE_SCRIPT_NAME: svc-04df8d213b73
          EDGE_VERIFY_ATTEMPTS: "3"
          EDGE_VERIFY_CONSECUTIVE: "3"
        run: python3 -B scripts/edge_route_cutover.py verify

      - name: Capture exact previous state and public discovery
        id: previous_state
        run: |
          set -euo pipefail
          origin="$LIVE_ORIGIN"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 20 --header 'Cache-Control: no-cache' \
            --output "$RUNNER_TEMP/previous-edge-state.json" \
            "$origin/.well-known/edge-state"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 60 --header 'Cache-Control: no-cache' \
            --output "$RUNNER_TEMP/previous-public-catalog.json" \
            "$origin/data/catalog.json"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 60 --header 'Cache-Control: no-cache' \
            --output "$RUNNER_TEMP/previous-public-sitemap.xml" \
            "$origin/sitemap-baidu.xml"
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path(os.environ["RUNNER_TEMP"])
          state = json.loads(root.joinpath("previous-edge-state.json").read_text(encoding="utf-8"))
          if (
              state.get("schema_version") != 1
              or state.get("slot") not in {"a", "b"}
              or not re.fullmatch(r"[0-9a-f]{32}", str(state.get("release_id") or ""))
              or not re.fullmatch(r"[0-9a-f]{64}", str(state.get("tree_sha256") or ""))
          ):
              raise SystemExit("Previous Edge state is invalid")
          catalog = json.loads(root.joinpath("previous-public-catalog.json").read_text(encoding="utf-8"))
          items = catalog.get("items")
          if not isinstance(items, list) or not items:
              raise SystemExit("Previous public catalog is empty or invalid")
          sitemap = ET.parse(root / "previous-public-sitemap.xml").getroot()
          if sitemap.tag.rsplit("}", 1)[-1] != "urlset" or not sitemap.findall("./{*}url"):
              raise SystemExit("Previous public sitemap is empty or invalid")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"previous_slot={state['slot']}\n")
              handle.write(f"previous_release={state['release_id']}\n")
              handle.write(f"previous_tree={state['tree_sha256']}\n")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"ACTIVE_STATIC_SLOT={state['slot']}\n")
              handle.write(f"PREVIOUS_STATIC_RELEASE={state['release_id']}\n")
          print(f"previous_slot={state['slot']} previous_catalog_items={len(items)}")
          PY

      - name: Capture active release semantics
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/previous-release-semantics.json"
          status="$(curl --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 30 --header 'Cache-Control: no-cache' \
            --output "$output" --write-out '%{http_code}' \
            "$LIVE_ORIGIN/.well-known/edge-release/$PREVIOUS_STATIC_RELEASE/data/release-semantics.json")"
          case "$status" in
            200)
              PYTHONPATH=scripts PREVIOUS_MANIFEST="$output" python3 - <<'PY'
          import os
          from pathlib import Path
          from compare_portal_release_semantics import load_manifest

          manifest = load_manifest(Path(os.environ["PREVIOUS_MANIFEST"]))
          print(f"previous_semantic_sha256={manifest['semantic_sha256']}")
          PY
              ;;
            404)
              rm -f "$output"
              echo "Active release has no semantic manifest; a reviewed manual seed is required"
              ;;
            *)
              echo "::error::Could not read active release semantics: HTTP $status"
              exit 1
              ;;
          esac

      - name: Capture exact active static manifest
        if: steps.operation.outputs.multilingual_enabled == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          MULTILINGUAL_LIVE: ${{ steps.operation.outputs.multilingual_live }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import hashlib
          from pathlib import Path
          import sys

          sys.path.insert(0, "scripts")
          from chart_search_r2 import client_and_bucket
          from publish_static_slot import slot_prefix, valid_manifest

          runner = Path(os.environ["RUNNER_TEMP"])
          state = json.loads(runner.joinpath("previous-edge-state.json").read_text(encoding="utf-8"))
          client, bucket = client_and_bucket()
          key = f"edge-static/slot-manifests/{state['slot']}.json"
          try:
              response = client.get_object(Bucket=bucket, Key=key)
              body = response["Body"].read(64 * 1024 * 1024 + 1)
          except Exception as error:
              raise SystemExit("Active static manifest is unavailable") from error
          if not body or len(body) > 64 * 1024 * 1024:
              raise SystemExit("Active static manifest is empty or oversized")
          try:
              payload = json.loads(body)
          except (UnicodeDecodeError, json.JSONDecodeError) as error:
              raise SystemExit("Active static manifest is invalid JSON") from error
          manifest = valid_manifest(payload, state["slot"])
          if (
              manifest is None
              or manifest.get("release_id") != state["release_id"]
              or manifest.get("tree_sha256") != state["tree_sha256"]
          ):
              raise SystemExit("Active static manifest does not match the live Edge state")
          output = runner / "previous-slot-manifest.json"
          output.write_text(
              json.dumps(manifest, ensure_ascii=True, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          output.chmod(0o600)
          if os.environ["MULTILINGUAL_LIVE"] != "true":
              descriptor = manifest["files"].get("assets/app.js")
              if not isinstance(descriptor, dict):
                  raise SystemExit("Active static manifest has no Chinese app bundle")
              app_response = client.get_object(
                  Bucket=bucket,
                  Key=slot_prefix(state["slot"]) + "assets/app.js",
              )
              app_body = app_response["Body"].read(16 * 1024 * 1024 + 1)
              if (
                  not app_body
                  or len(app_body) > 16 * 1024 * 1024
                  or len(app_body) != int(descriptor["size"])
                  or hashlib.sha256(app_body).hexdigest() != descriptor["sha256"]
              ):
                  raise SystemExit("Active Chinese app bundle does not match its manifest")
              active_app = runner / "previous-active-app.js"
              active_app.write_bytes(app_body)
              active_app.chmod(0o600)
          print(f"active_static_manifest_files={manifest['file_count']}")
          PY

      - name: Materialize private deployment profile
        env:
          PORTAL_PRIVATE_CONFIG_B64: ${{ secrets.PORTAL_PRIVATE_CONFIG_B64 }}
          PORTAL_PRIVATE_ASSET_KEY: ${{ secrets.PORTAL_PRIVATE_ASSET_KEY }}
          PORTAL_PRIVATE_PUBLISH_ASSET_KEY: ${{ secrets.PORTAL_PRIVATE_PUBLISH_ASSET_KEY }}
          PORTAL_SOCIAL_CARD_B64: ${{ secrets.PORTAL_SOCIAL_CARD_B64 }}
          PORTAL_SITE_URL: ${{ secrets.PORTAL_SITE_URL }}
        run: |
          set -euo pipefail
          echo "::add-mask::$PORTAL_SITE_URL"
          python3 scripts/render_private_config.py --github-add-mask
          python3 scripts/render_private_config.py \
            --root portal_suite/site_src \
            --root scripts/build_portal_suite_site.py \
            --root workers/portal-suite-worker/src/index.js
          python3 -B scripts/check_public_brand.py portal_suite/site_src \
            --forbid-profile-private-for admin-a \
            --forbid-profile-private-for admin-a@users.portal.example.invalid
          bash scripts/materialize_private_assets.sh portal_suite/site_src
          legacy_contact_card="portal_suite/site_src/assets/contact-card.jpg"
          member_contact_card="$RUNNER_TEMP/member-contact-card.jpg"
          trap 'rm -f "$legacy_contact_card"' EXIT
          test -s "$legacy_contact_card"
          python3 -B scripts/build_member_contact_card.py \
            --source "$legacy_contact_card" \
            --output "$member_contact_card"
          rm -f "$legacy_contact_card"
          trap - EXIT
          test ! -e "$legacy_contact_card"
          test -s "$member_contact_card"
          test -n "$PORTAL_SOCIAL_CARD_B64"
          social_card="$RUNNER_TEMP/portal-social-card.jpg"
          printf '%s' "$PORTAL_SOCIAL_CARD_B64" | base64 --decode > "$social_card"
          test "$(od -An -tx1 -N3 "$social_card" | tr -d ' \n')" = "ffd8ff"
          test "$(wc -c < "$social_card")" -le 1048576
          install -m 0600 "$social_card" portal_suite/site_src/assets/social-card.jpg

      - name: Refresh report catalog with additive PDF sync
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_OBJECT_PREFIX: ${{ vars.R2_OBJECT_PREFIX || 'reports' }}
          CATALOG_PDF_CLEANUP_ENABLED: "false"
        run: |
          set -euo pipefail
          test "$CATALOG_PDF_CLEANUP_ENABLED" = "false"
          test -s portal_suite/data/catalog.json
          test -s portal_suite/data/archive_catalog.json
          test -s portal_suite/data/history_catalog.json
          python3 scripts/portal_suite_catalog.py \
            --dropbox-root "/zip_backup" --days 0 \
            --catalog-path portal_suite/data/catalog.json \
            --password-rules portal_suite/password_rules.json \
            --r2-prefix "$R2_OBJECT_PREFIX" --storage-limit-gb 100 --sync-r2

      - name: Translate missing report titles
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
        run: |
          set -euo pipefail
          python3 scripts/translate_portal_titles.py \
            --catalog-path portal_suite/data/catalog.json \
            --model "$DEEPSEEK_MODEL" --deepseek-base-url "$DEEPSEEK_BASE_URL" --workers 500

      - name: Download private chart search index
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python3 scripts/chart_search_r2.py download --index _chart_search/index.json

      - name: Download public Hot Reports translation source
        if: steps.operation.outputs.multilingual_enabled == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, "scripts")
          from chart_search_r2 import client_and_bucket

          client, bucket = client_and_bucket()
          key = "_hot-reports/indexes/public-v2.json"
          try:
              response = client.get_object(Bucket=bucket, Key=key)
              body = response["Body"].read(4 * 1024 * 1024 + 1)
          except Exception as error:
              raise SystemExit("Hot Reports public translation source is unavailable") from error
          if not body or len(body) > 4 * 1024 * 1024:
              raise SystemExit("Hot Reports public translation source is empty or oversized")
          try:
              payload = json.loads(body)
          except (UnicodeDecodeError, json.JSONDecodeError) as error:
              raise SystemExit("Hot Reports public translation source is invalid JSON") from error
          if not isinstance(payload, dict) or payload.get("version") != 2 or not isinstance(payload.get("items"), list):
              raise SystemExit("Hot Reports public translation source has an unsupported schema")
          target = Path(os.environ["RUNNER_TEMP"]) / "hot-reports-public-v2.json"
          target.write_bytes(body)
          target.chmod(0o600)
          PY

      - name: Restore resumable multilingual translation checkpoint
        if: steps.operation.outputs.multilingual_enabled == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/portal-locale-cache/cache-v1.json.gz
          key: portal-locale-cache-${{ hashFiles('scripts/build_portal_locales.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Loader/prune validate schema, prompt/provider/model, and each source/quality entry.
          restore-keys: |
            portal-locale-cache-${{ hashFiles('scripts/build_portal_locales.py') }}-
            portal-locale-cache-

      - name: Use active multilingual cache only without a CI checkpoint
        if: steps.operation.outputs.multilingual_enabled == 'true'
        run: |
          set -euo pipefail
          cache_dir="$RUNNER_TEMP/portal-locale-cache"
          cache_path="$cache_dir/cache-v1.json.gz"
          active_cache="$cache_dir/active-cache-v1.json.gz"
          mkdir -p "$cache_dir"
          if [ -s "$cache_path" ]; then
            echo "Using the latest resumable CI translation checkpoint"
            exit 0
          fi
          status="$(curl --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 120 --header 'Cache-Control: no-cache' \
            --output "$active_cache" --write-out '%{http_code}' \
            "$LIVE_ORIGIN/.well-known/edge-release/$PREVIOUS_STATIC_RELEASE/data/i18n/cache-v1.json.gz")"
          case "$status" in
            200)
              test -s "$active_cache"
              mv "$active_cache" "$cache_path"
              echo "Restored multilingual cache from the active immutable release"
              ;;
            404)
              rm -f "$active_cache"
              echo "Active release has no multilingual cache; starting with an empty cache"
              ;;
            *)
              rm -f "$active_cache"
              echo "::error::Could not read active multilingual cache: HTTP $status"
              exit 1
              ;;
          esac

      - name: Build private static release
        env:
          PORTAL_WORKER_URL: ${{ secrets.PORTAL_WORKER_URL }}
          PORTAL_DOWNLOAD_PASSWORD: ${{ secrets[vars.PORTAL_DOWNLOAD_SECRET_REF] }}
          PASSWORD_SECRET: ${{ secrets.PASSWORD_SECRET }}
        run: |
          set -euo pipefail
          echo "::add-mask::$PORTAL_WORKER_URL"
          python3 scripts/build_portal_suite_site.py \
            --catalog-path portal_suite/data/catalog.json \
            --password-rules portal_suite/password_rules.json \
            --site-src portal_suite/site_src \
            --wechat-drafts-root wechat_drafts \
            --blog-archive-root portal_suite/data/blog_archive \
            --output-dir _neutral_site --worker-base-url "$PORTAL_WORKER_URL"
          python3 scripts/merge_chart_search_index.py \
            --search-index _neutral_site/data/search_index.json \
            --chart-index _chart_search/index.json \
            --catalog portal_suite/data/catalog.json \
            --chart-output _neutral_site/data/chart_search_index.json

      - name: Snapshot protected Chinese release before locale build
        if: steps.operation.outputs.multilingual_enabled == 'true'
        env:
          MULTILINGUAL_LIVE: ${{ steps.operation.outputs.multilingual_live }}
        run: |
          set -euo pipefail
          CANDIDATE_APP="_neutral_site/assets/app.js" \
          ACTIVE_APP="$RUNNER_TEMP/previous-active-app.js" \
          PERFORMANCE_REPORT="$RUNNER_TEMP/chinese-performance.json" \
          MULTILINGUAL_LIVE="$MULTILINGUAL_LIVE" python3 - <<'PY'
          import gzip
          import hashlib
          import json
          import os
          from pathlib import Path

          candidate = Path(os.environ["CANDIDATE_APP"]).read_bytes()
          candidate_gzip = gzip.compress(candidate, compresslevel=9, mtime=0)
          if len(candidate) > 700_000 or len(candidate_gzip) > 150_000:
              raise SystemExit("Chinese app bundle exceeds its absolute loading budget")
          report = {
              "schema_version": 1,
              "candidate_bytes": len(candidate),
              "candidate_gzip_bytes": len(candidate_gzip),
              "candidate_sha256": hashlib.sha256(candidate).hexdigest(),
              "active_compared": False,
          }
          if os.environ["MULTILINGUAL_LIVE"] != "true":
              active = Path(os.environ["ACTIVE_APP"]).read_bytes()
              active_gzip = gzip.compress(active, compresslevel=9, mtime=0)
              raw_delta = len(candidate) - len(active)
              gzip_delta = len(candidate_gzip) - len(active_gzip)
              if raw_delta > 24_000 or gzip_delta > 6_000:
                  raise SystemExit("Chinese app bundle exceeds its active-release delta budget")
              report.update({
                  "active_compared": True,
                  "active_bytes": len(active),
                  "active_gzip_bytes": len(active_gzip),
                  "active_sha256": hashlib.sha256(active).hexdigest(),
                  "raw_delta_bytes": raw_delta,
                  "gzip_delta_bytes": gzip_delta,
              })
          report_bytes = json.dumps(
              report,
              ensure_ascii=True,
              sort_keys=True,
              separators=(",", ":"),
          ).encode("utf-8") + b"\n"
          Path(os.environ["PERFORMANCE_REPORT"]).write_bytes(report_bytes)
          print(json.dumps(report, ensure_ascii=True, sort_keys=True))
          PY
          active_manifest_args=()
          if [ "$MULTILINGUAL_LIVE" != "true" ]; then
            active_manifest_args+=(--active-manifest "$RUNNER_TEMP/previous-slot-manifest.json")
          fi
          python3 -B scripts/verify_portal_chinese_parity.py snapshot \
            --root _neutral_site \
            --site-url "$LIVE_ORIGIN" \
            --output "$RUNNER_TEMP/chinese-before-locales.json" \
            "${active_manifest_args[@]}"

      - name: Build Korean Japanese and Arabic static locales
        if: steps.operation.outputs.multilingual_enabled == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_API_KEY_BACKUP: ${{ secrets.DEEPSEEK_API_KEY_BACKUP }}
          DEEPSEEK_API_KEY_2: ${{ secrets.DEEPSEEK_API_KEY_2 }}
          DEEPSEEK_API_KEYS: ${{ secrets.DEEPSEEK_API_KEYS }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
          PORTAL_MULTILINGUAL_WORKERS: ${{ vars.PORTAL_MULTILINGUAL_WORKERS || '32' }}
          PORTAL_MULTILINGUAL_INDEX_START_DATE: ${{ vars.PORTAL_MULTILINGUAL_INDEX_START_DATE || '' }}
          PORTAL_MULTILINGUAL_INDEX_ALLOWLIST_PATH: ${{ vars.PORTAL_MULTILINGUAL_INDEX_ALLOWLIST_PATH || '' }}
        run: |
          set -euo pipefail
          case "$PORTAL_MULTILINGUAL_WORKERS" in
            ''|*[!0-9]*)
              echo "::error::PORTAL_MULTILINGUAL_WORKERS must be an integer from 1 to 500"
              exit 2
              ;;
          esac
          if [ "$PORTAL_MULTILINGUAL_WORKERS" -lt 1 ] \
            || [ "$PORTAL_MULTILINGUAL_WORKERS" -gt 500 ]
          then
            echo "::error::PORTAL_MULTILINGUAL_WORKERS must be an integer from 1 to 500"
            exit 2
          fi
          cache_args=()
          if [ -s "$RUNNER_TEMP/portal-locale-cache/cache-v1.json.gz" ]; then
            cache_args+=(--cache-in "$RUNNER_TEMP/portal-locale-cache/cache-v1.json.gz")
          fi
          index_args=(--index-start-date "$PORTAL_MULTILINGUAL_INDEX_START_DATE")
          if [ -n "$PORTAL_MULTILINGUAL_INDEX_ALLOWLIST_PATH" ]; then
            INDEX_ALLOWLIST_PATH="$PORTAL_MULTILINGUAL_INDEX_ALLOWLIST_PATH" python3 - <<'PY'
          import os
          from pathlib import Path, PurePosixPath

          value = os.environ["INDEX_ALLOWLIST_PATH"]
          relative = PurePosixPath(value)
          if (
              relative.is_absolute()
              or relative.as_posix() != value
              or any(part in {"", ".", ".."} for part in relative.parts)
              or "\\" in value
          ):
              raise SystemExit("PORTAL_MULTILINGUAL_INDEX_ALLOWLIST_PATH must be a safe repository-relative path")
          candidate = Path(*relative.parts)
          try:
              candidate.resolve().relative_to(Path.cwd().resolve())
          except ValueError as error:
              raise SystemExit("PORTAL_MULTILINGUAL_INDEX_ALLOWLIST_PATH escapes the repository") from error
          if not candidate.is_file() or candidate.is_symlink():
              raise SystemExit("PORTAL_MULTILINGUAL_INDEX_ALLOWLIST_PATH must name a regular non-symlink file")
          PY
            git ls-files --error-unmatch -- "$PORTAL_MULTILINGUAL_INDEX_ALLOWLIST_PATH" >/dev/null
            index_args+=(--index-allowlist "$PORTAL_MULTILINGUAL_INDEX_ALLOWLIST_PATH")
          fi
          locale_args=(
            --root _neutral_site
            --site-url "$LIVE_ORIGIN"
            --hot-report-index "$RUNNER_TEMP/hot-reports-public-v2.json"
            --cache-out _neutral_site/data/i18n/cache-v1.json.gz
            --assets-root portal_suite/locale_assets
            --model "$DEEPSEEK_MODEL"
            --deepseek-base-url "$DEEPSEEK_BASE_URL"
            --timeout 120
            "${index_args[@]}"
          )
          # A failed paid canary must stop this shell before high concurrency begins.
          python3 -B scripts/build_portal_locales.py "${locale_args[@]}" \
            --preflight-only --preflight-batches-per-locale 2 \
            --workers 1 --attempts 1 --max-provider-requests 6 \
            --diagnostics-out "$RUNNER_TEMP/locale-preflight-diagnostics.json" \
            "${cache_args[@]}"
          test -s _neutral_site/data/i18n/cache-v1.json.gz
          python3 -B scripts/build_portal_locales.py "${locale_args[@]}" \
            --cache-in _neutral_site/data/i18n/cache-v1.json.gz \
            --workers "$PORTAL_MULTILINGUAL_WORKERS" \
            --attempts 2 \
            --diagnostics-out "$RUNNER_TEMP/locale-full-diagnostics.json"

      - name: Detect multilingual translation checkpoint
        id: locale_checkpoint
        if: always() && steps.operation.outputs.multilingual_enabled == 'true'
        run: |
          if [ -s "_neutral_site/data/i18n/cache-v1.json.gz" ]; then
            mkdir -p "$RUNNER_TEMP/portal-locale-cache"
            cp "_neutral_site/data/i18n/cache-v1.json.gz" \
              "$RUNNER_TEMP/portal-locale-cache/cache-v1.json.gz"
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ -s "$RUNNER_TEMP/portal-locale-cache/cache-v1.json.gz" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save multilingual translation checkpoint
        if: always() && steps.locale_checkpoint.outputs.present == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/portal-locale-cache/cache-v1.json.gz
          key: portal-locale-cache-${{ hashFiles('scripts/build_portal_locales.py') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Preserve translation diagnostics even on failure
        if: always() && steps.operation.outputs.multilingual_enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: neutral-translation-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/locale-preflight-diagnostics.json
            ${{ runner.temp }}/locale-full-diagnostics.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify protected Chinese release after locale build
        id: chinese_parity
        if: steps.operation.outputs.multilingual_enabled == 'true'
        run: |
          set -euo pipefail
          python3 -B scripts/verify_portal_chinese_parity.py verify \
            --root _neutral_site \
            --snapshot "$RUNNER_TEMP/chinese-before-locales.json" \
            --site-url "$LIVE_ORIGIN" \
            --output "$RUNNER_TEMP/chinese-parity.json"
          PARITY_REPORT="$RUNNER_TEMP/chinese-parity.json" python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          import os
          from pathlib import Path

          report = Path(os.environ["PARITY_REPORT"])
          print(f"sha256={hashlib.sha256(report.read_bytes()).hexdigest()}")
          PY

      - name: Validate complete static release
        env:
          PORTAL_MULTILINGUAL_ENABLED: ${{ steps.operation.outputs.multilingual_enabled }}
          PORTAL_MULTILINGUAL_INDEX_START_DATE: ${{ vars.PORTAL_MULTILINGUAL_INDEX_START_DATE || '' }}
        run: |
          set -euo pipefail
          required_paths=(
            index.html assets/app.js data/catalog.json data/catalog_preview.json
            data/catalog_recommendations.json data/search_index.json
            data/chart_search_index.json data/password_rules.json
            reports/institutions/bernstein/index.html sitemap-baidu.xml
          )
          if [ "$PORTAL_MULTILINGUAL_ENABLED" = "true" ]; then
            required_paths+=(assets/locale.css assets/locale-runtime.js)
            for locale in ko ja ar; do
              required_paths+=(
                "$locale/index.html"
                "$locale/feed.xml"
                "$locale/llms.txt"
                "$locale/llms-full.txt"
                "$locale/data/course-materials.json"
                "sitemap-$locale.xml"
              )
              for locale_asset in \
                app.js charts.js contact.js locale-runtime.js report-chat.js \
                report-research-export.js site-runtime.js xlsx-export.js locale.css
              do
                required_paths+=("$locale/assets/$locale_asset")
              done
            done
            required_paths+=(data/i18n/cache-v1.json.gz data/i18n/manifest.json)
          fi
          for required in "${required_paths[@]}"; do
            test -s "_neutral_site/$required"
          done
          test -n "$(find _neutral_site/data/report_details -type f -name '*.json' -print -quit)"
          test ! -e _neutral_site/assets/contact-card.jpg
          if [ "$PORTAL_MULTILINGUAL_ENABLED" = "true" ]; then
            for locale in ko ja ar; do
              js_count=0
              while IFS= read -r -d '' script; do
                node --check "$script"
                js_count=$((js_count + 1))
              done < <(find "_neutral_site/$locale" -type f -name '*.js' -print0)
              test "$js_count" -gt 0
            done
            python3 - <<'PY'
          import gzip
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import xml.etree.ElementTree as ET

          root = Path("_neutral_site")
          site_origin = os.environ["LIVE_ORIGIN"].rstrip("/")
          locale_directions = {"ko": "ltr", "ja": "ltr", "ar": "rtl"}
          html_tag = re.compile(r"<html\b([^>]*)>", flags=re.I)
          html_attr = re.compile(r"\b(lang|dir)\s*=\s*(['\"])(.*?)\2", flags=re.I)
          locale_asset_limits = {
              "assets/locale-runtime.js": 32_768,
              "assets/locale.css": 24_576,
          }
          for relative, maximum_asset_bytes in locale_asset_limits.items():
              asset = root / relative
              size = asset.stat().st_size
              if not 1 <= size <= maximum_asset_bytes:
                  raise SystemExit(
                      f"Locale static asset exceeds its byte budget: {relative}={size}>{maximum_asset_bytes}"
                  )
              expected = asset.read_bytes()
              for locale in locale_directions:
                  localized_asset = root / locale / relative
                  if localized_asset.read_bytes() != expected:
                      raise SystemExit(f"Localized static asset differs from the shared asset: {localized_asset}")

          for locale, direction in locale_directions.items():
              pages = sorted(root.joinpath(locale).rglob("*.html"))
              if not pages:
                  raise SystemExit(f"No localized HTML pages found for {locale}")
              for page in pages:
                  with page.open("r", encoding="utf-8") as handle:
                      prefix = handle.read(16_384)
                  match = html_tag.search(prefix)
                  if match is None:
                      raise SystemExit(f"Localized page has no html element: {page}")
                  attrs = {
                      key.lower(): value.strip().lower()
                      for key, _quote, value in html_attr.findall(match.group(1))
                  }
                  if attrs.get("lang") != locale or attrs.get("dir") != direction:
                      raise SystemExit(f"Localized page language or direction is invalid: {page}")

              sitemap_path = root / f"sitemap-{locale}.xml"
              sitemap = ET.parse(sitemap_path).getroot()
              locations = [
                  str(node.text or "").strip()
                  for node in sitemap.findall(".//{*}loc")
                  if str(node.text or "").strip()
              ]
              expected_prefix = f"{site_origin}/{locale}/"
              if not locations or any(not value.startswith(expected_prefix) for value in locations):
                  raise SystemExit(f"Localized sitemap URLs are invalid: {sitemap_path}")

          cache_path = root / "data/i18n/cache-v1.json.gz"
          with gzip.open(cache_path, "rt", encoding="utf-8") as handle:
              cache = json.load(handle)
          if cache.get("schema_version") != 1 or set(cache.get("locales", {})) != set(locale_directions):
              raise SystemExit("Multilingual cache is invalid or incomplete")
          manifest = json.loads(root.joinpath("data/i18n/manifest.json").read_text(encoding="utf-8"))
          if manifest.get("quality_gate_version") != 2:
              raise SystemExit("Multilingual manifest quality gate version is invalid")
          if set(manifest.get("locales", [])) != set(locale_directions):
              raise SystemExit("Multilingual manifest locale set is invalid")
          expected_html_page_count = manifest.get("html_page_count")
          if not isinstance(expected_html_page_count, int) or expected_html_page_count <= 0:
              raise SystemExit("Multilingual manifest HTML page count is invalid")
          for locale in locale_directions:
              actual_html_page_count = sum(1 for _ in root.joinpath(locale).rglob("*.html"))
              if actual_html_page_count != expected_html_page_count:
                  raise SystemExit(
                      f"Localized HTML page count does not match manifest: "
                      f"{locale}={actual_html_page_count}!={expected_html_page_count}"
                  )
          coverage = manifest.get("coverage") or {}
          if any(coverage.get(locale) != 1.0 for locale in locale_directions):
              raise SystemExit("Multilingual manifest coverage is incomplete")

          index_policy = manifest.get("index_policy") or {}
          configured_start_date = os.environ.get("PORTAL_MULTILINGUAL_INDEX_START_DATE", "") or None
          if (
              index_policy.get("mode") != "fixed-publication-cutoff"
              or index_policy.get("default") != "hubs-only"
              or index_policy.get("index_start_date") != configured_start_date
          ):
              raise SystemExit("Multilingual manifest index policy does not match the staged release")

          def safe_required_path(value: object) -> PurePosixPath:
              if not isinstance(value, str) or not value or "\\" in value:
                  raise SystemExit("Multilingual manifest required_paths contains an invalid path")
              relative = PurePosixPath(value)
              if (
                  relative.is_absolute()
                  or relative.as_posix() != value
                  or any(part in {"", ".", ".."} for part in relative.parts)
              ):
                  raise SystemExit(f"Multilingual manifest path is not a safe relative path: {value!r}")
              return relative

          required_values = manifest.get("required_paths")
          if not isinstance(required_values, list) or not required_values:
              raise SystemExit("Multilingual manifest required_paths must be a non-empty list")
          required_paths = [safe_required_path(value) for value in required_values]
          if len(required_paths) != len(set(required_paths)):
              raise SystemExit("Multilingual manifest required_paths contains duplicates")

          catalog_overlays = manifest.get("catalog_overlays")
          if not isinstance(catalog_overlays, dict) or set(catalog_overlays) != set(locale_directions):
              raise SystemExit("Multilingual catalog overlay locale set is invalid")
          manifest_metadata = {}

          def register_metadata(locale: str, kind: str, metadata: object) -> None:
              if not isinstance(kind, str) or not kind or not isinstance(metadata, dict):
                  raise SystemExit(f"Multilingual overlay metadata is invalid: {locale}/{kind}")
              relative = safe_required_path(metadata.get("path"))
              if relative.parts[:3] != ("data", "i18n", locale):
                  raise SystemExit(f"Multilingual overlay path has the wrong locale: {relative}")
              if relative in manifest_metadata:
                  raise SystemExit(f"Multilingual overlay path is duplicated: {relative}")
              manifest_metadata[relative] = (locale, kind, metadata, True)

          def register_locale_data(locale: str, kind: str, metadata: object) -> None:
              if not isinstance(kind, str) or not kind or not isinstance(metadata, dict):
                  raise SystemExit(f"Multilingual locale data metadata is invalid: {locale}/{kind}")
              relative = safe_required_path(metadata.get("path"))
              if relative.parts[:2] != (locale, "data"):
                  raise SystemExit(f"Multilingual locale data path has the wrong locale: {relative}")
              if relative in manifest_metadata:
                  raise SystemExit(f"Multilingual locale data path is duplicated: {relative}")
              manifest_metadata[relative] = (locale, kind, metadata, False)

          expected_kinds = None
          for locale in locale_directions:
              locale_overlays = catalog_overlays.get(locale)
              if not isinstance(locale_overlays, dict) or not locale_overlays:
                  raise SystemExit(f"Multilingual catalog overlays are missing for {locale}")
              locale_kinds = frozenset(locale_overlays)
              if expected_kinds is None:
                  expected_kinds = locale_kinds
              elif locale_kinds != expected_kinds:
                  raise SystemExit("Multilingual catalog overlay kinds differ by locale")
              for kind, metadata in locale_overlays.items():
                  register_metadata(locale, kind, metadata)

          detail_overlays = manifest.get("catalog_detail_overlays")
          if not isinstance(detail_overlays, dict) or set(detail_overlays) != set(locale_directions):
              raise SystemExit("Multilingual detail overlay locale set is invalid")
          source_detail_dir = root / "data" / "report_details"
          source_detail_prefixes = {
              path.stem
              for path in source_detail_dir.glob("*.json")
              if path.is_file() and not path.is_symlink()
          }
          if (
              not source_detail_prefixes
              or any(re.fullmatch(r"[a-z0-9_]{2}", prefix) is None for prefix in source_detail_prefixes)
          ):
              raise SystemExit("Multilingual source detail shard set is invalid")
          for locale, locale_overlays in detail_overlays.items():
              if not isinstance(locale_overlays, dict) or set(locale_overlays) != source_detail_prefixes:
                  raise SystemExit(f"Multilingual detail overlays are incomplete for {locale}")
              for prefix, metadata in locale_overlays.items():
                  register_metadata(locale, f"detail:{prefix}", metadata)

          chart_overlays = manifest.get("chart_overlays")
          if not isinstance(chart_overlays, dict) or set(chart_overlays) != set(locale_directions):
              raise SystemExit("Multilingual chart overlay locale set is invalid")
          for locale, metadata in chart_overlays.items():
              register_metadata(locale, "charts", metadata)

          hot_report_overlays = manifest.get("hot_report_overlays")
          if not isinstance(hot_report_overlays, dict) or set(hot_report_overlays) != set(locale_directions):
              raise SystemExit("Multilingual Hot Reports overlay locale set is invalid")
          source_generations = set()
          for locale, metadata in hot_report_overlays.items():
              register_metadata(locale, "hot-reports", metadata)
              source_generation = metadata.get("source_generation") if isinstance(metadata, dict) else None
              if not isinstance(source_generation, str) or re.fullmatch(r"[0-9a-f]{16}", source_generation) is None:
                  raise SystemExit(f"Multilingual Hot Reports source generation is invalid: {locale}")
              source_generations.add(source_generation)
          if len(source_generations) != 1:
              raise SystemExit("Multilingual Hot Reports overlays do not share one source generation")

          locale_data_files = manifest.get("locale_data_files")
          if not isinstance(locale_data_files, dict) or set(locale_data_files) != set(locale_directions):
              raise SystemExit("Multilingual locale data file locale set is invalid")
          expected_locale_data_kinds = {"course-materials"}
          for locale, data_files in locale_data_files.items():
              if not isinstance(data_files, dict) or set(data_files) != expected_locale_data_kinds:
                  raise SystemExit(f"Multilingual locale data files are incomplete for {locale}")
              for kind, metadata in data_files.items():
                  register_locale_data(locale, kind, metadata)

          if set(required_paths) != set(manifest_metadata):
              raise SystemExit("Multilingual manifest required_paths does not match runtime data metadata")
          runtime_data_byte_limits = {
              "preview": 512_000,
              "detail": 512_000,
              "full": 8_000_000,
              "charts": 32_000_000,
              "hot-reports": 6_000_000,
              "course-materials": 2_000_000,
          }
          for relative in required_paths:
              locale, kind, metadata, require_payload_identity = manifest_metadata[relative]
              target = root.joinpath(*relative.parts)
              try:
                  target.resolve().relative_to(root.resolve())
              except ValueError as error:
                  raise SystemExit(f"Multilingual required file escapes the release root: {relative}") from error
              if not target.is_file() or target.is_symlink():
                  raise SystemExit(f"Multilingual required file is missing or not regular: {relative}")
              payload_bytes = target.read_bytes()
              expected_size = metadata.get("byte_size")
              expected_digest = metadata.get("sha256")
              if not isinstance(expected_size, int) or expected_size <= 0 or len(payload_bytes) != expected_size:
                  raise SystemExit(f"Multilingual required file size does not match manifest: {relative}")
              budget_kind = "detail" if kind.startswith("detail:") else kind
              maximum_size = runtime_data_byte_limits.get(budget_kind)
              if maximum_size is None or expected_size > maximum_size:
                  raise SystemExit(
                      f"Multilingual runtime data exceeds its byte budget: "
                      f"{relative}={expected_size}>{maximum_size}"
                  )
              if (
                  not isinstance(expected_digest, str)
                  or re.fullmatch(r"[0-9a-f]{64}", expected_digest) is None
                  or hashlib.sha256(payload_bytes).hexdigest() != expected_digest
              ):
                  raise SystemExit(f"Multilingual required file digest does not match manifest: {relative}")
              payload = json.loads(payload_bytes)
              if require_payload_identity and (payload.get("locale") != locale or payload.get("kind") != kind):
                  raise SystemExit(f"Multilingual required file locale/kind does not match manifest: {relative}")
              item_count = metadata.get("item_count")
              if require_payload_identity and (
                  not isinstance(item_count, int)
                  or item_count < 0
                  or payload.get("item_count") != item_count
              ):
                  raise SystemExit(f"Multilingual required file item count does not match manifest: {relative}")
              if kind == "hot-reports" and payload.get("source_generation") != metadata.get("source_generation"):
                  raise SystemExit(f"Multilingual Hot Reports source generation does not match manifest: {relative}")
          print(
              "localized_pages="
              + ",".join(
                  f"{locale}:{sum(1 for _ in root.joinpath(locale).rglob('*.html'))}"
                  for locale in locale_directions
              )
          )
          PY
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path("_neutral_site")
          files = [path for path in root.rglob("*") if path.is_file() and not path.is_symlink()]
          total = sum(path.stat().st_size for path in files)
          multilingual = os.environ["PORTAL_MULTILINGUAL_ENABLED"] == "true"
          maximum_files = 100_000 if multilingual else 20_000
          maximum_bytes = 2_500_000_000 if multilingual else 1_000_000_000
          if not 1000 <= len(files) <= maximum_files:
              raise SystemExit("Static file count is outside the expected range")
          if not 100_000_000 <= total <= maximum_bytes:
              raise SystemExit("Static release size is outside the expected range")
          print(f"static_files={len(files)} static_bytes={total}")
          PY

      - name: Validate built public brand
        run: python3 -B scripts/check_public_brand.py _neutral_site

      - name: Compute multilingual index policy identity
        id: locale_policy
        if: steps.operation.outputs.multilingual_enabled == 'true'
        env:
          PORTAL_MULTILINGUAL_INDEX_ALLOWLIST_PATH: ${{ vars.PORTAL_MULTILINGUAL_INDEX_ALLOWLIST_PATH || '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          manifest_path = Path("_neutral_site/data/i18n/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          index_policy = manifest.get("index_policy")
          if not isinstance(index_policy, dict):
              raise SystemExit("Multilingual manifest has no index policy")
          allowlist_path = os.environ.get("PORTAL_MULTILINGUAL_INDEX_ALLOWLIST_PATH", "")
          allowlist_bytes = Path(allowlist_path).read_bytes() if allowlist_path else b""
          review_policy = {
              "schema_version": 1,
              "manifest_index_policy": index_policy,
              "allowlist_path": allowlist_path,
              "allowlist_sha256": hashlib.sha256(allowlist_bytes).hexdigest(),
          }
          encoded = json.dumps(
              review_policy,
              ensure_ascii=True,
              sort_keys=True,
              separators=(",", ":"),
          ).encode("utf-8")
          digest = hashlib.sha256(encoded).hexdigest()
          output = {
              "schema_version": 1,
              "index_policy_sha256": digest,
              "policy": review_policy,
          }
          target = Path(os.environ["RUNNER_TEMP"]) / "multilingual-index-policy.json"
          target.write_text(
              json.dumps(output, ensure_ascii=True, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"index_policy_sha256={digest}\n")
          print(f"multilingual_index_policy_sha256={digest}")
          PY

      - name: Detect meaningful public release changes
        id: release_delta
        env:
          PORTAL_MULTILINGUAL_ENABLED: ${{ steps.operation.outputs.multilingual_enabled }}
        run: |
          set -euo pipefail
          previous_args=()
          force_args=()
          locale_contract_args=()
          if [ -s "$RUNNER_TEMP/previous-release-semantics.json" ]; then
            previous_args+=(--previous-manifest "$RUNNER_TEMP/previous-release-semantics.json")
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] \
            && { [ "$NEUTRAL_OPERATION" = "rehearse" ] \
              || [ ! -s "$RUNNER_TEMP/previous-release-semantics.json" ]; }
          then
            force_args+=(--force)
          fi
          if [ "$PORTAL_MULTILINGUAL_ENABLED" = "true" ]; then
            locale_contract_args+=(
              --build-contract scripts/build_portal_locales.py
              --build-contract portal_suite/locale_assets/locale.css
              --build-contract portal_suite/locale_assets/locale-runtime.js
              --build-contract _neutral_site/data/i18n/cache-v1.json.gz
              --build-contract _neutral_site/data/i18n/manifest.json
              --build-contract _neutral_site/sitemap-ko.xml
              --build-contract _neutral_site/sitemap-ja.xml
              --build-contract _neutral_site/sitemap-ar.xml
            )
          fi
          python3 -B scripts/compare_portal_release_semantics.py \
            --current-catalog _neutral_site/data/catalog.json \
            --current-sitemap _neutral_site/sitemap-baidu.xml \
            --current-search-index _neutral_site/data/search_index.json \
            --current-chart-search-index _neutral_site/data/chart_search_index.json \
            --current-password-rules _neutral_site/data/password_rules.json \
            --current-runtime-config _neutral_site/data/config.json \
            --blog-archive-root portal_suite/data/blog_archive \
            --site-source-root portal_suite/site_src \
            --build-contract scripts/build_member_contact_card.py \
            --build-contract "$RUNNER_TEMP/member-contact-card.jpg" \
            --build-contract scripts/compare_portal_release_semantics.py \
            --build-contract scripts/build_portal_suite_site.py \
            --build-contract scripts/merge_chart_search_index.py \
            --build-contract workers/edge-static-host/src/index.js \
            --public-root _neutral_site \
            --write-current-manifest _neutral_site/data/release-semantics.json \
            --github-output "$GITHUB_OUTPUT" \
            "${locale_contract_args[@]}" "${previous_args[@]}" "${force_args[@]}"
          test -s _neutral_site/data/release-semantics.json

      - name: Upload inactive static slot and immutable runtime
        id: static_upload
        if: steps.release_delta.outputs.changed == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          NEUTRAL_OPERATION: ${{ steps.operation.outputs.operation }}
        run: |
          set -euo pipefail
          private_asset_args=()
          if [ "$NEUTRAL_OPERATION" = "locale-shadow" ]; then
            private_asset_args+=(--skip-shared-private-assets)
          fi
          python3 -B scripts/publish_static_slot.py \
            --root _neutral_site --release "$STATIC_RELEASE" \
            --active-slot "$ACTIVE_STATIC_SLOT" \
            --member-contact-card "$RUNNER_TEMP/member-contact-card.jpg" \
            --max-workers 4 "${private_asset_args[@]}"

      - name: Prepare isolated multilingual shadow worker
        id: shadow_context
        if: >-
          ${{
            steps.release_delta.outputs.changed == 'true' &&
            steps.operation.outputs.multilingual_enabled == 'true' &&
            (
              steps.operation.outputs.operation == 'locale-shadow' ||
              steps.operation.outputs.multilingual_live != 'true'
            )
          }}
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          SHADOW_STATIC_PREFIX: ${{ steps.static_upload.outputs.static_prefix }}
          SHADOW_STATIC_TREE: ${{ steps.static_upload.outputs.tree_sha256 }}
        run: |
          set -euo pipefail
          worker_name="portal-locale-shadow-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "${#worker_name}" -le 63
          R2_BUCKET_VALUE="$R2_BUCKET" WORKER_NAME="$worker_name" python3 - <<'PY'
          import os
          import re

          bucket = os.environ["R2_BUCKET_VALUE"]
          worker = os.environ["WORKER_NAME"]
          if re.fullmatch(r"[a-z][a-z0-9-]{2,62}", worker) is None:
              raise SystemExit("Generated shadow Worker name is invalid")
          if re.fullmatch(r"[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]", bucket) is None:
              raise SystemExit("Configured R2 bucket name is invalid")
          PY
          mkdir -p .neutral_edge_shadow
          cp workers/edge-static-host/src/index.js .neutral_edge_shadow/index.js
          cat > .neutral_edge_shadow/wrangler.toml <<EOF
          name = "$worker_name"
          main = "index.js"
          compatibility_date = "2026-08-12"
          workers_dev = true
          preview_urls = false

          [vars]
          STATIC_PREFIX = "$SHADOW_STATIC_PREFIX"
          STATIC_RELEASE = "$STATIC_RELEASE"
          STATIC_TREE_SHA256 = "$SHADOW_STATIC_TREE"
          CANONICAL_HOST = ""
          SHADOW_MODE = "true"

          [[r2_buckets]]
          binding = "STATIC_BUCKET"
          bucket_name = "$R2_BUCKET"

          [[services]]
          binding = "API"
          service = "portal-suite-worker"

          [observability]
          enabled = false
          EOF
          python3 -B scripts/audit_portal_shadow_preview.py plan \
            --root _neutral_site \
            --output "$RUNNER_TEMP/shadow-samples.json"
          printf 'worker_name=%s\n' "$worker_name" >> "$GITHUB_OUTPUT"

      - name: Deploy isolated multilingual shadow worker
        id: shadow_deploy
        if: steps.shadow_context.outcome == 'success'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          workingDirectory: .neutral_edge_shadow
          command: deploy
          wranglerVersion: "4.125.0"

      - name: Verify isolated multilingual shadow worker
        id: shadow_identity
        if: steps.shadow_deploy.outcome == 'success'
        env:
          SHADOW_PREVIEW_URL: ${{ steps.shadow_deploy.outputs.deployment-url }}
          SHADOW_WORKER_NAME: ${{ steps.shadow_context.outputs.worker_name }}
          SHADOW_STATIC_SLOT: ${{ steps.static_upload.outputs.static_slot }}
          SHADOW_STATIC_TREE: ${{ steps.static_upload.outputs.tree_sha256 }}
          CANDIDATE_COMMIT_SHA: ${{ steps.operation.outputs.commit_sha }}
        run: |
          set -euo pipefail
          preview_url="${SHADOW_PREVIEW_URL%/}"
          test -n "$preview_url"
          python3 -B scripts/audit_portal_shadow_preview.py audit \
            --base-url "$preview_url" \
            --public-origin "$LIVE_ORIGIN" \
            --samples "$RUNNER_TEMP/shadow-samples.json" \
            --expected-release "$STATIC_RELEASE" \
            --expected-tree "$SHADOW_STATIC_TREE" \
            --output "$RUNNER_TEMP/shadow-http-audit.json"
          PREVIEW_URL="$preview_url" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema_version": 1,
              "worker_name": os.environ["SHADOW_WORKER_NAME"],
              "preview_url": os.environ["PREVIEW_URL"],
              "commit_sha": os.environ["CANDIDATE_COMMIT_SHA"],
              "static_slot": os.environ["SHADOW_STATIC_SLOT"],
              "release_id": os.environ["STATIC_RELEASE"],
              "tree_sha256": os.environ["SHADOW_STATIC_TREE"],
          }
          target = Path(os.environ["RUNNER_TEMP"]) / "shadow-preview.json"
          target.write_text(
              json.dumps(payload, ensure_ascii=True, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          printf 'preview_url=%s\n' "$preview_url" >> "$GITHUB_OUTPUT"
          {
            echo "## Isolated multilingual shadow"
            echo
            echo "- Worker: \`$SHADOW_WORKER_NAME\`"
            echo "- Candidate release: \`$STATIC_RELEASE\`"
            echo "- Candidate tree: \`$SHADOW_STATIC_TREE\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish multilingual review identity
        if: steps.release_delta.outputs.changed == 'true' && steps.operation.outputs.multilingual_enabled == 'true'
        env:
          REVIEW_OPERATION: ${{ steps.operation.outputs.operation }}
          CANDIDATE_COMMIT_SHA: ${{ steps.operation.outputs.commit_sha }}
          CANDIDATE_STATIC_TREE: ${{ steps.static_upload.outputs.tree_sha256 }}
          CANDIDATE_INDEX_POLICY_SHA256: ${{ steps.locale_policy.outputs.index_policy_sha256 }}
          CANDIDATE_CHINESE_PARITY_SHA256: ${{ steps.chinese_parity.outputs.sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          operation = os.environ["REVIEW_OPERATION"]
          actual = {
              "commit_sha": os.environ["CANDIDATE_COMMIT_SHA"],
              "static_tree_sha256": os.environ["CANDIDATE_STATIC_TREE"],
              "index_policy_sha256": os.environ["CANDIDATE_INDEX_POLICY_SHA256"],
              "chinese_parity_sha256": os.environ["CANDIDATE_CHINESE_PARITY_SHA256"],
          }
          if re.fullmatch(r"[0-9a-f]{40}", actual["commit_sha"]) is None:
              raise SystemExit("Candidate multilingual commit SHA is invalid")
          for field in ("static_tree_sha256", "index_policy_sha256", "chinese_parity_sha256"):
              if re.fullmatch(r"[0-9a-f]{64}", actual[field]) is None:
                  raise SystemExit(f"Candidate multilingual {field} is invalid")

          policy_path = Path(os.environ["RUNNER_TEMP"]) / "multilingual-index-policy.json"
          policy = json.loads(policy_path.read_text(encoding="utf-8"))
          if policy.get("index_policy_sha256") != actual["index_policy_sha256"]:
              raise SystemExit("Candidate multilingual index policy identity changed after validation")
          identity = {
              "schema_version": 1,
              "operation": operation,
              **actual,
              "index_policy": policy.get("policy"),
          }
          identity_path = Path(os.environ["RUNNER_TEMP"]) / "multilingual-review-identity.json"
          identity_path.write_text(
              json.dumps(identity, ensure_ascii=True, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("## Multilingual candidate review identity\n\n")
              summary.write(f"- Commit SHA: `{actual['commit_sha']}`\n")
              summary.write(f"- Static tree SHA-256: `{actual['static_tree_sha256']}`\n")
              summary.write(f"- Index policy SHA-256: `{actual['index_policy_sha256']}`\n")
              summary.write(f"- Chinese parity SHA-256: `{actual['chinese_parity_sha256']}`\n")
              summary.write(f"- Operation: `{operation}`\n")
          print("Multilingual candidate identity is ready for same-run approval")
          PY

      - name: Build public validation artifact
        if: steps.release_delta.outputs.changed == 'true'
        env:
          PORTAL_MULTILINGUAL_ENABLED: ${{ steps.operation.outputs.multilingual_enabled }}
        run: |
          set -euo pipefail
          mkdir -p _release_validation/previous _release_validation/candidate
          install -m 0600 "$RUNNER_TEMP/previous-edge-state.json" _release_validation/previous/edge-state.json
          install -m 0600 "$RUNNER_TEMP/previous-public-catalog.json" _release_validation/previous/catalog.json
          install -m 0600 "$RUNNER_TEMP/previous-public-sitemap.xml" _release_validation/previous/sitemap.xml
          install -m 0600 _neutral_site/data/catalog.json _release_validation/candidate/catalog.json
          install -m 0600 _neutral_site/data/catalog_preview.json _release_validation/candidate/catalog_preview.json
          install -m 0600 _neutral_site/sitemap-baidu.xml _release_validation/candidate/sitemap.xml
          install -m 0600 _neutral_site/data/release-semantics.json _release_validation/candidate/release-semantics.json
          if [ "$PORTAL_MULTILINGUAL_ENABLED" = "true" ]; then
            mkdir -p \
              _release_validation/candidate/{ko,ja,ar} \
              _release_validation/candidate/assets \
              _release_validation/candidate/data/i18n
            install -m 0600 _neutral_site/index.html \
              _release_validation/candidate/index.html
            install -m 0600 _neutral_site/feed.xml \
              _release_validation/candidate/feed.xml
            install -m 0600 _neutral_site/assets/styles.css \
              _release_validation/candidate/assets/styles.css
            install -m 0600 _neutral_site/assets/locale.css \
              _release_validation/candidate/assets/locale.css
            install -m 0600 _neutral_site/assets/locale-runtime.js \
              _release_validation/candidate/assets/locale-runtime.js
            install -m 0600 "$RUNNER_TEMP/chinese-parity.json" \
              _release_validation/candidate/chinese-parity.json
            install -m 0600 "$RUNNER_TEMP/chinese-performance.json" \
              _release_validation/candidate/chinese-performance.json
            for locale in ko ja ar; do
              install -m 0600 "_neutral_site/$locale/index.html" \
                "_release_validation/candidate/$locale/index.html"
              install -m 0600 "_neutral_site/sitemap-$locale.xml" \
                "_release_validation/candidate/sitemap-$locale.xml"
            done
            install -m 0600 _neutral_site/data/i18n/manifest.json \
              _release_validation/candidate/data/i18n/manifest.json
            install -m 0600 "$RUNNER_TEMP/multilingual-review-identity.json" \
              _release_validation/candidate/multilingual-review-identity.json
            if [ -s "$RUNNER_TEMP/shadow-preview.json" ]; then
              install -m 0600 "$RUNNER_TEMP/shadow-preview.json" \
                _release_validation/candidate/shadow-preview.json
              install -m 0600 "$RUNNER_TEMP/shadow-samples.json" \
                _release_validation/candidate/shadow-samples.json
              install -m 0600 "$RUNNER_TEMP/shadow-http-audit.json" \
                _release_validation/candidate/shadow-http-audit.json
            fi
          fi

      - name: Upload release validation artifact
        if: steps.release_delta.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: neutral-release-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: _release_validation
          if-no-files-found: error
          retention-days: 7

  shadow_review_hold:
    needs: prepare_release
    if: >-
      ${{
        needs.prepare_release.result == 'success' &&
        needs.prepare_release.outputs.changed == 'true' &&
        needs.prepare_release.outputs.operation == 'locale-shadow' &&
        needs.prepare_release.outputs.shadow_worker_name != '' &&
        needs.prepare_release.outputs.shadow_preview_url != ''
      }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment:
      name: portal-multilingual-shadow-review
    steps:
      - name: Download exact shadow review artifact
        uses: actions/download-artifact@v4
        with:
          name: neutral-release-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: _release_validation

      - name: Confirm reviewed shadow identity
        env:
          EXPECTED_WORKER_NAME: ${{ needs.prepare_release.outputs.shadow_worker_name }}
          EXPECTED_PREVIEW_URL: ${{ needs.prepare_release.outputs.shadow_preview_url }}
          EXPECTED_RELEASE: ${{ needs.prepare_release.outputs.static_release }}
          EXPECTED_TREE: ${{ needs.prepare_release.outputs.static_tree }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          preview = json.loads(
              Path("_release_validation/candidate/shadow-preview.json").read_text(encoding="utf-8")
          )
          expected = {
              "worker_name": os.environ["EXPECTED_WORKER_NAME"],
              "preview_url": os.environ["EXPECTED_PREVIEW_URL"],
              "release_id": os.environ["EXPECTED_RELEASE"],
              "tree_sha256": os.environ["EXPECTED_TREE"],
          }
          if preview.get("schema_version") != 1 or any(
              preview.get(key) != value for key, value in expected.items()
          ):
              raise SystemExit("Reviewed shadow does not match the prepared candidate")
          audit = json.loads(
              Path("_release_validation/candidate/shadow-http-audit.json").read_text(encoding="utf-8")
          )
          if (
              audit.get("schema_version") != 1
              or audit.get("base_url") != expected["preview_url"]
              or audit.get("release_id") != expected["release_id"]
              or audit.get("tree_sha256") != expected["tree_sha256"]
              or int(audit.get("sample_count") or 0) < 18
          ):
              raise SystemExit("Reviewed shadow audit does not match the prepared candidate")
          print("Exact isolated multilingual shadow approved")
          PY

  multilingual_approval:
    needs: prepare_release
    if: >-
      ${{
        needs.prepare_release.result == 'success' &&
        needs.prepare_release.outputs.changed == 'true' &&
        needs.prepare_release.outputs.operation != 'locale-shadow' &&
        needs.prepare_release.outputs.multilingual_enabled == 'true' &&
        needs.prepare_release.outputs.multilingual_live != 'true'
      }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment:
      name: portal-multilingual-production
    steps:
      - name: Download exact multilingual candidate identity
        uses: actions/download-artifact@v4
        with:
          name: neutral-release-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: _release_validation

      - name: Approve exact same-run multilingual candidate
        env:
          CANDIDATE_OPERATION: ${{ needs.prepare_release.outputs.operation }}
          CANDIDATE_COMMIT_SHA: ${{ needs.prepare_release.outputs.candidate_commit }}
          CANDIDATE_STATIC_TREE: ${{ needs.prepare_release.outputs.static_tree }}
          CANDIDATE_INDEX_POLICY_SHA256: ${{ needs.prepare_release.outputs.multilingual_index_policy_sha256 }}
          CANDIDATE_CHINESE_PARITY_SHA256: ${{ needs.prepare_release.outputs.chinese_parity_sha256 }}
          PORTAL_MULTILINGUAL_ACTIVATION_APPROVED: ${{ vars.PORTAL_MULTILINGUAL_ACTIVATION_APPROVED || 'false' }}
          PORTAL_MULTILINGUAL_APPROVED_COMMIT_SHA: ${{ vars.PORTAL_MULTILINGUAL_APPROVED_COMMIT_SHA || '' }}
          PORTAL_MULTILINGUAL_APPROVED_STATIC_TREE: ${{ vars.PORTAL_MULTILINGUAL_APPROVED_STATIC_TREE || '' }}
          PORTAL_MULTILINGUAL_APPROVED_INDEX_POLICY_SHA256: ${{ vars.PORTAL_MULTILINGUAL_APPROVED_INDEX_POLICY_SHA256 || '' }}
          PORTAL_MULTILINGUAL_APPROVED_CHINESE_PARITY_SHA256: ${{ vars.PORTAL_MULTILINGUAL_APPROVED_CHINESE_PARITY_SHA256 || '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          identity_path = Path(
              "_release_validation/candidate/multilingual-review-identity.json"
          )
          if not identity_path.is_file() or identity_path.is_symlink():
              raise SystemExit("Same-run multilingual review identity artifact is missing")
          identity = json.loads(identity_path.read_text(encoding="utf-8"))
          actual = {
              "commit_sha": os.environ["CANDIDATE_COMMIT_SHA"],
              "static_tree_sha256": os.environ["CANDIDATE_STATIC_TREE"],
              "index_policy_sha256": os.environ["CANDIDATE_INDEX_POLICY_SHA256"],
              "chinese_parity_sha256": os.environ["CANDIDATE_CHINESE_PARITY_SHA256"],
          }
          if re.fullmatch(r"[0-9a-f]{40}", actual["commit_sha"]) is None:
              raise SystemExit("Same-run multilingual commit SHA is invalid")
          for field in ("static_tree_sha256", "index_policy_sha256", "chinese_parity_sha256"):
              if re.fullmatch(r"[0-9a-f]{64}", actual[field]) is None:
                  raise SystemExit(f"Same-run multilingual {field} is invalid")
          artifact_identity = {
              "commit_sha": identity.get("commit_sha"),
              "static_tree_sha256": identity.get("static_tree_sha256"),
              "index_policy_sha256": identity.get("index_policy_sha256"),
              "chinese_parity_sha256": identity.get("chinese_parity_sha256"),
          }
          if (
              identity.get("schema_version") != 1
              or identity.get("operation") != os.environ["CANDIDATE_OPERATION"]
              or not isinstance(identity.get("index_policy"), dict)
              or artifact_identity != actual
          ):
              raise SystemExit("Multilingual review artifact does not match prepare outputs")
          if os.environ["PORTAL_MULTILINGUAL_ACTIVATION_APPROVED"] != "true":
              raise SystemExit("Multilingual environment approval flag is not true")
          approved = {
              "commit_sha": os.environ["PORTAL_MULTILINGUAL_APPROVED_COMMIT_SHA"],
              "static_tree_sha256": os.environ["PORTAL_MULTILINGUAL_APPROVED_STATIC_TREE"],
              "index_policy_sha256": os.environ["PORTAL_MULTILINGUAL_APPROVED_INDEX_POLICY_SHA256"],
              "chinese_parity_sha256": os.environ["PORTAL_MULTILINGUAL_APPROVED_CHINESE_PARITY_SHA256"],
          }
          if approved != actual:
              mismatched = ", ".join(key for key in actual if approved.get(key) != actual[key])
              raise SystemExit(f"Multilingual environment identity mismatch: {mismatched}")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("## Approved multilingual candidate\n\n")
              summary.write(f"- Commit SHA: `{actual['commit_sha']}`\n")
              summary.write(f"- Static tree SHA-256: `{actual['static_tree_sha256']}`\n")
              summary.write(f"- Index policy SHA-256: `{actual['index_policy_sha256']}`\n")
              summary.write(f"- Chinese parity SHA-256: `{actual['chinese_parity_sha256']}`\n")
          print("Same-run multilingual candidate identity approved")
          PY

  cutover:
    needs: [prepare_release, multilingual_approval]
    if: >-
      ${{
        always() &&
        needs.prepare_release.result == 'success' &&
        needs.prepare_release.outputs.changed == 'true' &&
        needs.prepare_release.outputs.operation != 'locale-shadow' &&
        (
          needs.prepare_release.outputs.multilingual_enabled != 'true' ||
          needs.prepare_release.outputs.multilingual_live == 'true' ||
          needs.multilingual_approval.result == 'success'
        )
      }}
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    env:
      STATIC_RELEASE: ${{ needs.prepare_release.outputs.static_release }}
      STATIC_SLOT: ${{ needs.prepare_release.outputs.static_slot }}
      STATIC_PREFIX: ${{ needs.prepare_release.outputs.static_prefix }}
      STATIC_TREE_SHA256: ${{ needs.prepare_release.outputs.static_tree }}
      PREVIOUS_STATIC_SLOT: ${{ needs.prepare_release.outputs.previous_slot }}
      PREVIOUS_STATIC_RELEASE: ${{ needs.prepare_release.outputs.previous_release }}
      PREVIOUS_STATIC_TREE: ${{ needs.prepare_release.outputs.previous_tree }}
      NEUTRAL_OPERATION: ${{ needs.prepare_release.outputs.operation }}
      PORTAL_MULTILINGUAL_ENABLED: ${{ needs.prepare_release.outputs.multilingual_enabled }}
      PORTAL_MULTILINGUAL_LIVE: ${{ needs.prepare_release.outputs.multilingual_live }}
    steps:
      - name: Checkout audited cutover source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare masked live route context
        env:
          PORTAL_SITE_URL: ${{ secrets.PORTAL_SITE_URL }}
        run: |
          set -euo pipefail
          echo "::add-mask::$PORTAL_SITE_URL"
          site_host="$(python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          parsed = urlsplit(os.environ["PORTAL_SITE_URL"])
          if (
              parsed.scheme != "https"
              or not parsed.hostname
              or parsed.username is not None
              or parsed.password is not None
              or parsed.port is not None
              or parsed.path not in {"", "/"}
              or parsed.query
              or parsed.fragment
          ):
              raise SystemExit("Configured site URL is not a bare HTTPS origin")
          print(parsed.hostname.lower())
          PY
          )"
          alias_hosts=""
          if [ "$(printf '%s' "$site_host" | awk -F. '{print NF}')" -eq 2 ] \
            && [ "${site_host#www.}" = "$site_host" ]
          then
            alias_hosts="www.$site_host"
          fi
          live_origin="https://$site_host"
          echo "::add-mask::$site_host"
          echo "::add-mask::$alias_hosts"
          echo "::add-mask::$live_origin"
          printf 'SITE_HOST=%s\n' "$site_host" >> "$GITHUB_ENV"
          printf 'EDGE_ALIAS_HOSTS=%s\n' "$alias_hosts" >> "$GITHUB_ENV"
          printf 'LIVE_ORIGIN=%s\n' "$live_origin" >> "$GITHUB_ENV"

      - name: Download release validation artifact
        uses: actions/download-artifact@v4
        with:
          name: neutral-release-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: _release_validation

      - name: Prove live release is unchanged before cutover
        timeout-minutes: 5
        env:
          EDGE_SCRIPT_NAME: svc-04df8d213b73
          EDGE_VERIFY_ATTEMPTS: "3"
          EDGE_VERIFY_CONSECUTIVE: "3"
        run: |
          set -euo pipefail
          origin="$LIVE_ORIGIN"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 20 --header 'Cache-Control: no-cache' \
            --output "$RUNNER_TEMP/live-state-before.json" \
            "$origin/.well-known/edge-state"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 60 --header 'Cache-Control: no-cache' \
            --output "$RUNNER_TEMP/live-catalog-before.json" \
            "$origin/data/catalog.json"
          cmp _release_validation/previous/edge-state.json "$RUNNER_TEMP/live-state-before.json"
          cmp _release_validation/previous/catalog.json "$RUNNER_TEMP/live-catalog-before.json"
          python3 -B scripts/edge_route_cutover.py verify

      - name: Require live Portal Worker locale search capability
        if: needs.prepare_release.outputs.multilingual_enabled == 'true'
        timeout-minutes: 2
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 30 --header 'Cache-Control: no-cache' \
            --output "$RUNNER_TEMP/portal-worker-capabilities.json" \
            "$LIVE_ORIGIN/api/health"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          health = json.loads(
              Path(os.environ["RUNNER_TEMP"])
              .joinpath("portal-worker-capabilities.json")
              .read_text(encoding="utf-8")
          )
          capabilities = health.get("capabilities") or {}
          if health.get("ok") is not True:
              raise SystemExit("Live Portal Worker health is not ok")
          if capabilities.get("hot_report_locale_ids_v1") is not True:
              raise SystemExit("Live Portal Worker lacks hot_report_locale_ids_v1")
          print("live_portal_worker_capability=hot_report_locale_ids_v1")
          PY

      - name: Prepare neutral edge runtime
        env:
          PORTAL_PRIVATE_CONFIG_B64: ${{ secrets.PORTAL_PRIVATE_CONFIG_B64 }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          mkdir -p .neutral_edge_runtime
          cp workers/edge-static-host/src/index.js .neutral_edge_runtime/index.js
          cat > .neutral_edge_runtime/wrangler.toml <<EOF
          name = "svc-04df8d213b73"
          main = "index.js"
          compatibility_date = "2026-08-12"
          workers_dev = false
          preview_urls = false

          [cache]
          enabled = false

          [vars]
          STATIC_PREFIX = "$STATIC_PREFIX"
          STATIC_RELEASE = "$STATIC_RELEASE"
          STATIC_TREE_SHA256 = "$STATIC_TREE_SHA256"
          CANONICAL_HOST = "$SITE_HOST"

          [[r2_buckets]]
          binding = "STATIC_BUCKET"
          bucket_name = "$R2_BUCKET"

          [[services]]
          binding = "API"
          service = "portal-suite-worker"

          [observability]
          enabled = false
          EOF
          python3 scripts/render_private_config.py \
            --skip-generated-files --root .neutral_edge_runtime/wrangler.toml
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          lines = Path(".neutral_edge_runtime/wrangler.toml").read_text(encoding="utf-8").splitlines()
          matches = []
          for line in lines:
              if line.lstrip().startswith("["):
                  break
              match = re.fullmatch(r'\s*name\s*=\s*"([A-Za-z0-9][A-Za-z0-9._-]{0,127})"\s*', line)
              if match:
                  matches.append(match.group(1))
          if len(matches) != 1:
              raise SystemExit("Rendered Edge config must have one safe top-level name")
          name = matches[0]
          print(f"::add-mask::{name}")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"EDGE_PRIVATE_SCRIPT_NAME={name}\n")
          PY

      - name: Capture exact edge rollback target
        timeout-minutes: 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
        run: >-
          python3 -B scripts/capture_edge_worker_deployment.py
          --script-name "$EDGE_PRIVATE_SCRIPT_NAME"
          --output-env "$GITHUB_ENV"

      - name: Deploy prepared neutral edge release
        id: edge_deploy
        timeout-minutes: 5
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          workingDirectory: .neutral_edge_runtime
          command: deploy
          wranglerVersion: "4.125.0"

      - name: Accept prepared release through the live edge
        id: release_acceptance
        timeout-minutes: 18
        env:
          EDGE_SCRIPT_NAME: svc-04df8d213b73
          EDGE_VERIFY_ATTEMPTS: "6"
          EDGE_VERIFY_CONSECUTIVE: "3"
        run: |
          set -euo pipefail
          origin="$LIVE_ORIGIN"
          accepted=0
          for attempt in $(seq 1 8); do
            curl --fail --silent --show-error --max-redirs 0 \
              --connect-timeout 5 --max-time 15 --header 'Cache-Control: no-cache' \
              --output "$RUNNER_TEMP/live-state-after.json" \
              "$origin/.well-known/edge-state" || true
            if STATE_PATH="$RUNNER_TEMP/live-state-after.json" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          state = json.loads(Path(os.environ["STATE_PATH"]).read_text(encoding="utf-8"))
          expected = {
              "schema_version": 1,
              "slot": os.environ["STATIC_SLOT"],
              "release_id": os.environ["STATIC_RELEASE"],
              "tree_sha256": os.environ["STATIC_TREE_SHA256"],
          }
          if state != expected:
              raise SystemExit("Prepared Edge state is not active")
          PY
            then
              accepted=1
              break
            fi
            sleep 3
          done
          test "$accepted" = 1
          python3 -B scripts/edge_route_cutover.py verify
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 60 \
            --output "$RUNNER_TEMP/release-catalog.json" \
            "$origin/.well-known/edge-release/$STATIC_RELEASE/data/catalog.json"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 60 \
            --output "$RUNNER_TEMP/public-catalog-after.json" \
            "$origin/data/catalog.json"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 60 \
            --output "$RUNNER_TEMP/public-sitemap-after.xml" \
            "$origin/sitemap-baidu.xml"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 30 \
            --output "$RUNNER_TEMP/release-semantics-after.json" \
            "$origin/.well-known/edge-release/$STATIC_RELEASE/data/release-semantics.json"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 30 \
            --output "$RUNNER_TEMP/public-semantics-after.json" \
            "$origin/data/release-semantics.json"
          cmp _release_validation/candidate/catalog.json "$RUNNER_TEMP/release-catalog.json"
          cmp _release_validation/candidate/catalog.json "$RUNNER_TEMP/public-catalog-after.json"
          cmp _release_validation/candidate/sitemap.xml "$RUNNER_TEMP/public-sitemap-after.xml"
          cmp _release_validation/candidate/release-semantics.json "$RUNNER_TEMP/release-semantics-after.json"
          cmp _release_validation/candidate/release-semantics.json "$RUNNER_TEMP/public-semantics-after.json"
          if [ "$PORTAL_MULTILINGUAL_ENABLED" = "true" ]; then
            for locale in ko ja ar; do
              curl --fail --silent --show-error --max-redirs 0 \
                --connect-timeout 5 --max-time 60 --header 'Cache-Control: no-cache' \
                --dump-header "$RUNNER_TEMP/public-$locale-headers-after.txt" \
                --output "$RUNNER_TEMP/public-$locale-index-after.html" \
                "$origin/$locale/"
              curl --fail --silent --show-error --max-redirs 0 \
                --connect-timeout 5 --max-time 60 --header 'Cache-Control: no-cache' \
                --output "$RUNNER_TEMP/public-sitemap-$locale-after.xml" \
                "$origin/sitemap-$locale.xml"
              cmp "_release_validation/candidate/$locale/index.html" \
                "$RUNNER_TEMP/public-$locale-index-after.html"
              cmp "_release_validation/candidate/sitemap-$locale.xml" \
                "$RUNNER_TEMP/public-sitemap-$locale-after.xml"
              LOCALE="$locale" \
              LOCALE_HEADERS="$RUNNER_TEMP/public-$locale-headers-after.txt" \
              LOCALE_HTML="$RUNNER_TEMP/public-$locale-index-after.html" \
                python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          locale = os.environ["LOCALE"]
          headers = Path(os.environ["LOCALE_HEADERS"]).read_text(encoding="iso-8859-1")
          values = [
              line.split(":", 1)[1].strip().lower()
              for line in headers.splitlines()
              if line.lower().startswith("content-language:")
          ]
          if values != [locale]:
              raise SystemExit(f"Unexpected Content-Language for /{locale}/: {values}")
          html = Path(os.environ["LOCALE_HTML"]).read_text(encoding="utf-8")[:16_384]
          match = re.search(r"<html\b([^>]*)>", html, flags=re.I)
          if match is None:
              raise SystemExit(f"Live locale page has no html element: {locale}")
          attrs = {
              key.lower(): value.strip().lower()
              for key, _quote, value in re.findall(
                  r"\b(lang|dir)\s*=\s*(['\"])(.*?)\2",
                  match.group(1),
                  flags=re.I,
              )
          }
          expected_direction = "rtl" if locale == "ar" else "ltr"
          if attrs.get("lang") != locale or attrs.get("dir") != expected_direction:
              raise SystemExit(f"Live locale html language or direction is invalid: {locale}")
          PY
              LOCALE="$locale" \
              SITE_ORIGIN="$origin" \
              LOCALE_SITEMAP="$RUNNER_TEMP/public-sitemap-$locale-after.xml" \
              DEEP_URL_FILE="$RUNNER_TEMP/public-$locale-deep-url.txt" \
                python3 - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import urlsplit
          import xml.etree.ElementTree as ET

          locale = os.environ["LOCALE"]
          origin = urlsplit(os.environ["SITE_ORIGIN"])
          prefix = f"/{locale}/"
          candidates = []
          tree = ET.parse(os.environ["LOCALE_SITEMAP"])
          for node in tree.findall(".//{*}loc"):
              value = str(node.text or "").strip()
              parsed = urlsplit(value)
              if (
                  parsed.scheme != origin.scheme
                  or parsed.netloc != origin.netloc
                  or parsed.query
                  or parsed.fragment
                  or not parsed.path.startswith(prefix)
              ):
                  continue
              relative = parsed.path[len(prefix):].strip("/")
              if "/" in relative:
                  candidates.append(value)
          if not candidates:
              raise SystemExit(f"Locale sitemap has no deterministic deep URL: {locale}")
          Path(os.environ["DEEP_URL_FILE"]).write_text(sorted(set(candidates))[0], encoding="utf-8")
          PY
              IFS= read -r deep_url < "$RUNNER_TEMP/public-$locale-deep-url.txt"
              deep_status="$(curl --fail --silent --show-error --max-redirs 0 \
                --connect-timeout 5 --max-time 60 --header 'Cache-Control: no-cache' \
                --write-out '%{http_code}' \
                --output "$RUNNER_TEMP/public-$locale-deep-after.html" \
                "$deep_url")"
              test "$deep_status" = "200"
              LOCALE="$locale" \
              SITE_ORIGIN="$origin" \
              DEEP_URL="$deep_url" \
              DEEP_HTML="$RUNNER_TEMP/public-$locale-deep-after.html" \
                python3 - <<'PY'
          from html.parser import HTMLParser
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit, urlunsplit


          class MetadataParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.canonicals = []
                  self.alternates = {}
                  self.meta = {}
                  self.json_ld = []
                  self._json_parts = None

              def handle_starttag(self, tag, attrs):
                  attributes = {str(key).lower(): str(value or "") for key, value in attrs}
                  if tag.lower() == "link":
                      rel = {value.lower() for value in attributes.get("rel", "").split()}
                      if "canonical" in rel and attributes.get("href"):
                          self.canonicals.append(attributes["href"])
                      if "alternate" in rel and attributes.get("hreflang") and attributes.get("href"):
                          self.alternates.setdefault(attributes["hreflang"], []).append(attributes["href"])
                  elif tag.lower() == "meta":
                      key = (attributes.get("property") or attributes.get("name") or "").lower()
                      if key:
                          self.meta.setdefault(key, []).append(attributes.get("content", ""))
                  elif tag.lower() == "script" and attributes.get("type", "").lower() == "application/ld+json":
                      self._json_parts = []

              def handle_data(self, data):
                  if self._json_parts is not None:
                      self._json_parts.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self._json_parts is not None:
                      self.json_ld.append("".join(self._json_parts))
                      self._json_parts = None


          locale = os.environ["LOCALE"]
          origin = urlsplit(os.environ["SITE_ORIGIN"])
          deep_url = os.environ["DEEP_URL"]
          deep = urlsplit(deep_url)
          prefix = f"/{locale}"
          if not (deep.path == prefix or deep.path.startswith(prefix + "/")):
              raise SystemExit(f"Deep locale URL is outside /{locale}: {deep_url}")
          root_path = deep.path[len(prefix):] or "/"
          root_url = urlunsplit((origin.scheme, origin.netloc, root_path, "", ""))
          expected_alternates = {"zh-Hans": root_url, "x-default": root_url}
          for language in ("ko", "ja", "ar"):
              localized_path = f"/{language}" + (root_path if root_path.startswith("/") else "/" + root_path)
              expected_alternates[language] = urlunsplit(
                  (origin.scheme, origin.netloc, localized_path, "", "")
              )

          parser = MetadataParser()
          parser.feed(Path(os.environ["DEEP_HTML"]).read_text(encoding="utf-8"))
          if parser.canonicals != [deep_url]:
              raise SystemExit(f"Deep locale page does not have one self canonical: {locale}")
          if parser.meta.get("og:url") != [deep_url]:
              raise SystemExit(f"Deep locale page og:url is not self-referential: {locale}")
          if set(parser.alternates) != set(expected_alternates):
              raise SystemExit(f"Deep locale page hreflang language set is incomplete: {locale}")
          for language, expected_url in expected_alternates.items():
              if parser.alternates.get(language) != [expected_url]:
                  raise SystemExit(f"Deep locale page hreflang is invalid: {locale}/{language}")

          documents = []
          for source in parser.json_ld:
              try:
                  documents.append(json.loads(source))
              except json.JSONDecodeError as error:
                  raise SystemExit(f"Deep locale page has invalid JSON-LD: {locale}") from error
          if not documents:
              raise SystemExit(f"Deep locale page has no JSON-LD: {locale}")

          def has_locale_language(value):
              if isinstance(value, dict):
                  language = value.get("inLanguage")
                  if isinstance(language, str) and (
                      language.lower() == locale or language.lower().startswith(locale + "-")
                  ):
                      return True
                  if isinstance(language, list) and any(
                      isinstance(item, str)
                      and (item.lower() == locale or item.lower().startswith(locale + "-"))
                      for item in language
                  ):
                      return True
                  return any(has_locale_language(item) for item in value.values())
              if isinstance(value, list):
                  return any(has_locale_language(item) for item in value)
              return False

          if not any(has_locale_language(document) for document in documents):
              raise SystemExit(f"Deep locale page JSON-LD has no localized inLanguage: {locale}")
          PY
            done
            curl --fail --silent --show-error --max-redirs 0 \
              --connect-timeout 5 --max-time 60 --header 'Cache-Control: no-cache' \
              --output "$RUNNER_TEMP/public-locale-manifest-after.json" \
              "$origin/data/i18n/manifest.json"
            cmp _release_validation/candidate/data/i18n/manifest.json \
              "$RUNNER_TEMP/public-locale-manifest-after.json"
          fi
          public_brand_root="$RUNNER_TEMP/public-brand-after"
          mkdir -p "$public_brand_root/assets"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 30 --header 'Cache-Control: no-cache' \
            --output "$public_brand_root/index.html" "$origin/"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 30 --header 'Cache-Control: no-cache' \
            --output "$public_brand_root/assets/app.js" "$origin/assets/app.js"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 30 --header 'Cache-Control: no-cache' \
            --output "$public_brand_root/assets/app-mark.svg" "$origin/assets/app-mark.svg"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 30 --header 'Cache-Control: no-cache' \
            --output "$public_brand_root/doc.html" "$origin/doc.html"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 30 --header 'Cache-Control: no-cache' \
            --output "$public_brand_root/report.html" "$origin/report.html"
          python3 -B scripts/check_public_brand.py "$public_brand_root"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 30 \
            --output "$RUNNER_TEMP/runtime-health-after.json" \
            "$origin/api/health?runtime-data=1"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = json.loads(Path("_release_validation/candidate/catalog.json").read_text(encoding="utf-8"))
          health = json.loads(Path(os.environ["RUNNER_TEMP"]).joinpath("runtime-health-after.json").read_text(encoding="utf-8"))
          runtime = health.get("runtime_data") or {}
          if health.get("ok") is not True:
              raise SystemExit("Portal health is not ok")
          if runtime.get("release_id") != os.environ["STATIC_RELEASE"]:
              raise SystemExit("Portal did not select the prepared runtime release")
          if runtime.get("catalog_versioned") is not True or runtime.get("rules_versioned") is not True:
              raise SystemExit("Portal did not verify the immutable runtime objects")
          if int(runtime.get("catalog_item_count") or 0) != len(expected.get("items") or []):
              raise SystemExit("Portal runtime catalog count does not match the prepared catalog")
          if str(runtime.get("catalog_updated_at_bjt") or "") != str(expected.get("updated_at_bjt") or ""):
              raise SystemExit("Portal runtime catalog version does not match the prepared catalog")
          if runtime.get("rules_loaded") is not True:
              raise SystemExit("Portal runtime rules did not load")
          print(f"portal_runtime_release={runtime['release_id']} catalog_items={runtime['catalog_item_count']}")
          PY

      - name: Roll back failed release or completed rehearsal
        id: edge_rollback
        if: >-
          ${{ always() &&
              steps.edge_deploy.outcome != 'skipped' &&
              (steps.release_acceptance.outcome != 'success' || needs.prepare_release.outputs.operation == 'rehearse') }}
        timeout-minutes: 5
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          workingDirectory: .neutral_edge_runtime
          command: rollback ${{ env.EDGE_PREVIOUS_VERSION_ID }} --message "Restore exact pre-release Edge version"
          wranglerVersion: "4.125.0"

      - name: Verify exact previous release after rollback
        id: rollback_acceptance
        if: ${{ always() && steps.edge_rollback.outcome == 'success' }}
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          EDGE_VERIFY_ATTEMPTS: "6"
          EDGE_VERIFY_CONSECUTIVE: "3"
        run: |
          set -euo pipefail
          python3 -B scripts/capture_edge_worker_deployment.py \
            --script-name "$EDGE_PRIVATE_SCRIPT_NAME" \
            --expect-version "$EDGE_PREVIOUS_VERSION_ID"
          origin="$LIVE_ORIGIN"
          restored=0
          for attempt in $(seq 1 8); do
            curl --fail --silent --show-error --max-redirs 0 \
              --connect-timeout 5 --max-time 15 --header 'Cache-Control: no-cache' \
              --output "$RUNNER_TEMP/rollback-edge-state.json" \
              "$origin/.well-known/edge-state" || true
            curl --fail --silent --show-error --max-redirs 0 \
              --connect-timeout 5 --max-time 60 --header 'Cache-Control: no-cache' \
              --output "$RUNNER_TEMP/rollback-public-catalog.json" \
              "$origin/data/catalog.json" || true
            if cmp _release_validation/previous/edge-state.json "$RUNNER_TEMP/rollback-edge-state.json" \
              && cmp _release_validation/previous/catalog.json "$RUNNER_TEMP/rollback-public-catalog.json"
            then
              restored=1
              break
            fi
            sleep 3
          done
          test "$restored" = 1
          EDGE_SCRIPT_NAME="$EDGE_PRIVATE_SCRIPT_NAME" python3 -B scripts/edge_route_cutover.py verify
          rollback_brand_root="$RUNNER_TEMP/public-brand-rollback"
          mkdir -p "$rollback_brand_root/assets"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 30 --header 'Cache-Control: no-cache' \
            --output "$rollback_brand_root/index.html" "$origin/"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 30 --header 'Cache-Control: no-cache' \
            --output "$rollback_brand_root/assets/app.js" "$origin/assets/app.js"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 30 --header 'Cache-Control: no-cache' \
            --output "$rollback_brand_root/assets/app-mark.svg" "$origin/assets/app-mark.svg"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 30 --header 'Cache-Control: no-cache' \
            --output "$rollback_brand_root/doc.html" "$origin/doc.html"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 30 --header 'Cache-Control: no-cache' \
            --output "$rollback_brand_root/report.html" "$origin/report.html"
          python3 -B scripts/check_public_brand.py "$rollback_brand_root"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 30 \
            --output "$RUNNER_TEMP/runtime-health-rollback.json" \
            "$origin/api/health?runtime-data=1"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = json.loads(Path("_release_validation/previous/catalog.json").read_text(encoding="utf-8"))
          health = json.loads(Path(os.environ["RUNNER_TEMP"]).joinpath("runtime-health-rollback.json").read_text(encoding="utf-8"))
          runtime = health.get("runtime_data") or {}
          if health.get("ok") is not True:
              raise SystemExit("Portal health is not ok after rollback")
          if runtime.get("release_id") != os.environ["PREVIOUS_STATIC_RELEASE"]:
              raise SystemExit("Portal did not return to the previous runtime release")
          if int(runtime.get("catalog_item_count") or 0) != len(expected.get("items") or []):
              raise SystemExit("Portal rollback catalog count does not match the previous catalog")
          if str(runtime.get("catalog_updated_at_bjt") or "") != str(expected.get("updated_at_bjt") or ""):
              raise SystemExit("Portal rollback catalog version does not match the previous catalog")
          if runtime.get("rules_loaded") is not True:
              raise SystemExit("Portal rollback rules did not load")
          print(f"portal_runtime_restored={runtime['release_id']} catalog_items={runtime['catalog_item_count']}")
          PY

      - name: Enforce transactional outcome
        if: always()
        run: |
          set -euo pipefail
          test "${{ steps.edge_deploy.outcome }}" = "success"
          test "${{ steps.release_acceptance.outcome }}" = "success"
          if [ "$NEUTRAL_OPERATION" = "rehearse" ]; then
            test "${{ steps.edge_rollback.outcome }}" = "success"
            test "${{ steps.rollback_acceptance.outcome }}" = "success"
          else
            test "${{ steps.edge_rollback.outcome }}" = "skipped"
          fi

  cleanup_multilingual_shadow:
    needs: [prepare_release, shadow_review_hold, multilingual_approval, cutover]
    if: >-
      ${{
        always() &&
        needs.prepare_release.outputs.shadow_worker_name != ''
      }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Delete exact isolated shadow worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          SHADOW_WORKER_NAME: ${{ needs.prepare_release.outputs.shadow_worker_name }}
        run: |
          set -euo pipefail
          expected="portal-locale-shadow-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$SHADOW_WORKER_NAME" = "$expected"
          response="$RUNNER_TEMP/shadow-delete.json"
          status="$(curl --silent --show-error --request DELETE \
            --connect-timeout 5 --max-time 30 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --output "$response" --write-out '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$SHADOW_WORKER_NAME")"
          test "$status" = "200"
          DELETE_RESPONSE="$response" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["DELETE_RESPONSE"]).read_text(encoding="utf-8"))
          if payload.get("success") is not True:
              raise SystemExit("Cloudflare did not confirm deletion of the isolated shadow Worker")
          print("Isolated multilingual shadow Worker deleted")
          PY
