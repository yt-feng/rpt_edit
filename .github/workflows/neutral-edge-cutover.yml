name: Neutral edge catalog refresh
run-name: Neutral edge catalog ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'migrate' }}

on:
  schedule:
    - cron: "30 1,5,9,13 * * *"
  workflow_run:
    workflows:
      - Bank report catalog
      - Final PDF to XHS notes
      - Institution latest PDF to WeChat
      - Consulting latest PDF to WeChat
      - ARK Invest feed to WeChat
      - Upload XHS notes to WeChat drafts
      - Portal chart search index
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: "Rehearse restores A; migrate keeps the accepted B release"
        required: true
        type: choice
        options:
          - rehearse
          - migrate
        default: rehearse

permissions:
  contents: read

concurrency:
  group: portal-production-release
  cancel-in-progress: false

jobs:
  prepare_release:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          vars.NEUTRAL_SCHEDULE_ENABLED == 'true' &&
          (
            github.event_name == 'schedule' ||
            (
              github.event_name == 'workflow_run' &&
              github.event.workflow_run.conclusion == 'success' &&
              github.event.workflow_run.head_branch == github.event.repository.default_branch &&
              github.event.workflow_run.head_repository.full_name == github.repository
            )
          )
        )
      }}
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    outputs:
      changed: ${{ steps.release_delta.outputs.changed }}
      static_release: ${{ steps.runtime_context.outputs.static_release }}
      static_slot: ${{ steps.static_upload.outputs.static_slot }}
      static_prefix: ${{ steps.static_upload.outputs.static_prefix }}
      static_tree: ${{ steps.static_upload.outputs.tree_sha256 }}
      previous_slot: ${{ steps.previous_state.outputs.previous_slot }}
      previous_release: ${{ steps.previous_state.outputs.previous_release }}
      previous_tree: ${{ steps.previous_state.outputs.previous_tree }}
      operation: ${{ steps.operation.outputs.operation }}
    steps:
      - name: Require reviewed main operation
        id: operation
        env:
          REQUESTED_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              case "$REQUESTED_OPERATION" in
                rehearse|migrate) operation="$REQUESTED_OPERATION" ;;
                *) echo "::error::Unsupported manual Neutral operation"; exit 2 ;;
              esac
              ;;
            schedule|workflow_run)
              operation="migrate"
              ;;
            *)
              echo "::error::Unsupported Neutral trigger: $GITHUB_EVENT_NAME"
              exit 2
              ;;
          esac
          printf 'NEUTRAL_OPERATION=%s\n' "$operation" >> "$GITHUB_ENV"
          printf 'operation=%s\n' "$operation" >> "$GITHUB_OUTPUT"

      - name: Checkout public source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate public source
        run: |
          set -euo pipefail
          python3 -B scripts/check_public_identity.py
          node --input-type=module --check < workers/edge-static-host/src/index.js
          node --input-type=module --check < workers/portal-suite-worker/src/index.js
          node --input-type=module --check < workers/portal-suite-worker/src/source-lead-adapter.js
          node --check portal_suite/site_src/assets/app.js
          node --check portal_suite/site_src/assets/report-chat.js
          node --check portal_suite/site_src/assets/charts.js
          node --check portal_suite/site_src/assets/site-runtime.js
          node --test workers/edge-static-host/test/index.test.mjs
          for test_file in portal_suite/tests/*.test.mjs; do
            node "$test_file"
          done
          node scripts/test_source_lead_adapter.js
          node scripts/test_portal_source_lead_integration.js
          node scripts/test_portal_chart_search_frontend.js
          node scripts/test_portal_site_runtime.js
          python3 -m py_compile \
            scripts/check_public_brand.py \
            scripts/compare_portal_release_semantics.py \
            scripts/edge_route_cutover.py \
            scripts/capture_edge_worker_deployment.py \
            scripts/publish_static_slot.py
          python3 -B scripts/test_compare_portal_release_semantics.py
          python3 -B scripts/test_check_public_brand.py
          python3 -B scripts/test_publish_static_slot.py
          python3 -B scripts/test_capture_edge_worker_deployment.py
          python3 scripts/test_portal_seo.py
          python3 scripts/test_portal_blog_build.py
          python3 scripts/test_edge_route_cutover.py
          python3 scripts/test_neutral_edge_cutover_workflow.py

      - name: Prepare masked release context
        id: runtime_context
        env:
          PORTAL_SITE_URL: ${{ secrets.PORTAL_SITE_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          echo "::add-mask::$PORTAL_SITE_URL"
          echo "::add-mask::$R2_BUCKET"
          site_host="$(python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          parsed = urlsplit(os.environ["PORTAL_SITE_URL"])
          if (
              parsed.scheme != "https"
              or not parsed.hostname
              or parsed.username is not None
              or parsed.password is not None
              or parsed.port is not None
              or parsed.path not in {"", "/"}
              or parsed.query
              or parsed.fragment
          ):
              raise SystemExit("Configured site URL is not a bare HTTPS origin")
          print(parsed.hostname.lower())
          PY
          )"
          alias_hosts=""
          if [ "$(printf '%s' "$site_host" | awk -F. '{print NF}')" -eq 2 ] \
            && [ "${site_host#www.}" = "$site_host" ]
          then
            alias_hosts="www.$site_host"
          fi
          live_origin="https://$site_host"
          release_id="$(openssl rand -hex 16)"
          echo "::add-mask::$site_host"
          echo "::add-mask::$alias_hosts"
          echo "::add-mask::$live_origin"
          printf 'SITE_HOST=%s\n' "$site_host" >> "$GITHUB_ENV"
          printf 'EDGE_ALIAS_HOSTS=%s\n' "$alias_hosts" >> "$GITHUB_ENV"
          printf 'LIVE_ORIGIN=%s\n' "$live_origin" >> "$GITHUB_ENV"
          printf 'STATIC_RELEASE=%s\n' "$release_id" >> "$GITHUB_ENV"
          printf 'static_release=%s\n' "$release_id" >> "$GITHUB_OUTPUT"

      - name: Gate preparation on stable live routes
        timeout-minutes: 5
        env:
          EDGE_SCRIPT_NAME: svc-04df8d213b73
          EDGE_VERIFY_ATTEMPTS: "3"
          EDGE_VERIFY_CONSECUTIVE: "3"
        run: python3 -B scripts/edge_route_cutover.py verify

      - name: Capture exact previous state and public discovery
        id: previous_state
        run: |
          set -euo pipefail
          origin="$LIVE_ORIGIN"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 20 --header 'Cache-Control: no-cache' \
            --output "$RUNNER_TEMP/previous-edge-state.json" \
            "$origin/.well-known/edge-state"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 60 --header 'Cache-Control: no-cache' \
            --output "$RUNNER_TEMP/previous-public-catalog.json" \
            "$origin/data/catalog.json"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 60 --header 'Cache-Control: no-cache' \
            --output "$RUNNER_TEMP/previous-public-sitemap.xml" \
            "$origin/sitemap-baidu.xml"
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path(os.environ["RUNNER_TEMP"])
          state = json.loads(root.joinpath("previous-edge-state.json").read_text(encoding="utf-8"))
          if (
              state.get("schema_version") != 1
              or state.get("slot") not in {"a", "b"}
              or not re.fullmatch(r"[0-9a-f]{32}", str(state.get("release_id") or ""))
              or not re.fullmatch(r"[0-9a-f]{64}", str(state.get("tree_sha256") or ""))
          ):
              raise SystemExit("Previous Edge state is invalid")
          catalog = json.loads(root.joinpath("previous-public-catalog.json").read_text(encoding="utf-8"))
          items = catalog.get("items")
          if not isinstance(items, list) or not items:
              raise SystemExit("Previous public catalog is empty or invalid")
          sitemap = ET.parse(root / "previous-public-sitemap.xml").getroot()
          if sitemap.tag.rsplit("}", 1)[-1] != "urlset" or not sitemap.findall("./{*}url"):
              raise SystemExit("Previous public sitemap is empty or invalid")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"previous_slot={state['slot']}\n")
              handle.write(f"previous_release={state['release_id']}\n")
              handle.write(f"previous_tree={state['tree_sha256']}\n")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"ACTIVE_STATIC_SLOT={state['slot']}\n")
              handle.write(f"PREVIOUS_STATIC_RELEASE={state['release_id']}\n")
          print(f"previous_slot={state['slot']} previous_catalog_items={len(items)}")
          PY

      - name: Capture active release semantics
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/previous-release-semantics.json"
          status="$(curl --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 30 --header 'Cache-Control: no-cache' \
            --output "$output" --write-out '%{http_code}' \
            "$LIVE_ORIGIN/.well-known/edge-release/$PREVIOUS_STATIC_RELEASE/data/release-semantics.json")"
          case "$status" in
            200)
              PYTHONPATH=scripts PREVIOUS_MANIFEST="$output" python3 - <<'PY'
          import os
          from pathlib import Path
          from compare_portal_release_semantics import load_manifest

          manifest = load_manifest(Path(os.environ["PREVIOUS_MANIFEST"]))
          print(f"previous_semantic_sha256={manifest['semantic_sha256']}")
          PY
              ;;
            404)
              rm -f "$output"
              echo "Active release has no semantic manifest; a reviewed manual seed is required"
              ;;
            *)
              echo "::error::Could not read active release semantics: HTTP $status"
              exit 1
              ;;
          esac

      - name: Install refresh dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check
          "boto3>=1.34,<2" "pypdf>=4,<6" "requests>=2.31,<3" "Pillow>=10,<12"

      - name: Materialize private deployment profile
        env:
          PORTAL_PRIVATE_CONFIG_B64: ${{ secrets.PORTAL_PRIVATE_CONFIG_B64 }}
          PORTAL_PRIVATE_ASSET_KEY: ${{ secrets.PORTAL_PRIVATE_ASSET_KEY }}
          PORTAL_PRIVATE_PUBLISH_ASSET_KEY: ${{ secrets.PORTAL_PRIVATE_PUBLISH_ASSET_KEY }}
          PORTAL_SOCIAL_CARD_B64: ${{ secrets.PORTAL_SOCIAL_CARD_B64 }}
          PORTAL_SITE_URL: ${{ secrets.PORTAL_SITE_URL }}
        run: |
          set -euo pipefail
          echo "::add-mask::$PORTAL_SITE_URL"
          python3 scripts/render_private_config.py --github-add-mask
          python3 scripts/render_private_config.py \
            --root portal_suite/site_src \
            --root scripts/build_portal_suite_site.py \
            --root workers/portal-suite-worker/src/index.js
          bash scripts/materialize_private_assets.sh portal_suite/site_src
          test -s portal_suite/site_src/assets/contact-card.jpg
          test -n "$PORTAL_SOCIAL_CARD_B64"
          social_card="$RUNNER_TEMP/portal-social-card.jpg"
          printf '%s' "$PORTAL_SOCIAL_CARD_B64" | base64 --decode > "$social_card"
          test "$(od -An -tx1 -N3 "$social_card" | tr -d ' \n')" = "ffd8ff"
          test "$(wc -c < "$social_card")" -le 1048576
          install -m 0600 "$social_card" portal_suite/site_src/assets/social-card.jpg

      - name: Refresh report catalog with additive PDF sync
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_OBJECT_PREFIX: ${{ vars.R2_OBJECT_PREFIX || 'reports' }}
          CATALOG_PDF_CLEANUP_ENABLED: "false"
        run: |
          set -euo pipefail
          test "$CATALOG_PDF_CLEANUP_ENABLED" = "false"
          test -s portal_suite/data/catalog.json
          test -s portal_suite/data/archive_catalog.json
          test -s portal_suite/data/history_catalog.json
          python3 scripts/portal_suite_catalog.py \
            --dropbox-root "/zip_backup" --days 0 \
            --catalog-path portal_suite/data/catalog.json \
            --password-rules portal_suite/password_rules.json \
            --r2-prefix "$R2_OBJECT_PREFIX" --storage-limit-gb 100 --sync-r2

      - name: Translate missing report titles
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
        run: |
          set -euo pipefail
          python3 scripts/translate_portal_titles.py \
            --catalog-path portal_suite/data/catalog.json \
            --model "$DEEPSEEK_MODEL" --deepseek-base-url "$DEEPSEEK_BASE_URL" --workers 500

      - name: Download private chart search index
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python3 scripts/chart_search_r2.py download --index _chart_search/index.json

      - name: Build private static release
        env:
          PORTAL_WORKER_URL: ${{ secrets.PORTAL_WORKER_URL }}
          PORTAL_DOWNLOAD_PASSWORD: ${{ secrets[vars.PORTAL_DOWNLOAD_SECRET_REF] }}
          PASSWORD_SECRET: ${{ secrets.PASSWORD_SECRET }}
        run: |
          set -euo pipefail
          echo "::add-mask::$PORTAL_WORKER_URL"
          python3 scripts/build_portal_suite_site.py \
            --catalog-path portal_suite/data/catalog.json \
            --password-rules portal_suite/password_rules.json \
            --site-src portal_suite/site_src \
            --wechat-drafts-root wechat_drafts \
            --blog-archive-root portal_suite/data/blog_archive \
            --output-dir _neutral_site --worker-base-url "$PORTAL_WORKER_URL"
          python3 scripts/merge_chart_search_index.py \
            --search-index _neutral_site/data/search_index.json \
            --chart-index _chart_search/index.json \
            --catalog portal_suite/data/catalog.json \
            --chart-output _neutral_site/data/chart_search_index.json
          for required in \
            index.html assets/app.js data/catalog.json data/catalog_preview.json \
            data/catalog_recommendations.json data/search_index.json \
            data/chart_search_index.json data/password_rules.json \
            reports/institutions/bernstein/index.html sitemap-baidu.xml
          do
            test -s "_neutral_site/$required"
          done
          test -n "$(find _neutral_site/data/report_details -type f -name '*.json' -print -quit)"
          python3 - <<'PY'
          from pathlib import Path

          root = Path("_neutral_site")
          files = [path for path in root.rglob("*") if path.is_file() and not path.is_symlink()]
          total = sum(path.stat().st_size for path in files)
          if not 1000 <= len(files) <= 20000:
              raise SystemExit("Static file count is outside the expected range")
          if not 100_000_000 <= total <= 1_000_000_000:
              raise SystemExit("Static release size is outside the expected range")
          print(f"static_files={len(files)} static_bytes={total}")
          PY

      - name: Validate built public brand
        run: python3 -B scripts/check_public_brand.py _neutral_site

      - name: Detect meaningful public release changes
        id: release_delta
        run: |
          set -euo pipefail
          previous_args=()
          force_args=()
          if [ -s "$RUNNER_TEMP/previous-release-semantics.json" ]; then
            previous_args+=(--previous-manifest "$RUNNER_TEMP/previous-release-semantics.json")
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] \
            && { [ "$NEUTRAL_OPERATION" = "rehearse" ] \
              || [ ! -s "$RUNNER_TEMP/previous-release-semantics.json" ]; }
          then
            force_args+=(--force)
          fi
          python3 -B scripts/compare_portal_release_semantics.py \
            --current-catalog _neutral_site/data/catalog.json \
            --current-sitemap _neutral_site/sitemap-baidu.xml \
            --current-search-index _neutral_site/data/search_index.json \
            --current-chart-search-index _neutral_site/data/chart_search_index.json \
            --current-password-rules _neutral_site/data/password_rules.json \
            --current-runtime-config _neutral_site/data/config.json \
            --blog-archive-root portal_suite/data/blog_archive \
            --site-source-root portal_suite/site_src \
            --build-contract scripts/compare_portal_release_semantics.py \
            --build-contract scripts/build_portal_suite_site.py \
            --build-contract scripts/merge_chart_search_index.py \
            --build-contract workers/edge-static-host/src/index.js \
            --public-root _neutral_site \
            --write-current-manifest _neutral_site/data/release-semantics.json \
            --github-output "$GITHUB_OUTPUT" \
            "${previous_args[@]}" "${force_args[@]}"
          test -s _neutral_site/data/release-semantics.json

      - name: Upload inactive static slot and immutable runtime
        id: static_upload
        if: steps.release_delta.outputs.changed == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          python3 -B scripts/publish_static_slot.py \
            --root _neutral_site --release "$STATIC_RELEASE" \
            --active-slot "$ACTIVE_STATIC_SLOT" --max-workers 10

      - name: Build public validation artifact
        if: steps.release_delta.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p _release_validation/previous _release_validation/candidate
          install -m 0600 "$RUNNER_TEMP/previous-edge-state.json" _release_validation/previous/edge-state.json
          install -m 0600 "$RUNNER_TEMP/previous-public-catalog.json" _release_validation/previous/catalog.json
          install -m 0600 "$RUNNER_TEMP/previous-public-sitemap.xml" _release_validation/previous/sitemap.xml
          install -m 0600 _neutral_site/data/catalog.json _release_validation/candidate/catalog.json
          install -m 0600 _neutral_site/data/catalog_preview.json _release_validation/candidate/catalog_preview.json
          install -m 0600 _neutral_site/sitemap-baidu.xml _release_validation/candidate/sitemap.xml
          install -m 0600 _neutral_site/data/release-semantics.json _release_validation/candidate/release-semantics.json

      - name: Upload release validation artifact
        if: steps.release_delta.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: neutral-release-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: _release_validation
          if-no-files-found: error
          retention-days: 1

  cutover:
    needs: prepare_release
    if: needs.prepare_release.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    env:
      STATIC_RELEASE: ${{ needs.prepare_release.outputs.static_release }}
      STATIC_SLOT: ${{ needs.prepare_release.outputs.static_slot }}
      STATIC_PREFIX: ${{ needs.prepare_release.outputs.static_prefix }}
      STATIC_TREE_SHA256: ${{ needs.prepare_release.outputs.static_tree }}
      PREVIOUS_STATIC_SLOT: ${{ needs.prepare_release.outputs.previous_slot }}
      PREVIOUS_STATIC_RELEASE: ${{ needs.prepare_release.outputs.previous_release }}
      PREVIOUS_STATIC_TREE: ${{ needs.prepare_release.outputs.previous_tree }}
      NEUTRAL_OPERATION: ${{ needs.prepare_release.outputs.operation }}
    steps:
      - name: Checkout audited cutover source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare masked live route context
        env:
          PORTAL_SITE_URL: ${{ secrets.PORTAL_SITE_URL }}
        run: |
          set -euo pipefail
          echo "::add-mask::$PORTAL_SITE_URL"
          site_host="$(python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          parsed = urlsplit(os.environ["PORTAL_SITE_URL"])
          if (
              parsed.scheme != "https"
              or not parsed.hostname
              or parsed.username is not None
              or parsed.password is not None
              or parsed.port is not None
              or parsed.path not in {"", "/"}
              or parsed.query
              or parsed.fragment
          ):
              raise SystemExit("Configured site URL is not a bare HTTPS origin")
          print(parsed.hostname.lower())
          PY
          )"
          alias_hosts=""
          if [ "$(printf '%s' "$site_host" | awk -F. '{print NF}')" -eq 2 ] \
            && [ "${site_host#www.}" = "$site_host" ]
          then
            alias_hosts="www.$site_host"
          fi
          live_origin="https://$site_host"
          echo "::add-mask::$site_host"
          echo "::add-mask::$alias_hosts"
          echo "::add-mask::$live_origin"
          printf 'SITE_HOST=%s\n' "$site_host" >> "$GITHUB_ENV"
          printf 'EDGE_ALIAS_HOSTS=%s\n' "$alias_hosts" >> "$GITHUB_ENV"
          printf 'LIVE_ORIGIN=%s\n' "$live_origin" >> "$GITHUB_ENV"

      - name: Download release validation artifact
        uses: actions/download-artifact@v4
        with:
          name: neutral-release-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: _release_validation

      - name: Prove live release is unchanged before cutover
        timeout-minutes: 5
        env:
          EDGE_SCRIPT_NAME: svc-04df8d213b73
          EDGE_VERIFY_ATTEMPTS: "3"
          EDGE_VERIFY_CONSECUTIVE: "3"
        run: |
          set -euo pipefail
          origin="$LIVE_ORIGIN"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 20 --header 'Cache-Control: no-cache' \
            --output "$RUNNER_TEMP/live-state-before.json" \
            "$origin/.well-known/edge-state"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 60 --header 'Cache-Control: no-cache' \
            --output "$RUNNER_TEMP/live-catalog-before.json" \
            "$origin/data/catalog.json"
          cmp _release_validation/previous/edge-state.json "$RUNNER_TEMP/live-state-before.json"
          cmp _release_validation/previous/catalog.json "$RUNNER_TEMP/live-catalog-before.json"
          python3 -B scripts/edge_route_cutover.py verify

      - name: Prepare neutral edge runtime
        env:
          PORTAL_PRIVATE_CONFIG_B64: ${{ secrets.PORTAL_PRIVATE_CONFIG_B64 }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          mkdir -p .neutral_edge_runtime
          cp workers/edge-static-host/src/index.js .neutral_edge_runtime/index.js
          cat > .neutral_edge_runtime/wrangler.toml <<EOF
          name = "svc-04df8d213b73"
          main = "index.js"
          compatibility_date = "2026-08-12"
          workers_dev = false
          preview_urls = false

          [cache]
          enabled = false

          [vars]
          STATIC_PREFIX = "$STATIC_PREFIX"
          STATIC_RELEASE = "$STATIC_RELEASE"
          STATIC_TREE_SHA256 = "$STATIC_TREE_SHA256"
          CANONICAL_HOST = "$SITE_HOST"

          [[r2_buckets]]
          binding = "STATIC_BUCKET"
          bucket_name = "$R2_BUCKET"

          [[services]]
          binding = "API"
          service = "portal-suite-worker"

          [observability]
          enabled = false
          EOF
          python3 scripts/render_private_config.py \
            --skip-generated-files --root .neutral_edge_runtime/wrangler.toml
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          lines = Path(".neutral_edge_runtime/wrangler.toml").read_text(encoding="utf-8").splitlines()
          matches = []
          for line in lines:
              if line.lstrip().startswith("["):
                  break
              match = re.fullmatch(r'\s*name\s*=\s*"([A-Za-z0-9][A-Za-z0-9._-]{0,127})"\s*', line)
              if match:
                  matches.append(match.group(1))
          if len(matches) != 1:
              raise SystemExit("Rendered Edge config must have one safe top-level name")
          name = matches[0]
          print(f"::add-mask::{name}")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"EDGE_PRIVATE_SCRIPT_NAME={name}\n")
          PY

      - name: Capture exact edge rollback target
        timeout-minutes: 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
        run: >-
          python3 -B scripts/capture_edge_worker_deployment.py
          --script-name "$EDGE_PRIVATE_SCRIPT_NAME"
          --output-env "$GITHUB_ENV"

      - name: Deploy prepared neutral edge release
        id: edge_deploy
        timeout-minutes: 5
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          workingDirectory: .neutral_edge_runtime
          command: deploy
          wranglerVersion: "4.125.0"

      - name: Accept prepared release through the live edge
        id: release_acceptance
        timeout-minutes: 18
        env:
          EDGE_SCRIPT_NAME: svc-04df8d213b73
          EDGE_VERIFY_ATTEMPTS: "6"
          EDGE_VERIFY_CONSECUTIVE: "3"
        run: |
          set -euo pipefail
          origin="$LIVE_ORIGIN"
          accepted=0
          for attempt in $(seq 1 8); do
            curl --fail --silent --show-error --max-redirs 0 \
              --connect-timeout 5 --max-time 15 --header 'Cache-Control: no-cache' \
              --output "$RUNNER_TEMP/live-state-after.json" \
              "$origin/.well-known/edge-state" || true
            if STATE_PATH="$RUNNER_TEMP/live-state-after.json" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          state = json.loads(Path(os.environ["STATE_PATH"]).read_text(encoding="utf-8"))
          expected = {
              "schema_version": 1,
              "slot": os.environ["STATIC_SLOT"],
              "release_id": os.environ["STATIC_RELEASE"],
              "tree_sha256": os.environ["STATIC_TREE_SHA256"],
          }
          if state != expected:
              raise SystemExit("Prepared Edge state is not active")
          PY
            then
              accepted=1
              break
            fi
            sleep 3
          done
          test "$accepted" = 1
          python3 -B scripts/edge_route_cutover.py verify
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 60 \
            --output "$RUNNER_TEMP/release-catalog.json" \
            "$origin/.well-known/edge-release/$STATIC_RELEASE/data/catalog.json"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 60 \
            --output "$RUNNER_TEMP/public-catalog-after.json" \
            "$origin/data/catalog.json"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 60 \
            --output "$RUNNER_TEMP/public-sitemap-after.xml" \
            "$origin/sitemap-baidu.xml"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 30 \
            --output "$RUNNER_TEMP/release-semantics-after.json" \
            "$origin/.well-known/edge-release/$STATIC_RELEASE/data/release-semantics.json"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 30 \
            --output "$RUNNER_TEMP/public-semantics-after.json" \
            "$origin/data/release-semantics.json"
          cmp _release_validation/candidate/catalog.json "$RUNNER_TEMP/release-catalog.json"
          cmp _release_validation/candidate/catalog.json "$RUNNER_TEMP/public-catalog-after.json"
          cmp _release_validation/candidate/sitemap.xml "$RUNNER_TEMP/public-sitemap-after.xml"
          cmp _release_validation/candidate/release-semantics.json "$RUNNER_TEMP/release-semantics-after.json"
          cmp _release_validation/candidate/release-semantics.json "$RUNNER_TEMP/public-semantics-after.json"
          public_brand_root="$RUNNER_TEMP/public-brand-after"
          mkdir -p "$public_brand_root/assets"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 30 --header 'Cache-Control: no-cache' \
            --output "$public_brand_root/index.html" "$origin/"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 30 --header 'Cache-Control: no-cache' \
            --output "$public_brand_root/assets/app.js" "$origin/assets/app.js"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 30 --header 'Cache-Control: no-cache' \
            --output "$public_brand_root/doc.html" "$origin/doc.html"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 30 --header 'Cache-Control: no-cache' \
            --output "$public_brand_root/report.html" "$origin/report.html"
          python3 -B scripts/check_public_brand.py "$public_brand_root"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 30 \
            --output "$RUNNER_TEMP/runtime-health-after.json" \
            "$origin/api/health?runtime-data=1"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = json.loads(Path("_release_validation/candidate/catalog.json").read_text(encoding="utf-8"))
          health = json.loads(Path(os.environ["RUNNER_TEMP"]).joinpath("runtime-health-after.json").read_text(encoding="utf-8"))
          runtime = health.get("runtime_data") or {}
          if health.get("ok") is not True:
              raise SystemExit("Portal health is not ok")
          if runtime.get("release_id") != os.environ["STATIC_RELEASE"]:
              raise SystemExit("Portal did not select the prepared runtime release")
          if runtime.get("catalog_versioned") is not True or runtime.get("rules_versioned") is not True:
              raise SystemExit("Portal did not verify the immutable runtime objects")
          if int(runtime.get("catalog_item_count") or 0) != len(expected.get("items") or []):
              raise SystemExit("Portal runtime catalog count does not match the prepared catalog")
          if str(runtime.get("catalog_updated_at_bjt") or "") != str(expected.get("updated_at_bjt") or ""):
              raise SystemExit("Portal runtime catalog version does not match the prepared catalog")
          if runtime.get("rules_loaded") is not True:
              raise SystemExit("Portal runtime rules did not load")
          print(f"portal_runtime_release={runtime['release_id']} catalog_items={runtime['catalog_item_count']}")
          PY

      - name: Roll back failed release or completed rehearsal
        id: edge_rollback
        if: >-
          ${{ always() &&
              steps.edge_deploy.outcome != 'skipped' &&
              (steps.release_acceptance.outcome != 'success' || needs.prepare_release.outputs.operation == 'rehearse') }}
        timeout-minutes: 5
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          workingDirectory: .neutral_edge_runtime
          command: rollback ${{ env.EDGE_PREVIOUS_VERSION_ID }} --message "Restore exact pre-release Edge version"
          wranglerVersion: "4.125.0"

      - name: Verify exact previous release after rollback
        id: rollback_acceptance
        if: ${{ always() && steps.edge_rollback.outcome == 'success' }}
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          EDGE_VERIFY_ATTEMPTS: "6"
          EDGE_VERIFY_CONSECUTIVE: "3"
        run: |
          set -euo pipefail
          python3 -B scripts/capture_edge_worker_deployment.py \
            --script-name "$EDGE_PRIVATE_SCRIPT_NAME" \
            --expect-version "$EDGE_PREVIOUS_VERSION_ID"
          origin="$LIVE_ORIGIN"
          restored=0
          for attempt in $(seq 1 8); do
            curl --fail --silent --show-error --max-redirs 0 \
              --connect-timeout 5 --max-time 15 --header 'Cache-Control: no-cache' \
              --output "$RUNNER_TEMP/rollback-edge-state.json" \
              "$origin/.well-known/edge-state" || true
            curl --fail --silent --show-error --max-redirs 0 \
              --connect-timeout 5 --max-time 60 --header 'Cache-Control: no-cache' \
              --output "$RUNNER_TEMP/rollback-public-catalog.json" \
              "$origin/data/catalog.json" || true
            if cmp _release_validation/previous/edge-state.json "$RUNNER_TEMP/rollback-edge-state.json" \
              && cmp _release_validation/previous/catalog.json "$RUNNER_TEMP/rollback-public-catalog.json"
            then
              restored=1
              break
            fi
            sleep 3
          done
          test "$restored" = 1
          EDGE_SCRIPT_NAME="$EDGE_PRIVATE_SCRIPT_NAME" python3 -B scripts/edge_route_cutover.py verify
          rollback_brand_root="$RUNNER_TEMP/public-brand-rollback"
          mkdir -p "$rollback_brand_root/assets"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 30 --header 'Cache-Control: no-cache' \
            --output "$rollback_brand_root/index.html" "$origin/"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 30 --header 'Cache-Control: no-cache' \
            --output "$rollback_brand_root/assets/app.js" "$origin/assets/app.js"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 30 --header 'Cache-Control: no-cache' \
            --output "$rollback_brand_root/doc.html" "$origin/doc.html"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 30 --header 'Cache-Control: no-cache' \
            --output "$rollback_brand_root/report.html" "$origin/report.html"
          python3 -B scripts/check_public_brand.py "$rollback_brand_root"
          curl --fail --silent --show-error --max-redirs 0 \
            --connect-timeout 5 --max-time 30 \
            --output "$RUNNER_TEMP/runtime-health-rollback.json" \
            "$origin/api/health?runtime-data=1"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = json.loads(Path("_release_validation/previous/catalog.json").read_text(encoding="utf-8"))
          health = json.loads(Path(os.environ["RUNNER_TEMP"]).joinpath("runtime-health-rollback.json").read_text(encoding="utf-8"))
          runtime = health.get("runtime_data") or {}
          if health.get("ok") is not True:
              raise SystemExit("Portal health is not ok after rollback")
          if runtime.get("release_id") != os.environ["PREVIOUS_STATIC_RELEASE"]:
              raise SystemExit("Portal did not return to the previous runtime release")
          if int(runtime.get("catalog_item_count") or 0) != len(expected.get("items") or []):
              raise SystemExit("Portal rollback catalog count does not match the previous catalog")
          if str(runtime.get("catalog_updated_at_bjt") or "") != str(expected.get("updated_at_bjt") or ""):
              raise SystemExit("Portal rollback catalog version does not match the previous catalog")
          if runtime.get("rules_loaded") is not True:
              raise SystemExit("Portal rollback rules did not load")
          print(f"portal_runtime_restored={runtime['release_id']} catalog_items={runtime['catalog_item_count']}")
          PY

      - name: Enforce transactional outcome
        if: always()
        run: |
          set -euo pipefail
          test "${{ steps.edge_deploy.outcome }}" = "success"
          test "${{ steps.release_acceptance.outcome }}" = "success"
          if [ "$NEUTRAL_OPERATION" = "rehearse" ]; then
            test "${{ steps.edge_rollback.outcome }}" = "success"
            test "${{ steps.rollback_acceptance.outcome }}" = "success"
          else
            test "${{ steps.edge_rollback.outcome }}" = "skipped"
          fi
