name: Neutral edge catalog refresh
run-name: Neutral edge catalog ${{ inputs.operation || 'scheduled refresh' }}

on:
  schedule:
    # UTC 01:30/05:30/09:30/13:30 = Asia/Shanghai 09:30/13:30/17:30/21:30.
    - cron: "30 1,5,9,13 * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: "Choose migrate or rollback"
        required: true
        type: choice
        options:
          - migrate
          - switch
          - rollback
          - inspect-source
        default: migrate

permissions:
  contents: write

concurrency:
  group: neutral-edge-hosting-cutover
  cancel-in-progress: false

jobs:
  edge:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate public source
        run: |
          set -euo pipefail
          python3 -B scripts/check_public_identity.py
          node --input-type=module --check < workers/edge-static-host/src/index.js
          node --input-type=module --check < workers/portal-suite-worker/src/index.js
          node --input-type=module --check < workers/portal-suite-worker/src/source-lead-adapter.js
          node --check portal_suite/site_src/assets/app.js
          node --check portal_suite/site_src/assets/report-chat.js
          node --check portal_suite/site_src/assets/charts.js
          node --check portal_suite/site_src/assets/site-runtime.js
          node --test workers/edge-static-host/test/index.test.mjs
          node --test portal_suite/tests/*.test.mjs
          node scripts/test_source_lead_adapter.js
          node scripts/test_portal_source_lead_integration.js
          node scripts/test_portal_chart_search_frontend.js
          node scripts/test_portal_site_runtime.js
          python3 -m py_compile scripts/edge_route_cutover.py
          python3 -m py_compile \
            scripts/build_chart_search_index.py \
            scripts/build_report_chat_index.py \
            scripts/chart_search_r2.py \
            scripts/merge_chart_search_index.py
          python3 scripts/test_build_report_chat_index.py
          python3 scripts/test_portal_seo.py
          python3 scripts/test_portal_blog_build.py
          python3 scripts/test_edge_route_cutover.py

      - name: Prepare masked runtime context
        env:
          PORTAL_SITE_URL: ${{ secrets.PORTAL_SITE_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          echo "::add-mask::$PORTAL_SITE_URL"
          echo "::add-mask::$R2_BUCKET"
          site_host="$(python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          parsed = urlsplit(os.environ["PORTAL_SITE_URL"])
          if parsed.scheme != "https" or not parsed.hostname or parsed.path not in {"", "/"}:
              raise SystemExit("Configured site URL is not a bare HTTPS origin")
          print(parsed.hostname)
          PY
          )"
          release_id="$(openssl rand -hex 16)"
          echo "::add-mask::$site_host"
          echo "::add-mask::$release_id"
          alias_hosts=""
          if [ "$(printf '%s' "$site_host" | awk -F. '{print NF}')" -eq 2 ] && [ "${site_host#www.}" = "$site_host" ]; then
            alias_hosts="www.$site_host"
            echo "::add-mask::$alias_hosts"
          fi
          printf 'SITE_HOST=%s\n' "$site_host" >> "$GITHUB_ENV"
          printf 'EDGE_ALIAS_HOSTS=%s\n' "$alias_hosts" >> "$GITHUB_ENV"
          printf 'STATIC_RELEASE=%s\n' "$release_id" >> "$GITHUB_ENV"

      - name: Install refresh dependencies
        if: github.event_name == 'schedule' || inputs.operation == 'migrate' || inputs.operation == 'inspect-source'
        run: >-
          python3 -m pip install --disable-pip-version-check
          "boto3>=1.34,<2" "pypdf>=4,<6" "requests>=2.31,<3" "Pillow>=10,<12"

      - name: Test Dropbox API retry handling
        if: github.event_name == 'schedule' || inputs.operation == 'migrate' || inputs.operation == 'inspect-source'
        run: python3 scripts/test_build_bank_report_catalog.py

      - name: Test chart search indexing
        if: github.event_name == 'schedule' || inputs.operation == 'migrate'
        run: python3 scripts/test_chart_search_index.py

      - name: Inspect source namespace visibility
        if: inputs.operation == 'inspect-source'
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re

          import requests

          token_response = requests.post(
              "https://api.dropboxapi.com/oauth2/token",
              data={"grant_type": "refresh_token", "refresh_token": os.environ["DROPBOX_REFRESH_TOKEN"]},
              auth=(os.environ["DROPBOX_APP_KEY"], os.environ["DROPBOX_APP_SECRET"]),
              timeout=60,
          )
          token_response.raise_for_status()
          token = token_response.json()["access_token"]
          auth_headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          account_response = requests.post(
              "https://api.dropboxapi.com/2/users/get_current_account",
              headers=auth_headers,
              data="null",
              timeout=60,
          )
          account_response.raise_for_status()
          root_info = account_response.json().get("root_info") or {}
          root_namespace = str(root_info.get("root_namespace_id") or "")
          home_namespace = str(root_info.get("home_namespace_id") or "")

          def list_dates(path_root):
              headers = dict(auth_headers)
              if path_root:
                  headers["Dropbox-API-Path-Root"] = json.dumps(
                      {".tag": "root", "root": path_root}, separators=(",", ":")
                  )
              response = requests.post(
                  "https://api.dropboxapi.com/2/files/list_folder",
                  headers=headers,
                  json={"path": "/zip_backup", "recursive": False, "include_deleted": False},
                  timeout=90,
              )
              if response.status_code == 409:
                  return False, []
              response.raise_for_status()
              payload = response.json()
              entries = list(payload.get("entries") or [])
              while payload.get("has_more"):
                  response = requests.post(
                      "https://api.dropboxapi.com/2/files/list_folder/continue",
                      headers=headers,
                      json={"cursor": payload["cursor"]},
                      timeout=90,
                  )
                  response.raise_for_status()
                  payload = response.json()
                  entries.extend(payload.get("entries") or [])
              dates = sorted(
                  (
                      str(entry.get("name") or "")
                      for entry in entries
                      if entry.get(".tag") == "folder" and re.fullmatch(r"\d{6,8}", str(entry.get("name") or ""))
                  ),
                  key=int,
                  reverse=True,
              )
              return True, dates

          default_found, default_dates = list_dates("")
          print(
              f"account_root_kind={root_info.get('.tag') or 'unknown'} "
              f"root_differs_from_home={root_namespace != home_namespace}"
          )
          print(
              f"default_path_found={default_found} default_date_count={len(default_dates)} "
              f"default_latest={','.join(default_dates[:10]) or 'none'}"
          )
          if root_namespace and root_namespace != home_namespace:
              root_found, root_dates = list_dates(root_namespace)
              print(
                  f"account_root_path_found={root_found} account_root_date_count={len(root_dates)} "
                  f"account_root_latest={','.join(root_dates[:10]) or 'none'}"
              )
          PY

      - name: Materialize private deployment profile
        if: github.event_name == 'schedule' || inputs.operation == 'migrate'
        env:
          PORTAL_PRIVATE_CONFIG_B64: ${{ secrets.PORTAL_PRIVATE_CONFIG_B64 }}
          PORTAL_PRIVATE_ASSET_KEY: ${{ secrets.PORTAL_PRIVATE_ASSET_KEY }}
          PORTAL_PRIVATE_PUBLISH_ASSET_KEY: ${{ secrets.PORTAL_PRIVATE_PUBLISH_ASSET_KEY }}
          PORTAL_SOCIAL_CARD_B64: ${{ secrets.PORTAL_SOCIAL_CARD_B64 }}
          PORTAL_SITE_URL: ${{ secrets.PORTAL_SITE_URL }}
        run: |
          set -euo pipefail
          echo "::add-mask::$PORTAL_SITE_URL"
          python3 scripts/render_private_config.py --github-add-mask
          python3 scripts/render_private_config.py \
            --root portal_suite/site_src \
            --root scripts/build_portal_suite_site.py \
            --root workers/portal-suite-worker/src/index.js
          bash scripts/materialize_private_assets.sh portal_suite/site_src
          test -s portal_suite/site_src/assets/contact-card.jpg
          test -n "$PORTAL_SOCIAL_CARD_B64"
          social_card="$RUNNER_TEMP/portal-social-card.jpg"
          printf '%s' "$PORTAL_SOCIAL_CARD_B64" | base64 --decode > "$social_card"
          test "$(od -An -tx1 -N3 "$social_card" | tr -d ' \n')" = "ffd8ff"
          test "$(wc -c < "$social_card")" -le 1048576
          install -m 0600 "$social_card" portal_suite/site_src/assets/social-card.jpg

      - name: Refresh report catalog and private PDF mirror
        id: catalog
        if: github.event_name == 'schedule' || inputs.operation == 'migrate'
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_OBJECT_PREFIX: ${{ vars.R2_OBJECT_PREFIX || 'reports' }}
        run: |
          set -euo pipefail
          test -s portal_suite/data/catalog.json
          test -s portal_suite/data/archive_catalog.json
          test -s portal_suite/data/history_catalog.json
          cp portal_suite/data/catalog.json "$RUNNER_TEMP/previous-portal-catalog.json"
          cp portal_suite/data/archive_catalog.json "$RUNNER_TEMP/previous-portal-archive-catalog.json"
          cp portal_suite/data/history_catalog.json "$RUNNER_TEMP/previous-portal-history-catalog.json"
          python3 scripts/portal_suite_catalog.py \
            --dropbox-root "/zip_backup" \
            --days 0 \
            --catalog-path "portal_suite/data/catalog.json" \
            --password-rules "portal_suite/password_rules.json" \
            --r2-prefix "$R2_OBJECT_PREFIX" \
            --storage-limit-gb 7 \
            --sync-r2

      - name: Translate missing report titles
        if: github.event_name == 'schedule' || inputs.operation == 'migrate'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
        run: |
          set -euo pipefail
          python3 scripts/translate_portal_titles.py \
            --catalog-path "portal_suite/data/catalog.json" \
            --model "$DEEPSEEK_MODEL" \
            --deepseek-base-url "$DEEPSEEK_BASE_URL" \
            --workers 500

      - name: Publish private Report Chat lookup index
        if: github.event_name == 'schedule' || inputs.operation == 'migrate'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          python3 scripts/build_report_chat_index.py \
            --catalog-path portal_suite/data/catalog.json \
            --output-dir "$RUNNER_TEMP/report-chat-index" \
            --upload-r2

      - name: Download private chart search index
        if: github.event_name == 'schedule' || inputs.operation == 'migrate'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python3 scripts/chart_search_r2.py download \
            --index _chart_search/index.json

      - name: Build private static release
        if: github.event_name == 'schedule' || inputs.operation == 'migrate'
        env:
          PORTAL_WORKER_URL: ${{ secrets.PORTAL_WORKER_URL }}
          PORTAL_DOWNLOAD_PASSWORD: ${{ secrets[vars.PORTAL_DOWNLOAD_SECRET_REF] }}
          PASSWORD_SECRET: ${{ secrets.PASSWORD_SECRET }}
        run: |
          set -euo pipefail
          echo "::add-mask::$PORTAL_WORKER_URL"
          if ! python3 scripts/build_portal_suite_site.py \
            --catalog-path portal_suite/data/catalog.json \
            --password-rules portal_suite/password_rules.json \
            --site-src portal_suite/site_src \
            --wechat-drafts-root wechat_drafts \
            --blog-archive-root portal_suite/data/blog_archive \
            --output-dir _neutral_site \
            --worker-base-url "$PORTAL_WORKER_URL" \
            >"$RUNNER_TEMP/static-build.log" 2>&1
          then
            echo "Static build failed" >&2
            exit 1
          fi
          python3 scripts/merge_chart_search_index.py \
            --search-index _neutral_site/data/search_index.json \
            --chart-index _chart_search/index.json \
            --catalog portal_suite/data/catalog.json \
            --chart-output _neutral_site/data/chart_search_index.json
          test -s _neutral_site/index.html
          test -s _neutral_site/assets/app.js
          test -s _neutral_site/data/catalog.json
          test -s _neutral_site/data/catalog_preview.json
          test -s _neutral_site/data/catalog_recommendations.json
          test -s _neutral_site/data/search_index.json
          test -s _neutral_site/data/chart_search_index.json
          test -s _neutral_site/data/password_rules.json
          test -s _neutral_site/reports/institutions/bernstein/index.html
          test -n "$(find _neutral_site/data/report_details -type f -name '*.json' -print -quit)"
          python3 - <<'PY'
          from pathlib import Path

          root = Path("_neutral_site")
          files = [path for path in root.rglob("*") if path.is_file() and not path.is_symlink()]
          total = sum(path.stat().st_size for path in files)
          if not 1000 <= len(files) <= 20000:
              raise SystemExit("Static file count is outside the expected range")
          if not 100_000_000 <= total <= 1_000_000_000:
              raise SystemExit("Static release size is outside the expected range")
          if any(path.is_symlink() for path in root.rglob("*")):
              raise SystemExit("Static release contains a symbolic link")
          placeholder = bytes(
              (112, 111, 114, 116, 97, 108, 46, 101, 120, 97, 109, 112, 108, 101, 46, 105, 110, 118, 97, 108, 105, 100)
          ).decode("ascii")
          blog_files = tuple((root / "blog").glob("*.html"))
          if not blog_files:
              raise SystemExit("Static release contains no Blog pages")
          leaked_blog_pages = [
              path.name
              for path in blog_files
              if placeholder in path.read_text(encoding="utf-8")
          ]
          if leaked_blog_pages:
              raise SystemExit(
                  f"Static Blog release retained the public host placeholder in {len(leaked_blog_pages)} page(s)"
              )
          print(f"static_files={len(files)} static_bytes={total}")
          PY

      - name: Upload immutable release to private object storage
        id: static_upload
        if: github.event_name == 'schedule' || inputs.operation == 'migrate'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import mimetypes
          import os
          import re
          import sys
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path

          import boto3
          from boto3.s3.transfer import TransferConfig
          from botocore.config import Config

          def main() -> None:
              root = Path("_neutral_site")
              release = os.environ["STATIC_RELEASE"].strip().lower()
              if len(release) != 32 or any(character not in "0123456789abcdef" for character in release):
                  raise RuntimeError
              prefix = f"edge-static/releases/{release}/"
              bucket = os.environ["R2_BUCKET"]
              account_id = os.environ["R2_ACCOUNT_ID"]
              client = boto3.client(
                  "s3",
                  endpoint_url=f"https://{account_id}.r2.cloudflarestorage.com",
                  aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
                  aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
                  region_name="auto",
                  config=Config(
                      signature_version="s3v4",
                      max_pool_connections=24,
                      retries={"max_attempts": 8, "mode": "adaptive"},
                  ),
              )
              transfer = TransferConfig(
                  multipart_threshold=16 * 1024 * 1024,
                  multipart_chunksize=16 * 1024 * 1024,
                  max_concurrency=10,
                  use_threads=True,
              )
              files = sorted(path for path in root.rglob("*") if path.is_file() and not path.is_symlink())
              uploaded: set[str] = set()
              total_bytes = 0

              def upload(path: Path) -> tuple[str, int]:
                  relative = path.relative_to(root).as_posix()
                  key = prefix + relative
                  content_type, content_encoding = mimetypes.guess_type(path.name)
                  suffix = path.suffix.lower()
                  extra: dict[str, str] = {
                      "ContentType": content_type or "application/octet-stream",
                      "CacheControl": (
                          "public, max-age=0, must-revalidate"
                          if suffix in {".html", ".json", ".xml", ".txt"}
                          else "public, max-age=3600"
                      ),
                  }
                  if content_encoding:
                      extra["ContentEncoding"] = content_encoding
                  client.upload_file(str(path), bucket, key, ExtraArgs=extra, Config=transfer)
                  return key, path.stat().st_size

              with ThreadPoolExecutor(max_workers=10) as executor:
                  futures = {executor.submit(upload, path): path for path in files}
                  for future in as_completed(futures):
                      key, size = future.result()
                      uploaded.add(key)
                      total_bytes += size

              if len(uploaded) != len(files):
                  raise RuntimeError

              catalog = json.loads((root / "data" / "catalog.json").read_text(encoding="utf-8"))
              report_id = next(
                  (str(item.get("id") or "") for item in catalog.get("items", []) if item.get("id")),
                  "",
              )
              if not report_id:
                  raise RuntimeError
              detail_prefix = re.sub(r"[^a-z0-9]", "_", report_id.lower())[:2].ljust(2, "_")
              required_release_paths = (
                  "reports/institutions/bernstein/index.html",
                  "b7c3e9a41d8f52e604a71bc93f2d6e80.txt",
                  f"data/report_details/{detail_prefix}.json",
                  "data/catalog_recommendations.json",
              )
              for relative in required_release_paths:
                  path = root / relative
                  if not path.is_file() or path.is_symlink() or path.stat().st_size <= 0:
                      raise RuntimeError
                  metadata = client.head_object(Bucket=bucket, Key=prefix + relative)
                  if int(metadata.get("ContentLength", -1)) != path.stat().st_size:
                      raise RuntimeError

              runtime_data = (
                  root / "data" / "catalog.json",
                  root / "data" / "search_index.json",
                  root / "data" / "password_rules.json",
              )
              for path in runtime_data:
                  key = f"edge-static/runtime-data/{path.name}"
                  client.upload_file(
                      str(path),
                      bucket,
                      key,
                      ExtraArgs={
                          "ContentType": "application/json",
                          "CacheControl": "no-store",
                      },
                      Config=transfer,
                  )
                  metadata = client.head_object(Bucket=bucket, Key=key)
                  if int(metadata.get("ContentLength", -1)) != path.stat().st_size:
                      raise RuntimeError
              print(
                  f"uploaded_files={len(uploaded)} uploaded_bytes={total_bytes} "
                  f"runtime_data_files={len(runtime_data)} "
                  f"verified_release_objects={len(required_release_paths)}"
              )

          try:
              main()
          except Exception:
              print("Static upload failed", file=sys.stderr)
              raise SystemExit(1) from None
          PY

      - name: Prepare neutral edge runtime
        if: github.event_name == 'schedule' || inputs.operation == 'migrate'
        env:
          PORTAL_PRIVATE_CONFIG_B64: ${{ secrets.PORTAL_PRIVATE_CONFIG_B64 }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          mkdir -p .neutral_edge_runtime
          cp workers/edge-static-host/src/index.js .neutral_edge_runtime/index.js
          cat > .neutral_edge_runtime/wrangler.toml <<EOF
          name = "svc-04df8d213b73"
          main = "index.js"
          compatibility_date = "2026-08-12"
          workers_dev = false
          preview_urls = false

          [cache]
          enabled = true

          [vars]
          STATIC_PREFIX = "edge-static/releases/$STATIC_RELEASE/"
          CANONICAL_HOST = "$SITE_HOST"

          [[r2_buckets]]
          binding = "STATIC_BUCKET"
          bucket_name = "$R2_BUCKET"

          [[services]]
          binding = "API"
          service = "portal-suite-worker"

          [observability]
          enabled = false
          EOF
          python3 scripts/render_private_config.py \
            --skip-generated-files \
            --root .neutral_edge_runtime/wrangler.toml

      - name: Deploy neutral edge runtime
        id: edge_deploy
        if: github.event_name == 'schedule' || inputs.operation == 'migrate'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          workingDirectory: .neutral_edge_runtime
          command: deploy
          wranglerVersion: "4.69.0"

      - name: Verify active edge routes
        if: github.event_name == 'schedule' || inputs.operation == 'migrate'
        env:
          EDGE_SCRIPT_NAME: svc-04df8d213b73
        run: python3 -B scripts/edge_route_cutover.py verify

      - name: Switch active edge routes
        if: inputs.operation == 'switch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EDGE_SCRIPT_NAME: svc-04df8d213b73
        run: python3 -B scripts/edge_route_cutover.py migrate

      - name: Purge previous public edge cache when permitted
        if: github.event_name == 'schedule' || inputs.operation == 'migrate'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EDGE_SCRIPT_NAME: svc-04df8d213b73
        run: python3 -B scripts/edge_route_cutover.py purge

      - name: Verify refreshed catalog is live
        if: github.event_name == 'schedule' || inputs.operation == 'migrate'
        env:
          PORTAL_SITE_URL: ${{ secrets.PORTAL_SITE_URL }}
        run: |
          set -euo pipefail
          echo "::add-mask::$PORTAL_SITE_URL"
          release_check="$PORTAL_SITE_URL/.well-known/edge-release/$STATIC_RELEASE"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --max-time 30 \
              "$release_check/data/catalog.json" \
              --output "$RUNNER_TEMP/live-catalog.json" \
              && curl --fail --silent --max-time 30 \
              "$release_check/data/catalog_preview.json" \
              --output "$RUNNER_TEMP/live-catalog-preview.json"
            then
              if python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = json.loads(Path("_neutral_site/data/catalog.json").read_text(encoding="utf-8"))
          expected_preview = json.loads(Path("_neutral_site/data/catalog_preview.json").read_text(encoding="utf-8"))
          actual = json.loads(Path(os.environ["RUNNER_TEMP"]).joinpath("live-catalog.json").read_text(encoding="utf-8"))
          actual_preview = json.loads(
              Path(os.environ["RUNNER_TEMP"]).joinpath("live-catalog-preview.json").read_text(encoding="utf-8")
          )

          def latest_date(catalog):
              return max((str(item.get("date_folder") or "") for item in catalog.get("items", [])), default="")

          def catalog_summary(catalog):
              return (
                  int(catalog.get("schema_version") or 0),
                  str(catalog.get("updated_at_bjt") or ""),
                  int(catalog.get("item_count") or 0),
                  latest_date(catalog),
              )

          def preview_summary(catalog):
              return (
                  int(catalog.get("schema_version") or 0),
                  str(catalog.get("updated_at_bjt") or ""),
                  int(catalog.get("item_count") or 0),
                  int(catalog.get("total_item_count") or 0),
                  latest_date(catalog),
              )

          def assert_aligned(label, catalog, preview):
              catalog_version = (
                  int(catalog.get("schema_version") or 0),
                  str(catalog.get("updated_at_bjt") or ""),
              )
              preview_version = (
                  int(preview.get("schema_version") or 0),
                  str(preview.get("updated_at_bjt") or ""),
              )
              if catalog_version != preview_version:
                  raise SystemExit(f"{label} catalog version mismatch")
              if int(preview.get("total_item_count") or 0) != int(catalog.get("item_count") or 0):
                  raise SystemExit(f"{label} catalog total mismatch")
              if latest_date(preview) != latest_date(catalog):
                  raise SystemExit(f"{label} catalog latest-date mismatch")
              if not 0 < int(preview.get("item_count") or 0) <= int(preview.get("total_item_count") or 0):
                  raise SystemExit(f"{label} catalog preview is empty or oversized")

          assert_aligned("local", expected, expected_preview)
          assert_aligned("live", actual, actual_preview)

          expected_summary = catalog_summary(expected)
          actual_summary = catalog_summary(actual)
          expected_preview_summary = preview_summary(expected_preview)
          actual_preview_summary = preview_summary(actual_preview)
          if actual_summary != expected_summary or actual_preview_summary != expected_preview_summary:
              raise SystemExit(1)
          print(
              f"live_catalog_date={actual_summary[3]} "
              f"live_catalog_items={actual_summary[2]} "
              f"live_catalog_updated={actual_summary[1]} "
              f"live_catalog_preview_items={actual_preview_summary[2]}"
          )
          PY
              then
                exit 0
              fi
            fi
            echo "Waiting for refreshed catalog ($attempt/18)"
            sleep 5
          done
          echo "Refreshed catalog did not become active in time." >&2
          exit 1

