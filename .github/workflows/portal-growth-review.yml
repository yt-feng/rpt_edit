name: Portal weekly growth review

on:
  schedule:
    - cron: "20 17 * * 0"
  workflow_dispatch:
    inputs:
      start_date:
        description: Optional Beijing start date (YYYY-MM-DD); provide with end_date
        required: false
        type: string
      end_date:
        description: Optional Beijing end date (YYYY-MM-DD); provide with start_date
        required: false
        type: string
      archive_context_only:
        description: Read up to four existing aggregate archives without scanning raw analytics
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: portal-weekly-growth-review
  cancel-in-progress: false

jobs:
  review:
    if: github.event_name == 'schedule' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows/portal-growth-review.yml
            scripts/archive_portal_growth_review.py
            scripts/summarize_portal_growth_range.py
            scripts/summarize_portal_member_cohort.py
            scripts/export_portal_growth_users.mjs
            scripts/portal_growth_users_r2_bridge.py
            scripts/render_private_config.py
            scripts/test_export_portal_growth_users.mjs
            scripts/test_portal_growth_users_r2_bridge.py
            scripts/test_summarize_portal_member_cohort.py
            scripts/test_summarize_portal_growth_range.py
            scripts/fixtures/portal_growth_review_legacy.json
            scripts/audit_portal_research_coverage.py
            scripts/build_portal_suite_site.py
            scripts/portal_discovery_quality.py
            scripts/portal_lazy_assets.py
            portal_suite/growth_actions.json
            workers/portal-suite-worker/src
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install private archive client
        run: python -m pip install --disable-pip-version-check --quiet boto3==1.40.1 requests==2.32.4

      - uses: actions/setup-node@v4
        if: ${{ !inputs.archive_context_only }}
        with:
          node-version: "22"

      - name: Verify read-only account and cohort contracts
        if: ${{ !inputs.archive_context_only }}
        run: |
          node --test scripts/test_export_portal_growth_users.mjs
          python -B scripts/test_portal_growth_users_r2_bridge.py
          python -B scripts/test_summarize_portal_growth_range.py
          python -B scripts/test_summarize_portal_member_cohort.py

      - name: Materialize canonical account role configuration
        if: ${{ !inputs.archive_context_only }}
        env:
          PORTAL_PRIVATE_CONFIG_B64: ${{ secrets.PORTAL_PRIVATE_CONFIG_B64 }}
        run: |
          python scripts/render_private_config.py --github-add-mask --skip-generated-files \
            --root workers/portal-suite-worker/src

      - name: Read complete current account access snapshot
        if: ${{ !inputs.archive_context_only }}
        env:
          ACCOUNT_STORE_MODE: supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          umask 077
          mkdir -p private-input
          node scripts/export_portal_growth_users.mjs --output private-input/current-users.json

      - name: Build aggregate growth review
        env:
          PORTAL_SITE_URL: ${{ secrets.PORTAL_SITE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          ARCHIVE_CONTEXT_ONLY: ${{ inputs.archive_context_only }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p private-input private-summary
          if [[ "${ARCHIVE_CONTEXT_ONLY}" == "true" ]]; then
            python scripts/summarize_portal_growth_range.py --archive-context-only --archive-context-limit 4 \
              --output private-summary/growth-review.json --markdown-output private-summary/growth-review.md
            exit 0
          fi
          python - <<'PY'
          import os
          import pathlib
          import urllib.request
          from urllib.parse import urlsplit

          configured = os.environ.get("PORTAL_SITE_URL", "").strip().rstrip("/")
          parsed = urlsplit(configured)
          if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password:
              raise SystemExit("PORTAL_SITE_URL must be a clean HTTPS origin")
          if parsed.path not in {"", "/"} or parsed.query or parsed.fragment:
              raise SystemExit("PORTAL_SITE_URL must not contain a path, query, or fragment")
          origin = f"{parsed.scheme}://{parsed.netloc}"
          print(f"::add-mask::{origin}")
          print(f"::add-mask::{parsed.hostname}")
          pathlib.Path("private-input/site-host.txt").write_text(parsed.hostname, encoding="utf-8")
          request = urllib.request.Request(
              f"{origin}/data/catalog.json",
              headers={"User-Agent": "portal-growth-review/1.0", "Accept": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              payload = response.read()
          pathlib.Path("private-input/catalog.json").write_bytes(payload)
          PY

          site_host="$(<private-input/site-host.txt)"
          date_args=(--auto-days 14)
          if [[ -n "${START_DATE}" || -n "${END_DATE}" ]]; then
            date_args=(--start-date "${START_DATE}" --end-date "${END_DATE}")
          fi
          python scripts/summarize_portal_growth_range.py \
            "${date_args[@]}" \
            --actions portal_suite/growth_actions.json \
            --catalog private-input/catalog.json \
            --site-host "${site_host}" \
            --min-count 2 \
            --users-snapshot private-input/current-users.json \
            --cohort-output private-summary/member-cohort.json \
            --cohort-markdown-output private-summary/member-cohort.md \
            --archive-context-output private-summary/previous-growth-reviews.json \
            --output private-summary/growth-review.json \
            --markdown-output private-summary/growth-review.md

      - name: Read research and chart index coverage
        if: ${{ !inputs.archive_context_only }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          python scripts/audit_portal_research_coverage.py \
            --catalog private-input/catalog.json \
            --output private-summary/research-coverage.json

      - name: Verify aggregate-only output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("private-summary/growth-review.json").read_text(encoding="utf-8"))
          forbidden_keys = {
              "visitor_id", "session_id", "ip_hash", "email", "query", "referrer", "user_agent"
          }
          def check(value):
              if isinstance(value, dict):
                  assert not forbidden_keys.intersection(value), "identifier field leaked into aggregate output"
                  for child in value.values():
                      check(child)
              elif isinstance(value, list):
                  for child in value:
                      check(child)
          check(report)
          assert report.get("privacy") and not any(report["privacy"].values())
          for name in ("member-cohort.json", "previous-growth-reviews.json", "research-coverage.json"):
              path = Path("private-summary", name)
              if not path.exists():
                  continue
              value = json.loads(path.read_text(encoding="utf-8"))
              check(value)
              if name != "research-coverage.json":
                  assert value.get("privacy") and not any(value["privacy"].values())
          PY

      - name: Archive aggregate review to private R2
        if: ${{ !inputs.archive_context_only }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          python scripts/archive_portal_growth_review.py \
            --json private-summary/growth-review.json \
            --markdown private-summary/growth-review.md

      - name: Publish authenticated run summary
        shell: bash
        run: |
          cat private-summary/growth-review.md >> "$GITHUB_STEP_SUMMARY"
          if [[ -f private-summary/member-cohort.md ]]; then
            cat private-summary/member-cohort.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove runner-local account snapshot
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          Path("private-input/current-users.json").unlink(missing_ok=True)
          PY

      - name: Upload short-lived aggregate review
        uses: actions/upload-artifact@v4
        with:
          name: portal-growth-review-${{ github.run_id }}
          path: |
            private-summary/growth-review.json
            private-summary/growth-review.md
            private-summary/research-coverage.json
            private-summary/member-cohort.json
            private-summary/member-cohort.md
            private-summary/previous-growth-reviews.json
          if-no-files-found: error
          retention-days: 1
