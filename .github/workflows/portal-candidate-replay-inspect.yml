name: Inspect approved candidate replay
on:
  workflow_dispatch:
    inputs:
      active_only:
        description: Inspect only the exact active approved batches; leave candidate inputs empty
        required: false
        type: boolean
        default: false
      generation:
        required: false
        type: string
      locale:
        required: false
        type: string
      candidate:
        required: false
        type: string
      active_release:
        required: true
        type: string
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --disable-pip-version-check 'boto3>=1.34,<2' 'requests>=2.31,<3'
      - name: Compare authenticated candidates without inference or writes
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          GENERATION: ${{ inputs.generation }}
          LOCALE: ${{ inputs.locale }}
          CANDIDATE: ${{ inputs.candidate }}
          ACTIVE_RELEASE: ${{ inputs.active_release }}
          ACTIVE_ONLY: ${{ inputs.active_only }}
        run: |
          set -euo pipefail
          mode=(--active-release "$ACTIVE_RELEASE")
          if [ "$ACTIVE_ONLY" = 'true' ]; then mode+=(--active-only); fi
          python3 -B scripts/inspect_portal_candidate_replay.py \
            --generation "$GENERATION" --locale "$LOCALE" \
            --candidate "$CANDIDATE" "${mode[@]}"
