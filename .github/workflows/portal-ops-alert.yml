name: Portal Suite operations alert

on:
  workflow_call:
    inputs:
      source_workflow:
        description: Workflow name shown in the operations email
        required: true
        type: string
      source_results:
        description: Concise failed workflow job results
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  send-email:
    if: ${{ vars.PORTAL_AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout alert client
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/render_private_config.py
            scripts/check_portal_ops_alert_window.py
            scripts/send_portal_ops_alert.py
            scripts/test_check_portal_ops_alert_window.py
            scripts/test_send_portal_ops_alert.py

      - name: Test public operations alert client
        run: |
          python -B scripts/test_check_portal_ops_alert_window.py
          python -B scripts/test_send_portal_ops_alert.py

      - name: Check 24-hour workflow health window
        id: alert-window
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_WORKFLOW: ${{ inputs.source_workflow }}
        run: |
          set -euo pipefail
          RUNS_FILE="$RUNNER_TEMP/portal-ops-recent-runs.json"
          if CURRENT_STARTED_AT="$(gh run view "$GITHUB_RUN_ID" \
               --repo "$GITHUB_REPOSITORY" \
               --json startedAt \
               --jq .startedAt)" && \
             gh run list \
               --repo "$GITHUB_REPOSITORY" \
               --workflow "$SOURCE_WORKFLOW" \
               --all \
               --limit 1000 \
               --json databaseId,status,conclusion,createdAt,startedAt \
               > "$RUNS_FILE"; then
            python -B scripts/check_portal_ops_alert_window.py \
              --runs-json "$RUNS_FILE" \
              --source-workflow "$SOURCE_WORKFLOW" \
              --current-run-id "$GITHUB_RUN_ID" \
              --current-started-at "$CURRENT_STARTED_AT" \
              >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Unable to read recent workflow history; suppressing the email alert."
            echo "should_alert=false" >> "$GITHUB_OUTPUT"
            echo "reason=history_query_failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize private alert runtime values
        if: steps.alert-window.outputs.should_alert == 'true'
        env:
          PORTAL_PRIVATE_CONFIG_B64: ${{ secrets.PORTAL_PRIVATE_CONFIG_B64 }}
        run: |
          python -B scripts/render_private_config.py \
            --root scripts/send_portal_ops_alert.py \
            --github-add-mask \
            --skip-generated-files

      - name: Send deduplicated Portal Suite operations email
        if: steps.alert-window.outputs.should_alert == 'true'
        env:
          OPS_ALERT_SIGNING_KEY: ${{ secrets.OPS_ALERT_SIGNING_KEY || secrets.PASSWORD_SECRET }}
          PORTAL_WORKER_URL: ${{ secrets.PORTAL_WORKER_URL }}
          SOURCE_WORKFLOW: ${{ inputs.source_workflow }}
          SOURCE_RESULTS: ${{ inputs.source_results }}
        run: |
          python scripts/send_portal_ops_alert.py \
            --subject "Portal workflow failed | $SOURCE_WORKFLOW" \
            --source-workflow "$SOURCE_WORKFLOW" \
            --workflow-results "$SOURCE_RESULTS" \
            --dedupe-key "${{ steps.alert-window.outputs.dedupe_key }}" \
            --severity critical
