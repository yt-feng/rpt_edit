name: Validate private locale R2 handoff
on:
  push:
    branches: [codex/locale-script-diagnostics-20260923]
    paths: [.github/workflows/locale-r2-validation.yml]
permissions:
  contents: read
concurrency:
  group: locale-r2-storage-validation
  cancel-in-progress: false
jobs:
  storage:
    if: github.event.repository.private == false && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.34,<2' 'opencc-python-reimplemented==0.1.7'
      - name: Verify a small non-sensitive diagnostic object inside the new locale prefix only
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          python - <<'PY'
          import json,os,sys
          sys.path.insert(0,'scripts')
          from compare_hymt_translation import require_actions
          from portal_global_r2 import client_from_env,put,get,PREFIX
          require_actions()
          client,bucket=client_from_env()
          key=PREFIX+'diagnostics/storage-roundtrip.json'
          body=json.dumps({'schema_version':1,'scope':'offline-locale-storage-check','production_mutated':False,'paid_translation_requests':0},sort_keys=True).encode()
          checksum=put(client,bucket,key,body,1024)
          assert get(client,bucket,key,1024)==body,'Storage readback mismatch'
          result={'storage':'cloudflare-r2','sha256_verified':True,'bytes':len(body),'production_mutated':False,'paid_translation_requests':0}
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:out.write('## Cloudflare R2 handoff verified\n```json\n'+json.dumps(result,indent=2)+'\n```\n')
          PY
