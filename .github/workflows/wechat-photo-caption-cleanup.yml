name: Clean generated photo notices from current WeChat drafts
run-name: WeChat photo notices ${{ inputs.apply && 'cleanup' || 'audit' }}

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Remove generated photo notices from existing editable drafts
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: wechat-existing-draft-images
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, wechat-draft]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            prompts
            requirements.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --retries 0 -r requirements.txt
      - name: Test caption removal and draft preservation
        run: |
          python scripts/test_wechat_editorial_images.py
          python scripts/test_wechat_media_contract.py
          python scripts/test_repair_wechat_draft_images.py
      - name: Clean or audit current draft photo notices
        env:
          WECHAT_MP_APPID: ${{ secrets.WECHAT_MP_APPID }}
          WECHAT_MP_APPSECRET: ${{ secrets.WECHAT_MP_APPSECRET }}
          APPLY: ${{ inputs.apply }}
        run: |
          OPTIONS=()
          if [ "$APPLY" = true ]; then OPTIONS+=(--apply); fi
          python scripts/repair_wechat_draft_images.py --current-drafts \
            --output _wechat_photo_cleanup "${OPTIONS[@]}"
      - name: Save counts and readback results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wechat-photo-cleanup-${{ github.run_id }}
          path: |
            _wechat_photo_cleanup/result.json
            _wechat_photo_cleanup/progress.json
          retention-days: 7
          if-no-files-found: warn
