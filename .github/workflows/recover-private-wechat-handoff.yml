name: Recover private WeChat handoff
run-name: Recover ${{ inputs.source }} ${{ inputs.date_folder }} from ${{ inputs.source_handoff_run_id }}

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Producer whose draft upload never started"
        required: true
        type: choice
        options: [institution, consulting]
      source_handoff_run_id:
        description: "Failed producer run that saved the private translated handoff"
        required: true
      date_folder:
        description: "Exact six-digit date in the saved handoff"
        required: true
      expected_count:
        description: "Exact number of completed translated articles in the source run"
        required: true

permissions:
  contents: write
  actions: read

# Share the original producer's lock, including different recovery dispatches.
concurrency:
  group: ${{ inputs.source == 'institution' && 'institution-latest-pdf-to-wechat' || 'consulting-latest-pdf-to-wechat' }}
  cancel-in-progress: false
  queue: max

jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, wechat-draft]
    timeout-minutes: 120
    env:
      SOURCE: ${{ inputs.source }}
      SOURCE_RUN_ID: ${{ inputs.source_handoff_run_id }}
      DATE_FOLDER: ${{ inputs.date_folder }}
      EXPECTED_COUNT: ${{ inputs.expected_count }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate original producer and skipped upload
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/recover_private_wechat_handoff.py validate-run \
            --source "$SOURCE" --source-run-id "$SOURCE_RUN_ID" \
            --date-folder "$DATE_FOLDER" --expected-count "$EXPECTED_COUNT"

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install boto3

      - name: Restore accepted WeChat draft receipts from this recovery attempt
        uses: ./.github/actions/restore-wechat-diagnostics
        with:
          submission-step-names: |
            Upload and read back recovered drafts
          name: recovered-wechat-drafts-${{ github.run_id }}
          path: .
          checkpoint-path: wechat_drafts/${{ steps.source.outputs.scope }}/${{ inputs.date_folder }}

      - name: Restore and validate exact private handoff and accepted receipts
        id: restore
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          python scripts/recover_private_wechat_handoff.py restore \
            --source "$SOURCE" --source-run-id "$SOURCE_RUN_ID" \
            --date-folder "$DATE_FOLDER" --expected-count "$EXPECTED_COUNT"

      - name: Materialize private publishing image
        env:
          PORTAL_PRIVATE_PUBLISH_ASSET_KEY: ${{ secrets.PORTAL_PRIVATE_PUBLISH_ASSET_KEY }}
        run: bash scripts/materialize_private_social_asset.sh prompts

      - name: Upload and read back recovered drafts
        id: upload
        env:
          WECHAT_MP_APPID: ${{ secrets.WECHAT_MP_APPID }}
          WECHAT_MP_APPSECRET: ${{ secrets.WECHAT_MP_APPSECRET }}
          PORTAL_SITE_URL: ${{ secrets.PORTAL_SITE_URL }}
          SCOPE: ${{ steps.source.outputs.scope }}
        run: |
          set -o pipefail
          python scripts/push_portal_translated_to_wechat_drafts.py \
            --translated-root "portal_translated_reports/$SCOPE" \
            --date-folder "$DATE_FOLDER" --output-root "wechat_drafts/$SCOPE" \
            --max-articles all --articles-per-draft 8 --max-body-chars 1200 \
            --min-inline-images 3 --max-inline-images 3 2>&1 | tee recovery_wechat_progress.log

      - name: Verify complete recovered WeChat delivery
        id: delivery
        env:
          WECHAT_MP_APPID: ${{ secrets.WECHAT_MP_APPID }}
          WECHAT_MP_APPSECRET: ${{ secrets.WECHAT_MP_APPSECRET }}
          PORTAL_SITE_URL: ${{ secrets.PORTAL_SITE_URL }}
          SCOPE: ${{ steps.source.outputs.scope }}
        run: |
          python scripts/institution_wechat_delivery_receipt.py \
            --output-dir "wechat_drafts/$SCOPE/$DATE_FOLDER" \
            --source-dir "portal_translated_reports/$SCOPE/$DATE_FOLDER" \
            --source-kind portal-translated --expected-count "$EXPECTED_COUNT" \
            --max-articles all --include-institutions all --exclude-institutions rand,brookings \
            --output "wechat_drafts/$SCOPE/$DATE_FOLDER/delivery_verification.json"

      - name: Save accepted draft receipts even after readback failure
        if: ${{ always() && steps.restore.outcome == 'success' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          python scripts/recover_private_wechat_handoff.py save-receipts \
            --source "$SOURCE" --source-run-id "$SOURCE_RUN_ID" \
            --date-folder "$DATE_FOLDER" --expected-count "$EXPECTED_COUNT"

      - name: Archive WeChat draft diagnostics
        if: ${{ always() && steps.upload.outcome != '' && steps.upload.outcome != 'skipped' }}
        uses: ./.github/actions/resilient-diagnostic-artifact
        with:
          name: recovered-wechat-drafts-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            wechat_drafts
            recovery_wechat_progress.log
          if-no-files-found: error
          retention-days: "14"
          required: "true"
          checkpoint-path: wechat_drafts/${{ steps.source.outputs.scope }}/${{ inputs.date_folder }}

      - name: Update public Blog archive
        run: |
          python scripts/update_blog_archive_from_wechat_drafts.py \
            --wechat-drafts-root wechat_drafts \
            --blog-archive-root portal_suite/data/blog_archive
          bash scripts/commit_output_dir.sh portal_suite/data/blog_archive \
            "Archive recovered $SOURCE Blog articles $DATE_FOLDER" 8 true
