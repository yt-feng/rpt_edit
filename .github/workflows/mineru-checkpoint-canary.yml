name: MinerU private checkpoint canary
run-name: Synthetic MinerU checkpoint CAS verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mineru-private-checkpoint-canary
  cancel-in-progress: false

jobs:
  conditional-writes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verified conditional-write SDK
        run: python -m pip install "boto3>=1.37.32,<2"
      - name: Verify conditional writes using synthetic private objects
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: python scripts/smoke_mineru_ledger.py --diagnostics-out _mineru-canary/result.json
      - name: Preserve bounded diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mineru-private-checkpoint-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: _mineru-canary/result.json
          if-no-files-found: error
          retention-days: 14
