name: Manually cache accepted MinerU ZIPs with short-lived exact-leaf authentication
run-name: Seed accepted MinerU results ${{ inputs.date_folder }} (${{ inputs.max_results }})
on:
  pull_request:
    paths:
      - .github/workflows/mineru-result-cache-seed.yml
      - scripts/seed_legacy_market_views_cache.py
      - scripts/test_seed_legacy_market_views_cache.py
      - scripts/seed_mineru_result_cache.py
      - scripts/test_seed_mineru_result_cache.py
      - scripts/intake_fresh_market_views_sources.py
      - scripts/test_intake_fresh_market_views_sources.py
  workflow_dispatch:
    inputs:
      source_kind:
        description: Durable tasks by default; legacy Daily or complete fresh archive intake require explicit opt-in
        required: true
        type: choice
        options: ['durable', 'legacy-daily', 'original-archive']
        default: durable
      source_run_id:
        description: Exact completed original Daily or original-archive producer run on main; no submissions
        required: true
        type: string
      date_folder:
        description: Exact original Dropbox source date, YYMMDD
        required: true
        type: string
      expected_articles:
        description: Exact complete original file count, including failed parses
        required: true
        type: string
      max_results:
        description: Cache one done-result canary or all done results after complete original validation
        required: true
        type: choice
        options: ['1', 'all']
        default: '1'
      recovery_run_id:
        description: Optional exact completed manual recovery producer whose already accepted children will be cached
        required: false
        type: string
        default: ''
      allowed_error_hashes:
        description: Explicitly reviewed provider failure-message SHA256 hashes as a JSON array; required for child mode
        required: false
        type: string
        default: '[]'
      expected_manifest_sha256:
        description: Expected complete original PDF artifact manifest hash; required for child mode
        required: false
        type: string
        default: ''
      legacy_artifact_id:
        description: Optional exact original selected-PDF artifact ID for legacy Daily mode only
        required: false
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: mineru-result-cache-seed-${{ inputs.source_run_id }}-${{ inputs.date_folder }}
  cancel-in-progress: false
jobs:
  offline-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --disable-pip-version-check requests certifi 'urllib3>=2.2,<3' Pillow PyMuPDF
      - run: python3 -B scripts/test_seed_legacy_market_views_cache.py
      - run: python3 -B scripts/test_seed_mineru_result_cache.py
      - run: python3 -B scripts/test_intake_fresh_market_views_sources.py
  seed:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Initialize cache-only diagnostic
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'mineru-result-cache-seed-summary.json').write_text(json.dumps({
              'schema_version': 1, 'success': False, 'category': 'prerequisites_incomplete',
              'complete_source_handoff': False, 'production_acceptance': False, 'pipeline_restored': False,
              'provider_posts': 0, 'model_calls': 0, 'pdf_count': 0,
          }) + '\n')
          PY
      - name: Install isolated cache and certificate authentication dependencies
        run: python3 -m pip install --retries 0 --disable-pip-version-check requests certifi 'urllib3>=2.2,<3' Pillow PyMuPDF 'boto3>=1.37.32,<2'
      - name: Require an explicit source opt-in without mixing recovery authorizations
        env:
          SOURCE_KIND: ${{ inputs.source_kind }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          ALLOWED_ERROR_HASHES: ${{ inputs.allowed_error_hashes }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
          LEGACY_ARTIFACT_ID: ${{ inputs.legacy_artifact_id }}
        run: |
          python3 - <<'PY'
          import json, os
          kind = os.environ['SOURCE_KIND']
          if kind not in {'durable', 'legacy-daily', 'original-archive'}:
              raise SystemExit('Cache source-kind validation rejected.')
          if kind == 'legacy-daily' and (os.environ['RECOVERY_RUN_ID'] or os.environ['EXPECTED_MANIFEST_SHA256']
                                        or json.loads(os.environ['ALLOWED_ERROR_HASHES']) != []):
              raise SystemExit('Legacy tasks cannot mix durable child authorization.')
          if kind == 'durable' and os.environ['LEGACY_ARTIFACT_ID']:
              raise SystemExit('Durable tasks cannot use a legacy artifact override.')
          if kind == 'original-archive' and os.environ['LEGACY_ARTIFACT_ID']:
              raise SystemExit('Archive tasks cannot use a legacy artifact override.')
          PY
      - name: Authenticate completed original archive producer before GET-only restore
        if: ${{ inputs.source_kind == 'original-archive' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          DATE_FOLDER: ${{ inputs.date_folder }}
          EXPECTED_ARTICLES: ${{ inputs.expected_articles }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          ALLOWED_ERROR_HASHES: ${{ inputs.allowed_error_hashes }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from archive_market_views_originals import check_restore_producer, context
          from mineru_pinned_result_transport import require_before_cutoff, require_cloud_manual
          from seed_mineru_result_cache import child_authorization, check_recovery_producer
          try:
              require_cloud_manual()
              require_before_cutoff()
              run = os.environ['SOURCE_RUN_ID']
              if not re.fullmatch(r'[1-9][0-9]{0,19}', run) or not re.fullmatch(r'[1-9][0-9]{0,3}', os.environ['EXPECTED_ARTICLES']):
                  raise ValueError('source_input')
              response = subprocess.run(['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run}"],
                                        capture_output=True, text=True, timeout=30, check=False)
              if response.returncode or len(response.stdout.encode()) > 1_000_000:
                  raise ValueError('producer_unavailable')
              producer = json.loads(response.stdout)
              sha = producer.get('head_sha')
              check_restore_producer(producer, run, os.environ['GITHUB_REPOSITORY'], sha)
              context(run, os.environ['DATE_FOLDER'], sha, '')
              child_mode = child_authorization(os.environ['RECOVERY_RUN_ID'],
                  json.loads(os.environ['ALLOWED_ERROR_HASHES']), os.environ['EXPECTED_MANIFEST_SHA256'])
              if not child_mode and os.environ['EXPECTED_MANIFEST_SHA256']:
                  raise ValueError('archive_child_authorization')
              Path(os.environ['RUNNER_TEMP'], 'mineru-cache-archive-producer.json').write_text(response.stdout)
              Path(os.environ['RUNNER_TEMP'], 'mineru-cache-archive-sha.txt').write_text(sha)
              if child_mode:
                  recovery_run = os.environ['RECOVERY_RUN_ID']
                  response = subprocess.run(['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{recovery_run}"],
                                            capture_output=True, text=True, timeout=30, check=False)
                  if response.returncode or len(response.stdout.encode()) > 1_000_000:
                      raise ValueError('recovery_producer_unavailable')
                  check_recovery_producer(json.loads(response.stdout), recovery_run, os.environ['GITHUB_REPOSITORY'], os.environ['DATE_FOLDER'])
                  Path(os.environ['RUNNER_TEMP'], 'mineru-cache-recovery-producer.json').write_text(response.stdout)
          except Exception:
              raise SystemExit('Cache-only archive producer validation rejected.')
          PY
      - name: Restore complete original archive with GET-only exact receipt and PDF hashes
        if: ${{ inputs.source_kind == 'original-archive' }}
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          DATE_FOLDER: ${{ inputs.date_folder }}
          EXPECTED_ARTICLES: ${{ inputs.expected_articles }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          ARCHIVE_SHA="$(cat "$RUNNER_TEMP/mineru-cache-archive-sha.txt")"
          python3 -B scripts/archive_market_views_originals.py restore \
            --run-id "$SOURCE_RUN_ID" --date-folder "$DATE_FOLDER" --execution-sha "$ARCHIVE_SHA" \
            --expected-reports "$EXPECTED_ARTICLES" --repository "$GITHUB_REPOSITORY" \
            --producer-json "$RUNNER_TEMP/mineru-cache-archive-producer.json" \
            --destination "$RUNNER_TEMP/mineru-cache-archive-originals"
      - name: Read complete immutable intake roots and seed archive results without submission
        if: ${{ inputs.source_kind == 'original-archive' }}
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          DATE_FOLDER: ${{ inputs.date_folder }}
          EXPECTED_ARTICLES: ${{ inputs.expected_articles }}
          MAX_RESULTS: ${{ inputs.max_results }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          ALLOWED_ERROR_HASHES: ${{ inputs.allowed_error_hashes }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
          MINER_U: ${{ secrets.MINER_U }}
          MINER_U_2: ${{ secrets.MINER_U_2 }}
          MINER_U_3: ${{ secrets.MINER_U_3 }}
          MINER_U_4: ${{ secrets.MINER_U_4 }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          EXTRA_ARGS=()
          if [ -n "$RECOVERY_RUN_ID" ]; then
            EXTRA_ARGS+=(--recovery-producer-json "$RUNNER_TEMP/mineru-cache-recovery-producer.json")
          fi
          python3 -B scripts/seed_mineru_result_cache.py --source-kind original-archive \
            --input-dir "$RUNNER_TEMP/mineru-cache-archive-originals" \
            --producer-json "$RUNNER_TEMP/mineru-cache-archive-producer.json" \
            --source-run-id "$SOURCE_RUN_ID" --date-folder "$DATE_FOLDER" \
            --expected-reports "$EXPECTED_ARTICLES" --max-results "$MAX_RESULTS" \
            --recovery-run-id "$RECOVERY_RUN_ID" --allowed-error-hashes "$ALLOWED_ERROR_HASHES" \
            --expected-manifest-sha256 "$EXPECTED_MANIFEST_SHA256" "${EXTRA_ARGS[@]}" \
            --summary "$RUNNER_TEMP/mineru-result-cache-seed-summary.json"
      - name: Authenticate exact completed original Daily producer before source download
        if: ${{ inputs.source_kind == 'durable' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          DATE_FOLDER: ${{ inputs.date_folder }}
          EXPECTED_ARTICLES: ${{ inputs.expected_articles }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          ALLOWED_ERROR_HASHES: ${{ inputs.allowed_error_hashes }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from mineru_pinned_result_transport import require_before_cutoff, require_cloud_manual
          from recover_durable_mineru_sources import check_producer, exact_date
          from seed_mineru_result_cache import child_authorization, check_recovery_producer, decode
          try:
              require_cloud_manual()
              require_before_cutoff()
              run = os.environ['SOURCE_RUN_ID']
              if not re.fullmatch(r'[1-9][0-9]{0,19}', run):
                  raise ValueError('source_run')
              exact_date(os.environ['DATE_FOLDER'])
              if not re.fullmatch(r'[1-9][0-9]{0,3}', os.environ['EXPECTED_ARTICLES']):
                  raise ValueError('source_count')
              child_mode = child_authorization(os.environ['RECOVERY_RUN_ID'],
                  decode(os.environ['ALLOWED_ERROR_HASHES'].encode()), os.environ['EXPECTED_MANIFEST_SHA256'])
              response = subprocess.run(['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run}"],
                                        capture_output=True, text=True, timeout=30, check=False)
              if response.returncode or len(response.stdout.encode()) > 1_000_000:
                  raise ValueError('producer_unavailable')
              producer = json.loads(response.stdout)
              check_producer(producer, run, os.environ['GITHUB_REPOSITORY'])
              if producer.get('status') != 'completed' or producer.get('conclusion') not in {'success', 'failure'}:
                  raise ValueError('producer_not_completed')
              Path(os.environ['RUNNER_TEMP'], 'mineru-cache-original-producer.json').write_text(response.stdout)
              if child_mode:
                  recovery_run = os.environ['RECOVERY_RUN_ID']
                  response = subprocess.run(['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{recovery_run}"],
                                            capture_output=True, text=True, timeout=30, check=False)
                  if response.returncode or len(response.stdout.encode()) > 1_000_000:
                      raise ValueError('recovery_producer_unavailable')
                  check_recovery_producer(decode(response.stdout.encode()), recovery_run, os.environ['GITHUB_REPOSITORY'], os.environ['DATE_FOLDER'])
                  Path(os.environ['RUNNER_TEMP'], 'mineru-cache-recovery-producer.json').write_text(response.stdout)
          except Exception:
              raise SystemExit('Cache-only original producer validation rejected.')
          PY
      - name: Download the exact complete original Daily PDF artifact
        if: ${{ inputs.source_kind == 'durable' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          name: selected-macro-pdfs-${{ inputs.source_run_id }}
          path: _selected_macro_pdfs
      - name: Read accepted tasks and seed fully verified done ZIPs without new parsing submissions
        if: ${{ inputs.source_kind == 'durable' }}
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          DATE_FOLDER: ${{ inputs.date_folder }}
          EXPECTED_ARTICLES: ${{ inputs.expected_articles }}
          MAX_RESULTS: ${{ inputs.max_results }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          ALLOWED_ERROR_HASHES: ${{ inputs.allowed_error_hashes }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
          MINER_U: ${{ secrets.MINER_U }}
          MINER_U_2: ${{ secrets.MINER_U_2 }}
          MINER_U_3: ${{ secrets.MINER_U_3 }}
          MINER_U_4: ${{ secrets.MINER_U_4 }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          EXTRA_ARGS=()
          if [ -n "$RECOVERY_RUN_ID" ]; then
            EXTRA_ARGS+=(--recovery-producer-json "$RUNNER_TEMP/mineru-cache-recovery-producer.json")
          fi
          python3 -B scripts/seed_mineru_result_cache.py \
            --input-dir _selected_macro_pdfs \
            --producer-json "$RUNNER_TEMP/mineru-cache-original-producer.json" \
            --source-run-id "$SOURCE_RUN_ID" --date-folder "$DATE_FOLDER" \
            --expected-reports "$EXPECTED_ARTICLES" --max-results "$MAX_RESULTS" \
            --recovery-run-id "$RECOVERY_RUN_ID" --allowed-error-hashes "$ALLOWED_ERROR_HASHES" \
            --expected-manifest-sha256 "$EXPECTED_MANIFEST_SHA256" "${EXTRA_ARGS[@]}" \
            --summary "$RUNNER_TEMP/mineru-result-cache-seed-summary.json"
      - name: Authenticate whole legacy Daily originals and every accepted retry before cache-only result reads
        if: ${{ inputs.source_kind == 'legacy-daily' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          DATE_FOLDER: ${{ inputs.date_folder }}
          EXPECTED_ARTICLES: ${{ inputs.expected_articles }}
          MAX_RESULTS: ${{ inputs.max_results }}
          LEGACY_ARTIFACT_ID: ${{ inputs.legacy_artifact_id }}
          MINER_U: ${{ secrets.MINER_U }}
          MINER_U_2: ${{ secrets.MINER_U_2 }}
          MINER_U_3: ${{ secrets.MINER_U_3 }}
          MINER_U_4: ${{ secrets.MINER_U_4 }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          python3 -B scripts/seed_legacy_market_views_cache.py \
            --source-run-id "$SOURCE_RUN_ID" --date-folder "$DATE_FOLDER" \
            --expected-reports "$EXPECTED_ARTICLES" --max-results "$MAX_RESULTS" \
            --artifact-id "$LEGACY_ARTIFACT_ID" \
            --summary "$RUNNER_TEMP/mineru-result-cache-seed-summary.json"
      - name: Preserve sanitized cache-only authentication diagnostic
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mineru-result-cache-seed-${{ github.run_id }}
          path: ${{ runner.temp }}/mineru-result-cache-seed-summary.json
          if-no-files-found: warn
          retention-days: 7
