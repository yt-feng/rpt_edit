name: Compare strict MinerU result TLS clients
run-name: Compare strict clients and public TLS certificate chains at the MinerU result CDN
on:
  pull_request:
    paths:
      - .github/workflows/mineru-result-tls-probe.yml
      - scripts/probe_mineru_result_tls.py
      - scripts/test_probe_mineru_result_tls.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --disable-pip-version-check --retries 0 requests certifi
      - run: python3 -B scripts/test_probe_mineru_result_tls.py
  probe:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --disable-pip-version-check --retries 0 requests certifi
      - name: Compare two strict HEAD clients and two independent strict TLS handshakes
        run: python3 -B scripts/probe_mineru_result_tls.py
      - name: Preserve only sanitized trust comparison and public chain metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mineru-result-tls-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/mineru-result-tls-probe.json
          if-no-files-found: warn
          retention-days: 14
