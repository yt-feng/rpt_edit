name: Reportify Grab

# On-demand authorized full PDF download. The Portal Suite Worker
# fires this via repository_dispatch (event type "reportify-grab") when a user clicks
# a gated report. The grabbed PDF is mirrored to R2 at reportify/<id>.pdf, where the
# Worker's GET /reportify/pdf?id=<id> serves it on the next request.
on:
  repository_dispatch:
    types: [reportify-grab]
  workflow_dispatch:
    inputs:
      report_id:
        description: "Reportify report id (numeric, e.g. 1264649995240476672)"
        required: true
        type: string

permissions:
  contents: read

# Avoid duplicate grabs of the same report racing each other.
concurrency:
  group: reportify-grab-${{ github.event.client_payload.id || github.event.inputs.report_id }}
  cancel-in-progress: false

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve report id
        id: resolve
        env:
          REPORT_ID: ${{ github.event.client_payload.id || github.event.inputs.report_id }}
        run: |
          ID="$REPORT_ID"
          if ! printf '%s' "$ID" | grep -qE '^[0-9]{6,25}$'; then
            echo "Invalid report id: '$ID'" >&2
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 "pypdf>=4,<6"

      - name: Verify authorized PDF acquisition
        run: python -m unittest discover -s scripts -p 'test_reportify_api_grab.py' -v

      - name: Mark preparation running
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET || 'portal-suite-pdfs' }}
        run: |
          python scripts/mark_reportify_pdf_status.py \
            --id "${{ steps.resolve.outputs.id }}" \
            --status running

      - name: Grab reportify PDF
        env:
          REPORTIFY_COOKIE_HEADER: ${{ secrets.REPORTIFY_COOKIE_HEADER || secrets.REPORTIFY_COOKIE || '' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET || 'portal-suite-pdfs' }}
        run: |
          python scripts/reportify_pdf_grabber.py \
            --url "https://reportify.cn/reports/${{ steps.resolve.outputs.id }}" \
            --output "/tmp/${{ steps.resolve.outputs.id }}.pdf" \
            --result-json "/tmp/${{ steps.resolve.outputs.id }}.result.json" \
            --session-from-r2

      - name: Upload PDF to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET || 'portal-suite-pdfs' }}
        run: |
          python scripts/upload_reportify_pdf_to_r2.py \
            --id "${{ steps.resolve.outputs.id }}" \
            --pdf "/tmp/${{ steps.resolve.outputs.id }}.pdf" \
            --result-json "/tmp/${{ steps.resolve.outputs.id }}.result.json"

      - name: Mark preparation ready
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET || 'portal-suite-pdfs' }}
        run: |
          python scripts/mark_reportify_pdf_status.py \
            --id "${{ steps.resolve.outputs.id }}" \
            --status ready \
            --result-json "/tmp/${{ steps.resolve.outputs.id }}.result.json"

      - name: Mark preparation failed
        if: ${{ failure() && steps.resolve.outputs.id != '' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET || 'portal-suite-pdfs' }}
        run: |
          python scripts/mark_reportify_pdf_status.py \
            --id "${{ steps.resolve.outputs.id }}" \
            --status failed \
            --result-json "/tmp/${{ steps.resolve.outputs.id }}.result.json" \
            --message "Background preparation failed"
