name: Locale implementation diagnostics
on:
  push:
    branches: [codex/global-offline-locales-20260923]
    paths: [.github/workflows/locale-implementation-diagnostics.yml]
permissions:
  contents: read
concurrency:
  group: locale-implementation-repair
  cancel-in-progress: false
jobs:
  repair:
    if: github.event.repository.private == false && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact reviewed source corrections
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/hymt_offline_translation.py');s=p.read_text()
          marker='def validate_result(source: str, result: str, source_language: str, target: str,\n'
          extra='''def _restore_protected_link_spacing(source: str, result: str) -> str:
              """Canonicalize whitespace around an exact source-owned link token only.
          
              Destination identity, delimiters and occurrence counts still have to pass
              validate_result. Never reconstruct missing tokens or change visible text.
              """
              for left, right in (("(", ")"), ("[", "]")):
                  pattern = r"\\]" + re.escape(left) + r"(__HYMTPH_\\d+__)" + re.escape(right)
                  for token in set(re.findall(pattern, source)):
                      spaced = r"\\]" + re.escape(left) + r"[ \\t]*" + re.escape(token) + r"[ \\t]*" + re.escape(right)
                      result = re.sub(spaced, lambda _m: "]" + left + token + right, result)
              return result
          
          
          def _space_protected_tokens(source: str, *, markdown: bool) -> str:
              """Keep prose token boundaries explicit without changing link syntax."""
              result = re.sub(r'(__(?:KC_PH|HYMTPH)_\\d+__)', r' \\1 ', source)
              return _restore_protected_link_spacing(source, result) if markdown else result
          
          
          '''
          assert s.count(marker)==1 and 'def _space_protected_tokens' not in s
          s=s.replace(marker,extra+marker)
          before="EXTENDED_ADAPTER_REVISION = 'global-native-target-v2'"
          assert s.count(before)==1
          s=s.replace(before,"EXTENDED_ADAPTER_REVISION = 'global-native-target-v3-link-boundaries'")
          before="model_input = re.sub(r'(__(?:KC_PH|HYMTPH)_\\d+__)', r' \\1 ', masked)"
          assert s.count(before)==1
          s=s.replace(before,'model_input = _space_protected_tokens(masked, markdown=markdown)')
          before='value = _restore_table_edges(masked, value)\n                validate_result'
          assert s.count(before)==1
          s=s.replace(before,'value = _restore_table_edges(masked, value)\n                    value = _restore_protected_link_spacing(masked, value)\n                validate_result')
          p.write_text(s)
          Path('scripts/portal_global_build_support.py').write_text('''"""Bounded in-memory acceleration for public candidate preparation only."""
          from functools import lru_cache
          
          
          def cache_metadata_normalization(builder):
              """Memoize pure short-string normalization; never retain full report bodies."""
              original = builder.normalize_search_text
              cached = lru_cache(maxsize=32768)(original)
          
              def normalize(value):
                  text = str(value or "")
                  return cached(text) if len(text) <= 1000 else original(text)
          
              builder.normalize_search_text = normalize
              return cached
          ''')
          p=Path('scripts/prepare_portal_global_locales.py');s=p.read_text()
          before="               'b.SITE_BASE_URL=sys.argv.pop(1); raise SystemExit(b.main())', site_url,"
          after="               'from portal_global_build_support import cache_metadata_normalization; '\n               'cache_metadata_normalization(b); '\n"+before
          assert s.count(before)==1 and 'timeout=300)' in s
          p.write_text(s.replace(before,after).replace('timeout=300)','timeout=900)'))
          Path('scripts/test_portal_global_build_support.py').write_text('''"""Regressions for exact normalization caching and protected link spacing."""
          import tempfile
          import unittest
          from types import SimpleNamespace
          from unittest import mock
          import hymt_offline_translation as h
          from portal_global_build_support import cache_metadata_normalization
          
          class GlobalBuildSupportTests(unittest.TestCase):
              def test_bounded_cache_preserves_normalization_and_does_not_cache_body(self):
                  fn=mock.Mock(side_effect=lambda s: s.casefold())
                  builder=SimpleNamespace(normalize_search_text=fn)
                  cached=cache_metadata_normalization(builder)
                  self.assertEqual(builder.normalize_search_text('ABC'),'abc')
                  self.assertEqual(builder.normalize_search_text('ABC'),'abc')
                  self.assertEqual(fn.call_count,1)
                  builder.normalize_search_text('X'*1001);builder.normalize_search_text('X'*1001)
                  self.assertEqual(fn.call_count,3)
                  self.assertEqual(cached.cache_info().maxsize,32768)
          
              def test_spaces_in_prose_not_in_destinations(self):
                  text='研究__KC_PH_000__：[报告](__HYMTPH_0000__)。'
                  value=h._space_protected_tokens(text,markdown=True)
                  self.assertIn('研究 __KC_PH_000__ ',value)
                  self.assertIn('](__HYMTPH_0000__)',value)
          
              def test_exact_link_whitespace_repair_keeps_valid_url_and_cached_form(self):
                  source='阅读[报告](https://example.org/r.pdf)。'
                  engine=SimpleNamespace(translate=mock.Mock(return_value='Read [Report]( __HYMTPH_0000__ ).'))
                  with tempfile.TemporaryDirectory() as directory:
                      translator=h.OfflineTranslator(cache_dir=directory,engine_factory=lambda *_:engine)
                      self.assertEqual(translator.translate(source,'en','zh'),'Read [Report](https://example.org/r.pdf).')
                      self.assertEqual(translator.translate(source,'en','zh'),'Read [Report](https://example.org/r.pdf).')
                      self.assertEqual(engine.translate.call_count,1)
                      self.assertIn('](__HYMTPH_0000__)',engine.translate.call_args.args[0])
          
              def test_repairs_cannot_invent_missing_destination_or_accept_extra_content(self):
                  source='报告：[Report](__HYMTPH_0000__)。'
                  for bad in ('Read [Report](other __HYMTPH_0000__ ).',
                              'Read [Report] __HYMTPH_0000__.',
                              'Read [Report]( __HYMTPH_0001__ ).',
                              'Read [Report]( __HYMTPH_0000__ ). [Again]( __HYMTPH_0000__ ).'):
                      with self.subTest(bad=bad), self.assertRaises(h.OfflineTranslationValidationError):
                          h.validate_result(source,h._restore_protected_link_spacing(source,bad),'zh','en')
          
              def test_source_without_link_keeps_token_spacing_and_rejects_added_link(self):
                  source='阅读__HYMTPH_0000__。'
                  value='Read [Report]( __HYMTPH_0000__ ).'
                  self.assertEqual(h._restore_protected_link_spacing(source,value),value)
                  with self.assertRaises(h.OfflineTranslationValidationError):h.validate_result(source,value,'zh','en')
          
          if __name__=='__main__':unittest.main()
          ''')
          PY
      - name: Run complete related structural regressions without paid credentials
        run: |
          set -euo pipefail
          python -m pip install requests Pillow 'opencc-python-reimplemented==0.1.7'
          python -B scripts/test_portal_global_build_support.py
          python -B scripts/test_portal_global_locales.py
          python -B scripts/test_hymt_offline_translation.py
          python -B scripts/test_financial_quantity_integrity.py
          git diff --check
          mkdir -p /tmp/public-python-dependency
          python -m pip download --no-deps 'opencc-python-reimplemented==0.1.7' -d /tmp/public-python-dependency
      - name: Commit only verified source changes to implementation branch
        run: |
          set -euo pipefail
          git add scripts/hymt_offline_translation.py scripts/prepare_portal_global_locales.py scripts/portal_global_build_support.py scripts/test_portal_global_build_support.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve protected link boundaries and accelerate public source preparation'
          git push origin HEAD:refs/heads/codex/global-offline-locales-20260923
      - uses: actions/upload-artifact@v4
        with:
          name: public-python-dependency
          path: /tmp/public-python-dependency
          retention-days: 1
