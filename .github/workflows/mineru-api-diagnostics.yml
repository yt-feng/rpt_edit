name: Diagnose MinerU API and saved results
run-name: Read-only MinerU API diagnostics from inspection ${{ inputs.inspection_run_id }}
on:
  pull_request:
    paths:
      - .github/workflows/mineru-api-diagnostics.yml
      - scripts/diagnose_mineru_api.py
      - scripts/test_diagnose_mineru_api.py
  workflow_dispatch:
    inputs:
      inspection_run_id:
        description: Exact producer of the existing private inspection receipt
        type: string
        required: true
        default: '37160198464'
      inspection_attempt:
        description: Exact inspection attempt
        type: string
        required: true
        default: '1'
      input_sha256:
        description: Canonical input SHA-256 of that verified inspection
        type: string
        required: true
        default: ece9b3164c1bc7ca2a99e07ca6ef1a3b93396f196f27d7b08141424322d34bd8
      receipt_sha256:
        description: Exact private receipt SHA-256
        type: string
        required: true
        default: 0bc3bc20b57d520056109123c6ba50a76ca8a6486bd20b4c4bd75c3340fbc369
      stream_probe:
        description: Read only four ZIP prefix bytes after a successful TLS HEAD probe
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: mineru-api-diagnostics-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -B scripts/test_diagnose_mineru_api.py
  diagnose:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --disable-pip-version-check --retries 0 'boto3>=1.37.32,<2'
      - name: Read verified cached responses and probe API authentication and result transport
        env:
          INSPECTION_RUN_ID: ${{ inputs.inspection_run_id }}
          INSPECTION_ATTEMPT: ${{ inputs.inspection_attempt }}
          INPUT_SHA256: ${{ inputs.input_sha256 }}
          RECEIPT_SHA256: ${{ inputs.receipt_sha256 }}
          STREAM_PROBE: ${{ inputs.stream_probe }}
          MINER_U: ${{ secrets.MINER_U }}
          MINER_U_2: ${{ secrets.MINER_U_2 }}
          MINER_U_3: ${{ secrets.MINER_U_3 }}
          MINER_U_4: ${{ secrets.MINER_U_4 }}
          MINER_U_EXPIRES_AT: ${{ vars.MINER_U_EXPIRES_AT }}
          MINER_U_2_EXPIRES_AT: ${{ vars.MINER_U_2_EXPIRES_AT }}
          MINER_U_3_EXPIRES_AT: ${{ vars.MINER_U_3_EXPIRES_AT }}
          MINER_U_4_EXPIRES_AT: ${{ vars.MINER_U_4_EXPIRES_AT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: python3 -B scripts/diagnose_mineru_api.py
      - name: Preserve only the sanitized diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mineru-api-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/mineru-api-diagnostics.json
          if-no-files-found: warn
          retention-days: 14
