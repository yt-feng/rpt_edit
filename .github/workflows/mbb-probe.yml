name: MBB probe (temporary)

# Temporary diagnostic: characterize McKinsey / Bain / BCG insights pages (HTML vs
# SPA, PDF links, feeds, sitemaps) so we can build the consulting adapter. Delete
# once MBB is wired up.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install curl_cffi
      - name: Probe MBB insight pages
        run: |
          python - <<'PY'
          import re
          from curl_cffi import requests as cr

          urls = [
              "https://www.mckinsey.com/featured-insights",
              "https://www.mckinsey.com/mgi/our-research",
              "https://www.bain.com/insights/",
              "https://www.bcg.com/publications",
          ]
          for u in urls:
              print("=" * 74)
              try:
                  r = cr.get(u, impersonate="chrome", timeout=40, allow_redirects=True)
                  html = r.text
              except Exception as e:
                  print("ERR", u, e); continue
              print(u, r.status_code, r.headers.get("content-type", "")[:30], "len", len(html))
              pdfs = sorted(set(re.findall(r'(?:href|content)="([^"]+\.pdf[^"]*)"', html, re.I)))
              print("  pdf links:", len(pdfs))
              for p in pdfs[:5]:
                  print("    ", p)
              arts = sorted(set(re.findall(r'href="(/[^"]*(?:insights|publications|our-research|mgi)[^"]*)"', html, re.I)))
              print("  article-ish links:", len(arts))
              for a in arts[:6]:
                  print("    ", a)
              feed = re.search(r'<link[^>]+application/(?:rss|atom)\+xml[^>]+href="([^"]+)"', html, re.I)
              print("  __NEXT_DATA__:", "__NEXT_DATA__" in html, "| declared feed:", feed.group(1) if feed else None)

          for dom in ["www.mckinsey.com", "www.bain.com", "www.bcg.com"]:
              try:
                  r = cr.get(f"https://{dom}/sitemap.xml", impersonate="chrome", timeout=40, allow_redirects=True)
                  body = r.text
                  locs = re.findall(r"<loc>([^<]+)</loc>", body)
                  print("SITEMAP", dom, r.status_code, "len", len(body), "locs", len(locs), "first", (locs[0] if locs else body[:80].replace(chr(10), " ")))
              except Exception as e:
                  print("SITEMAP ERR", dom, e)
          PY
