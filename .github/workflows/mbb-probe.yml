name: MBB probe (temporary)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install curl_cffi
      - name: Search-engine PDF discovery probe
        run: |
          python - <<'PY'
          import re
          from urllib.parse import quote, unquote
          from curl_cffi import requests as cr

          domains = {
              "bcg": "bcg.com",
              "mckinsey": "mckinsey.com",
              "bain": "bain.com",
          }

          def extract_pdfs(text):
              out = []
              for m in re.findall(r'https?%3a%2f%2f[^\s"\'<>()]+?\.pdf', text, re.I):
                  out.append(unquote(m))
              for m in re.findall(r'https?://[^\s"\'<>()]+?\.pdf(?:\?[^\s"\'<>()]*)?', text, re.I):
                  out.append(m)
              # de-dup, drop search-engine internal
              seen, res = set(), []
              for u in out:
                  u = u.replace("&amp;", "&")
                  if any(b in u for b in ("bing.com", "duckduckgo.com", "google.com", "gstatic", "w3.org")):
                      continue
                  if u not in seen:
                      seen.add(u); res.append(u)
              return res

          def bing(q):
              url = "https://www.bing.com/search?q=" + quote(q) + "&count=30&setlang=en&cc=us"
              r = cr.get(url, impersonate="chrome", timeout=40)
              return r.status_code, len(r.text), extract_pdfs(r.text)

          def ddg(q):
              url = "https://html.duckduckgo.com/html/?q=" + quote(q)
              r = cr.get(url, impersonate="chrome", timeout=40, headers={"Referer": "https://duckduckgo.com/"})
              return r.status_code, len(r.text), extract_pdfs(r.text)

          for key, d in domains.items():
              q = f"site:{d} filetype:pdf"
              print("=" * 70, "\n", key, "::", q)
              try:
                  st, ln, pdfs = bing(q); print(f"  BING {st} len{ln} pdfs={len(pdfs)}"); [print("    ", p) for p in pdfs[:6]]
              except Exception as e:
                  print("  BING ERR", e)
              try:
                  st, ln, pdfs = ddg(q); print(f"  DDG  {st} len{ln} pdfs={len(pdfs)}"); [print("    ", p) for p in pdfs[:6]]
              except Exception as e:
                  print("  DDG ERR", e)

          # Can we download a BCG asset PDF directly via curl_cffi?
          test = "http://media-publications.bcg.com/pdf/Your-Strategy-Needs-a-Strategy-chapter-01.pdf"
          try:
              r = cr.get(test, impersonate="chrome", timeout=40)
              ok = r.content[:5] == b"%PDF-"
              print("DOWNLOAD test", test, r.status_code, "is_pdf", ok, "bytes", len(r.content))
          except Exception as e:
              print("DOWNLOAD ERR", e)
          PY
