name: Verify admitted Institution originals
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install requests pypdf==6.19.0 'boto3>=1.37.32,<2'
      - name: Read pending original registry and verify all three byte identities
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: python3 -B scripts/probe_institution_admitted_originals.py --output "$RUNNER_TEMP/institution-admitted-originals.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: institution-admitted-originals-${{ github.run_id }}
          path: ${{ runner.temp }}/institution-admitted-originals.json
          if-no-files-found: error
          retention-days: 7
