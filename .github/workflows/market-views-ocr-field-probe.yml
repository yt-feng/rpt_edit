name: Probe original Market Views OCR numeric fields
run-name: Market Views OCR field probe ${{ inputs.date_folder }}
on:
  workflow_dispatch:
    inputs:
      source_kind:
        description: Default Daily artifact, or explicitly restore a verified private original archive
        required: true
        type: choice
        options:
          - daily
          - original-archive
        default: daily
      source_run_id:
        description: Completed main producer run for the selected source kind
        required: true
        type: string
      date_folder:
        description: Exact original Dropbox date, YYMMDD
        required: true
        type: string
      expected_articles:
        description: Exact original PDF file count, including duplicate aliases
        required: true
        type: string
      fixture_json:
        description: Schema-1 numeric checks with ID, source SHA, page, expected literal and point bbox
        required: false
        type: string
        default: ''
      page_probe_json:
        description: Archive-only schema-1 pages with source_ordinal and page; diagnostic counts, without golden acceptance
        required: false
        type: string
        default: ''
      retain_private_evidence:
        description: Preserve one archive page's existing OCR candidates and pixels in private R2 for diagnosis only
        required: false
        type: boolean
        default: false
      archive_original_source_run_id:
        description: Original Daily ID bound by the archive receipt; empty for a fresh Dropbox archive
        required: false
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: market-views-ocr-field-probe-${{ inputs.source_run_id }}-${{ inputs.date_folder }}
  cancel-in-progress: false
jobs:
  probe:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Initialize sanitized probe-only diagnostic
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'market-views-ocr-field-probe.json').write_text(json.dumps({
              'schema': 1, 'success': False, 'category': 'prerequisites_incomplete',
              'page_probe_only': True, 'complete_source_handoff': False, 'production_acceptance': False,
              'provider_post_count': 0, 'model_call_count': 0, 'pdf_count': 0, 'r2_source_admission_count': 0,
          }) + '\n', encoding='utf-8')
          PY
      - name: Install actual cloud OCR engines and language models
        env:
          SOURCE_KIND: ${{ inputs.source_kind }}
        run: |
          python -m pip install PyMuPDF Pillow
          if [ "$SOURCE_KIND" = "original-archive" ]; then python -m pip install requests "boto3>=1.37.32,<2"; fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim
          TESSDATA_DIR="$(tesseract --list-langs 2>/dev/null | sed -n '1s/.*"\(.*\)".*/\1/p')"
          test -n "$TESSDATA_DIR"
          test -f "$TESSDATA_DIR/eng.traineddata"
          test -f "$TESSDATA_DIR/chi_sim.traineddata"
          echo "TESSDATA_PREFIX=$TESSDATA_DIR" >> "$GITHUB_ENV"
      - name: Validate bounded fixtures and exact original Daily producer
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          DATE_FOLDER: ${{ inputs.date_folder }}
          EXPECTED_ARTICLES: ${{ inputs.expected_articles }}
          FIXTURE_JSON: ${{ inputs.fixture_json }}
          PAGE_PROBE_JSON: ${{ inputs.page_probe_json }}
          SOURCE_KIND: ${{ inputs.source_kind }}
          ARCHIVE_ORIGINAL_SOURCE_RUN_ID: ${{ inputs.archive_original_source_run_id }}
          RETAIN_PRIVATE_EVIDENCE: ${{ inputs.retain_private_evidence }}
        run: |
          python - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import probe_market_views_ocr_fields as probe
          from audit_market_views_ocr_receipt import write_summary
          temporary = Path(os.environ['RUNNER_TEMP'])
          summary = temporary / 'market-views-ocr-field-probe.json'
          try:
              probe.validate_inputs(os.environ['DATE_FOLDER'], os.environ['SOURCE_RUN_ID'],
                                    probe.positive_count(os.environ['EXPECTED_ARTICLES']))
              kind = os.environ['SOURCE_KIND']
              if kind not in {'daily', 'original-archive'}:
                  raise probe.ProbeError('invalid_source_kind')
              fixture_raw, page_raw = os.environ['FIXTURE_JSON'], os.environ['PAGE_PROBE_JSON']
              if bool(fixture_raw) == bool(page_raw):
                  raise probe.ProbeError('exactly_one_probe_request_required')
              if kind == 'daily' and (page_raw or os.environ['ARCHIVE_ORIGINAL_SOURCE_RUN_ID']):
                  raise probe.ProbeError('page_diagnostics_require_original_archive')
              retain_private = os.environ['RETAIN_PRIVATE_EVIDENCE'] == 'true'
              if retain_private and (kind != 'original-archive' or not page_raw):
                  raise probe.ProbeError('private_evidence_requires_single_archive_page')
              raw = fixture_raw or page_raw
              if len(raw.encode('utf-8')) > probe.FIXTURE_BYTE_LIMIT:
                  raise probe.ProbeError('fixture_input_size_exceeded')
              fixtures = temporary / 'market-views-ocr-field-fixtures.json'
              fixtures.write_text(raw, encoding='utf-8')
              if fixture_raw:
                  probe.read_checks(fixtures)
              else:
                  checks = probe.read_page_checks(fixtures)
                  if retain_private and len(checks) != 1:
                      raise probe.ProbeError('private_evidence_requires_single_page')
              response = subprocess.run(['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['SOURCE_RUN_ID']}"],
                                        text=True, capture_output=True, check=False, timeout=60)
              if response.returncode != 0:
                  raise probe.ProbeError('original_daily_metadata_unavailable')
              metadata = temporary / 'market-views-original-daily.json'
              metadata.write_text(response.stdout, encoding='utf-8')
              probe.verify_producer(metadata, os.environ['SOURCE_RUN_ID'], source_kind=kind,
                                    repository=os.environ['GITHUB_REPOSITORY'])
          except probe.ProbeError as exc:
              write_summary(summary, probe.failure_summary(str(exc)), source_dir=Path('_selected_macro_pdfs'))
              raise SystemExit('OCR field probe prerequisite validation rejected.')
          except Exception:
              write_summary(summary, probe.failure_summary('producer_metadata_failed'), source_dir=Path('_selected_macro_pdfs'))
              raise SystemExit('OCR field probe producer verification failed.')
          PY
      - name: Download exact original Daily selected-PDF artifact
        if: ${{ inputs.source_kind == 'daily' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          name: selected-macro-pdfs-${{ inputs.source_run_id }}
          path: _selected_macro_pdfs
      - name: Restore the exact complete private original archive using only R2 reads
        if: ${{ inputs.source_kind == 'original-archive' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          DATE_FOLDER: ${{ inputs.date_folder }}
          EXPECTED_ARTICLES: ${{ inputs.expected_articles }}
          ARCHIVE_ORIGINAL_SOURCE_RUN_ID: ${{ inputs.archive_original_source_run_id }}
        run: |
          ARCHIVE_EXECUTION_SHA="$(python -c 'import json,os; from pathlib import Path; print(json.loads(Path(os.environ["RUNNER_TEMP"], "market-views-original-daily.json").read_text())["head_sha"])')"
          python scripts/archive_market_views_originals.py restore \
            --destination "$RUNNER_TEMP/market-views-originals" \
            --run-id "$SOURCE_RUN_ID" --date-folder "$DATE_FOLDER" \
            --execution-sha "$ARCHIVE_EXECUTION_SHA" --expected-reports "$EXPECTED_ARTICLES" \
            --original-source-run-id "$ARCHIVE_ORIGINAL_SOURCE_RUN_ID" \
            --producer-json "$RUNNER_TEMP/market-views-original-daily.json" --repository "$GITHUB_REPOSITORY"
      - name: Probe only requested original pages and numeric fields
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          DATE_FOLDER: ${{ inputs.date_folder }}
          EXPECTED_ARTICLES: ${{ inputs.expected_articles }}
          SOURCE_KIND: ${{ inputs.source_kind }}
          PAGE_PROBE_JSON: ${{ inputs.page_probe_json }}
          ARCHIVE_ORIGINAL_SOURCE_RUN_ID: ${{ inputs.archive_original_source_run_id }}
          RETAIN_PRIVATE_EVIDENCE: ${{ inputs.retain_private_evidence }}
        run: |
          INPUT_DIR=_selected_macro_pdfs
          REQUEST_ARGS=(--fixtures "$RUNNER_TEMP/market-views-ocr-field-fixtures.json")
          if [ "$SOURCE_KIND" = "original-archive" ]; then INPUT_DIR="$RUNNER_TEMP/market-views-originals"; fi
          if [ -n "$PAGE_PROBE_JSON" ]; then REQUEST_ARGS=(--page-checks "$RUNNER_TEMP/market-views-ocr-field-fixtures.json"); fi
          if [ "$RETAIN_PRIVATE_EVIDENCE" = true ]; then REQUEST_ARGS+=(--private-evidence-dir "$RUNNER_TEMP/market-views-ocr-private-evidence"); fi
          python scripts/probe_market_views_ocr_fields.py \
            --input-dir "$INPUT_DIR" \
            --manifest "$INPUT_DIR/selected_to_process_manifest.json" \
            "${REQUEST_ARGS[@]}" \
            --producer-metadata "$RUNNER_TEMP/market-views-original-daily.json" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-kind "$SOURCE_KIND" --repository "$GITHUB_REPOSITORY" \
            --original-source-run-id "$ARCHIVE_ORIGINAL_SOURCE_RUN_ID" \
            --date-folder "$DATE_FOLDER" \
            --expected-articles "$EXPECTED_ARTICLES" \
            --summary "$RUNNER_TEMP/market-views-ocr-field-probe.json"
      - name: Preserve requested single-page OCR evidence only in private R2
        if: ${{ always() && inputs.retain_private_evidence && inputs.source_kind == 'original-archive' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
          DATE_FOLDER: ${{ inputs.date_folder }}
        run: |
          PRIVATE_DIR="$RUNNER_TEMP/market-views-ocr-private-evidence"
          if [ -f "$PRIVATE_DIR/ocr-evidence.json" ] && [ -f "$PRIVATE_DIR/page.png" ]; then
            python scripts/private_workflow_handoff.py upload-dir \
              --source "$PRIVATE_DIR" \
              --key "_private-workflow-handoff/ocr-probe-evidence/$GITHUB_RUN_ID/$DATE_FOLDER/page-evidence.tar.gz"
          else
            echo 'Private OCR evidence unavailable; original probe result is unchanged.'
          fi
      - name: Preserve only sanitized probe diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: market-views-ocr-field-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/market-views-ocr-field-probe.json
          if-no-files-found: warn
          retention-days: 7
