name: Research news summary snapshot

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-news-snapshot
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/research-news-refresh.yml
            scripts/build_research_news_snapshot.py
            scripts/test_research_news_snapshot.py
            scripts/build_report_chat_index.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test snapshot boundaries
        run: python -B scripts/test_research_news_snapshot.py
      - name: Install R2 client
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Capture descriptions and verify private snapshot
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
          PYTHONUNBUFFERED: '1'
        run: python -B scripts/build_research_news_snapshot.py --lookback-minutes 75 --publish
