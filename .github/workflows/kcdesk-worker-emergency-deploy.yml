name: KCdesk Worker Emergency Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kcdesk-worker-emergency-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout Worker source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            workers/kc-desk-notes-worker/src/index.js
            kc_desk_notes/site_src/assets/app.js
            scripts/test_kcdesk_legacy_access_compat.js

      - name: Validate legacy access compatibility
        run: |
          node --check workers/kc-desk-notes-worker/src/index.js
          node --check kc_desk_notes/site_src/assets/app.js
          node scripts/test_kcdesk_legacy_access_compat.js

      - name: Prepare Cloudflare Worker config
        env:
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET || vars.R2_BUCKET || 'kc-desk-notes-pdfs' }}
          R2_OBJECT_PREFIX: ${{ vars.R2_OBJECT_PREFIX || 'reports' }}
          NEWSFEED_EMAIL_PROVIDER: ${{ vars.NEWSFEED_EMAIL_PROVIDER || 'cloudflare' }}
          OPS_ALERT_EMAIL: ${{ secrets.OPS_ALERT_EMAIL || vars.OPS_ALERT_EMAIL || '' }}
        run: |
          cat > workers/kc-desk-notes-worker/wrangler.toml <<EOF
          name = "kc-desk-notes-worker"
          main = "src/index.js"
          compatibility_date = "2026-05-01"

          [vars]
          ACCOUNT_STORE_MODE = "supabase"
          R2_OBJECT_PREFIX = "$R2_OBJECT_PREFIX"
          CATALOG_URL = "https://kcdesk.com/data/catalog.json"
          SEARCH_INDEX_URL = "https://kcdesk.com/data/search_index.json"
          PASSWORD_RULES_URL = "https://kcdesk.com/data/password_rules.json"
          ALLOWED_ORIGIN = "https://kcdesk.com"
          GH_REPO = "$GITHUB_REPOSITORY"
          NEWSFEED_EMAIL_PROVIDER = "$NEWSFEED_EMAIL_PROVIDER"
          OPS_ALERT_EMAIL = "$OPS_ALERT_EMAIL"

          [triggers]
          crons = [
            "*/30 * * * *",
            "*/10 17-18 * * *",
            "*/10 23 * * *",
            "*/10 0-3 * * *",
            "*/10 5-6 * * *"
          ]

          [[r2_buckets]]
          binding = "REPORT_BUCKET"
          bucket_name = "$R2_BUCKET_NAME"
          EOF
          if [ "$NEWSFEED_EMAIL_PROVIDER" = "cloudflare" ]; then
            cat >> workers/kc-desk-notes-worker/wrangler.toml <<EOF

          [[send_email]]
          name = "EMAIL"
          EOF
          fi

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        env:
          PASSWORD_SECRET: ${{ secrets.PASSWORD_SECRET }}
          CALC_KEY: ${{ secrets.CALC_KEY }}
          MASTER_KEY: ${{ secrets.KC_DESK_MASTER_KEY || secrets.KC_DESK_DOWNLOAD_PASSWORD }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || secrets.PASSWORD_SECRET || 'unconfigured' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'unconfigured' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'unconfigured' }}
          PADDLE_ENV: ${{ secrets.PADDLE_ENV || vars.PADDLE_ENV || 'production' }}
          PADDLE_CLIENT_TOKEN: ${{ secrets.PADDLE_CLIENT_TOKEN || vars.PADDLE_CLIENT_TOKEN || 'unconfigured' }}
          PADDLE_PRICE_CNY_CENT: ${{ secrets.PADDLE_PRICE_CNY_CENT || vars.PADDLE_PRICE_CNY_CENT || 'unconfigured' }}
          PADDLE_PRICE_REPORT_CNY_CENT: ${{ secrets.PADDLE_PRICE_REPORT_CNY_CENT || vars.PADDLE_PRICE_REPORT_CNY_CENT || 'unconfigured' }}
          PADDLE_PRICE_YEARLY: ${{ secrets.PADDLE_PRICE_YEARLY || vars.PADDLE_PRICE_YEARLY || 'unconfigured' }}
          PADDLE_WEBHOOK_SECRET: ${{ secrets.PADDLE_WEBHOOK_SECRET || 'unconfigured' }}
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN || secrets.GH_DISPATCH_TOKEN || 'unconfigured' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || 'unconfigured' }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
          NEWSFEED_EMAIL_FROM: ${{ secrets.NEWSFEED_EMAIL_FROM || vars.NEWSFEED_EMAIL_FROM || 'KC Desk Newsfeed <newsfeed@kcdesk.com>' }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY || 'unconfigured' }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL || vars.BREVO_SENDER_EMAIL || 'unconfigured' }}
          BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME || vars.BREVO_SENDER_NAME || 'KC Desk Newsfeed' }}
          CLOUDFLARE_EMAIL_ROUTING_API_TOKEN: ${{ secrets.CLOUDFLARE_EMAIL_ROUTING_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN || 'unconfigured' }}
          CLOUDFLARE_EMAIL_ROUTING_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_EMAIL_ROUTING_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID || 'unconfigured' }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN || 'unconfigured' }}
          OPS_ALERT_SIGNING_KEY: ${{ secrets.OPS_ALERT_SIGNING_KEY || secrets.PASSWORD_SECRET || 'unconfigured' }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID || '8182ec40eab8c484e11ebf5d6a516fbd' }}
          workingDirectory: workers/kc-desk-notes-worker
          command: deploy
          secrets: |
            PASSWORD_SECRET
            CALC_KEY
            MASTER_KEY
            AUTH_SECRET
            SUPABASE_URL
            SUPABASE_SERVICE_ROLE_KEY
            PADDLE_ENV
            PADDLE_CLIENT_TOKEN
            PADDLE_PRICE_CNY_CENT
            PADDLE_PRICE_REPORT_CNY_CENT
            PADDLE_PRICE_YEARLY
            PADDLE_WEBHOOK_SECRET
            GH_READ_TOKEN
            DEEPSEEK_API_KEY
            DEEPSEEK_BASE_URL
            DEEPSEEK_MODEL
            NEWSFEED_EMAIL_FROM
            BREVO_API_KEY
            BREVO_SENDER_EMAIL
            BREVO_SENDER_NAME
            CLOUDFLARE_EMAIL_ROUTING_API_TOKEN
            CLOUDFLARE_EMAIL_ROUTING_ACCOUNT_ID
            GH_DISPATCH_TOKEN
            OPS_ALERT_SIGNING_KEY
