# Foundation integration complete; this workflow never deploys or receives storage credentials.
name: Extended locales offline checks
on:
  pull_request:
    paths:
      - 'scripts/*extended*'
      - 'scripts/*english_commentary*'
      - 'scripts/*english_ui*'
      - 'scripts/*english_pipeline*'
      - 'scripts/*english_publication*'
      - 'scripts/*english_handoff*'
      - 'scripts/build_portal_locale_resume_workflow.py'
      - 'scripts/*resume_portal_locale_candidate*'
      - 'scripts/test_portal_locale_resume_workflow.py'
      - 'portal_suite/locale_assets/english-commentary.*'
      - 'portal_suite/site_src/assets/app.js'
      - 'portal_suite/locale_assets/extended-locales.*'
      - 'scripts/*hymt*'
      - 'scripts/*financial_quantity_integrity*'
      - '.github/actions/setup-offline-translation/action.yml'
      - 'workers/edge-static-host/**'
      - 'workers/portal-suite-worker/src/english-commentary.js'
      - 'workers/portal-suite-worker/src/index.js'
      - 'portal_suite/tests/english-commentary*.mjs'
      - '.github/workflows/portal-extended-locales-check.yml'
      - '.github/workflows/portal-extended-locales-r2.yml'
      - '.github/workflows/portal-extended-continuation-inspect.yml'
      - '.github/workflows/portal-extended-recovery-intent.yml'
      - '.github/workflows/portal-extended-locales-source.yml'
      - '.github/workflows/neutral-edge-cutover.yml'
      - '.github/workflows/neutral-locale-resume.yml'
  push:
    branches: [main, codex/extended-locales-r2-20260924]
    paths:
      - 'scripts/*extended*'
      - 'scripts/*english_commentary*'
      - 'scripts/*english_ui*'
      - 'scripts/*english_pipeline*'
      - 'scripts/*english_publication*'
      - 'scripts/*english_handoff*'
      - 'scripts/build_portal_locale_resume_workflow.py'
      - 'scripts/*resume_portal_locale_candidate*'
      - 'scripts/test_portal_locale_resume_workflow.py'
      - 'portal_suite/locale_assets/english-commentary.*'
      - 'portal_suite/site_src/assets/app.js'
      - 'portal_suite/locale_assets/extended-locales.*'
      - 'scripts/*hymt*'
      - 'scripts/*financial_quantity_integrity*'
      - '.github/actions/setup-offline-translation/action.yml'
      - 'workers/edge-static-host/**'
      - 'workers/portal-suite-worker/src/english-commentary.js'
      - 'workers/portal-suite-worker/src/index.js'
      - 'portal_suite/tests/english-commentary*.mjs'
      - '.github/workflows/portal-extended-locales-check.yml'
      - '.github/workflows/portal-extended-locales-r2.yml'
      - '.github/workflows/portal-extended-continuation-inspect.yml'
      - '.github/workflows/portal-extended-recovery-intent.yml'
      - '.github/workflows/portal-extended-locales-source.yml'
      - '.github/workflows/neutral-edge-cutover.yml'
      - '.github/workflows/neutral-locale-resume.yml'
  workflow_dispatch:
    inputs:
      run_model_canary:
        description: Run four bounded public-sample checks on the pinned free CPU model
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: extended-locales-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[locale-foundation-ready]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check new modules and unchanged offline translation contracts
        run: |
          set -euo pipefail
          python -m pip install 'requests>=2.31,<3' 'Pillow>=10.1,<12' 'PyYAML>=6,<7'
          python -B scripts/test_portal_extended_locales.py
          python -B scripts/test_portal_extended_hardening.py
          python -B scripts/test_portal_extended_source_fallback.py
          python -B scripts/test_portal_extended_r2.py
          python -B scripts/test_portal_extended_incremental.py
          python -B scripts/test_portal_extended_continuation.py
          python -B scripts/test_portal_extended_recovery_intent.py
          python -B scripts/test_portal_extended_daily_queue.py
          python -B scripts/test_portal_extended_source_refresh.py
          python -B scripts/test_portal_english_commentary.py
          python -B scripts/test_portal_english_pipeline.py
          python -B scripts/test_portal_english_publication.py
          python -B scripts/test_neutral_edge_cutover_workflow.py
          python -B scripts/build_portal_locale_resume_workflow.py --check
          python -B scripts/test_portal_locale_resume_workflow.py
          python -B scripts/test_resume_portal_locale_candidate.py
          python -B scripts/test_verify_prepared_static_slot.py
          python -B scripts/test_portal_english_ui.py
          node --test scripts/test_portal_english_ui.js
          python -B scripts/test_portal_extended_recovery.py
          python -B scripts/test_portal_extended_publication.py
          python -B scripts/test_portal_extended_ui.py
          node --test scripts/test_portal_extended_ui.js
          node --test portal_suite/tests/english-commentary.test.mjs
          python -B scripts/test_portal_extended_handoff.py
          python -B scripts/test_review_portal_extended_handoff.py
          python -B scripts/test_restore_assemble_portal_extended_r2.py
          python -B scripts/test_hymt_offline_translation.py
          python -B scripts/test_compare_hymt_translation.py
          python -B scripts/test_financial_quantity_integrity.py
          python -B scripts/test_offline_translation_callers.py
          python -B scripts/test_portal_offline_locales.py
          python -B scripts/test_translate_portal_titles.py
          python -B scripts/check_public_identity.py
          for test in workers/edge-static-host/test/*.test.mjs; do node --test "$test"; done
  model-canary:
    needs: regression
    if: >-
      github.event.repository.private == false &&
      ((github.event_name == 'workflow_dispatch' && inputs.run_model_canary == true) ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[locale-canary]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        locale: [fr, pt, hi, zh-Hant]
    env:
      KC_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-offline-translation
        with:
          targets: ${{ matrix.locale }}
          persist-audit: 'false'
      - name: Check public samples without publishing content or storing translation artifacts
        env:
          CANARY_LOCALE: ${{ matrix.locale }}
        run: python -B scripts/smoke_portal_extended_locales.py --locales "$CANARY_LOCALE"
