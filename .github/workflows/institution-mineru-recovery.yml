name: Recover exact Institution MinerU tasks
on:
  pull_request:
    paths:
      - .github/workflows/institution-mineru-recovery.yml
      - scripts/recover_institution_mineru.py
      - scripts/institution_original_cache.py
      - scripts/test_institution_original_cache.py
      - scripts/institution_dependency_backlog.py
      - scripts/test_institution_dependency_backlog.py
      - scripts/test_institution_backlog_pipeline.py
      - scripts/institution_hold_provenance.py
      - scripts/test_institution_hold_provenance.py
      - scripts/inspect_durable_mineru.py
      - scripts/inspect_institution_feed_holds.py
      - scripts/test_inspect_institution_feed_holds.py
      - scripts/run_pdf_to_xhs_in_batches.py
      - .github/workflows/institution-latest-pdf-to-wechat.yml
      - scripts/fetch_institution_latest_pdfs.py
      - scripts/test_recover_institution_mineru.py
      - scripts/mineru_completed_child_reuse.py
      - scripts/mineru_result_cache.py
      - scripts/pdf_to_xhs_batch.py
      - scripts/mineru_pdf_graph.py
      - scripts/mineru_pdf_oc.py
      - scripts/test_mineru_pdf_graph.py
      - scripts/test_mineru_pdf_oc.py
      - scripts/test_mineru_completed_child_reuse.py
      - scripts/test_mineru_result_cache.py
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [verify, recover, seed-holds, check-holds, check-feed-holds]
        default: verify
        required: true
        description: Verify complete original PDF bytes; recover retries only explicitly reviewed terminal failures
      request:
        type: string
        required: true
        description: Exact accepted batch keys, original institutional producer run IDs, and reviewed failure hashes
      expected_source_name_sha256:
        type: string
        required: false
        description: Required for check-feed-holds; exact held source filename SHA256
permissions:
  contents: read
  actions: read
concurrency:
  group: institution-mineru-recovery
  cancel-in-progress: false
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --disable-pip-version-check requests Pillow PyMuPDF pypdf==6.19.0 pypdfium2==5.13.0 'urllib3>=2.2,<3' certifi
      - run: python3 -B scripts/test_recover_institution_mineru.py
      - run: python3 -B scripts/test_institution_original_cache.py
      - run: python3 -B scripts/test_institution_dependency_backlog.py
      - run: python3 -B scripts/test_institution_backlog_pipeline.py
      - run: python3 -B scripts/test_institution_hold_provenance.py
      - run: python3 -B scripts/test_inspect_durable_mineru.py
      - run: python3 -B scripts/test_inspect_institution_feed_holds.py
      - run: python3 -B scripts/test_fetch_institution_latest_pdfs.py
      - run: python3 -B scripts/test_mineru_terminal_recovery.py
      - run: python3 -B scripts/test_mineru_pdf_graph.py
      - run: python3 -B scripts/test_mineru_pdf_oc.py
      - run: python3 -B scripts/test_mineru_completed_child_reuse.py
      - run: python3 -B scripts/test_mineru_result_cache.py
      - run: python3 -B scripts/test_mineru_daily_result_cache.py
  recover:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            institution_feeds
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --retries 0 --disable-pip-version-check requests Pillow PyMuPDF pypdf==6.19.0 'boto3>=1.37.32,<2' 'urllib3>=2.2,<3' certifi
      - name: Prove and freeze every original source before bounded terminal recovery
        if: inputs.operation != 'check-feed-holds'
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_OPERATION: ${{ inputs.operation }}
          RECOVERY_REQUEST: ${{ inputs.request }}
          MINER_U: ${{ secrets.MINER_U }}
          MINER_U_2: ${{ secrets.MINER_U_2 }}
          MINER_U_3: ${{ secrets.MINER_U_3 }}
          MINER_U_4: ${{ secrets.MINER_U_4 }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: python3 -B scripts/recover_institution_mineru.py
      - name: Verify held source selection from one current institution feed response
        if: inputs.operation == 'check-feed-holds'
        timeout-minutes: 2
        env:
          EXPECTED_SOURCE_NAME_SHA256: ${{ inputs.expected_source_name_sha256 }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: |
          python3 -B scripts/institution_dependency_backlog.py export --path "$RUNNER_TEMP/institution-holds.json"
          python3 -B scripts/inspect_institution_feed_holds.py --holds "$RUNNER_TEMP/institution-holds.json" --archive institution_feeds/institution_pdf_archive.jsonl --expected-source-name-sha256 "$EXPECTED_SOURCE_NAME_SHA256" --output "$RUNNER_TEMP/institution-recovery-summary.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: institution-recovery-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/institution-recovery-summary.json
          if-no-files-found: ignore
          retention-days: 14
