name: API cost controls regression

on:
  pull_request:
    paths:
      - 'scripts/*deepseek*'
      - 'scripts/*generation_cost_controls*'
      - '.github/workflows/deepseek-usage*'
  push:
    branches: [main]
    paths:
      - 'scripts/*deepseek*'
      - 'scripts/*generation_cost_controls*'
      - '.github/workflows/deepseek-usage*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Verify accounting and dated collection without paid calls
        run: |
          python scripts/test_deepseek_http.py
          python scripts/test_deepseek_usage.py
          python scripts/test_collect_deepseek_usage_artifacts.py
