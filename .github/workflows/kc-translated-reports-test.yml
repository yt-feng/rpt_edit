name: KC translated reports PDF test

on:
  workflow_dispatch:
    inputs:
      date_folder:
        description: "Dropbox output date folder under xhs_notes/dropbox, or latest"
        required: true
        default: "latest"
      max_reports:
        description: "Number of reports to translate. Keep 1 for testing; use 10 after validation."
        required: true
        default: "1"
      report_offset:
        description: "Skip this many report folders before selecting reports"
        required: true
        default: "0"
      model:
        description: "DeepSeek model for translation"
        required: true
        default: "deepseek-chat"
      deepseek_base_url:
        description: "DeepSeek API base URL"
        required: true
        default: "https://api.deepseek.com"
      commit_results:
        description: "Commit generated translated PDFs back to repo"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: kc-translated-reports-pdf-test
  cancel-in-progress: false

jobs:
  build-kc-translated-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pull latest generated shard outputs
        run: |
          git fetch --depth=1 origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install reportlab

      - name: Install Chinese fonts
        timeout-minutes: 5
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Build KC translated report PDF
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ github.event.inputs.deepseek_base_url || 'https://api.deepseek.com' }}
        run: |
          DATE_FOLDER="${{ github.event.inputs.date_folder || 'latest' }}"
          MAX_REPORTS="${{ github.event.inputs.max_reports || '1' }}"
          REPORT_OFFSET="${{ github.event.inputs.report_offset || '0' }}"
          MODEL="${{ github.event.inputs.model || 'deepseek-chat' }}"
          BASE_URL="${{ github.event.inputs.deepseek_base_url || 'https://api.deepseek.com' }}"
          echo "::notice::Building $MAX_REPORTS KC translated report PDF(s) from xhs_notes/dropbox/$DATE_FOLDER"
          python scripts/build_kc_translated_reports.py \
            --dropbox-output-root "xhs_notes/dropbox" \
            --date-folder "$DATE_FOLDER" \
            --output-root "kc_translated_reports" \
            --max-reports "$MAX_REPORTS" \
            --report-offset "$REPORT_OFFSET" \
            --model "$MODEL" \
            --deepseek-base-url "$BASE_URL" 2>&1 | tee kc_translated_reports_progress.log

      - name: Verify translated PDFs exist
        run: |
          if ! find kc_translated_reports -name "kc_translated_report_*.pdf" -type f -size +1k | grep -q .; then
            echo "No rendered kc_translated_report_*.pdf found. Failing the workflow so this is visible."
            find kc_translated_reports -maxdepth 4 -type f -print || true
            exit 1
          fi
          find kc_translated_reports -name "kc_translated_report_*.pdf" -type f -printf "%s bytes %p\n" | sort -n

      - name: Upload translated report artifact
        uses: actions/upload-artifact@v4
        with:
          name: kc-translated-reports-${{ github.run_id }}
          path: |
            kc_translated_reports
            kc_translated_reports_progress.log
          if-no-files-found: error

      - name: Commit generated translated reports
        if: ${{ github.event.inputs.commit_results == 'true' }}
        run: |
          bash scripts/commit_output_dir.sh "kc_translated_reports" "Generate KC translated report PDFs" 8
