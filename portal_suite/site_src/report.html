<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>报告详情 | KC桌面</title>
    <meta name="description" content="KC桌面报告详情页，展示金融研报标题、中文标题、机构、行业、日期、页数和相关报告推荐。">
    <meta name="robots" content="noindex,follow,noarchive,max-image-preview:none">
    <meta name="referrer" content="same-origin">
    <link rel="stylesheet" href="assets/styles.css?v=portal-suite-20260726b">
  </head>
  <body data-page="report" data-analytics-auto="manual">
    <header class="topbar">
      <a class="back-link" href="/">Back to home</a>
      <div class="topbar-actions">
        <a class="topbar-link" href="blog/">Blog</a>
        <a id="newsfeedNav" class="topbar-link" href="newsfeed.html">Newsfeed</a>
        <button id="accountGate" class="account-button" type="button">登录</button>
        <button id="adminGate" class="admin-gate" type="button" aria-label="Private tools"></button>
        <a class="brand compact" href="/" aria-label="Portal Suite home">
          <img src="assets/app-mark.svg" alt="" width="30" height="30">
          <span>Portal Suite</span>
        </a>
      </div>
    </header>

    <main class="shell detail-shell">
      <section id="detail" class="detail-panel">
        <p class="subtle" role="status">正在打开报告…</p>
      </section>
    </main>

    <script id="reportPreviewBootstrap">
      (() => {
        "use strict";
        const detail = document.getElementById("detail");
        const params = new URLSearchParams(window.location.search);
        const value = (key, limit = 320) => String(params.get(key) || "").trim().slice(0, limit);
        const title = value("title");
        if (!detail || !title) return;

        const appendText = (parent, tag, className, text) => {
          const element = document.createElement(tag);
          if (className) element.className = className;
          element.textContent = text;
          parent.append(element);
          return element;
        };
        const appendField = (parent, label, text) => {
          const field = document.createElement("div");
          field.className = "detail-field";
          appendText(field, "span", "", label);
          appendText(field, "strong", "", text || "正在确认");
          parent.append(field);
        };
        const displayDate = (raw) => {
          if (/^\d{6}$/.test(raw)) return `20${raw.slice(0, 2)}-${raw.slice(2, 4)}-${raw.slice(4, 6)}`;
          if (/^\d{8}$/.test(raw)) return `${raw.slice(0, 4)}-${raw.slice(4, 6)}-${raw.slice(6, 8)}`;
          return raw;
        };
        const displaySize = (raw) => {
          const bytes = Number(raw);
          if (!Number.isFinite(bytes) || bytes <= 0) return "Available";
          if (bytes >= 1024 * 1024) return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
          if (bytes >= 1024) return `${Math.round(bytes / 1024)} KB`;
          return `${Math.round(bytes)} B`;
        };

        const heading = document.createElement("div");
        appendText(heading, "h1", "detail-title", title);
        const titleZh = value("title_zh");
        if (titleZh && titleZh !== title) appendText(heading, "p", "detail-title-zh", titleZh);
        appendText(heading, "p", "subtle", "下载权限与相关报告将在后台补充。");

        const bankCode = value("bank_code", 120);
        const bankName = value("bank_name", 120);
        const institution = bankCode && bankName && bankCode.toLocaleLowerCase() !== bankName.toLocaleLowerCase()
          ? `${bankCode} · ${bankName}`
          : (bankCode || bankName);
        const grid = document.createElement("div");
        grid.className = "detail-grid";
        appendField(grid, "Institution", institution);
        appendField(grid, "Industry", value("industry", 160) || value("sector", 160) || value("category", 160));
        appendField(grid, "Date", displayDate(value("date_folder", 16)));
        const rawAvailable = value("available", 8).toLocaleLowerCase();
        const pdfStatus = rawAvailable === "1" || rawAvailable === "true"
          ? displaySize(value("size_bytes", 24))
          : (rawAvailable === "0" || rawAvailable === "false" ? "Text only" : "正在确认");
        appendField(grid, "PDF", pdfStatus);

        const firstPaintChildren = [heading, grid];
        if (pdfStatus === "Text only") {
          const guidance = document.createElement("aside");
          guidance.className = "text-only-search-guidance";
          appendText(guidance, "strong", "", "先搜索同名可下载版本");
          appendText(
            guidance,
            "p",
            "",
            "约 90% 的 Text only 报告可在首页按完整标题找到可下载版本，建议继续查看“其他报告”等板块。",
          );
          const searchLink = appendText(guidance, "a", "secondary-button", "在首页搜索同名报告");
          searchLink.href = `./?q=${encodeURIComponent(title.slice(0, 200))}`;
          firstPaintChildren.push(guidance);
        }

        detail.replaceChildren(...firstPaintChildren);
        document.title = `${title} | Portal Suite`;
      })();
    </script>

    <footer class="legal-footer">
      <a href="blog/">Blog</a>
      <a href="/reports/">报告索引</a>
      <a href="terms.html">Terms of Service</a>
      <a href="privacy.html">Privacy Policy</a>
      <span data-portal-chinese-only hidden>Contact WeChat: Support Contact</span>
      <a href="mailto:info@public-contact.invalid" data-portal-non-chinese-only hidden>Email: info@public-contact.invalid</a>
    </footer>

    <script src="assets/site-runtime.js"></script>
    <script src="assets/contact.js"></script>
    <script src="assets/analytics.js"></script>
    <script src="assets/app.js?v=portal-suite-20260726b"></script>
  </body>
</html>
