<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>用户行为历史 | KC桌面</title>
    <meta name="robots" content="noindex,nofollow,noarchive">
    <link rel="stylesheet" href="assets/styles.css?v=site-20260831a">
  </head>
  <body data-page="activity" class="analytics-history-page">
    <header class="topbar">
      <a class="brand compact" href="/" aria-label="KC桌面 home">
        <img src="assets/app-mark.svg" alt="" width="30" height="30">
        <span>KC桌面</span>
      </a>
      <div class="topbar-actions">
        <a class="topbar-link" href="/">返回首页</a>
        <a class="topbar-link" href="blog/">Blog</a>
        <button id="accountGate" class="account-button" type="button">登录</button>
      </div>
    </header>

    <main class="analytics-history-shell">
      <div class="analytics-history-title">
        <div>
          <h1>用户行为历史（已采集）</h1>
          <p>查看埋点启用后已存档的访问、搜索、RAG 对话、报告、账号与后台操作。</p>
        </div>
        <div class="analytics-history-title-actions">
          <button id="analyticsHistoryExportAll" class="secondary-button" type="button">导出全部历史</button>
          <button id="analyticsHistoryRefresh" class="secondary-button" type="button">刷新</button>
        </div>
      </div>

      <section class="analytics-day-summary" aria-labelledby="analyticsDaySummaryTitle">
        <div class="analytics-day-summary-heading">
          <div>
            <h2 id="analyticsDaySummaryTitle">按日期汇总</h2>
            <p>汇总唯一访客、事件/页面访问、来源、国家、设备与机器人提示；不展示原始 IP 或哈希。</p>
          </div>
          <div class="analytics-day-summary-actions">
            <label>日期<input id="analyticsDaySummaryDate" type="date"></label>
            <button id="analyticsDaySummaryLoad" class="primary" type="button">读取汇总</button>
            <button id="analyticsDaySummaryRefresh" class="secondary-button" type="button">重新扫描</button>
          </div>
        </div>
        <div id="analyticsDaySummaryStatus" class="status-line" aria-live="polite"></div>
        <div id="analyticsDaySummaryResults"></div>
      </section>

      <form id="analyticsHistoryFilters" class="analytics-history-filters">
        <label>
          <span>事件类型</span>
          <select id="analyticsHistoryType">
            <option value="">全部事件</option>
            <option value="page_view">页面访问</option>
            <option value="search">搜索</option>
            <option value="report_chat">RAG 对话（服务端）</option>
            <option value="report_chat_interaction">RAG 对话（交互）</option>
            <option value="course_material_request">KC桌面学堂索取</option>
            <option value="report_open">打开报告</option>
            <option value="download_attempt">尝试下载</option>
            <option value="download_success">下载成功</option>
            <option value="download_error">下载失败</option>
            <option value="download_pending">等待报告</option>
            <option value="delivery_link_generate">生成发货链接</option>
            <option value="account_auth">账号操作</option>
            <option value="admin_user_update">用户权限操作</option>
            <option value="daily_file_download">每日文件下载</option>
          </select>
        </label>
        <label class="analytics-history-user-filter">
          <span>用户</span>
          <input
            id="analyticsHistoryUser"
            type="search"
            list="analyticsHistoryUserOptions"
            autocomplete="off"
            placeholder="用户名或邮箱（全部用户）"
          >
          <datalist id="analyticsHistoryUserOptions"></datalist>
        </label>
        <label class="analytics-history-query">
          <span>关键词</span>
          <input id="analyticsHistoryQuery" type="search" autocomplete="off" placeholder="搜索词、报告、页面、来源或状态">
        </label>
        <label>
          <span>开始日期</span>
          <input id="analyticsHistoryStartDate" type="date">
        </label>
        <label>
          <span>结束日期</span>
          <input id="analyticsHistoryEndDate" type="date">
        </label>
        <label>
          <span>每页</span>
          <select id="analyticsHistoryPageSize">
            <option value="50">50 条</option>
            <option value="100" selected>100 条</option>
            <option value="200">200 条</option>
          </select>
        </label>
        <div class="analytics-history-filter-actions">
          <button class="primary" type="submit">查询</button>
          <button id="analyticsHistoryReset" class="secondary-button" type="button">重置</button>
        </div>
      </form>

      <p id="analyticsHistoryCoverage" class="analytics-history-coverage">正在读取埋点存档范围…</p>
      <div id="analyticsHistoryStatus" class="status-line" aria-live="polite">正在验证管理员权限…</div>
      <div id="analyticsHistoryMeta" class="analytics-history-meta"></div>
      <section id="analyticsHistoryResults" class="analytics-history-results" aria-live="polite"></section>

      <nav class="analytics-history-pagination" aria-label="用户行为历史翻页">
        <button id="analyticsHistoryPrev" class="secondary-button" type="button" disabled>上一页（较新）</button>
        <span id="analyticsHistoryPage">第 1 页</span>
        <button id="analyticsHistoryNext" class="secondary-button" type="button" disabled>下一页（更早记录）</button>
      </nav>
    </main>

    <script src="assets/site-runtime.js"></script>
    <script src="assets/contact.js"></script>
    <script src="assets/analytics.js"></script>
    <script src="assets/app.js?v=site-20260831a"></script>
  </body>
</html>
